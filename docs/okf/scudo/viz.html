d via the catalogue MCP).\n- `ontology_context` \u2014 candidate CDAO nodes + definitions for this request, plus `rubric_version`.\n- `precedents` \u2014 analogous prior mappings.\n- `conflict_context` \u2014 populated only on RECONCILE_CONFLICT.\n\n## The default assumption: there is usually no exact match\nMost vendor products will **not** have a clean one-to-one CDAO equivalent \u2014 that\ngap is the entire reason this work exists [clarif. 83]. Treat \"no exact match\" as\nthe normal case. Your job is the best-supported target plus an honest confidence.\n\n## Finding candidates \u2014 relatedness, not just similarity\nUse the **graphrag-retrieval** skill to find candidate CDAO nodes. It returns\ncandidates by *relatedness* (taxonomic / structural), which surfaces the right\nnode even when it isn't semantically close to the vendor wording \u2014 exactly the\nno-exact-match case. Treat its output as candidates, not ground truth.\n\nThen **confirm** before you commit: for the candidate you favour, call\n`neptune_node_by_iri` to read its authoritative definition and position in the\nRDF graph (the system of record). Use `neptune_existing_mapping` and\n`neptune_conflicts` to settle NEW-vs-EXTEND and to detect cross-vendor conflicts.\nNever trust the retrieval sidecar as truth \u2014 anchor on the RDF graph.\n\n## Procedure\n1. Read `vendor_product` (title, description, theme, `asset_class`, `identifiers`, `raw_attributes`).\n2. Retrieve candidates via graphrag-retrieval; weigh them and any `precedents`.\n3. Confirm the favoured candidate(s) against the authoritative graph (neptune-io).\n4. Pick the best-supported node (or, on RECONCILE, a reconciliation; on RESEARCH, an extension).\n5. Assemble **evidence** \u2014 every assertion above `confidence > 0.5` needs non-empty, cited evidence (including which retrieved candidate and which authoritative node). Evidence-free = hallucination; the verifier rejects it.\n6. Emit `proposed_triples` via the **rdf-serialisation** skill (never write Turtle by hand). Each triple carries its named graph.\n7. Set `confidence` (0.0\u20131.0) and `confidence_band` (high \u2265 0.8 / medium / low). Self-flag `requires_human_review` whenever genuinely unsure.\n\n## Per-route behaviour\n- **NEW_MAPPING** \u2014 propose a target from scratch; highest evidentiary bar.\n- **EXTEND_MAPPING** \u2014 add attributes/edges only; never silently overwrite the existing mapping.\n- **RECONCILE_CONFLICT** \u2014 output a reconciliation that **explicitly preserves both source positions**; cite both.\n- **RESEARCH** \u2014 output a *proposed taxonomy extension*, not a mapping. Does **not** publish; produces a write-up for ontology owners.\n\n## Confidence calibration\nBe honest, not optimistic. The 0.80 floor [clarif. F31] is enforced downstream:\nanything below routes to the catalogue HITL queue [clarif. E27]. Under-confidence\ncosts a reviewer a look; over-confidence risks bad data. When in doubt, score lower.\n\n## Do not\nRoute \u00b7 publish \u00b7 assemble your own context \u00b7 hand-write Turtle or SPARQL \u00b7 treat\nretrieved candidates as ground truth \u00b7 return a mapping with empty evidence \u00b7\noverwrite an existing mapping on EXTEND.\n\n## Related\n\n- [GraphRAG retrieval](/skills/graphrag-retrieval.md)\n- [Neptune I/O](/skills/neptune-io.md)\n- [RDF serialisation](/skills/rdf-serialisation.md)\n- [Confidence bands & provenance (canonical)](/reference/matching-data-provenance.md)", "specs/auth-gate-strip-inject": "# Auth gate \u2014 strip & inject `X-Authenticated-User` (deployer spec)\n\n**Goal:** make `/api/*` authenticated and **non-spoofable** before any exposure\nbeyond a closed/internal demo. Today the gate is dev-open and the edge forwards\nclient headers, so a caller can forge identity.\n\n**Who runs this:** deployer/operator with AWS access (account `954976331678`,\n`us-east-1`) **and** whoever controls the CloudFront distribution + ALB in front\nof the `scudo-poc` backend.\n\n**The contract (from `backend/auth.py`):** the backend trusts a single header,\ndefault **`X-Authenticated-User`** (overridable via `SCUDO_AUTH_PRINCIPAL_HEADER`).\n`auth.py` resolves identity in this order: dev-env \u2192 trusted header \u2192 401. The\ndocstring's trust boundary is the spec: header-from-gateway is sound **only when\n(a)** the backend is reachable *exclusively* through the gateway **and (b)** the\ngateway **strips any client-supplied copy before setting its own**.\n\n---\n\n## The two defects to fix (both must land \u2014 coupled change)\n\n### Defect 1 \u2014 dev auth is enabled on the backend\n`SCUDO_AUTH_ALLOW_DEV` is truthy on `scudo-poc-app`, so `_resolve_from_dev()`\nreturns a principal for *every* request \u2192 `/api/*` answers with no header at all.\n\n### Defect 2 \u2014 the edge forwards client `X-Authenticated-User`\nThe `scudo-poc-frontend` template sets the `/api/*` behavior's\n`OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3` \u2014 AWS-managed\n**`AllViewer`**, which forwards **all** viewer headers to the origin, including a\nclient-supplied `X-Authenticated-User`. So even with Defect 1 fixed, a client\ncould forge the header and it would reach the backend. (Verify against the LIVE\ndistribution \u2014 the demo currently runs on the *dev* CloudFront/S3, which may\ndiffer from this template.)\n\n---\n\n## Target end state\n\n```\nBrowser \u2500\u2500(no X-Authenticated-User; SPA already pins VITE_DEV_PRINCIPAL=\"\")\u2500\u2500\u25b6 CloudFront\nCloudFront \u2500\u2500(authenticate; STRIP any inbound X-Authenticated-User)\u2500\u2500\u25b6 ALB\nALB/edge \u2500\u2500(INJECT X-Authenticated-User = the authenticated identity)\u2500\u2500\u25b6 Flask\nFlask: SCUDO_AUTH_ALLOW_DEV unset \u2192 trusts ONLY the gateway-set header \u2192 401 if absent\n```\n\nPick **one** enforcement point that does the authenticate-strip-inject. Options\nin order of preference for this PoC:\n\n### Option A \u2014 Lambda@Edge / CloudFront Function on the `/api/*` behavior (recommended)\nA `viewer-request` function that: (1) authenticates the request (validate the\nsession cookie / OIDC token the org's SSO already issues), (2) **deletes** any\ninbound `X-Authenticated-User`, (3) sets `X-Authenticated-User` to the verified\nprincipal. Replace the `AllViewer` origin-request policy with one that does **not**\nforward `X-Authenticated-User` from the viewer (or an explicit allowlist that\nexcludes it), so the only copy reaching the origin is the function-set one.\n\n### Option B \u2014 ALB listener rules + an auth action\nIf the ALB fronts the backend directly, use an `authenticate-oidc` (or\n`authenticate-cognito`) action on the listener, and a rule that **drops** inbound\n`X-Authenticated-User` and sets it from the authenticated claims. (ALB can't\nmutate arbitrary request headers natively as richly as Lambda@Edge \u2014 confirm the\nmechanism; if it can't strip+set, fall back to Option A or C.)\n\n### Option C \u2014 JWT verification in the app (the `auth.py`-blessed path)\nIf the edge already issues signed JWTs, **don't** trust a header at all \u2014\nreplace the body of `_resolve_from_header` in `backend/auth.py` with JWT\nsignature+claims verification (issuer, audience, expiry). Per the docstring this\nis a one-file change; the route surface and rest of the codebase are unchanged.\nThen the edge only needs to be the exclusive ingress (boundary (a)).\n\n---\n\n## Steps\n\n1. **Confirm exclusive ingress (boundary (a)).** The ALB/backend must NOT be\n   reachable except through CloudFront. Check the ALB security group only admits\n   the CloudFront origin (managed-prefix-list `com.amazonaws.global.cloudfront.origin-facing`)\n   or the edge, and there's no public NodePort/direct-attach path. If the backend\n   is directly reachable, strip+inject is moot \u2014 fix this first.\n\n2. **Implement strip+inject** (Option A/B/C above) on the live distribution.\n\n3. **Stop the SPA sending the header** \u2014 already done: the prod build pins\n   `VITE_DEV_PRINCIPAL=\"\"` (`vite.config.matching.ts`), so the deployed dashboard\n   sends no `X-Authenticated-User`. (Confirm: `grep -r X-Authenticated dashboard-dist/assets` \u2192 only the header *name* in code paths that now resolve to \"\", no value.)\n\n4. **Disable dev auth on the backend.** On `scudo-poc-app`, unset\n   `SCUDO_AUTH_ALLOW_DEV` (and `SCUDO_AUTH_DEV_PRINCIPAL`). Redeploy/roll the\n   service. Now `auth.py` trusts only the gateway-set header.\n\n---\n\n## Verification (must all pass)\n\n```bash\nBASE=https://<live-distribution-domain>     # e.g. dp4ji14se0pct.cloudfront.net\n\n# 1. Unauthenticated request is rejected (dev auth off):\ncurl -s -o /dev/null -w \"no-auth: %{http_code}\\n\" \"$BASE/api/mapping/vendors\"\n#   EXPECT 401 (was 200). If still 200 \u2192 SCUDO_AUTH_ALLOW_DEV still set, or the\n#   edge is injecting a principal for anonymous sessions.\n\n# 2. FORGED header does NOT get through (the spoofing test \u2014 the whole point):\ncurl -s -o /dev/null -w \"forged: %{http_code}\\n\" \\\n  -H \"X-Authenticated-User: attacker@evil.com\" \"$BASE/api/mapping/vendors\"\n#   EXPECT 401 (edge stripped it) \u2014 NOT 200. A 200 here means the forge path is\n#   STILL OPEN; do not expose externally.\n\n# 3. A genuinely authenticated session works:\n#   Drive a real SSO/OIDC login through the edge, then confirm /api/mapping/vendors\n#   returns 200 and that any precedent-writing call (POST /api/mapping/decision)\n#   is attributed to the real principal, not the forged one.\n\n# 4. Direct-to-ALB forge is impossible (boundary (a)):\n#   From outside the edge, attempt the forged-header call directly against the\n#   ALB DNS. EXPECT connection refused / not reachable. If it answers, ingress\n#   is not exclusive \u2014 fix step 1.\n```\n\n**Done = tests 1, 2, 4 behave as above and a real login passes test 3.** Until\nthen the deployment stays a **closed/internal demo** (network-gated), as it is\nnow.\n\n---\n\n## Notes\n- This is the single gate between \"closed demo\" (current, fine) and \"external /\n  real-data exposure\". Nothing else in the app needs to change \u2014 `auth.py` is the\n  single swap point by design.\n- If the org's edge already does OIDC/JWT, **Option C is the cleanest** and\n  removes the header-trust assumption entirely.\n- Cross-ref: `backend/auth.py` docstring (trust boundary), `infra/DEPLOY_RUNBOOK_scudo-poc.md` \u00a75,\n  `infra/SMOKE_FIXES_round1.md` finding #3.\n\n## Related\n\n- [Code review fixes (B1/B2)](/handovers/code-review-fixes.md)\n- [Deploy runbook](/deployment/deploy-runbook-scudo-poc.md)", "specs/hitl-two-way-chat": "# Spec \u2014 HITL two-way chat (ask the agent)\n\n**Status:** design only (not built). The reasoning transcript + decision UI\n(approve/override/reject on the `hitl-review` node) shipped; this spec covers the\nremaining piece: letting a reviewer **ask the agent questions** / give guidance,\nwhich needs new backend capability.\n\n## Why this is a backend build, not frontend wiring\n\nThe agent today is **one-shot and stateless**. Both `ScriptedMappingAgent` and\n`BedrockMappingAgent` (`backend/scudo_mapping_mcp/agent.py`) expose\n`run(ref) -> Iterator[AgentEvent]`: read product \u2192 run a fixed tool sequence \u2192\n`final_result` \u2192 `done`. There is **no** message history, no session, and no\nendpoint that accepts a follow-up message. So two-way chat requires:\n\n1. a conversational endpoint,\n2. session/context state across turns,\n3. a multi-turn agent loop (Bedrock) that can take free-form reviewer input.\n\n## Proposed design\n\n### Endpoint\n`POST /api/mapping/agent/chat` (SSE, same framing as `/agent/run`).\nBody: `{ session_id, vendor, product_id, message }`.\nStreams the same event vocabulary (`agent_message` / `tool_call` /\n`tool_result` / `final_result` / `error` / `done`) so the existing frontend\ntranscript renders it with no new event handling.\n\n### Session state\n- A `session_id` (UUID minted by the client on first turn) keys a\n  conversation: the prior turns + the mapping context (the `ref`, the candidate\n  set, the last `MappingResult`).\n- Store: start with an **in-process TTL dict** (PoC; single-instance, like the\n  current working set) keyed by `session_id`; note explicitly that multi-worker\n  / multi-task scaling needs a shared store (Redis/Dynamo) \u2014 same caveat as the\n  working set (Codex flagged that unsynchronized in-memory state).\n- Bound: max turns per session + TTL eviction (don't grow unbounded \u2014 mirrors\n  the upload row/byte caps).\n\n### Agent loop\n- Extend `BedrockMappingAgent` with a `chat(session, message) -> Iterator[...]`\n  that appends the user message to the conversation and runs a bounded Bedrock\n  multi-turn loop with the SAME MCP tools (`find_similar_products`,\n  `get_taxonomy_node`, `get_ontology_neighbourhood`, `map_vendor_product`).\n- INVARIANT (must hold): the chat can **explain** and **re-retrieve/re-rank**,\n  but a mapping it commits still goes through the deterministic\n  `map_vendor_product` gate \u2014 the LLM cannot bypass the cost-ladder/validations\n  or auto-confirm a precedent. Chat guidance influences retrieval, not the gate.\n- Scripted fallback (`SCUDO_AGENT_BACKEND=scripted`): a canned Q&A over the\n  last result so the feature demos with no Bedrock.\n\n### Constraints / risks (carry over from the review)\n- **Auth:** same gate as the rest of `/api/*` \u2014 the chat must not be a way to\n  write precedents under a forged identity. Blocked on the same\n  strip+inject auth gate (`infra/AUTH_GATE_SPEC_strip_inject.md`).\n- **SSE / ALB idle timeout:** a multi-turn Bedrock chat can be slow \u2192 needs the\n  heartbeat/keepalive that long `/agent/run` calls already want. Address\n  together.\n- **Cost:** multi-turn Bedrock per reviewer message \u2014 gate behind the same\n  `SCUDO_AGENT_BACKEND=bedrock` flag; scripted otherwise.\n\n### Frontend (small, once the endpoint exists)\n- Add a text input to `ReasoningPanel` (currently read-only) that POSTs to\n  `/agent/chat` and appends the streamed turns to the same transcript.\n- Reuse the existing `postSse` async-iterator client (`src/api/mapping.ts`) and\n  `transcriptTurn` mapping \u2014 both already handle the event vocabulary.\n\n## Acceptance (when built)\n- A reviewer types a question on a NEEDS_REVIEW result and gets a streamed,\n  reasoned answer in the transcript.\n- Re-running with guidance changes retrieval but any committed mapping still\n  passes the deterministic gate (test: chat cannot force AUTO_MAPPED below floor).\n- Session bounded (max turns + TTL); scripted backend works with no Bedrock.", "specs/i5-lift-preconditions": "# I5 Lift \u2014 Preconditions for Autonomous Canonical Writes\n\n| Field | Value |\n|---|---|\n| Status | Draft for review \u2014 owners must be named before circulation to any governance forum |\n| Scope | SCUDO mapping, five priority vendors (LSEG, S&P Global, Bloomberg, ICE, FactSet) |\n| Accountable Owner | _[TBC \u2014 JPMC MD, SCUDO programme]_ |\n| Technology Owner | _[TBC \u2014 JPMC ED, Data Platform / Neptune SoR]_ |\n| Control Steward | _[TBC \u2014 JPMC, aligned to Firmwide Model Risk Governance]_ |\n| Delivery partner | Cognizant (does not own this control) |\n| Model Inventory Tier | _[TBC \u2014 to be assigned by MRGR on registration]_ |\n| GRC Control ID | _[TBC]_ |\n| Version | 0.2 |\n\n## 1. What this gates\n\nInvariant **I5** stops the system writing to the canonical store (Amazon Neptune \u2014 the system-of-record graph for enriched mappings) without a human. Every mapping verdict, including `AUTO_MAPPED`, is intercepted by the Persistence MCP (the only component permitted to write) and routed to the reviewer queue. Nothing reaches Neptune until a reviewer approves it.\n\nThis document states what must be true before I5 can be lifted: that is, before a sealed PASS-band verdict (`sealed_band == \"pass\"`) is allowed to become a direct-write trigger and persist to Neptune without review.\n\nIt is a gate, not a plan. Nothing below is scheduled here. **These are preconditions \u2014 lift cannot happen until all of them hold, evidenced and signed off.**\n\n### 1.1 What this does NOT gate\n\nThe following remain governed by their own controls and are unchanged by I5 lift:\n\n- **M6 bundle imports** (bulk seed of confirmed precedents). Out of scope for I5 lift; remain supervised under a separate signed-manifest + reviewer-approval control _[TBC: name the control]_, persisted via a distinct code path that does **not** consult `sealed_band`.\n- **HITL writes via `record_decision`.** The reviewer-queue path is unaffected and remains the route for everything below PASS, or whenever any precondition is unmet.\n- **Out-of-scope vendors.** The deterministic scope gate continues to fail-closed; I5 lift does not relax I3.\n- **All BORDERLINE and FAIL verdicts** continue to route through the reviewer queue.\n\n## 2. The substitution being closed\n\nThe matcher's confidence gate has three bands, decided on the dense similarity score relative to the floor and a half-width:\n\n- **PASS** (`sim >= floor + half`): auto-maps with **no model in the loop**.\n- **BORDERLINE** (within `\u00b1 half` of the floor): the LLM specialist is consulted.\n- **FAIL** (below, or a required validation fails): goes to review.\n\nThe PASS band has no semantic check today \u2014 it is decided on similarity alone. This is safe only because I5 routes every verdict through the reviewer queue. **The reviewer is the safety net, not a \"universal verifier\".** Reviewers do not refute; they take one of three actions: **approve** the matcher's pick, **override** to a different node, or **reject** with no mapping. The substitution at lift is therefore not \"human-verifier \u2192 machine-verifier\" but \"human-with-override-capability \u2192 machine-without-override-capability\". This re-frames Path A: a refute/concur model is necessary but **not sufficient** if it cannot supply an override candidate when it disagrees.\n\nThe moment I5 lifts and a sealed PASS becomes a direct write, the reviewer's safety net is gone. Closing that gap is the central decision of lift, not an afterthought.\n\n## 3. The decision that must be made at lift\n\nThe hard preconditions in \u00a74 hold either way. The choice is **what replaces the reviewer** on the PASS band:\n\n### Path A \u2014 universal verifier on PASS (recommended)\n\nA cheap LLM refute-check runs on every PASS verdict before it can auto-persist. The verifier produces a **second seal under a separate key**; Persistence requires both seals present, both valid, and cross-bound to the same `input_hash + mapped_node_iri` before any autonomous write. The verifier must be able to supply an alternative candidate on disagreement (the override-capability the reviewer had); a yea/nay refuter alone does not replace the human.\n\nAdds latency to the common case; closes the substitution directly.\n\n### Path B \u2014 similarity-only autonomous writes\n\nNo semantic check; PASS is trusted on calibrated similarity alone. Defensible only when **every** precondition in \u00a74 is met **and** the per-vendor auto-persist precision target (\u00a77) is met with statistical confidence on a held-out golden set **and** the audit-back loop (\u00a74.5) is operating with documented integrity. Path B is not a shortcut: it trades the verifier for stricter reliance on calibration and audit, both of which become load-bearing under it.\n\n### Path C \u2014 hybrid: auto-persist with sliding-cadence sampling\n\nPersist sealed PASS autonomously; route a stratified random sample (rate set by `audit_sample_rate`) back through human review on a sliding cadence. Path C is **not a third route at lift** \u2014 it is **how the audit-back loop (\u00a74.5) operates regardless of Path A or B**. If sampled review disagreement breaches a threshold, automatic rollback is triggered (\u00a76).\n\n### Recommendation\n\n**Path A**, unless **all** of the following hold simultaneously:\n\n1. Measured per-PASS verifier p95 latency exceeds the end-to-end SLO budget (\u00a75.4), **and**\n2. Per-vendor auto-persist precision on the held-out golden set is \u2265 _[TBC: e.g. 99%]_ with a 95% confidence-interval lower bound also \u2265 _[TBC: e.g. 98%]_, **and**\n3. MRGR independent validation of the dense arm and calibration has signed off without findings.\n\nIf any of (1)\u2013(3) fails, the answer is to **remain at I5 and redesign** \u2014 not to fall to Path B by default. This choice is itself a precondition of lift and is recorded in the evidence pack.\n\n## 4. Hard preconditions\n\nAll must hold before lift; each requires evidence attached to the sign-off pack.\n\n### 4.1 Dense arm is production-grade\n\nThe dense retrieval arm is real semantic embeddings (Titan v2 or equivalent), **not** the Jaro-Winkler character-similarity stand-in. Auto-persisting on a string-similarity stand-in is indefensible.\n\nEvidence: model card (provider, version, hosting boundary, data residency); deployment manifest with pinned model version; integration tests against the production endpoint.\n\n### 4.2 Floor and band widths calibrated against a golden set\n\nThe floor and `\u00b1 half` width are derived from a labelled golden set, not guessed, and per-vendor auto-persist precision (\u00a77) meets target. **The dense swap and the recalibration are one operation** \u2014 any calibration done against Jaro-Winkler is void the moment embeddings land.\n\n#### 4.2.1 Golden set construction\n\n- **Labelling authority.** Named JPMC role _[TBC]_. \u22652 independent labellers per item; disagreements adjudicated by a third labeller.\n- **Taxonomy version pin.** Each label is valid against a specific CDAO snapshot ID. Re-label triggered on bump.\n- **Inter-annotator agreement.** Cohen's \u03ba \u2265 0.8 on a \u226520% double-labelled subset. Lower \u03ba blocks lift.\n- **Coverage.** \u2265 _[TBC: e.g. 200]_ items per vendor, stratified across CDAO branches in proportion to live traffic, with explicit oversampling of the hard tail (low-similarity historical disagreements).\n- **Hold-out.** \u226530% strict hold-out, never seen during floor selection or band tuning, used only for the final per-vendor precision report.\n- **Provenance.** Golden set lives in a controlled-access store with versioning, labelled by JPMC personnel only; no Cognizant labelling on items that calibrate the autonomous-write decision (conflict of interest).\n\n#### 4.2.2 Floor and band are independent events\n\nThe PASS-band threshold (sparse-ranker precision distribution) and the BORDERLINE half-width (LLM-specialist disagreement-cap effectiveness) are statistically independent. They are calibrated separately, against separate slices of the golden set, with separate target metrics.\n\n### 4.3 Verdict seal is hardened (the IAM-and-key cluster)\n\nThe entire I5 gate trusts `sealed_status` and `sealed_band`. The signing-key trust model must be:\n\n- **Key custody.** SSM Parameter Store or Secrets Manager (KMS-backed), scoped to the Match&Verify and Persistence task roles **only** \u2014 never readable by Ingestion or any operator role.\n- **IRSA scoping verified.** No cluster-wide service account; no privileged debug sidecar can assume the M&V pod identity; no shared SA across MCPs. Evidence: IRSA configuration audit + cluster posture report.\n- **Key rotation.** Documented rotation policy with maximum age _[TBC: e.g. 90 days]_, dual-control on rotation, and an overlap window during which both old and new keys verify.\n- **Key access audit.** CloudTrail on the SSM/SM ARN; every `GetSecretValue` is logged, alerted on out-of-band access, and reviewed monthly.\n- **Replay / freshness window.** `SCUDO_VERDICT_MAX_AGE_SECONDS` must be tightened from the current review-mediated default (300s) to a value appropriate for autonomous writes _[TBC: e.g. 60s]_. Pinned in the signed deploy manifest.\n- **Supply chain.** Container images for M&V and Persistence are signed (Sigstore/Notary), with provenance attestation and a deploy-time policy gate that refuses unsigned images.\n- **Rogue M&V operator.** Mitigated via dual-control on M&V deploys + the audit-back loop (\u00a74.5) which provides independent reconciliation of every autonomous write.\n\n### 4.4 Retrieval path is integration-tested against real stores\n\nFusion (dense + lexical + RRF + structural) and the persist gate are tested **end-to-end** against a real FalkorDB **and** a real Neptune cluster, not seam-tested only. Schema/contract tests run in CI for every M&V/Persistence change.\n\n### 4.5 Per-decision audit-back loop exists with integrity\n\nEvery autonomous write is audited; the sealed verdict is retained; sampled review is operating.\n\n- **Append-only audit store.** Separate IAM scope from Persistence; entries KMS-signed; automated reconciliation against Neptune writes (catches \"wrote but didn't log\" and \"logged but didn't write\").\n- **Retention horizon \u2265 regulatory minimum** _[TBC: e.g. 7 years]_.\n- **Sampling.** Stratified random sample at rate `audit_sample_rate` (\u00a77), with bias toward edge cases (PASS scores just above pass threshold, vendors with thin precedent volume, recent CDAO taxonomy changes).\n- **Acting authority.** Named role _[TBC]_ owns the sampled-review queue and is empowered to call rollback (\u00a76).\n- **Integrity guarantee.** A compromised auditor must not be able to hide a bad write; reconciliation runs from an independent source.\n\n### 4.6 Canonical taxonomy data quality evidenced\n\nEvery threshold, every calibration, every golden-set label is relative to the canonical taxonomy. If the taxonomy is broken, \"calibrated\" is meaningless.\n\n- Documented DQ pass within _[TBC: 30]_ days of lift: duplicate detection, orphan check, deprecated-node sweep, hierarchy validation.\n- Numeric DQ score above _[TBC]_; recalibration triggered if score drops post-lift.\n\n### 4.7 Precedent edge integrity established\n\nPrecedents drive both the live matcher (precedent reuse, rank-signal tilt) and the calibration signal. Poisoned precedents poison both.\n\n- All precedents created **before the dense swap** are re-scored under the new embeddings and either re-confirmed by a reviewer or quarantined.\n- Documented precedent-audit sample shows < _[TBC]_% defect rate.\n- Ageing/expiry policy exists (precedents older than _[TBC]_ require re-confirmation on next match).\n- **Precedents created from auto-persisted decisions (post-lift) are tagged distinctly and are NOT used to recalibrate the floor.** Otherwise the model learns from its own writes and the calibration loop closes on itself.\n\n### 4.8 Lift is a controlled rollout, not a flip\n\nPhased per \u00a75. Per-vendor lift, not aggregate. Reversible per \u00a76.\n\n### 4.9 Commercial and third-party control envelope refreshed\n\nLifting I5 moves Cognizant-delivered components from an advisory control category to an autonomous-write category against JPMC's system-of-record. Before lift:\n\n- SoW amendment covering liability, indemnification, and change-control for autonomous-write components.\n- Third-Party Risk Management classification refreshed (engagement risk tier likely changes).\n- Operational Risk capital impact assessment performed; result attached to evidence pack.\n\n### 4.10 LLM-in-the-loop classification\n\nThe Path A verifier and the BORDERLINE specialist are models under the Firmwide AI/ML Policy:\n\n- Registered in the Model Inventory at Tier _[TBC]_; model cards on file.\n- Independent validation report from MRM (second line).\n- Prompts and decision-policy versioned, pinned in the deploy manifest, included in change-management for any change.\n- Drift / regression suite runs on every model or prompt change.\n- Vendor-version pin (no silent provider upgrades).\n\n### 4.11 Governance sign-off\n\nLifting I5 is a control change governed by the JPMC Firmwide Model Risk Governance Framework (under SR 11-7) and the Firmwide AI/ML Risk Policy. Sign-off is required in parallel from the bodies enumerated in \u00a710. No single engineer or LOB head can authorise lift.\n\n### 4.12 Path A additional condition (required if Path A is chosen)\n\n#### Verifier-on-PASS seam is live, with all of the following:\n\n- **Separate seal.** Verifier produces an attestation under its own key, in its own SSM/Secrets Manager entry, scoped to **Verifier + Persistence task roles only \u2014 NOT readable by M&V**. Persistence requires both seals present, both valid, and cross-bound to the same `input_hash + mapped_node_iri` before any autonomous write.\n- **Override capability.** The verifier may return an alternative candidate (mimicking the reviewer's override path); Persistence treats verifier-disagreement-with-alternative as a routed-to-queue verdict, not a refuted PASS.\n- **Latency budget.** Per-PASS p95 \u2264 _[TBC: e.g. 800ms]_; hard timeout _[TBC: e.g. 2000ms]_; end-to-end PASS-to-persist SLO _[TBC]_.\n- **Fail-closed.** Timeout, 5xx, circuit-open, or any non-deterministic verifier response routes the verdict to the reviewer queue. Never auto-persist on a verifier failure.\n- **Circuit breaker** with documented open/half-open policy.\n- **Verifier MRGR registration.** As \u00a74.10.\n\n## 5. Lift sequence\n\n```mermaid\nflowchart LR\n    P0[\"Phase 0 \u2014 supervised<br/>I5 holds all verdicts\"]\n    P1a[\"Phase 1a \u2014 seal hardening<br/>(no lift)\"]\n    P1b[\"Phase 1b \u2014 dense swap + recalibrate<br/>(no lift)\"]\n    P2[\"Phase 2 \u2014 shadow mode<br/>per-vendor\"]\n    P3[\"Phase 3 \u2014 incremental lift<br/>bounded slice\"]\n    P4[\"Phase 4 \u2014 broaden\"]\n\n    P0 --> P1a --> P1b --> P2\n    P2 -->|per-vendor precision target met| P3\n    P3 -->|metrics hold, sampled audit clean| P4\n    P2 -.->|target missed| P1b\n    P3 -.->|rollback trigger fired| P0\n    P4 -.->|rollback trigger fired| P0\n\n    classDef supervised fill:#ece8e0,stroke:#7d7464,color:#3d362a;\n    classDef lift fill:#e0f0d5,stroke:#5a8f3a,color:#274a14;\n    class P0,P1a,P1b,P2 supervised;\n    class P3,P4 lift;\n```\n\n| Phase | Entry criteria | Activities | Exit criteria | Decision-maker | Min duration |\n|---|---|---|---|---|---|\n| **0 \u2014 supervised (now)** | n/a | I5 holds every verdict; precedents accumulate via reviewer queue | n/a | n/a | n/a |\n| **1a \u2014 seal hardening** | Decision to begin lift programme signed | \u00a74.3 cluster: SSM/SM, IRSA scoping, key rotation, audit trail, replay window, image signing | All \u00a74.3 evidence attached and independently reviewed | _[TBC: CISO delegate]_ | _[TBC]_ |\n| **1b \u2014 dense swap + recalibrate** | \u00a74.3 complete | Embeddings deployed; golden set built (\u00a74.2.1); floor + band recalibrated; integration tests against real stores | \u00a74.2 evidence attached; per-vendor precision evidenced against the hold-out; \u00a74.4 integration tests green | _[TBC: MRGR delegate + Tech Owner]_ | _[TBC]_ |\n| **2 \u2014 shadow mode (per vendor)** | \u00a74.1, \u00a74.2, \u00a74.3, \u00a74.4 complete | Compute the verdict that would auto-persist; still route through review; measure asymmetric metrics (\u00a77) per vendor | Per-vendor auto-persist precision \u2265 target with 95% CI lower bound \u2265 target, sustained over `N` decisions (\u00a77); no sealed-band integrity events | Accountable Owner + MRGR | _[TBC]_ per vendor |\n| **3 \u2014 incremental lift** | Phase 2 exit met for \u22651 vendor; \u00a74.5 (audit-back) live; \u00a74.7 (precedent integrity) complete; Path A or Path B + Path C decision recorded | Lift for one vendor (or a high-confidence sub-band within a vendor) | Auto-persist precision sustained; sampled-audit defect rate below ceiling; no rollback triggers fired over window `M`; no dependency SLA breach | Accountable Owner + MRGR + LOB head | _[TBC]_ |\n| **4 \u2014 broaden** | Phase 3 exit met | Lift further vendors incrementally, never as a single global switch | Per-vendor as above | Same as Phase 3 | per vendor |\n\n### 5.1 Partial preconditions\n\nIf a precondition is partially met (e.g. calibration completes for 3/5 vendors; integration tests pass for FalkorDB but not Neptune; precedent re-confirmation done for 1 vendor), the default is **wait**. Per-vendor lift on a partial calibration requires (a) explicit MRGR sign-off naming the limitation and (b) the unmet preconditions tracked as conditions-of-lift with a closing date.\n\n## 6. Rollback\n\n### 6.1 Rollback triggers\n\nRollback to I5 (full reviewer-queue routing) is **automatic** on any of the following:\n\n- Sampled-audit defect rate above _[TBC]_% over a rolling window of _[TBC]_ decisions.\n- Auto-persist precision (measured against late-arriving human override / correction) drops below the target's lower CI bound.\n- Any sealed-band integrity event (verify failure on a previously-accepted seal, key access anomaly, identity-binding mismatch).\n- Any dependency SLA breach affecting M&V, the verifier seam, or Persistence beyond _[TBC]_ minutes.\n- A taxonomy DQ score drop below the \u00a74.6 threshold.\n- A model drift / regression-suite breach on the dense arm or the verifier.\n\nRollback is also **manual** at any time, callable by any of: Accountable Owner, Technology Owner, MRGR, CISO delegate, on-call Persistence engineer.\n\n### 6.2 Rollback effect\n\n- **New verdicts.** Immediately route to reviewer queue; no new autonomous writes accepted.\n- **Already-persisted auto-writes.** Are **not** automatically retracted. Sampled re-review of writes in the affected window is triggered; retraction is per-decision (\u00a76.3).\n- **Precedents derived from auto-persisted decisions.** Tagged for re-validation; not used as a calibration signal until re-confirmed.\n\n### 6.3 Rollback semantics for persisted Neptune writes\n\nHard-delete from Neptune is **forbidden** (invalidates referential history for downstream consumers).\n\n- Retraction is implemented as a **superseding edge** with `status = RETRACTED`, `retraction_reason`, and a back-reference to the retracting decision.\n- Persistence MCP emits a `mapping.retracted` event on the same stream downstream consumers subscribe to, at-least-once contract, documented consumer SLA for honouring it _[TBC: SLA]_.\n- **Cascading precedent invalidation.** Any precedent edge whose evidence chain includes a now-retracted PASS is itself flagged and excluded from rank-signal tilt and floor recalibration until re-confirmed.\n\n## 7. Thresholds \u2014 JPMC to set\n\nReplaces the symmetric \"agreement\" metric (which averages a critical false-positive against an inert false-negative) with two named asymmetric metrics, both per-vendor.\n\n| Threshold | Used at | Target |\n|---|---|---|\n| **Auto-persist precision** `P(human approves | would-PASS)`, per vendor, hold-out only | Phase 2 \u2192 3 gate; rollback trigger | _[TBC: e.g. \u2265 98%, with 95% CI lower bound \u2265 96%]_ |\n| **Review-load delta** `P(would-PASS | human approves)`, per vendor | Informational throughput indicator only \u2014 **do not gate on this** | _[TBC]_ |\n| **Sample size N** per vendor for Phase 2 evidence | Phase 2 entry / exit | Derived from target precision + expected PASS base rate via power analysis; floor _[TBC: e.g. \u2265 500]_ |\n| **Audit sample rate** | Phase 3+ continuous | _[TBC: e.g. 5% stratified, with floor 100/day/vendor]_ |\n| **Audit-defect-rate rollback ceiling** | Rollback trigger | _[TBC: e.g. > 1% over rolling 1000-decision window]_ |\n| **Replay / freshness window** | `SCUDO_VERDICT_MAX_AGE_SECONDS` for autonomous writes | _[TBC: e.g. 60s]_ |\n| **Path A verifier p95 latency** | Path A gate | _[TBC: e.g. \u2264 800ms]_ |\n| **Path A verifier hard timeout** | Path A fail-closed | _[TBC: e.g. 2000ms]_ |\n| **Cohen's \u03ba on golden-set double-labelling** | Golden-set acceptance | \u2265 0.8 on \u2265 20% double-labelled subset |\n\n### 7.1 Scale-out anticipation\n\nThese thresholds are set for the five-vendor slice. The ~695-vendor scale-out will re-litigate them. Stating that explicitly here avoids the fight later: the per-vendor structure of the metrics is designed so scale-out adds vendors without re-deriving the methodology.\n\n## 8. Post-lift signals & review cadence\n\nThe lift is a hypothesis. Its falsification path must be defined.\n\n- **Monitoring (minimum).** Per-vendor auto-persist precision (rolling); audit-defect rate; verifier latency and error rate; seal-verify failure rate; Neptune write success/error; precedent-edge integrity score.\n- **Alarm-to-action map.** Each metric breach maps to a named action (page on-call, freeze further lift, automatic rollback). Documented in the runbook _[TBC: link]_.\n- **+30 / +90-day post-lift review.** Accountable Owner convenes a post-lift review at +30 days and +90 days per vendor; standing agenda includes precision trend, audit defects, rollback events, downstream-consumer feedback. Outcome documented to GRC.\n- **Annual recertification.** I5 lift is recertified annually as a control change; lapsed recertification triggers automatic rollback to I5.\n\n## 9. Threat model \u2014 what the seal defends, and what it doesn't\n\n| Threat | Defence | Residual |\n|---|---|---|\n| Forged verdict on the wire | HMAC seal verified by Persistence; identity-bound via `input_hash` | Key compromise (\u00a74.3) |\n| Replay across products | `input_hash` binding refuses identity-mismatched seals | None at protocol level |\n| Replay of stale verdict | Freshness window (\u00a77) | Window sizing trade-off |\n| Status smuggling via verdict body | Persistence reads `sealed_status` from the payload, not the agent dict | None |\n| Insider with M&V role | Dual-control on M&V deploys + audit-back loop reconciliation | Limited to one decision before reconciliation catches |\n| Compromised CI/CD pipeline | Image signing + deploy-time policy gate | Out-of-band deploy by privileged operator |\n| Compromised auditor | Independent reconciliation, append-only KMS-signed log | Coordinated insider attack across two roles |\n| Verifier compromise (Path A) | Separate key + separate IAM scope + cross-binding to M&V seal | Same as M&V insider, on the verifier side |\n| LLM hallucination on PASS (Path A) | Override-capable verifier; verifier-disagreement routes to queue | Verifier silent-agreement on a wrong PASS \u2014 caught by audit sampling |\n\n## 10. Approving forums \u2014 sign-off matrix\n\nLift cannot proceed until all of the following have approved. Each sign-off is recorded in the GRC tool; dissent at any forum blocks lift.\n\n| # | Forum | Why | Evidence required |\n|---|---|---|---|\n| 1 | Firmwide Model Risk Governance (MRGR / MRGRD) | LLM verifier + BORDERLINE specialist are models under JPMC model policy | Model cards, golden-set methodology, independent validation report |\n| 2 | AI/ML Governance Council | Agentic system + foundation-model use in a decision path | LLM-in-the-loop classification, drift suite, prompt versioning |\n| 3 | Data Risk Management | Canonical writes against SoR | DQ evidence (\u00a74.6), precedent integrity (\u00a74.7), retention policy |\n| 4 | Architecture review (CTC) | Neptune write path, IRSA, three-MCP topology | Architecture pack, integration test evidence (\u00a74.4) |\n| 5 | Technology Controls / CISO delegate | IAM + key custody changes | Seal-hardening evidence (\u00a74.3) |\n| 6 | Third-Party Oversight | Cognizant code on the auto-persist path | Refreshed TPRM classification, SoW amendment (\u00a74.9) |\n| 7 | Compliance | Disclosure, records retention | Retention policy, downstream-consumer disclosure plan |\n| 8 | LOB head (data domain) | Residual risk acceptance | Risk register entry |\n| 9 | Accountable Owner | Programme-level go decision | All of the above attached |\n\n### 10.1 Reversibility\n\nRe-imposing I5 is **not** a symmetric control change. Any rollback trigger (\u00a76.1) is unilateral and immediate. Programme-level pause is callable by Accountable Owner, Technology Owner, MRGR, or CISO delegate. Re-lifting after rollback requires the full sign-off matrix again, with root-cause analysis attached.\n\n## 11. Disclosure to downstream consumers\n\nConsumers of the canonical Neptune graph must be notified, before lift, that some entries are autonomously persisted. The notice must include:\n\n- The marker on each edge that indicates autonomous vs HITL provenance (`provenance.decided_by = \"auto\"` vs a named reviewer).\n- The retraction event semantics (\u00a76.3).\n- The audit-sampling cadence.\n\n## 12. Regulatory frameworks referenced\n\n- SR 11-7 (US Federal Reserve / OCC guidance on model risk management) \u2014 primary anchor.\n- JPMC Firmwide Model Risk Governance Framework \u2014 implementation of SR 11-7.\n- JPMC Firmwide AI/ML Risk Policy.\n- DORA (EU Digital Operational Resilience Act) \u2014 relevant if any consumer of the canonical store is in scope.\n- SS1/23 (Bank of England / PRA expectations for AI/ML in financial services) \u2014 relevant for UK operations.\n- EU AI Act \u2014 relevance to be assessed during MRGR registration.\n\n## 13. Glossary\n\n| Term | Definition |\n|---|---|\n| **I5** | Invariant 5 \u2014 never auto-promote weak-oracle output; enforced today by Persistence MCP routing all agent-driven AUTO_MAPPED verdicts to the reviewer queue. |\n| **SoR** | System of Record \u2014 here, Amazon Neptune. |\n| **PASS / BORDERLINE / FAIL** | Verdict bands at the matcher gate. See \u00a72. |\n| **Sealed verdict / `sealed_band`** | HMAC-signed payload from Match&Verify; Persistence reads `sealed_status` and `sealed_band` from the payload, not from the agent's verdict dict. |\n| **Path A / B / C** | The three options for replacing the reviewer on autonomous PASS persistence. See \u00a73. |\n| **Auto-persist precision** | `P(human approves | would-PASS)`, per vendor, on the golden-set hold-out. The gating metric. |\n| **MRGR** | Firmwide Model Risk Governance \u2014 second-line model risk function, owner of SR 11-7 compliance. |\n| **MRGRD** | Model Risk Governance & Reporting (department / process variant) \u2014 name confirmation TBD. |\n| **TPRM** | Third-Party Risk Management. |\n| **IRSA** | IAM Roles for Service Accounts \u2014 the EKS mechanism by which pod identity is granted IAM permissions. |\n| **Override-capable** | A verifier that can return an alternative candidate, not just refute / concur. |\n\n## 14. Open items (must close before circulation)\n\n- [ ] Name Accountable Owner, Technology Owner, Control Steward.\n- [ ] Fill all `[TBC]` placeholders (thresholds, retention windows, latency budgets, sample sizes).\n- [ ] Confirm exact name of MRGR-aligned forum and MRGR control ID.\n- [ ] Confirm whether the M6 bundle import control exists; if not, escalate.\n- [ ] Confirm DORA / EU AI Act applicability.\n- [ ] Attach SoW amendment status for \u00a74.9.\n- [ ] Link to runbook for \u00a78 alarm-to-action map.\n\n## 15. Document control\n\n- v0.1 \u2014 initial draft.\n- v0.2 \u2014 adversarial review incorporated: substitution re-framing, second-seal architecture, asymmetric calibration metrics, golden-set construction detail, Phase 1a/1b split, rollback semantics for Neptune writes, threat-model matrix, sign-off matrix, scale-out anticipation, Path C absorbed into audit-back loop, Cognizant commercial envelope.\n\n## Related\n\n- [Confidence bands & provenance (canonical)](/reference/matching-data-provenance.md)\n- [HITL bands handover](/handovers/hitl-bands-2026-06-26.md)", "specs/ingestion-framework": "# Ingestion Framework \u2014 Technical Specification\n\n## Table of Contents\n\n1. [Overview](#1-overview)\n2. [Architecture](#2-architecture)\n3. [Class Design](#3-class-design)\n4. [Trigger Mechanisms](#4-trigger-mechanisms)\n5. [Column Comparison and Validation Logic](#5-column-comparison-and-validation-logic)\n6. [File Processing Rules](#6-file-processing-rules)\n7. [ETL Run Log](#7-etl-run-log)\n8. [File Format Support](#8-file-format-support)\n9. [Database Schema Changes](#9-database-schema-changes)\n10. [UI Reports Section](#10-ui-reports-section)\n11. [Error Handling and Edge Cases](#11-error-handling-and-edge-cases)\n\n---\n\n## 1. Overview\n\nThe ingestion framework reads data files from a landing folder, validates them against the registered dataset metadata, loads records into the target ingestion table, and logs the outcome of every run in `etl_run_log`.\n\nKey principles:\n- **One physical file is processed exactly once.** A file that has already been loaded is never re-loaded.\n- **Schema drift is not a blocker.** Extra or missing columns are recorded as warnings; processing continues on the known columns.\n- **All outcomes are observable.** Every run, success or failure, produces a row in `etl_run_log` with enough context for self-service debugging.\n- **No hard-coded format logic at the call site.** The caller invokes the base class; format-specific behaviour is encapsulated in derived classes.\n\n---\n\n## 2. Architecture\n\n```\nCaller (API endpoint / CLI / scheduler)\n         \u2502\n         \u25bc\n  IngestionEngine          \u2190 base class, entry point, orchestration\n         \u2502\n         \u2502  resolves dataset metadata from DB\n         \u2502  selects the correct reader\n         \u2502\n         \u251c\u2500\u2500 CsvIngester\n         \u251c\u2500\u2500 TxtIngester   (configurable delimiter)\n         \u251c\u2500\u2500 JsonIngester\n         \u251c\u2500\u2500 XlsxIngester  (configurable sheet name)\n         \u251c\u2500\u2500 XmlIngester\n         \u2514\u2500\u2500 ParquetIngester\n```\n\nThe base class (`IngestionEngine`) owns:\n- Dataset resolution (from DB via `dataset_id`)\n- File discovery and ordering\n- Column comparison\n- Target table load\n- ETL run log writing\n- File move to processed folder\n\nDerived classes own **only** the file reading logic: they receive a file path and return a `pandas.DataFrame`.\n\n---\n\n## 3. Class Design\n\n### 3.1 Base Class \u2014 `IngestionEngine`\n\n```python\nclass IngestionEngine:\n    \"\"\"\n    Orchestrates a full ingest run for one dataset.\n    Subclasses implement read_file() for their specific format.\n    \"\"\"\n\n    def __init__(self, dataset_id: int):\n        self.dataset_id = dataset_id\n        self.meta = None          # populated by _load_metadata()\n        self.run_log_id = None    # set after etl_run_log row is inserted\n\n    # ------------------------------------------------------------------ #\n    # Public API                                                           #\n    # ------------------------------------------------------------------ #\n\n    def run(self) -> list[dict]:\n        \"\"\"\n        Discover files, process each one, return list of run-log summaries.\n        Called by the trigger layer (API, CLI, scheduler).\n        \"\"\"\n        self._load_metadata()\n        files = self._discover_files()\n\n        if not files:\n            self._log_run(\n                file_path=None,\n                run_status='skipped',\n                status_notes='No files found matching pattern in landing folder',\n                column_status='n/a',\n                records_loaded=0,\n            )\n            return []\n\n        results = []\n        for file_path in files:\n            results.append(self._process_file(file_path))\n        return results\n\n    # ------------------------------------------------------------------ #\n    # Abstract \u2014 subclasses must implement                                 #\n    # ------------------------------------------------------------------ #\n\n    def read_file(self, file_path: str) -> 'pd.DataFrame':\n        \"\"\"\n        Read the file at file_path and return a DataFrame.\n        Receives all dataset metadata via self.meta for format-specific\n        parameters (delimiter, sheet_name, etc.).\n        \"\"\"\n        raise NotImplementedError\n\n    # ------------------------------------------------------------------ #\n    # Orchestration \u2014 implemented in base class                           #\n    # ------------------------------------------------------------------ #\n\n    def _load_metadata(self): ...\n    def _discover_files(self) -> list[str]: ...\n    def _process_file(self, file_path: str) -> dict: ...\n    def _compare_columns(self, file_columns: list[str]) -> dict: ...\n    def _load_to_target(self, df, file_path: str) -> int: ...\n    def _move_to_processed(self, file_path: str) -> str: ...\n    def _log_run(self, **kwargs) -> int: ...\n    def _already_processed(self, file_path: str) -> bool: ...\n```\n\n### 3.2 Factory Function\n\n```python\ndef get_ingester(dataset_id: int) -> IngestionEngine:\n    \"\"\"\n    Resolve the data_format from metadata and return the correct subclass instance.\n    The caller never needs to know which format is involved.\n    \"\"\"\n    fmt = _fetch_format(dataset_id)   # lightweight DB lookup\n    registry = {\n        'csv':     CsvIngester,\n        'txt':     TxtIngester,\n        'json':    JsonIngester,\n        'xlsx':    XlsxIngester,\n        'xml':     XmlIngester,\n        'parquet': ParquetIngester,\n    }\n    cls = registry.get(fmt)\n    if not cls:\n        raise ValueError(f'Unsupported format: {fmt}')\n    return cls(dataset_id)\n```\n\n### 3.3 Derived Classes\n\nEach derived class only implements `read_file()`.\n\n```python\nclass CsvIngester(IngestionEngine):\n    def read_file(self, file_path):\n        return pd.read_csv(file_path)\n\nclass TxtIngester(IngestionEngine):\n    def read_file(self, file_path):\n        delimiter = self.meta.get('delimiter', ',')\n        return pd.read_csv(file_path, sep=delimiter)\n\nclass JsonIngester(IngestionEngine):\n    def read_file(self, file_path):\n        return pd.read_json(file_path)\n\nclass XlsxIngester(IngestionEngine):\n    def read_file(self, file_path):\n        sheet = self.meta.get('sheet_name') or 0\n        return pd.read_excel(file_path, sheet_name=sheet)\n\nclass XmlIngester(IngestionEngine):\n    def read_file(self, file_path):\n        return pd.read_xml(file_path)\n\nclass ParquetIngester(IngestionEngine):\n    def read_file(self, file_path):\n        return pd.read_parquet(file_path)\n```\n\n---\n\n## 4. Trigger Mechanisms\n\n### 4.1 Dataset-ID Based Trigger\n\nThe primary trigger. The caller provides only a `dataset_id`; all other parameters are resolved from the metadata database.\n\n**Metadata resolved from DB:**\n\n| Field | Source Table | Purpose |\n|---|---|---|\n| `data_format` | `tp_dataset` | Which derived class to instantiate |\n| `sheet_name` | `tp_dataset` | XLSX only |\n| `delimiter` | `tp_dataset` | TXT only |\n| `landing_folder` | `tp_dataset` | Where to look for files |\n| `file_name_pattern` | `tp_dataset` | Glob pattern to match files (e.g. `equity_prices_*.csv`) |\n| `target_table` | `tp_dataset` | Ingestion DB table to write to |\n| `dataset_id` | `tp_dataset` | Business key written to every loaded row |\n| `provider_id` | `tp_dataset` | Business key written to every loaded row |\n| columns | `tp_dataset_col` | Current version column list for comparison |\n\n**Invocation:**\n\n```python\n# API endpoint (Flask)\n@bp.post('/ingest/<int:dataset_id>')\ndef trigger_ingest(dataset_id):\n    ingester = get_ingester(dataset_id)\n    results = ingester.run()\n    return jsonify(results), 200\n\n# CLI\npython -m ingestion.run --dataset-id 3\n\n# Scheduler (cron / Airflow task)\nget_ingester(dataset_id=3).run()\n```\n\n### 4.2 Future Trigger Modes (out of scope for v1)\n\n| Mode | Description |\n|---|---|\n| Provider-level | Run all active datasets for a given `provider_id` |\n| Full refresh | Reprocess all files regardless of processed status |\n| File-path based | Supply an explicit file path, bypassing discovery |\n\n---\n\n## 5. Column Comparison and Validation Logic\n\nColumn comparison happens after the file is read, before any rows are loaded. It compares the columns in the current active version of the dataset (`tp_dataset_col WHERE current_flag='y'`) against the columns found in the file.\n\n### 5.1 Comparison Matrix\n\n| Scenario | Condition | Action | `column_status` | `status_notes` |\n|---|---|---|---|---|\n| **Exact match** | File columns == dataset columns (order-insensitive) | Load all columns | `match` | \u2014 |\n| **File has more columns** | File has columns not in dataset | Load known columns only; extra columns ignored | `extra_cols_in_file` | List of extra column names |\n| **File is missing columns** | Dataset has columns not in file | Load with NULLs for missing; flag as warning | `missing_cols_in_file` | List of missing column names |\n| **Both extra and missing** | Combination of above | Load known intersection; flag both | `col_mismatch` | Lists of both extra and missing |\n\nComparison is **case-insensitive** and **order-insensitive**. Only the intersection of known columns is loaded.\n\n### 5.2 Column Resolution Pseudocode\n\n```python\ndef _compare_columns(self, file_columns):\n    known = {c['col_name'].lower() for c in self.meta['columns']}\n    actual = {c.lower() for c in file_columns}\n\n    extra   = sorted(actual - known)\n    missing = sorted(known - actual)\n    common  = sorted(known & actual)\n\n    if not extra and not missing:\n        status = 'match'\n        notes  = None\n    elif extra and not missing:\n        status = 'extra_cols_in_file'\n        notes  = f'Extra: {extra}'\n    elif missing and not extra:\n        status = 'missing_cols_in_file'\n        notes  = f'Missing: {missing}'\n    else:\n        status = 'col_mismatch'\n        notes  = f'Extra: {extra} | Missing: {missing}'\n\n    return {'status': status, 'notes': notes, 'load_columns': common}\n```\n\n---\n\n## 6. File Processing Rules\n\n### 6.1 File Discovery\n\n1. Read `landing_folder` and `file_name_pattern` from dataset metadata.\n2. Glob-match all files in the landing folder against the pattern.\n3. Sort matched files by **file modification date, ascending** (oldest first).\n4. Process files one at a time in that order.\n\n```python\ndef _discover_files(self):\n    folder  = self.meta['landing_folder']\n    pattern = self.meta['file_name_pattern']\n    matches = glob.glob(os.path.join(folder, pattern))\n    return sorted(matches, key=os.path.getmtime)\n```\n\n### 6.2 Duplicate / Already-Processed Check\n\nBefore processing each file:\n\n1. Derive a canonical file identity: **filename + file size + file mtime** (stored as `file_path` in `etl_run_log`).\n2. Query `etl_run_log` for a row with the same `file_path` and `run_status = 'success'`.\n3. If found \u2192 skip; write a new `etl_run_log` row with `run_status = 'skipped'` and `status_notes = 'Already processed: {original_run_date}'`.\n4. If not found \u2192 proceed with processing.\n\nThis handles the case where a file was not moved (move failed) and the job is re-run.\n\n### 6.3 Processing Sequence (per file)\n\n```\n1. Check already-processed \u2192 skip if yes\n2. Read file into DataFrame using derived class read_file()\n3. Compare columns \u2192 determine load_columns\n4. Filter DataFrame to load_columns only\n5. Add audit columns to every row:\n       load_id      = <new run log id>\n       provider_id  = self.meta['provider_id']\n       dataset_id   = self.meta['dataset_id']\n       load_date    = NOW()\n       load_process = 'dataset_id:<id>|file:<filename>'\n6. Bulk-insert into target_table (ingestion DB)\n7. Write etl_run_log row (run_status = 'success' or 'failed')\n8. Move file to <landing_folder>/processed/<YYYYMMDD_HHMMSS>/<filename>\n9. If move fails \u2192 log warning in status_notes; do NOT revert the load\n```\n\n### 6.4 Processed Folder Structure\n\n```\n<landing_folder>/\n    processed/\n        20240102_083000/\n            equity_prices_20240102.csv\n        20240103_091500/\n            equity_prices_20240103.csv\n```\n\nTimestamped sub-folder per run prevents name collisions when the same filename arrives on different dates.\n\n### 6.5 Move-Failed Rerun Safety\n\nIf a move fails and the user reruns the ingestion:\n- Step 1 (already-processed check) finds the `run_status = 'success'` row with the same `file_path`.\n- The file is skipped; a new `run_status = 'skipped'` row is logged.\n- The move is reattempted as part of the skipped-file handling so the file eventually leaves the landing folder.\n\n---\n\n## 7. ETL Run Log\n\n### 7.1 Table: `etl_run_log` (metadata database)\n\n```sql\nCREATE TABLE etl_run_log (\n    run_id          BIGINT AUTO_INCREMENT PRIMARY KEY,\n    provider_id     INT          NOT NULL,\n    dataset_id      INT          NOT NULL,\n    run_date        DATETIME     NOT NULL DEFAULT CURRENT_TIMESTAMP,\n    run_status      VARCHAR(20)  NOT NULL\n                    COMMENT 'success | failed | skipped | partial',\n    column_status   VARCHAR(30)  NOT NULL\n                    COMMENT 'match | extra_cols_in_file | missing_cols_in_file | col_mismatch | n/a',\n    status_notes    TEXT,\n    file_path       VARCHAR(1000),\n    file_name       VARCHAR(500),\n    file_size_bytes BIGINT,\n    file_mtime      DATETIME,\n    records_found   INT          COMMENT 'rows in the source file',\n    records_loaded  INT          COMMENT 'rows successfully inserted',\n    records_skipped INT          COMMENT 'rows rejected (type errors, nulls on required cols)',\n    target_table    VARCHAR(255),\n    dataset_version INT          COMMENT 'tp_dataset.version at time of run',\n    error_detail    TEXT         COMMENT 'full exception traceback if run_status=failed',\n    created_by      VARCHAR(100) DEFAULT 'system',\n\n    INDEX idx_run_dataset  (dataset_id, run_date),\n    INDEX idx_run_provider (provider_id, run_date),\n    INDEX idx_run_status   (run_status),\n    INDEX idx_run_file     (file_name, run_status)\n);\n```\n\n### 7.2 `run_status` Values\n\n| Value | Meaning |\n|---|---|\n| `success` | All records loaded; file moved to processed folder |\n| `failed` | Unrecoverable error; no records loaded; file not moved |\n| `partial` | Some records loaded, some rejected (type errors etc.); file moved |\n| `skipped` | File already processed in a prior run, or no files found |\n\n### 7.3 Sample Rows\n\n| run_id | dataset_id | run_status | column_status | status_notes | file_name | records_loaded |\n|---|---|---|---|---|---|---|\n| 1 | 3 | success | match | \u2014 | equity_prices_20240102.csv | 250 |\n| 2 | 3 | success | extra_cols_in_file | Extra: ['low'] | equity_prices_20240103.csv | 250 |\n| 3 | 3 | skipped | n/a | Already processed: 2024-01-02 08:30 | equity_prices_20240102.csv | 0 |\n| 4 | 3 | failed | n/a | FileNotFoundError: landing folder does not exist | \u2014 | 0 |\n\n---\n\n## 8. File Format Support\n\n| Format | Class | Key Parameters | Notes |\n|---|---|---|---|\n| CSV | `CsvIngester` | \u2014 | Auto-detects header row |\n| TXT | `TxtIngester` | `delimiter` (stored in `tp_dataset`) | Treated as CSV with a custom separator |\n| JSON | `JsonIngester` | \u2014 | Top-level array or newline-delimited |\n| XLSX | `XlsxIngester` | `sheet_name` (stored in `tp_dataset`) | Defaults to first sheet if not specified |\n| XML | `XmlIngester` | \u2014 | Uses `pd.read_xml`; repeating element = row |\n| Parquet | `ParquetIngester` | \u2014 | Schema read from Parquet metadata |\n\n---\n\n## 9. Database Schema Changes\n\n### 9.1 Add columns to `tp_dataset`\n\n```sql\nALTER TABLE tp_dataset\n    ADD COLUMN delimiter  VARCHAR(10)  AFTER data_format,\n    ADD COLUMN sheet_name VARCHAR(255) AFTER delimiter;\n```\n\n> `delimiter` is used by `TxtIngester`. `sheet_name` is used by `XlsxIngester`.\n> Both are already resolved in `_load_metadata()` and available via `self.meta`.\n\n### 9.2 New table: `etl_run_log`\n\nSee Section 7.1 \u2014 add to `init_db.sql`.\n\n---\n\n## 10. UI Reports Section\n\n### 10.1 Navigation\n\nAdd a **Reports** item to the main navigation sidebar, below Datasets.\n\n### 10.2 Pages\n\n#### 10.2.1 Ingestion Run Summary (`/reports`)\n\nA filterable table showing one row per `etl_run_log` entry.\n\n**Filters (top bar):**\n- Provider (dropdown)\n- Dataset (dropdown, filtered by selected provider)\n- Status (multi-select: success / failed / skipped / partial)\n- Date range (from / to date pickers)\n\n**Columns:**\n\n| Column | Source |\n|---|---|\n| Run ID | `run_id` |\n| Provider | `provider_id` \u2192 lookup provider name |\n| Dataset | `dataset_id` \u2192 lookup dataset name |\n| Run Date | `run_date` |\n| Status | `run_status` (colour-coded badge) |\n| Column Status | `column_status` (badge) |\n| File | `file_name` |\n| Records Loaded | `records_loaded` |\n| Notes | `status_notes` (truncated, expand on click) |\n| Actions | Detail link |\n\n**Status badge colours (accessible, not colour-only):**\n- `success` \u2014 green badge, \"\u2713 Success\"\n- `failed` \u2014 red badge, \"\u2717 Failed\"\n- `partial` \u2014 amber badge, \"\u26a0 Partial\"\n- `skipped` \u2014 grey badge, \"\u2014 Skipped\"\n\n#### 10.2.2 Run Detail (`/reports/<run_id>`)\n\nFull detail view for a single run log row.\n\nSections:\n- **Run Summary** \u2014 run_id, status, run_date, created_by\n- **Dataset Info** \u2014 provider name, dataset name, dataset version at time of run, target_table\n- **File Info** \u2014 file_path, file_name, file_size, file_mtime\n- **Record Counts** \u2014 records_found, records_loaded, records_skipped\n- **Column Status** \u2014 column_status badge + full status_notes (untruncated)\n- **Error Detail** \u2014 full `error_detail` stacktrace (shown only if run_status = 'failed'; monospace scrollable block)\n\n### 10.3 API Endpoints\n\n```\nGET  /api/reports                    list with filter params: provider_id, dataset_id, status, from_date, to_date\nGET  /api/reports/<int:run_id>       single run detail\nPOST /api/ingest/<int:dataset_id>    trigger ingestion and return run log summaries\n```\n\n---\n\n## 11. Error Handling and Edge Cases\n\n| Scenario | Behaviour |\n|---|---|\n| Landing folder does not exist | `run_status = 'failed'`; `error_detail` = path + OS error; no file processed |\n| File is unreadable (permissions, corrupt) | `run_status = 'failed'` for that file; continue to next file |\n| All columns in file are unknown | `run_status = 'failed'`; `column_status = 'col_mismatch'`; no rows loaded |\n| Target table does not exist | `run_status = 'failed'`; `error_detail` includes table name; raised as configuration error |\n| File move fails after successful load | Load is kept; `status_notes` includes move error; `run_status = 'partial'`; re-run will detect via already-processed check and reattempt move |\n| Dataset metadata not found (bad dataset_id) | Raise immediately with HTTP 404 before any file work begins |\n| XLSX sheet not found | `run_status = 'failed'`; `error_detail` lists available sheet names |\n| TXT file with no delimiter configured | Default to comma; log warning in `status_notes` |\n| Zero-row file | Load metadata columns only (0 data rows); `run_status = 'success'`; `records_loaded = 0` |\n| Multiple files on same run | Each file gets its own `etl_run_log` row; a parent-level summary row is NOT created (each row is independently queryable) |\n\n---\n\nFor the SCUDO matching-pipeline diagrams, see [architecture diagrams & sources](/architecture/diagrams-and-sources.md).\n\n## Related\n\n- [Confidence bands & provenance (canonical)](/reference/matching-data-provenance.md)\n- [Architecture diagrams](/architecture/diagrams-and-sources.md)", "specs/matching-frontend": "# SCUDO Matching Front-End \u2014 Revised Design Spec\n\n**Date:** 2026-06-24 \u00b7 **Status:** implemented (Phases 0\u20132); owner sign-off + AWS deploy pending  \n**Supersedes:** implicit target in `docs/superpowers/plans/2026-06-24-scudo-matching-frontend-and-deploy.md` (port into `frontend/`)\n\n---\n\n## Intent\n\nShip a **stakeholder-safe SCUDO matching comprehension UI** that:\n\n1. Tells a coherent end-to-end story (vendor product \u2192 ETL \u2192 A/B/C matcher \u2192 confidence gate \u2192 band routing \u2192 JAPI persist).\n2. Labels all synthetic data unmistakably as **ILLUSTRATIVE**.\n3. Uses the **polished understand-anything dashboard** the owner already approved on `:5177`, not the generic ingestion console at `:3000/mapping`.\n\nMock data is acceptable. Incoherent mock data presented as real bank taxonomy is not.\n\n---\n\n## Owner decisions (binding)\n\n| ID | Decision | Rationale |\n|----|----------|-----------|\n| **D-1** | **Ship `understand-anything-plugin/packages/dashboard`** as the matching UI | Owner rejected `:3000/mapping` (\"awful\", \"shadcn looking thing\"). `:5177` dashboard already has layered graph, tour, band colouring, Cognizant polish. |\n| **D-2** | **Confidence bands follow matcher config** (not architecture diagram copy) | PASS \u2265 0.80, BORDERLINE 0.70\u20130.80, FAIL < 0.70 \u2014 see `docs/superpowers/matching-data-provenance.md`. **Corrected 2026-08-16:** this row said PASS \u2265 0.85 / BORDERLINE 0.75\u20130.85 / FAIL < 0.75, from the pre-5-zone `CONFIDENCE_FLOOR=0.80`. The decision itself (\"follow matcher config\") is unchanged and still binding \u2014 only the transcribed numbers were stale. |\n| **D-3** | **IRI scheme `jpmorgan:data:cdao:*`** for all CDAO nodes in shipped artifacts | `urn:cdao:*` and bare `cdao:*` are legacy demo pollution. |\n| **D-4** | **Drop Marketing domain** from taxonomy and graph | Incoherent for LSEG / ICE / S&P Global financial-data demo. |\n| **D-5** | **Phase 3\u20134 (AWS deploy) gated** on owner screenshots of Phases 0\u20132 on `:5177` | Codex C-8: no public demo without origin secret / auth hardening. |\n\n---\n\n## What ships vs. what does not\n\n| Artifact | Role | Ship? |\n|----------|------|-------|\n| `Understand-Anything/.../packages/dashboard` | Matching comprehension SPA (React 19, `@xyflow/react`, tour, layers) | **Yes \u2014 primary UI** |\n| `MatchMaker/frontend/` | Data Ingestion Framework console | **No for matching** \u2014 keep for ingestion; revert `/mapping` bolt-on |\n| `MatchMaker/backend/` | Flask API, matcher, graph builder, fixtures | **Yes \u2014 data + API source of truth** |\n| `MatchMaker/infra/scudo-poc-*.yaml` | Console deploy stacks | **Yes \u2014 revised to build dashboard, not `frontend/`** |\n\n---\n\n## Two graph schemas (do not conflate)\n\nThe codebase currently has **two** graph shapes. The spec locks which is canonical for each consumer:\n\n### A. KnowledgeGraph (dashboard contract)\n\nConsumed by `packages/dashboard` via `validateGraph()` from `@understand-anything/core/schema`.\n\n- File: `matching-graph.json` (served as `knowledge-graph.json` in matching demo mode)\n- Fields: `version`, `kind: \"codebase\"`, `project`, `nodes[]` (id, type, name, summary, tags, \u2026), `edges[]`, `layers[]`, `tour[]`\n- Node `summary` carries expositional caption text\n- `meta.json` may carry `dataProvenance: \"synthetic\"` for the ILLUSTRATIVE banner\n\n**This is the UI contract.** `build_matching_graph.py` MUST emit this shape.\n\n### B. MatchPayload (API contract)\n\nConsumed by `GET /api/mapping/graph` and programmatic clients.\n\n- Documented in `docs/superpowers/matching-data-provenance.md` and the original plan\n- Slimmer: `meta`, `nodes[]` with `kind`, `caption`, `provenance`, `edges[]` with `band` / `weight`\n\n**Phase 2 approach:** API route joins captions from `cdao_catalogue.json` + fixture at response time (Codex C-5). For the dashboard demo, either:\n\n- **Preferred:** Dashboard loads static `matching-graph.json` (KnowledgeGraph) built by `build_matching_graph.py`; API is for drill-down / future live mode.\n- **Later:** Add `?format=knowledge-graph` on the API or a thin adapter in the dashboard store.\n\nDo **not** replace KnowledgeGraph emission with MatchPayload-only output (regression that broke `:5177` compatibility).\n\n---\n\n## Phase 0 \u2014 Honest, coherent mock data (BLOCKER)\n\n### Taxonomy (`backend/scudo/fixtures/cdao_catalogue.json`)\n\n- [x] Remove Marketing domain and all `urn:cdao:*` / `cdao:*` nodes\n- [x] Use `jpmorgan:data:cdao:domain|subdomain|concept:<slug>` IRIs\n- [x] Every node: `caption` (\u2264140 chars) + `provenance: { \"source\": \"synthetic\" }`\n- [x] Regenerate `matching-graph.json` (KnowledgeGraph) from fixed catalogue \u2014 synced to dashboard `public/` via `sync_matching_graph_to_dashboard.sh`\n\n### Ingest & seed\n\n- [x] `backend/scudo_mapping_mcp/ingest.py` seeds from catalogue fixture\n- [x] `backend/scudo/seed_falkordb.py` defaults to catalogue fixture\n- [ ] FalkorDB cleanup: delete stale Marketing / `urn:cdao` / `cdao:` nodes in running graph \u2014 `cleanup_stale_cdao.py` ready, not run live\n- [x] Grep gates in `backend/scudo/tests/test_provenance.py`: no `Marketing`, `urn:cdao`, bare `cdao:` in fixtures or emitted graph\n\n### UI honesty\n\n- [x] Persistent **ILLUSTRATIVE DATA** banner when `meta.dataProvenance === \"synthetic\"` (`IllustrativeDataBanner.tsx`)\n- [x] Node panel shows `caption` / `summary` as expositional context\n\n---\n\n## Phase 1 \u2014 Matching-mode dashboard (not `frontend/` port)\n\nWork happens in `packages/dashboard`, triggered from MatchMaker via sync script or monorepo path.\n\n### 1.1 Matching demo profile\n\nWhen `VITE_DEMO_MODE=true` and graph is SCUDO matching (`project.name` contains \"SCUDO Matching\" or env `VITE_MATCHING_MODE=true`):\n\n| Control | Action |\n|---------|--------|\n| Domain / structural view toggles | Hide or disable |\n| File explorer, code viewer, pathfinder | Hide |\n| Persona selector (developer-focused) | Hide or default to \"Executive tour\" |\n| Layer legend | Keep \u2014 exposes ETL / Matcher / Gate / Persist bands |\n| Project overview + guided tour | Keep \u2014 primary exposition vehicle |\n| Learn panel | Keep if tour steps reference matcher stages |\n\n### 1.2 Macro pipeline fidelity\n\n- Graph uses **pinned layout** for architecture stages (ETL \u2192 parse \u2192 semantic \u2192 rank \u2192 gate \u2192 bands \u2192 orchestration \u2192 HITL \u2192 JAPI), not random ELK scatter for those nodes\n- Existing `layers[]` in `matching-graph.json` group nodes; `tour[]` walks the story left-to-right\n- Edge colouring: PASS green, BORDERLINE amber, FAIL red per D-2\n\n### 1.3 Micro match drill-down\n\n- Selecting a **vendor product** node opens NodeInfo with: candidates, scores, band, chosen CDAO target\n- Data from graph node `summary` / edge `weight` / `band` metadata already embedded by `build_matching_graph.py`\n- No separate React page required if NodeInfo + tour suffice; optional `MatchDetail` drawer if owner wants isolation\n\n### 1.4 Revert wrong target\n\nIn `MatchMaker/frontend/`:\n\n- [x] Remove routes `/mapping`, `/mapping/drilldown`, `/mapping/lab` and associated pages added in the rejected bolt-on\n- [x] Restore nav to ingestion-only scope\n- [x] Keep `GET /api/mapping/graph` on backend \u2014 API is still valid\n\n---\n\n## Phase 2 \u2014 Real `GET /api/mapping/graph`\n\n- Route: `backend/routes/mapping.py` \u2014 join captions from fixture (C-5)\n- Tests: `backend/tests/test_mapping_graph_route.py`\n- Response shape: MatchPayload (schema B) unless `format=knowledge-graph` query added later\n- **Sync pipeline:** after `python backend/scudo/build_matching_graph.py`:\n  1. Write `backend/scudo/fixtures/matching-graph.json` (KnowledgeGraph)\n  2. Copy to `packages/dashboard/public/matching-graph.json`\n  3. Optionally copy to `.understand-anything/knowledge-graph.json` for local `GRAPH_DIR` dev\n\n### Local dev recipe (`:5177`)\n\n```bash\n# MatchMaker repo\npython backend/scudo/build_matching_graph.py\ncp backend/scudo/fixtures/matching-graph.json \\\n   ../Understand-Anything/understand-anything-plugin/packages/dashboard/public/matching-graph.json\n\n# Dashboard repo\ncd packages/dashboard\nGRAPH_DIR=/path/to/MatchMaker pnpm dev --port 5177\n# Or: VITE_DEMO_MODE=true with matching-graph.json in public/\n```\n\n---\n\n## Phase 3\u20134 \u2014 AWS deploy (separate plan, hard gate)\n\nPrerequisites: owner approves `:5177` screenshots for Phases 0\u20132.\n\n### Deploy target change (from original plan)\n\nCodeBuild currently runs `cd frontend && npm run build`. **Revise to:**\n\n1. Submodule or clone `understand-anything-plugin` at pinned commit, OR vendor `packages/dashboard` into MatchMaker `dashboard/` subtree\n2. Run `pnpm build:demo` (or `vite build` with `VITE_DEMO_MODE` + `VITE_GRAPH_URL=/api/mapping/graph` once live)\n3. Upload `dist/` to S3 / CloudFront per `infra/scudo-poc-frontend.yaml`\n\n### Infra constraints (unchanged from Codex review)\n\n- Revise existing `infra/scudo-poc-*.yaml` in place (C-3)\n- CloudFront `/healthz` behaviour or smoke via `/api/mapping/vendors` (C-7)\n- Origin secret header before external demo (C-8)\n- Schema migration sentinel before `init_db.sql` (C-6)\n\n---\n\n## Acceptance criteria\n\n### Phase 0\n\n- [x] `grep -r 'Marketing\\|urn:cdao' backend/scudo/fixtures/ packages/dashboard/public/matching-graph.json` \u2192 no matches\n- [x] Every graph node has expositional text; banner visible on load\n- [x] `pytest backend/scudo/tests/test_provenance.py` passes\n\n### Phase 1\n\n- [x] `:5177` loads SCUDO graph with deliberate left-to-right pipeline visible without manual panning (agent-verified; tour overlay)\n- [x] No broken code-comprehension buttons in matching mode\n- [ ] Owner sign-off: \"tells the story\"\n\n### Phase 2\n\n- [x] `curl localhost:5001/api/mapping/graph` \u2192 200, valid JSON, synthetic meta (pytest-covered)\n- [x] Rebuild script syncs dashboard static file\n\n### Phase 3\u20134\n\n- [ ] CloudFront URL loads matching demo\n- [ ] Playwright smoke: banner + tour step 1 + gate node visible\n\n---\n\n## File map\n\n| Path | Responsibility |\n|------|----------------|\n| `backend/scudo/fixtures/cdao_catalogue.json` | Canonical synthetic CDAO taxonomy |\n| `backend/scudo/build_matching_graph.py` | Emit KnowledgeGraph `matching-graph.json` |\n| `backend/scudo/fixtures/matching-graph.json` | Committed graph artifact (MatchMaker) |\n| `backend/routes/mapping.py` | `GET /api/mapping/graph` |\n| `docs/superpowers/matching-data-provenance.md` | Bands + IRI + classification table |\n| `packages/dashboard/public/matching-graph.json` | Static graph for demo build (synced) |\n| `packages/dashboard/src/App.tsx` | Matching-mode chrome hiding |\n| `packages/dashboard/src/components/GraphView.tsx` | Band edge colouring (exists) |\n| `packages/dashboard/src/components/IllustrativeDataBanner.tsx` | ILLUSTRATIVE banner |\n| `infra/scudo-poc-build.yaml` | CodeBuild \u2014 **must build dashboard** |\n\n---\n\n## Self-review checklist (spec author)\n\n| Requirement | Covered? | Notes |\n|-------------|----------|-------|\n| C-1 frontend target | \u2705 D-1 | Dashboard, not `frontend/` |\n| C-2 bands | \u2705 D-2 | Matcher canonical |\n| C-3 infra revise in place | \u2705 Phase 3\u20134 | |\n| C-4 data cleanup + grep gates | \u2705 Phase 0 | FalkorDB live cleanup still open |\n| C-5 caption join at API | \u2705 Phase 2 | |\n| C-6 schema migration sentinel | \u2705 Phase 3\u20134 | |\n| C-7 healthz smoke | \u2705 Phase 3\u20134 | |\n| C-8 auth hardening | \u2705 D-5 gate | |\n| KnowledgeGraph vs MatchPayload | \u2705 Two schemas section | Prevents repeat regression |\n| Revert `frontend/` bolt-on | \u2705 \u00a71.4 | |\n| Owner exposition / story | \u2705 Intent + Phase 1 | |\n\n**Gaps to resolve in implementation plan:** exact monorepo strategy for dashboard in CodeBuild (submodule vs subtree vs npm package).\n\n---\n\n## References\n\n- Architecture diagram: `docs/superpowers/scudo-architecture-flat.mmd`\n- Implementation plan (completed): `docs/superpowers/plans/2026-06-24-scudo-matching-dashboard.md`\n- Original combined plan: `docs/superpowers/plans/2026-06-24-scudo-matching-frontend-and-deploy.md`\n- Agent memory: `AGENTS.md`\n- Deploy notes: `backend/scudo/DEPLOY.md`\n\n## Related\n\n- [Agent operating rules](/reference/agents.md)\n- [Confidence bands & provenance (canonical)](/reference/matching-data-provenance.md)", "specs/self-improving-agent": "# Self-Improving Orchestrator \u2014 Design Spec\n\n**Date:** 2026-06-16 \u00b7 **Status:** approved (design) \u2192 pending spec review\n\n## Intent\n\nGive the SCUDO orchestrator **self-improving memory** so it gets better at mapping\nvendor products \u2192 CDAO nodes the more it runs \u2014 across **new vendors** (NEW_MAPPING) and\n**old vendors** (EXTEND / RECONCILE). The model stays fixed; the environment around it\ncompounds: every verified mapping leaves a precedent, every recurring defect becomes a\nrule, and the next run consults those priors instead of re-deriving them.\n\nThe principles below are model-agnostic. They run today on Opus 4.8 (no Fable 5), against\nthe in-memory store (`STORE_BACKEND=memory`), and document the live (FalkorDB/Neptune/CMA)\nupgrade path.\n\n## What already exists vs. the gap\n\nSCUDO already has most of the substrate \u2014 the layer plugs into it, never beside it:\n\n| Already there | Where |\n|---|---|\n| Independent, sealed verifier (not self-critique) | `verdict.py` HMAC seal; Match & Verify MCP; 10-dim rubric |\n| Precedent memory from HITL decisions | `feedback.py` \u2192 `store.upsert_precedent` (approve/override/reject) |\n| Compounding rank signal consulted on later runs | `store.rank_signals_for(vendor_signature)` \u2192 `find_similar_products` |\n| Resume-don't-restart | `hydrate.py` replays the canonical bundle at boot |\n| Deterministic goal gate | `0.80` floor + bounded retry (12\u201315) + HITL escalation |\n\n**The gap (what this builds):**\n1. Learn from the orchestrator's **own verified** outcomes, not only HITL decisions.\n2. **Distill general rules** \u2014 per-vendor quirks, per-subtree mapping rules, recurring\n   rubric defects \u2014 above the level of single precedent edges.\n3. **Consult** those rules as priors *before* mapping (today only the rank signal is read).\n4. **Verified-facts-only** promotion: an independent grader must confirm a candidate rule\n   before it enters durable memory (honors the \"one memory system / verified facts\" rule).\n5. **Scheduled compounding**: a nightly routine re-runs the eval suite and distills.\n\n## Model routing (\"Opus where possible\")\n\n| Role | Model | Effort |\n|---|---|---|\n| Orchestrator / synthesis | Opus 4.8 | medium\u2013high (not max \u2014 thinking bills as output) |\n| Heavy bounded subtask (reconcile, gnarly map) | Opus 4.8 | high |\n| Fan-out workers (scaffold, eval rows, docs) | Sonnet 4.6 | low\u2013med |\n| Grader / rule-refuter sub-agents | Haiku 4.5 | low |\n| Classifier-blocked domain | surface to human (no Fable\u2192Opus fallback to lean on) | \u2014 |\n\n## Deliverable: portable skill + SCUDO integration\n\n```\n~/.claude/skills/self-improving-agent/\n\u251c\u2500\u2500 SKILL.md                  # when/how to run a compounding loop; read-at-start / write-before-exit\n\u251c\u2500\u2500 references/\n\u2502   \u251c\u2500\u2500 compound-stack.md     # 4 layers, self-improving\u2260self-learning (principles, no lore)\n\u2502   \u251c\u2500\u2500 model-routing.md      # the table above + classifier fallback\n\u2502   \u251c\u2500\u2500 memory-protocol.md    # 5-stage Fail\u2192Investigate\u2192Verify\u2192Distill\u2192Consult, mapped to SCUDO stores\n\u2502   \u2514\u2500\u2500 verifier-pattern.md   # independent verifier > self-critique; applied to rule promotion\n\u251c\u2500\u2500 workflows/                # invoked via Workflow({scriptPath}); each opens with `export const meta`\n\u2502   \u251c\u2500\u2500 goal-loop.js          # maker \u2192 independent grader \u2192 iterate until pass\n\u2502   \u251c\u2500\u2500 adversarial-verify.js # N Haiku skeptics refute a candidate rule; majority-refute kills it\n\u2502   \u251c\u2500\u2500 fan-out-synthesize.js # split \u2192 parallel Sonnet \u2192 Opus synthesize\n\u2502   \u2514\u2500\u2500 loop-until-done.js    # loop-until-dry (K empty rounds = stop)\n\u251c\u2500\u2500 scr
