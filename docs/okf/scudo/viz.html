Deterministic matching cost ladder with scope, precedent, retrieval,\n  validation, confidence, and specialist seams.\n- Scripted, Bedrock, and Azure agent runtime options behind a common event\n  contract.\n- Browser-facing upload, matching, agent, and human-review workflows.\n- Aurora-backed agent memory with fail-open reads and fail-loud writes.\n- Structured agent and matching-engine trajectories.\n- Versioned golden-set evaluator with holdout leakage protection.\n- Named-approval and immutable-artifact promotion boundary.\n- Rollback-compatible versioned live skill records.\n\n### Required before broader external use\n\n- Curated, representative business golden sets, including adversarial cases.\n- A scheduled evaluation and approval workflow for self-improvement.\n- Replacement or calibration of the current string-similarity stand-in with\n  production semantic retrieval.\n- A complete Neptune retrieval implementation if Neptune is selected as a\n  deployment backend.\n- Production identity enforcement at the gateway and removal of dev-open auth.\n  The persistence MCP's write tools now fail closed behind\n  `SCUDO_PERSIST_WRITE_TOKEN`, but that authenticates a *service*, not a person:\n  a token holder can still record a decision under any `decided_by` it chooses.\n- Durable reviewer-queue persistence for the separated MCP deployment shape.\n- Deployment of the latest SSE heartbeat and dashboard assets where required.\n- Temporal matching is built but not yet reachable on real data. The comparator\n  and its `SCUDO_TEMPORAL_VALIDATION` flag exist and are tested, but the DCAT\n  loader drops `temporal_coverage` before it reaches a `TaxonomyNode`, so the\n  check passes by default in a live run. Two products identical in name but\n  covering different periods are still indistinguishable to the engine.\n- The Lambda HITL approve path writes `mapping_result` from the request body\n  straight to the catalogue without running the deterministic publish gate, so a\n  malformed IRI can reach the projection table by a route the auto-publish path\n  rejects.\n\nThese are explicit boundaries, not hidden assumptions. The repository is\ndesigned so they can be addressed without allowing unvalidated learning to\nchange live mappings.\n\n## Quick start\n\n**No database, no container, no AWS credentials.** One command:\n\n```bash\npip install -r backend/requirements.txt\npython start_local.py\n```\n\nThen open **<http://localhost:3000>** \u2014 that is the UI. The backend on :5000 is\nnot the app; opening it directly is the most common false alarm.\n\nPort 5000 is occupied on macOS by AirPlay Receiver, and by some corporate\nagents. If the server starts but nothing loads:\n\n```bash\nPORT=5055 VITE_API_PROXY=http://localhost:5055 python start_local.py\n```\n\n`start_local.py` sets the environment **before** importing `app.py`. That\nordering is load-bearing: launching `python app.py` directly leaves the auth\ngate unconfigured, every `/api/*` call returns 401, and the UI renders its shell\nwith no data \u2014 the \"only one page opens\" symptom. `start_all.sh` now delegates\nhere for the same reason.\n\n### What runs with nothing installed\n\nVerified end to end from a clean checkout: ingest a vendor file, run the\nmatcher, get a banded result against a real CDAO node. No FalkorDB, no Neptune,\nno MySQL, no PostgreSQL, no Bedrock.\n\n| Page | Works offline? |\n|---|---|\n| Matching Test, Upload and Test, Catalogue | yes |\n| Providers, Datasets, Admin, Ingestion | yes \u2014 via the SQLite stand-in below |\n\nDefaults chosen for you by `start_local.py`:\n\n| Variable | Value | Effect |\n|---|---|---|\n| `STORE_BACKEND` | `scipy_sqlite` | full matching ladder and HITL state in `backend/.local/scudo_matching.sqlite3` |\n| `SCUDO_SCIPY_SQLITE_PATH` | `backend/.local/scudo_matching.sqlite3` | matching database; separate from the console database |\n| `CONSOLE_DB_BACKEND` | `sqlite` | console pages run with no PostgreSQL \u2014 [`backend/db_sqlite_fallback.py`](backend/db_sqlite_fallback.py), standard library only |\n| `FRAME_SOURCE` | `mock` | bundled sample vendor data instead of S3 |\n| `SCUDO_AUTH_ALLOW_DEV` | `1` | local dev principal, so `/api/*` does not 401 |\n\nUnset `CONSOLE_DB_BACKEND` and the console reverts to real PostgreSQL/Aurora\nvia `CONSOLE_DB_*`; `docker compose up postgres` provides that locally. The\nSQLite path is read at call time, so deployed behaviour is unchanged.\n\n`scipy_sqlite` is a single-host backend. Do not put its database on a shared\nnetwork filesystem or use it as a multi-container replacement for the deployed\nFalkorDB/Neptune topology. It is not activated in Lambda merely by setting\n`STORE_BACKEND`; Lambda use requires the explicit `SCUDO_USE_RETRIEVAL_STORE`\nflag and a healthy, pre-seeded taxonomy.\n\nThe matching-store factory accepts five backends: `scipy_sqlite`, `local_file`,\n`memory`, `falkordb`, and `neptune`. For local startup, `scipy_sqlite` is the\ndefault complete matching store: taxonomy, retrieval indexes, HITL decisions,\nprecedents, and audit state persist in one SQLite database. `local_file`\nremains the simpler precedent-only fallback; it journals reviewer precedents\nbut does not provide the complete SQLite matching-store contract.\n\n### Health endpoints\n\n`/healthz` \u2014 liveness. `/readyz` \u2014 readiness; it returns **503 until the CDAO\ntaxonomy has been seeded**, which happens lazily on the first `/api/*` request,\nthen 200. A cold 503 is the probe working, not a failure. There is no `/health`.\n\n### Beyond the laptop\n\nThe full trust-gradient deployment \u2014 FalkorDB plus the three MCP services \u2014 is\ndescribed in ``backend/scudo/DEPLOY.md``. Neptune is\nreachable only from an appropriate AWS network. Neither is needed for anything\nabove.\n\nTo use Bedrock instead of the offline narrator, set `SCUDO_AGENT_BACKEND` and\n`SCUDO_AGENT_PROVIDER_DEFAULT` to `bedrock` with your `AWS_REGION` and\n`SCUDO_BEDROCK_MODEL_ID`. Note what this does and does not change: it selects the\n**narrating agent** only. It does not decide how the score is computed \u2014 that\nis `SCUDO_DENSE_BACKEND`, an independent lever. Both shipped launchers\n(`streamlit_app.py`, `run_cognizant.py`) set it to `opus`, where an LLM\nsupplies the candidate similarity that becomes the published confidence. For a\ndeterministic Jaro-Winkler score, set `SCUDO_DENSE_BACKEND=jaro_winkler` and\nleave `SCUDO_USE_OPUS_DENSE` unset.\n\n## API entry points\n\nThe main browser and integration surfaces are:\n\n| Endpoint | Purpose |\n|---|---|\n| `POST /api/mapping/ingest/stream` | Upload and observe normalisation stages. |\n| `POST /api/mapping/map` | Run the deterministic matcher for one product. |\n| `POST /api/mapping/agent/run` | Stream an agent-assisted matching run over SSE. |\n| `POST /api/mapping/decision` | Approve, override, or reject a decision. |\n| `GET /api/mapping/graph` | Read the dashboard's matching architecture payload. |\n| `GET /api/mapping/agent/describe` | Inspect configured agent providers. |\n\nThe matcher package and MCP services expose the same typed contracts to\nautomation clients. Raw Cypher, SPARQL, and unrestricted graph queries are not\nagent-facing tools.\n\n## Where the code lives\n\nTwo folders sit under `backend/`. Telling them apart answers most \"where is\nthe agent?\" questions:\n\n| Folder | What it holds | When it runs |\n|---|---|---|\n| `backend/scudo_mapping_mcp/` | **The product** \u2014 the agent, the matching engine, the catalogue and review logic | Always |\n| `backend/scudo/` | **The AWS wiring** \u2014 Lambda, cloud memory, deployment | Only in AWS |\n\nRunning it on a laptop or on Streamlit uses the first folder. You can ignore\nthe second.\n\n### The four things people look for\n\nEverything below is in `backend/scudo_mapping_mcp/`.\n\n| Looking for | File | In one line |\n|---|---|---|\n| **The agent** | `agent.py` | Explains the match. Two versions: an offline narrator, and Claude via Bedrock |\n| **The agent's tools** | `agent.py` (also `mcp_server.py`) | Six tools it may call \u2014 search the catalogue, read a taxonomy node, compare candidates, run the match |\n| **The matching engine** | `matching.py` | Produces the score, the band, and the mapped node |\n| **The memory** | `store/` and `feedback.py` | Reviewer decisions become precedents the next match reuses |\n\n**The narrating agent does not decide the score.** The matching engine does,\nand it is the system of record: the agent's recommendation never overrides it.\nThe agent can be switched off entirely without changing a single number.\n\nThat is a statement about the *agent selector*, not about whether a model is\ninvolved in scoring. Those are separate levers, and conflating them was a\ndocumented defect in this repo. Whether the number is deterministic depends on\nthe **dense arm**:\n\n| Dense arm | Score |\n|---|---|\n| `SCUDO_DENSE_BACKEND=jaro_winkler`, `SCUDO_USE_OPUS_DENSE` unset | Deterministic string similarity \u2014 the same product scores the same every time |\n| `SCUDO_DENSE_BACKEND=opus` (**what both launchers ship**) | An LLM scores each nominated candidate and that float becomes the published confidence \u2014 it can vary between runs and between models |\n| `SCUDO_USE_OPUS_DENSE=1` | Also an LLM, via a different code path that ignores `SCUDO_DENSE_BACKEND` entirely |\n\nA third lever, `SCUDO_SPECIALIST_BACKEND`, adds LLM adjudication of borderline\ncases on either agent, and can cap confidence and force review.\n\nThe score is auditable in every configuration; it is only *deterministic* in\nthe first row.\n\nThe agent also answers one question at a time about one product. It is not a\nchatbot you can ask anything.\n\n### If you need more detail\n\n| Concern | File |\n|---|---|\n| Which retrieval store is in use (`memory`, `local_file`, FalkorDB, Neptune) | `store/factory.py` |\n| Durable local memory that survives a restart | `store/local_file_store.py` |\n| Reviewer approve / override / reject | `feedback.py` |\n| Reading and normalising vendor files | `ingest.py`, `frames.py`, `url_ingest.py` |\n| Business rules applied to a candidate | `validations.py` |\n| Confidence thresholds | `config.py` |\n| Signed verdicts and the write boundary | `verdict.py`, `persistence_mcp.py` |\n\nIn `backend/scudo/` (AWS only): `lambda_handler.py` for cloud entry points,\n`orchestrator.py` for the publish gate, `aurora_memory.py` and\n`aurora_store.py` for cloud memory. Note that cloud memory is **not** used by\nthe local or Streamlit run \u2014 that uses `store/local_file_store.py` instead.\n\n## Technical architecture\n\nThe approved target architecture has five business-relevant zones:\n\n| Zone | Responsibility | Representative code |\n|---|---|---|\n| 1. Sources and ingestion | Receive vendor metadata and create normalised records. | `backend/scudo_mapping_mcp/ingest.py`, `backend/scudo_mapping_mcp/frames.py`, `backend/scudo_mapping_mcp/url_ingest.py` |\n| 2. Processing | Validate, clean, quarantine, land, and audit source data. | `backend/scudo_mapping_mcp/validations.py`, `backend/scudo/etl_handler.py` |\n| 3. Matching engine | Retrieve candidates, apply policy, score, validate, and gate. | `backend/scudo_mapping_mcp/matching.py`, `backend/scudo_mapping_mcp/store/` (`matcher_bridge.py` is the Lambda-side adapter \u2014 not on the Flask/Streamlit path) |\n| 4. Agentic layer | Provide contextual reasoning, specialist assistance, and verification. | `backend/scudo_mapping_mcp/agent.py` (the agent you run), `backend/scudo/orchestrator.py` (AWS publish gate) |\n| 5. Persistence and review | Store decisions, audit, lineage, memory, and review outcomes. | `backend/scudo/aurora_store.py`, `backend/scudo/aurora_memory.py`, `backend/scudo_mapping_mcp/feedback.py` |\n\nAurora PostgreSQL is the target system of record. FalkorDB, Neptune, or the\nin-memory backend provides retrieval according to `STORE_BACKEND`; these stores\nare not authoritative for business decisions.\n\nThe three MCP services are:\n\n- **Ingestion:** normalises vendor input and provides bounded frame context.\n- **Match-Verify:** provides bounded catalogue evidence and signed deterministic\n  verdicts.\n- **Persistence:** verifies verdicts and owns the write boundary for the\n  separated MCP deployment shape.\n\nThe current Flask deployment often calls these package functions in-process.\nThe networked MCP topology remains available for the trust-gradient deployment\nshape. Both shapes preserve the same bounded operation contracts.\n\n## Repository guide\n\n```text\nbackend/scudo_mapping_mcp/   Matching engine, agent and its tools, MCPs,\n                              catalogue models, stores, reviewer feedback\nbackend/scudo/                Orchestrator, Lambda substrate, Aurora memory,\n                              self-improvement, deployment scripts\n                              (AWS only \u2014 not used by the local run)\nbackend/routes/               Flask REST facade\nfrontend/                     React console and matching-test experience\ndashboard-dist/               Vendored dashboard build\ninfra/                        AWS infrastructure and deployment runbooks\ndocs/architecture/            Approved architecture diagrams and UML sources\ndocs/okf/scudo/               Navigable project knowledge base\nZONES.md                      Module-to-zone map\nstart_local.py                One-command local run (sets env before import)\nbackend/db_sqlite_fallback.py Console DB stand-in \u2014 no PostgreSQL, no Docker\n```\n\n### Handover documents\n\n| Document | For |\n|---|---|\n| [`JPMC_LOCAL_RUN_HANDOVER.md`](/architecture/JPMC_LOCAL_RUN_HANDOVER.md) | Running locally without infrastructure: what is already resolved, what changed and why, per-item evidence. |\n| [`JPMC_PORT_TYPE_IN.md`](/architecture/JPMC_PORT_TYPE_IN.md) | Carrying those changes into `jpmc-port/` by hand. Tiered FIND/TYPE instructions, dry-run verified against the port's own files. |\n| [`CITRIX_FOLLOWUP.md`](/architecture/CITRIX_FOLLOWUP.md) | Corrections after a Citrix-side apply: health-endpoint names, the `falkordb` spelling, switching on the SQLite stand-in. |\n\n## Self-improvement implementation map\n\n| Capability | Location |\n|---|---|\n| Golden cases, metrics, and promotion contracts | `backend/scudo/matching_self_improvement.py` |\n| Report-only evaluator | `backend/scudo/scripts/evaluate_matching_golden.py` |\n| Agent memory and trajectory persistence | `backend/scudo/aurora_memory.py` |\n| Deterministic-engine trajectory adapter | `backend/scudo/aurora_memory.py` |\n| Strict offline sleep cycle | `backend/scudo/skillopt_sleep_runner.py` |\n| Live prompt skill pinning | `backend/scudo/schemas.py`, `orchestrator.py`, `lambda_handler.py` |\n\n## Testing and verification\n\nRun from `backend/`:\n\n```bash\n# Focused self-improvement and memory coverage\nPYTHONPATH=. pytest \\\n  scudo/tests/test_matching_self_improvement.py \\\n  scudo/tests/test_aurora_memory.py \\\n  scudo/tests/test_lambda_handler_memory_wiring.py \\\n  scudo/tests/test_skillopt_sleep_runner.py -q\n\n# Full SCUDO and matching-engine coverage\nPYTHONPATH=. pytest scudo/tests scudo_mapping_mcp/tests -q \\\n  --disable-warnings --maxfail=10\n```\n\nOn July 16, 2026, the focused suite passed 76 tests. The broader SCUDO and\nmatching-engine run passed 494 tests and had two known failures in\n`scudo/tests/test_provenance.py` caused by pre-existing forbidden Marketing\ncontent in the generated conceptual graph. Those failures are unrelated to the\nself-improvement implementation.\n\nAdditional standalone smoke suites are available:\n\n```bash\nPYTHONPATH=. python -m scudo_mapping_mcp.tests.smoke\nPYTHONPATH=. python -m tests.test_auth\n```\n\nThe root `backend/tests/test_ingest_*.py` files currently have a pytest\ncollection-path issue involving `_ingest_helpers`; use the relevant standalone\ntest command or exclude those files while that test-infrastructure issue is\nresolved.\n\n## Deployment and operating references\n\nUse the detailed runbooks for deployment rather than copying commands from this\noverview:\n\n- ``backend/scudo/DEPLOY.md`` - SAM/Lambda deployment\n  and required Aurora inputs.\n- [`infra/DEPLOY_RUNBOOK_scudo-poc.md`](/architecture/infra/DEPLOY_RUNBOOK_scudo-poc.md) -\n  CloudShell deployment, smoke checks, and rollback.\n- [`infra/HANDOVER_5zone_alignment.md`](/architecture/infra/HANDOVER_5zone_alignment.md) -\n  why Aurora is the target system of record.\n- [`ZONES.md`](/architecture/ZONES.md) - module-to-zone ownership.\n- [`docs/architecture/README.md`](/architecture/docs/architecture/README.md) - approved\n  architecture diagrams and UML sources.\n- ``docs/okf/scudo/index.md`` - navigable knowledge\n  base covering architecture, operations, specifications, and plans.\n\n## Open work and limits\n\nThe following items should be treated as explicit delivery gates:\n\n1. **Retrieval quality:** the default dense arm is currently Jaro-Winkler\n   string similarity, not a calibrated production embedding model. Thresholds\n   must be recalibrated when the scoring backend changes.\n2. **Golden data:** the evaluator is implemented, but a representative,\n   approved business golden set and scheduled evaluation process are not\n   included in this repository.\n3. **Self-improvement operations:** the offline evaluator and promotion boundary\n   are implemented; the default optimizer/evaluator integration and scheduled\n   AWS job remain operator-owned.\n4. **Neptune:** the Neptune retrieval implementation is not complete enough to\n   treat it as a production matching backend.\n5. **Identity:** the current demo posture can allow dev-open authentication.\n   External exposure requires a trusted gateway identity boundary and removal\n   of the dev bypass.\n6. **Reviewer queue:** the separated Persistence MCP currently has an\n   in-memory reviewer queue; durable queue wiring remains open.\n7. **Test debt:** the two provenance failures and the ingest test collection\n   issue described above remain visible and should not be hidden.\n\n## Glossary\n\n| Term | Meaning |\n|---|---|\n| CDAO catalogue | The client-owned taxonomy and related catalogue/rights model that products are mapped into. |\n| HITL | Human-in-the-loop review for uncertain or policy-sensitive decisions. |\n| Precedent | A confirmed human decision reused as evidence for a later similar product. |\n| Golden set | Versioned, human-labelled examples used to evaluate matching changes. |\n| Holdout set | Examples kept out of training or candidate generation and used for promotion evaluation. |\n| Confidence band | The policy classification of a match as PASS, BORDERLINE, or FAIL. |\n| MCP | Model Context Protocol service exposing bounded, typed operations to agents. |\n| Trajectory | A structured record of an input, decision, evidence, and versions used for offline analysis. |\n\n## Source of truth\n\nThis README is the business and engineering index. Detailed implementation\ndecisions belong in the linked architecture diagrams, specifications, plans,\nand deployment runbooks. When those documents disagree, use the current code\nand the approved architecture sources, then record the decision in the relevant\nspecification.\n\n---\n\n# Appendix A \u2014 Why the local run needs no infrastructure\n\nThree sessions independently set out to \"remove MySQL, FalkorDB and Neptune\"\nbefore anyone ran the system to see whether they were load-bearing. They were\nnot. What follows is the measured position, so the fourth session does not\nrepeat it.\n\n| Component | Actual state |\n|---|---|\n| MySQL | Already gone. Zero `mysql`/`pymysql` imports. `db.py` targets Aurora PostgreSQL \u2014 the MySQL\u2192Aurora migration already happened. |\n| FalkorDB | Lazy-imported in two production files (`store/falkordb_store.py`, `store/factory.py`; three more are tests), reachable only through `factory.py`'s branch. Never loaded under `STORE_BACKEND=local_file`. |\n| Neptune | Same: lazy, unused locally. |\n| Bedrock | Every `boto3` import is lazy. The app imports and runs with no credentials. |\n\nNothing was commented out, and that was deliberate \u2014 `store/factory.py:20-32`\nrecords the reasoning. The branches stay active because the AWS deploys set\n`STORE_BACKEND=falkordb` and would break without them; being lazy imports, they\ncost a local run nothing.\n\n**`falkordb_store.py` must stay on disk even though the database is unused:**\nthe default scoring path imports `_jaro_winkler` from that file. The *pip\npackage* is not required \u2014 its import lives inside a method.\n\n### The real cause of \"FalkorDB keeps being asked for\"\n\nNot the branches \u2014 the **default**. `STORE_BACKEND` defaulted to `\"falkordb\"`,\nso any entry point that set no environment tried to open a connection on :6379.\n`start_all.sh` set no environment at all, which is why the obvious script kept\ndemanding a database nobody wanted.\n\nTwo fixes: the default is now `local_file`, and `start_all.sh` delegates to\n`start_local.py` rather than keeping a second env block that silently diverged.\nChanging the default is safe because **every deployed path sets the variable\nexplicitly** \u2014 verified across `backend/Dockerfile`, `infra/scudo-dev-deploy.yaml`\n(four containers), `infra/scudo-poc-app.yaml`, and `backend/scudo/template.yaml`.\n\n### And \"only one page opens\"\n\nAlso an environment problem, not a database one. `start_all.sh` used to run\n`python3 app.py` directly, leaving the auth gate unconfigured, so every\n`/api/*` call returned 401 while the UI shell rendered normally. Port 5000 is\nseparately occupied on macOS by AirPlay Receiver.\n\n### The console database\n\nProviders, Datasets, Admin and Ingestion are the only pages needing a\nrelational store \u2014 74 `execute()` calls over 9 tables \u2014 and they returned 500\nwithout PostgreSQL. [`backend/db_sqlite_fallback.py`](backend/db_sqlite_fallback.py)\nis a file-backed stand-in using only the standard library.\n\nIt was cheap because the route SQL is nearly dialect-free: `%s`\u2192`?`,\n`SERIAL`\u2192`INTEGER`, `TIMESTAMPTZ`/`JSONB`\u2192`TEXT`. `RETURNING` and\n`ON CONFLICT` are native in SQLite 3.35+ and pass through untouched. The hook\nlives in `db.py`'s two connection functions and is read at **call** time, so\n**no route code changed** and the deployed Aurora path is byte-for-byte\nunaffected.\n\nLimits, stated rather than hidden: no schemas (`console.`/`ingestion.` collapse\ninto one namespace); the PL/pgSQL `updated_at` trigger is skipped, so that\ncolumn does not self-update; single writer. Sized for one person running a\ndemo, which is the stated need.\n\n---\n\n# Appendix B \u2014 Why gates are deterministic, not advisory\n\nA check that is computed but never acted on is not a gate. Two were found here,\nboth by adversarial review rather than by testing.\n\n`Orchestrator._pre_verify_defects` returns a list of defect strings. That list\nwas only ever **concatenated into the verifier model's prompt**. Nothing\nenforced it. A verifier that scored well and ignored the injected text\npublished anyway. Measured, before the fix:\n\n```\nspecialist proposes a node never offered in bundle.candidates\n  -> OUTCOME: PUBLISHED | published: 1\n```\n\nThe consequence is not cosmetic: the model could map a vendor product to **any\nCDAO node it invented**, and no confidence score catches that \u2014 an invented\nnode scores however the model says it does.\n\nTwo checks were therefore promoted into `_gate_and_decide`, where no model\nopinion can override them:\n\n- `vendor_product_iri` must equal the deterministically minted value. It is the\n  primary key of the published record, and the publish gate's IRI-shape check\n  only inspected *triple subjects*, never this field.\n- `proposed_target_iri` must be one of the offered candidates.\n\nThe candidate check was initially written `if target and candidates and target\nnot in candidates` \u2014 **fail-open**: an empty candidate list published anything.\nThat is precisely the case with the least grounding, so it now fails closed on\nboth degenerate shapes.\n\n**The generalisable rule: adding a check to `_pre_verify_defects` does not\nenforce it.** Enforcement belongs in `_gate_and_decide`. Three other checks\nthere (evidence, source IRIs, band consistency) remain advisory by design and\nare commented as such.\n\n### Related: frames are authoritative\n\nFrame resolution exists in **three files** that must agree \u2014\n`routes/mapping.py:242`, `match_verify_mcp.py:255` (`_resolve_frame`, with a\nthin `_frame` wrapper at `:308`), and `mcp_server.py:127`. All three now\nignore caller-supplied `name`/`description` unless\n`SCUDO_MV_ALLOW_INLINE_FRAME` is set, and refuse rather than fabricating\n`name=product_id` when no frame exists. Two of the three copies were found only\nafter the first was fixed; a per-file fix leaves the other ingresses open.\n\n---\n\n# Appendix C \u2014 Why the agents are told what they are judged on\n\n`VerifierDimension` defined ten scoring dimensions as bare enum names \u2014\n`semantic_fit`, `candidate_coverage`, `conflict_handling` \u2014 with **no\ndefinition anywhere in the repository**. Two consequences:\n\n1. The **verifier** invented what each name meant on every call, and its\n   `total_score` drives a hard publish / retry / human-review gate. Scores were\n   not comparable between runs.\n2. The **specialist** was never shown the dimensions at all, and was graded on\n   a rubric it could not see. Separately, `vendor_product_iri` appeared **zero\n   times** in its prompt while the gate hard-rejects a mismatch on that field \u2014\n   the model could not comply with a rule it was never given.\n\nThe tell was already in the code: a hand-written line in the verifier prompt\nexplaining how to score `taxonomy_freshness`. One dimension patched by hand\nbecause the list was not shared.\n\nThe rubric is now defined once in `prompts._RUBRIC` and rendered for both\naudiences from that single source. `rubric_text()` **raises** if a dimension has\nno definition, so a new one cannot ship undefined the way these ten did.\n\n### On the risk of naming the rubric\n\nTelling a model how it is graded invites writing to the scorer. This was\naccepted deliberately, because the alternative is worse: a specialist\noptimising blind produces work the verifier rejects for reasons nobody stated,\ncosting a model call and a review ticket per miss.\n\nThree things bound the risk. The verifier is a **separate model**; the\ndeterministic gates in Appendix B cannot be talked out of; and every definition\nrewards a **verifiable property** of the output rather than a rhetorical one \u2014\n\"cite the evidence you used\" is not gameable in a way that hurts, because it is\nthe actual goal. The specialist is also told explicitly not to write to the\nscorer, and that instruction is pinned by a test.\n\n---\n\n# Appendix D \u2014 Why refusals are answers\n\nTools may now return a typed refusal instead of data \u2014 `frame_not_found` when\nno ingested frame exists for a product. This is deliberate: the system declines\nto score a product whose real details it does not have, rather than inventing a\nname from the identifier and matching on that.\n\nTwo consequences were handled explicitly.\n\n**The agent is told refusals are answers, not errors to work around.** Without\nthat instruction the natural behaviour is to retry, or to substitute a\nplausible name \u2014 exactly the fabrication the refusal exists to prevent. The\nagent prompt now says to report it and recommend human review.\n\n**The UI must keep the actionable half.** The backend returns\n`{error, detail}`, and all sixteen frontend call sites read only `error`, so a\nuser saw a bare `frame_not_found` while *\"ingest it first\"* was discarded. A\nsingle response interceptor now folds `detail` into `error`, fixing every call\nsite without touching any of them.\n\nThe same reasoning applies to the reasoning trace. The backend streams a full\nagent trace over SSE \u2014 a real run emits fourteen events including four tool\ncalls and their results. The frontend received all of them and rendered each as\nraw JSON truncated at 120 characters, cutting the agent's sentences off\nmid-word. The information was arriving; it was not legible. It is now rendered\nas a followable sequence of thinking, calls, and returns.\n\n---\n\n# Appendix E \u2014 Verification posture\n\nFour practices, each stated with the case that produced it so a reader can\njudge the practice rather than take it on trust.\n\n**Check that a new test fails when its fix is reverted.** Otherwise it may be\nasserting something trivially true. This proves sensitivity to that specific\nregression \u2014 not correctness in general. Applied to the confidence-band parity\ncheck\n(`backend/scudo_mapping_mcp/tests/test_band_config_parity.py`), this exposed a\nreal evasion: the original scanner paired `Name:`/`Value:` keys in source\norder, so the equally-legal `Value:`-before-`Name:` form parsed as zero\nrecords and drift passed silently. The fix is a structural YAML parse, pinned\nby `test_key_order_cannot_hide_a_band_declaration`, plus an anti-vacuity test\nproving the parser finds the real declarations rather than nothing.\n\n**Distinguish \"the code exists\" from \"the code runs.\"** Two absence claims were\nchecked by execution rather than grep, and both answers were more nuanced than\nthe original wording:\n\n- *\"Dates cannot be matched.\"* A temporal comparator and its\n  `SCUDO_TEMPORAL_VALIDATION` flag now exist and are tested. But\n  `matching.py` contains **zero** references to `node_temporal_coverage`, and\n  the DCAT loader drops the field before it reaches a `TaxonomyNode` \u2014 so on a\n  live run the check passes by default and the original limitation still\n  holds. Built is not the same as reachable; this is listed in \"Open work and\n  limits\" for that reason.\n- *\"No embedding retrieval path exists.\"* Wrong as stated. A LlamaIndex\n  retriever with real Bedrock embeddings exists at\n  `backend/scudo/sidecar/retrieval.py`, is exposed as a tool in\n  `tools.py:41`, and **is** attached to the generic mapping specialist via\n  `MAPPING_SPECIALIST_TOOLS`. It is unreachable on two axes only: the deployed\n  Lambda builds tool-less agents, and `SCUDO_SIDECAR_GRAPH_ENDPOINT` is unset\n  in `infra/`, so the sidecar falls back to an in-memory mock. Wired in the\n  specialist path, unwired in the Lambda path \u2014 which is a different and more\n  useful statement than either \"exists\" or \"does not exist.\"\n\n**Expect two different defect shapes, not one.** The defects found in this\nwork fell into two kinds, and a review that anticipates only the first will\nmiss the second.\n\n*Incomplete scope* \u2014 the fix was correct inside the file it was scoped to\nwhile the same defect sat untouched elsewhere. Frame resolution was fixed in\n`match_verify_mcp.py` while byte-equivalent copies remained in\n`routes/mapping.py:242` and `mcp_server.py:127`, the latter backing four live\nendpoints.\n\n*A bug inside the fix* \u2014 the first hard candidate check was written\n`if target and candidates and target not in candidates`, which published\nanything when the candidate list was empty: precisely the case with the least\ngrounding. Recorded at `orchestrator.py:425`, pinned at\n`backend/scudo/tests/smoke.py:552`.\n\nNeither is visible from the changed file alone: the first needs a search for\nother copies of the function, the second needs the empty-list case to be tried.\n\n**Do not let a red baseline become background noise.** Two tests fail on an\nunmodified checkout:\n\n- `test_provenance.py::test_matching_graph_is_knowledge_graph_schema`\n- `test_provenance.py::test_every_node_is_labelled_and_expositional`\n\nBoth reject the `marketing_dataset` kind supplied by\n`fixtures/conceptual_layer.json` and propagated through\n`build_matching_graph.py`. Verified by running the file on a clean worktree at\nHEAD with none of this work applied: 1 passed, 2 failed.\n\nThey are named here rather than counted because a count is a weak signal \u2014 it\nstays green if one failure is fixed while another appears. The better end state\nis an explicit `xfail` with a tracking issue, so the suite is green and the\nexception is documented in code rather than in prose.\n\n## Related\n\n- [Confidence bands & provenance (canonical)](/reference/matching-data-provenance.md)", "deployment/demo-runbook": "# SCUDO Demo Runbook\n\n| Field | Value |\n|---|---|\n| Status | Pre-demo, post-ARB-fix |\n| Smoke gates | 111/111 passing |\n| Last updated | 2026-06-10 |\n\n## Recommended demo configuration\n\n### Environment variables to SET for the demo\n\n| Variable | Value | Why |\n|---|---|---|\n| `SCUDO_USE_OPUS_DENSE` | `true` | Enables Opus-as-dense-scorer multi-path retrieval (the new feature being demoed) |\n| `SCUDO_DENSE_FALLBACK` | `1` | **CRITICAL** \u2014 closes ARB finding C1. On Opus throttle / 429 / timeout / Bedrock outage, falls back to the Jaro-Winkler stand-in instead of raising. Without this, a single Bedrock blip kills the demo with a stack trace. |\n| `SCUDO_VERDICT_ALLOW_DEV` | `1` | Permits the dev signing key for the seal \u2014 production must inject via Secrets Manager (see i5-lift-preconditions.md \u00a74.3) |\n| `BEDROCK_REGION` | `eu-west-2` | Cross-region inference profile for `eu.anthropic.claude-opus-4-8` |\n\n### Environment variables to LEAVE UNSET for the demo\n\n| Variable | Why |\n|---|---|\n| `SCUDO_MCP_HOST_ENABLED` | The MCP host is built but not yet installed (ARB C2). Setting this true gives you `{enabled: false}` from `get_host()`. Leave unset until the host is wired in `app.py`. |\n| `SCUDO_DENSE_BACKEND` | Don't pin \u2014 let the `SCUDO_USE_OPUS_DENSE` flag drive the retrieval path. |\n\n## ARB fixes landed this session\n\nAll four blocking-or-high findings from the prior workflow synthesis closed in-code:\n\n| # | Finding | Fix landed | Verifying gate |\n|---|---|---|---|\n| A1 | Flag-on was a kill-switch \u2014 every match \u2192 0.5 \u2192 review | `store/falkordb_store.py` lazy-imports `opus_dense` and passes `make_opus_dense_scorer(ref.description)` into `multi_path_retrieve` | `ARB_A1_flag_on_passes_real_scorer_not_none` |\n| A2 | Two parallel Opus surfaces \u2014 `dense_scorer.py` (new, unused) vs `opus_dense.py` (existing, working) | `dense_scorer.py` module docstring marked DEPRECATED with pointer to `opus_dense.py` as canonical | `ARB_A2_dense_scorer_module_is_deprecated_in_docstring` |\n| B1 | Agent routed M&V tools to ingestion tier \u2014 404 on every demo | Three `host.call(_TIER_INGESTION, ...)` sites in `agent.py` re-tiered to `_TIER_MATCH_VERIFY` with namespaced tool names (`matchverify.find_candidates`, `.get_node`, `.get_neighbourhood`) | `ARB_B1_agent_host_calls_route_to_match_verify_tier` |\n| B2 | `DenseScoreError` uncaught \u2014 Bedrock blip crashed the matcher | `retrieval._dense_rescore` wraps the scorer call in try/except; logs WARNING and degrades every survivor to `_DEGRADED_SIMILARITY` (= 0.5, below floor) so the floor gate routes the case to NEEDS_REVIEW | `ARB_B2_dense_rescore_catches_scorer_exception_and_degrades` |\n\n## Pre-demo checklist\n\n- [ ] `SCUDO_USE_OPUS_DENSE=true` set in the demo env\n- [ ] `SCUDO_DENSE_FALLBACK=1` set in the demo env\n- [ ] Bedrock model access enabled for `eu.anthropic.claude-opus-4-8` in `eu-west-2` / sandbox `954976331678` (already verified per prior runs)\n- [ ] Task role has `bedrock:InvokeModel` on the Opus 4.8 ARN (parked per user; sandbox auth via local creds)\n- [ ] Reviewer queue is in-memory today \u2014 flag-on routes to review path until DynamoDB wiring lands; demo accordingly\n- [ ] iFusion mock \u2014 backend route and frontend API helper land, but no UI button wired (ARB C3). If iFusion round-trip is part of the demo script, wire the button OR demonstrate via curl\n\n## Demo flow\n\n1. **Reviewer UI** shows a vendor product needing mapping (e.g. \"LSEG Equity Prices Real Time\")\n2. **Agent runs `matchverify.find_candidates`** via MCP host (if installed) or in-process (if not). Multi-path retrieval (BM25 pre-filter \u2192 Opus dense rescore \u2192 structural pass with rank-signal tilt) returns ranked candidates\n3. **Three-band gate** classifies as PASS / BORDERLINE / FAIL; specialist consulted only on BORDERLINE; anchored to the candidate set (off-list pick \u2192 NEEDS_REVIEW with `invariant_violation=\"specialist_off_list\"`)\n4. **HMAC seal v=2 with band** signed in Match&Verify; payload reaches Persistence\n5. **Persistence MCP** verifies the seal and applies the I5 gate \u2014 AUTO_MAPPED \u2192 reviewer queue (until I5 lifts per `i5-lift-preconditions.md`); APPROVED \u2192 Neptune write\n6. **iFusion mock publish** \u2014 `POST /api/ifusion/publish` returns `{published: true, publish_id: \"mock-pub-...\", channel: \"spi_v2\", status: \"accepted\"}`\n\n## Known live caveats (not blocking demo)\n\n- **MCP host uninstalled** (C2) \u2014 the host module exists but no one calls `set_host()` in `app.py`. The visibility tab will always show `{enabled: false}`. Either wire it or hide the tab for the demo.\n- **iFusion UI button missing** (C3) \u2014 backend route and frontend helper exist; no button calls them. Demo via curl or wire the button.\n- **Specialist anchor enforcement** \u2014 implementation differs from original brief: fail-closed to NEEDS_REVIEW with `invariant_violation=\"specialist_off_list\"` field surfaced on `MappingResult`, rather than silently treating off-list pick as abstain. This is arguably better \u2014 the violation is observable in the reviewer queue. ARB to confirm preferred semantics.\n- **Structural-boost-to-dense ratio** (D2) \u2014 on the Opus backend the raw boost (\u22640.10) is applied directly to dense scores in [0,1]; on the legacy backend it was multiplied by `rrf_top \u2248 0.0164`. Same boost is ~60\u00d7 more influential in absolute terms on the new path. Sort-key only \u2014 `Candidate.similarity` unchanged \u2014 so I5 holds, but top-1 ordering can flip differently. Ratify or recap at next ARB.\n\n## What's still parked\n\n- IAM grants (Bedrock + iFusion) \u2014 local creds in sandbox\n- Bedrock model-access toggle for Titan \u2014 Titan parked, not needed\n- Full GraphRAG-SDK adoption \u2014 built minimal SDK-inspired version in `retrieval.py`\n- DynamoDB reviewer-queue wiring \u2014 in-memory list today\n- Precedent hydrator (Neptune \u2192 Falkor) \u2014 workstream opened in `precedent-hydrator-workstream.md`\n- BLOCKING IAM / model-access items from prior ARB review \u2014 carried forward, not resolved\n\n## Files touched in this fix pass\n\n- `scudo_mapping_mcp/store/falkordb_store.py` \u2014 flag-on branch wires `opus_dense.make_opus_dense_scorer`\n- `scudo_mapping_mcp/retrieval.py` \u2014 `_dense_rescore` try/except + log + degraded fallback\n- `scudo_mapping_mcp/dense_scorer.py` \u2014 DEPRECATED marker in module docstring\n- `scudo_mapping_mcp/agent.py` \u2014 three M&V tool calls re-tiered from `_TIER_INGESTION` to `_TIER_MATCH_VERIFY` with namespaced tool names\n- `scudo_mapping_mcp/tests/smoke.py` \u2014 4 new ARB fix verification gates\n\n## Document control\n\n- v0.1 \u2014 initial demo runbook post-ARB fixes, 111/111 smoke green", "deployment/deploy-runbook-scudo-poc": "# SCUDO scudo-poc \u2014 AWS Deploy Runbook (handoff)\n\n**For:** an agent/operator with **direct AWS access** to account `954976331678`\n(`cb4115669a-genaipocs-aw`), region `us-east-1`. Run from **AWS CloudShell** \u2014 the\noriginating laptop has no AWS credentials, which is why this is handed off.\n\n**What ships:** the SCUDO matching dashboard (interactive Upload & Test pipeline)\n+ the Flask backend that serves `/api/mapping/*` (incl. the new\n`/api/mapping/ingest/stream` SSE ETL endpoint and `/healthz`).\n\n**Source of truth for the work:** branch `scudo-phase0-foundations` of\n`github.com/2096955/MatchMaker` @ commit `4b335bb` (pushed \u2014 verified).\nCompanion handoff facts: `backend/scudo/AWS_HANDOFF.md`.\n\n---\n\n## 0. Preconditions (verify before doing anything)\n\n```bash\naws sts get-caller-identity            # expect Account 954976331678\naws configure get region || echo $AWS_DEFAULT_REGION   # expect us-east-1\n```\n\nStacks expected `CREATE_COMPLETE` (do NOT recreate \u2014 they hold live data):\n`scudo-poc-net`, `scudo-poc-data`, `scudo-poc` (app), `scudo-poc-build`,\n`scudo-poc-frontend`.\n\n```bash\naws cloudformation describe-stacks \\\n  --query \"Stacks[?starts_with(StackName,'scudo-poc')].{Name:StackName,Status:StackStatus}\" \\\n  --output table\n```\n\n---\n\n## 1. Get the code\n\n```bash\ncd ~ && rm -rf MatchMaker\ngit clone --branch scudo-phase0-foundations \\\n  https://github.com/2096955/MatchMaker.git\ncd MatchMaker\ngit log --oneline -1     # expect 4b335bb feat(deploy): AWS scudo-poc dashboard packaging\u2026\ntest -f dashboard-dist/index.html && echo \"vendored dashboard dist present \u2713\"\n```\n\nThe dashboard is **pre-built and vendored** at `dashboard-dist/` (18 files,\n`base:/demo/`). You do NOT need node/pnpm or the dashboard repo for this deploy.\n\n---\n\n## 2. Deploy the dashboard (S3 + CloudFront)\n\n```bash\nbash infra/deploy_dashboard_cloudshell.sh\n```\n\nThis script (committed): resolves the frontend bucket + distribution from the\n`scudo-poc-frontend` stack exports, `aws s3 sync dashboard-dist/ s3://<bucket>/demo/`,\nand invalidates `/demo/*`. The SPA is then served at\n**`https://<cloudfront-domain>/demo/`** (current domain:\n`https://dp4ji14se0pct.cloudfront.net/demo/`).\n\n> Why `/demo/`: the build uses `base:\"/demo/\"`, so assets reference `/demo/...`.\n> Syncing to the bucket root would white-screen. The script handles the prefix.\n\n---\n\n## 3. Deploy the backend (so /api/mapping/* incl. ingest/stream is live)\n\nThe backend runs from the `scudo-poc` app stack via the `scudo-poc-build`\nCodeBuild project (builds the image from `backend/Dockerfile`, pushes to ECR,\nand \u2014 per the revised `infra/scudo-poc-build.yaml` \u2014 also publishes the vendored\n`dashboard-dist/` to S3/`demo/`).\n\n```bash\n# Point CodeBuild at the right branch if it isn't already:\naws codebuild start-build --project-name scudo-poc-build \\\n  --source-version scudo-phase0-foundations\n# watch:\naws codebuild batch-get-builds --ids <buildId> --query \"builds[0].buildStatus\"\n```\n\nThen roll the app stack to the new image if it doesn't auto-deploy (check how\n`scudo-poc` consumes the image \u2014 ECS service vs Lambda; see AWS_HANDOFF.md \u00a7\"app\").\n\n> If CodeBuild's source is still the old branch/credentials, either update the\n> project source or run step 2 standalone (the dashboard half doesn't need\n> CodeBuild \u2014 only the backend image does).\n\n---\n\n## 4. Smoke tests (must pass before declaring it up)\n\n```bash\n# Backend liveness (new unauthenticated probe):\ncurl -sf https://<api-domain>/healthz            # expect {\"status\":\"ok\"}\n\n# Matching graph (needs the gateway-injected auth header \u2014 see \u00a75):\ncurl -s https://<api-domain>/api/mapping/vendors  # expect a vendors list\n\n# Dashboard:\ncurl -sI https://<cloudfront-domain>/demo/ | head -1   # expect 200\n# open in a browser: the SCUDO graph loads, Upload & Test panel is top-right.\n```\n\nExisting smoke helper: `infra/scudo_post_deploy_smoke.sh` (adapt domains).\n\n---\n\n## 5. \u26a0\ufe0f MUST address before any real/external use\n\nThese are documented in README \"What is NOT done\" \u2014 do not skip:\n\n1. **Auth header injection (SECURITY).** The dashboard sends\n   `X-Authenticated-User` (PoC). The edge (ALB/CloudFront/API GW) **MUST strip\n   any inbound `X-Authenticated-User` and inject the real authenticated\n   identity** \u2014 otherwise a caller forges identity and can write precedents\n   (see `backend/auth.py`). Confirm the gateway does this, or the deploy is\n   insecure. For a closed demo, gate access at the network/CloudFront level.\n2. **CORS.** Prod is same-origin (CloudFront routes `/api/*` \u2192 ALB), so no CORS\n   config needed. If you instead expose the API on a different origin, you must\n   add CORS + you reintroduce the auth-header exposure.\n3. **Live matcher (Bedrock/Titan).** Matcher runs scripted unless\n   `SCUDO_AGENT_BACKEND=bedrock` is set on the app and Bedrock model access for\n   `amazon.titan-embed-text-v2:0` is granted. Verify model access in this\n   account first (historically the hard blocker \u2014 see AWS_HANDOFF.md).\n4. **SSE through ALB idle timeout (60s default).** `/ingest/stream` +\n   `/agent/run` set `X-Accel-Buffering:no` and `/api/*` has `Compress:false`. A\n   long live Bedrock run can exceed the ALB idle timeout \u2014 add an SSE heartbeat\n   or raise the timeout before relying on live runs.\n\n---\n\n## 6. Rollback\n\n- Dashboard: re-sync the previous `dashboard-dist/` (or `aws s3 sync` an earlier\n  copy) to `s3://<bucket>/demo/` + invalidate `/demo/*`.\n- Backend: redeploy the prior ECR image tag on the `scudo-poc` app stack.\n- No CloudFormation stack changes are required by this deploy (it publishes\n  assets + an app image to existing stacks), so there is no stack rollback \u2014\n  only artifact/image rollback.\n\n---\n\n## Quick reference\n\n| Thing | Value |\n|---|---|\n| Account / region | `954976331678` / `us-east-1` |\n| Branch @ commit | `scudo-phase0-foundations` @ `4b335bb` |\n| Dashboard URL | `https://<cloudfront>/demo/` (now `dp4ji14se0pct.cloudfront.net`) |\n| Health | `https://<api>/healthz` |\n| Stacks (don't recreate) | `scudo-poc-net`, `-data`, `scudo-poc`, `-build`, `-frontend` |\n| New endpoints this release | `POST /api/mapping/ingest/stream` (SSE), `GET /healthz` |\n| Titan model | `amazon.titan-embed-text-v2:0` |", "deployment/deploy": "# SCUDO MatchMaker AIA Stack Deployment\n\nTarget account and region:\n\n- Account: `954976331678` (`cb4115669a-genaipocs-aw`)\n- Principal: `cloudboost_account_operator/2096955@cognizant.com`\n- Region: `us-east-1`\n- Existing stack name: `scudo-poc`\n\nThe SAM template now reflects the target architecture's first deployable slice:\nevent-driven ETL plus the matching API. The specialist+verifier can run on\neither the Bedrock (default) or the pre-built Azure OpenAI backend \u2014 see\n\"Intelligent demo\" below to run the Azure + real-matcher path.\n\n## What Gets Created\n\n- Raw, clean canonical, quarantine, vendor catalog, and CDAO catalog S3 buckets.\n- EventBridge raw-object rule -> SQS ETL queue -> ETL Lambda worker.\n- DynamoDB tables for ETL jobs, facts, audit log, human review, and transaction outbox.\n- Custom EventBridge bus plus projection SQS queue for mapping/persistence events.\n- Existing SCUDO orchestrator Lambda behind API Gateway HTTP API.\n- Existing Bedrock model wiring for the mapping specialist/verifier.\n\nCost-bearing always-on stores from the full diagram are exposed as explicit\nconnection seams. Neptune and OpenSearch stay optional (empty keeps those\nprojections off), but **Aurora is now mandatory** \u2014 `AuroraClusterArn` and\n`AuroraSecretArn` have no defaults and the stack will fail without them, since\nthe DynamoDB tables were removed in the 5-zone persistence consolidation:\n\n- `NeptuneSparqlEndpoint` (optional)\n- `OpenSearchEndpoint` (optional)\n- `AuroraClusterArn` (**required**)\n- `AuroraSecretArn` (**required**)\n\n## Deploy From CloudShell\n\nCloudShell is already authenticated to the target account. From `~/scudo`:\n\n```bash\nsam build\nsam deploy \\\n  --stack-name scudo-poc \\\n  --region us-east-1 \\\n  --capabilities CAPABILITY_IAM \\\n  --parameter-overrides \\\n    ApiKey=\"$SCUDO_API_KEY\" \\\n    BedrockModelId=us.anthropic.claude-sonnet-5 \\\n    OntologySnapshot=cdao-2026-05-19 \\\n    RubricVersion=v1 \\\n    NeptuneSparqlEndpoint=\"\" \\\n    OpenSearchEndpoint=\"\" \\\n    AuroraClusterArn=\"$SCUDO_AURORA_CLUSTER_ARN\" \\\n    AuroraSecretArn=\"$SCUDO_AURORA_SECRET_ARN\"\n```\n\nGenerate the API key once if needed:\n\n```bash\nexport SCUDO_API_KEY=\"$(python -c 'import secrets; print(secrets.token_urlsafe(32))')\"\n```\n\n## Intelligent demo (Azure specialist+verifier + real matcher)\n\nThe default deploy above runs the Bedrock backend with the matcher falling back\nto the in-memory sidecar mock if FalkorDB has no candidates. To run the demo the\ndiagram depicts \u2014 the **Azure** specialist+verifier over **real** FalkorDB\ncandidates \u2014 add these overrides. Azure and Aurora are already provisioned; this\nis wiring, not new build. (The `openai` client now ships in the Lambda image via\n`requirements-lambda.txt`, which the Azure shim imports.)\n\n```bash\nsam deploy \\\n  --stack-name scudo-poc \\\n  --region us-east-1 \\\n  --capabilities CAPABILITY_IAM \\\n  --parameter-overrides \\\n    ApiKey=\"$SCUDO_API_KEY\" \\\n    OntologySnapshot=cdao-2026-05-19 \\\n    RubricVersion=v1 \\\n    AuroraClusterArn=\"$SCUDO_AURORA_CLUSTER_ARN\" \\\n    AuroraSecretArn=\"$SCUDO_AURORA_SECRET_ARN\" \\\n    NeptuneSparqlEndpoint=\"$SCUDO_NEPTUNE_SPARQL_ENDPOINT\" \\\n    OpenSearchEndpoint=\"$SCUDO_OPENSEARCH_ENDPOINT\" \\\n    AgentProviderDefault=azure \\\n    AzureOpenAIEndpoint=\"$AZURE_OPENAI_ENDPOINT\" \\\n    AzureOpenAIApiKey=\"$AZURE_OPENAI_API_KEY\" \\\n    AzureOpenAISpecialistDeployment=\"$AZURE_OPENAI_SPECIALIST_DEPLOYMENT\" \\\n    AzureOpenAIVerifierDeployment=\"$AZURE_OPENAI_VERIFIER_DEPLOYMENT\" \\\n    AllowMockFallback=\"\"\n```\n\nNotes:\n\n- **Real matcher**: the Lambda already runs `STORE_BACKEND=falkordb` with\n  `FALKORDB_URL` pointing at the in-VPC FalkorDB service, and `/run` prefers\n  `matcher_bridge.retrieve_candidates()` (real dense+lexical retrieval) over the\n  mock. Leaving `AllowMockFallback=\"\"` makes a store outage fail loudly instead\n  of silently serving mock candidates \u2014 the honest demo posture. Set it to `1`\n  only if you need the demo to survive before the stores are seeded.\n- **Per-request override**: a `/run` payload may set `\"agent_provider\": \"azure\"`\n  or `\"bedrock\"` to switch backend per call regardless of the default.\n- `AzureOpenAIApiVersion` (default `2024-10-21`) and\n  `AzureOpenAIReasoningEffort` (default `medium`) can be overridden if needed.\n\n## Smoke Checks\n\n```bash\naws cloudformation describe-stacks \\\n  --stack-name scudo-poc \\\n  --region us-east-1 \\\n  --query 'Stacks[0].Outputs' \\\n  --output table\n\ncurl \"$(aws cloudformation describe-stacks \\\n  --stack-name scudo-poc \\\n  --region us-east-1 \\\n  --query \"Stacks[0].Outputs[?OutputKey=='HealthUrl'].OutputValue\" \\\n  --output text)\"\n```\n\nThe health response includes a `resources` object showing the exact buckets,\nqueues, tables, bus, and optional data-store endpoints currently wired into\nthe Lambda environment.\n\nTo exercise the ETL path, upload a small file to `RawFeedBucketName`; S3 emits\nto EventBridge, EventBridge delivers to SQS, and `scudo-poc-etl-worker` writes\neither `clean/<job>/...json` or `quarantine/<job>/...json`.", "handovers/architecture-gap-analysis": "# SCUDO Architecture \u2014 Gap Analysis vs Target-State Diagram\n\n**Date:** 2026-06-16\n**Method:** read-only fan-out (6 Explore agents over `backend/`, `infra/`, `docs/`) + a hand-verification pass on the orchestrator finding.\n**Scope:** maps the \"Strategic Architecture \u2014 Data Flow (Target State)\" diagram (5 vendors \u2192 ingestion \u2192 SCUDO[Neptune+RDF+ODRL] \u2192 Fusion SPI V2 \u2192 iFusion) onto the codebase.\n\n**Status key:** \u2705 working \u00b7 \ud83d\udfe1 partial \u00b7 \ud83d\udfe0 stub/mock \u00b7 \u274c missing\n\n## TL;DR\n\nPartially covered. **13 \u2705 / 5 \ud83d\udfe1 / 5 \ud83d\udfe0 / 9 \u274c** across 32 boxes. The *data plane* (ingestion \u2192 matcher \u2192 graph store \u2192 precedent memory \u2192 confidence gate \u2192 signed verdict) is real and runs locally. The *live infra* (Neptune semantic retrieval, S3 write, real vendor APIs) and the *consumer + governance edges* (Fusion SPI V2, iFusion catalog, and the entire DQ Framework) are stubs, mocks, or missing.\n\n## \u26a0\ufe0f Correction to the \"orchestrator\" finding (hand-verified; updated after independent review)\n\nThe diagram's **orchestrator + matching engine + nodes** loop **already exists and works** \u2014 in *two* real forms, plus one skeleton. There are THREE implementations:\n\n| Orchestrator | File | Reality |\n|---|---|---|\n| Deterministic orchestrator + verifier + publish gate | `backend/scudo/orchestrator.py` | \u2705 **Real.** `run()` (l.92) routes \u2192 assembles bundle \u2192 `_call_mapping` \u2192 **`_call_verifier`** (l.154, scores the real `VerifierReport`) \u2192 **`_gate_and_decide`** (l.215: verifier \u226516 + 0.80 floor + deterministic-IRI + named-graph). Bedrock-wired in `lambda_handler.py:136\u2013224`; bundle assembler is injectable (fake for tests, real pipeline for prod). |\n| MCP agent host + matcher | `backend/scudo_mapping_mcp/agent.py` + `matching.py` | \u2705 **Real.** Runs `find_similar_products \u2192 get_node \u2192 get_neighbourhood`, then `map_vendor_product` runs last and **gates**. Rule: *\"matcher wins; agent surfaces, matcher gates\u2026 cannot disagree by construction.\"* |\n| Strands wiring | `scudo_strands_app.py` (repo root) | \ud83d\udfe0 **Skeleton.** `route()` exists but every helper raises `NotImplementedError`. A blueprint, not wired. |\n\nSo you do **not** need to build the orchestrator\u2192matcher\u2192nodes feed \u2014 it runs today, and the `scudo/` orchestrator already has a **real 10-dim verifier scorer + publish gate**. The open decision is consolidating the two real paths and retiring the Strands skeleton.\n\nNamespaces: `backend/scudo_mapping_mcp/` (matcher/store/feedback/HMAC verdict), `backend/scudo/` (a **real** deterministic orchestrator + verifier + schemas + Bedrock lambda handler \u2014 only its `rdf/fake.py` serializer is a stub), and `scudo_strands_app.py` (the skeleton). *(The first row was missed in the initial pass and surfaced by an independent review.)*\n\n## Coverage matrix\n\n### Ingestion & vendor feeds\n| Box | Status | Evidence | Gap |\n|---|---|---|---|\n| Feed formats JSON/XML/CSV/Parquet/XLSX | \u2705 | `backend/ingestion/readers.py` (Csv/Txt/Json/Xlsx/Xml/Parquet ingesters, l.26\u2013123); tests `test_ingest_*.py` | \u2014 |\n| Ingestion framework: normalize / multi-vendor / schema-map / transform-load | \u2705 | `backend/ingestion/engine.py` (739 l): `_load_metadata` l.132, `do_transformations` l.542, `_compare_columns` l.378, `_load_to_target` l.418; `factory.py` l.32 | \u2014 |\n| Scheduler | \u274c | only manual `POST /api/ingest/<id>` (`routes/ingest.py:23`); cron/Airflow mentioned in `docs/ingestion_framework_spec.md:221` as future | no EventBridge/Lambda/cron |\n| File-xfer / AWS API path | \ud83d\udfe1 | local FS only (`engine.py:_discover_files` l.176); S3 env vars in `config.py:93` but no boto3 transfer | S3 ingestion not implemented |\n| Vendor catalogue source (MCP) | \ud83d\udfe0 | `vendor_catalogue_mcp/server.py:52` real tool surface, but `mock_backend.py:107` reads synthetic local parquet (\"ONLY seam that changes on AWS cutover\") | no real LSEG/Bloomberg/S&P/ICE/FactSet APIs |\n\n### Storage & metadata tiers\n| Box | Status | Evidence | Gap |\n|---|---|---|---|\n| S3 \"as-is\" store | \u2705 | `frames.py:134` `_read_s3_frame` (get_object + SHA-256); `hydrate.py:162` reads canonical bundle | **write/put_object path absent** (`persistence_mcp.py:329` returns JSON string only) |\n| \"Aurora PostgreSQL\" metadata/mapping/lineage | \ud83d\udfe1 | `init_db.sql` + `db.py:29` \u2014 but it's **MySQL** (`pymysql`), SCD-2 versioning on `tp_provider/dataset/col` | not Aurora-PG; tracks ETL not mapping lineage; mapping state lives only in graph |\n| Graph store seam (Falkor/Neptune/memory) | \u2705 | `store/factory.py:18`; `falkordb_store.py:95` + `neptune_store.py:463` (SigV4 SPARQL) + `memory_store.py:31` all implement the 15-method contract | Neptune `find_similar_products:547` is a **placeholder (sim=0.0, \"M9\")** |\n| Canonical bundle hydrate/export | \u2705 | `bundle.py:113` export / `:198` idempotent import; `hydrate.py:161` S3 replay, graceful cold-start | full-snapshot only; export doesn't write S3 |\n\n### Graph DB + RDF + ODRL (semantic core)\n| Box | Status | Evidence | Gap |\n|---|---|---|---|\n| Neptune ontology graph (CDAO nodes) | \u2705 | `neptune_store.py:46\u2013270` 12 SPARQL templates (skos:Concept/broader/narrower); `backend/scudo/authoritative/mcp.py` openCypher | \u2014 |\n| SPARQL templates | \u2705 | `neptune_store.py:46` parameterized templates, `_lit()/_iri()` escaping l.276 | \u2014 |\n| RDF/DCAT + SHACL | \ud83d\udfe1 | `backend/scudo/rdf/fake.py:54` deterministic DCAT triples | **SHACL is a stub** (`validate_shapes:132` \u2014 no real shapes; flags only empty/malformed triples); \"faithful FAKE\" awaiting `modules.rdf` |\n| Product-Rights-Contracts edges | \ud83d\udfe0 | prompts/skills exist; `backend/scudo/rdf/fake.py:121` `serialise_rights` returns empty stub | no Permission/Prohibition/Duty/Contract models |\n| ODRL rights (terms/policies/license) | \ud83d\udfe0 | `rights-odrl.SKILL.md` + agent wiring; `tools.py:108` \u2192 fake stub | actual ODRL triple generation `NotImplemented` |\n\n### Mapping engine (the matcher)\n| Box | Status | Evidence | Gap |\n|---|---|---|---|\n| OpenSearch / AOSS vector search | \u274c | `opus_dense.py:5` Titan-Embed **PARKED**; dense arm uses Opus 4.8 as judge | no embeddings/vector index |\n| Fuzzy + exact match | \u2705 | `falkordb_store.py:53` Jaro-Winkler; `base.py:318` BM25 (exact-token recovery, smoke-tested) | \u2014 |\n| Vendor-specific rule engine | \ud83d\udfe1 | `validations.py:59` `default_field_rules` (name\u2192prefLabel\u2026) | only field normalization; per-vendor scoring \"via M6 bundle\" |\n| Confidence scoring (0.80 floor / bands) | \u2705 | `config.py:44` floor 0.80 / `:49` half 0.05; `matching.py:247` 3-band PASS/BORDERLINE/FAIL | \u2014 |\n| Semantic classification / search | \u2705 | `opus_dense.py:70` scorer; `retrieval.py:74` `multi_path_retrieve`; flag `SCUDO_USE_OPUS_DENSE` | \u2014 |\n| Ranking (RRF) | \u2705 | `base.py:235` RRF_K=60; `:368` `reciprocal_rank_fusion`; fused in `falkordb_store.py:306` | \u2014 |\n| Approved overrides | \u2705 | `feedback.py:44` `apply_decision` (approve/override/reject); precedent reuse `matching.py:167` | \u2014 |\n| NLP Python libraries | \u274c | no nltk/spacy; pure-Python JW + regex tokenize (`base.py:306`) | semantic delegated to Opus, not NLP libs |\n\n### Orchestrator + verifier + DQ framework\n| Box | Status | Evidence | Gap |\n|---|---|---|---|\n| Orchestrator routing + publish gate | \u2705 | **two real:** `backend/scudo/orchestrator.py` (route + verifier + gate, Bedrock-wired) and `agent.py` + `matching.map_vendor_product` (matcher-gates). **skeleton:** `scudo_strands_app.py:262` all helpers `NotImplementedError` | consolidate the two real paths; retire Strands |\n| Independent verifier (10-dim rubric) + HMAC verdict | \u2705 | **two real mechanisms:** `verdict.py:1\u2013255` HMAC sign/verify (production-grade); AND `scudo/orchestrator.py:154` `_call_verifier` scores the real `VerifierReport` (`schemas.py:207` \u2014 10 dims, total\u226420, `recompute_total`) and gates in `_gate_and_decide:215`; Bedrock-wired (`lambda_handler.py:147`) | verifier output quality depends on the live LLM; `scudo_strands_app.py:252` rubric is the unwired skeleton's copy |\n| DQ framework: completeness/accuracy/cross-ref | \u274c | zero matches for dq/completeness/accuracy; `validations.py:83` is scope/IRI/length checks only | **no DQ framework at all** |\n| DQ metrics + error reports | \u274c | `mcp_host.py:281` metrics are circuit-breaker/availability, not data quality | no quality dimensions/error reports |\n| Vendor com/graphql`\n\nDo not paste or commit the AppSync API key. It exists as a stack output for\nbootstrap only and should be rotated/replaced before any non-PoC use.\n\nConsole MySQL import contract:\n\n- Export `scudo-poc-console-mysql-endpoint`: `scudo-poc-console-mysql.cluster-cvm68w06mna8.us-east-1.rds.amazonaws.com`\n- Export `scudo-poc-console-mysql-secret-arn`: `arn:aws:secretsmanager:us-east-1:954976331678:secret:scudo/poc/console-mysql-06oiAp`\n- RDS cluster status: `available`\n- RDS instance status: `available`\n- Engine/version: `aurora-mysql` / `8.0.mysql_aurora.3.10.3`\n- Port: `3306`\n\n### `scudo-poc`\n\nStatus: `UPDATE_COMPLETE`.\n\nConfirmed Lambda wiring:\n\n- `scudo-poc-orchestrator` has the Aurora, Neptune, OpenSearch, AppSync, and Titan env vars.\n- `scudo-poc-projection-worker` is `Active`, `LastUpdateStatus=Successful`.\n- Projection worker VPC config:\n  - Subnets: `subnet-0aadacea616fd53c1`, `subnet-07c7316701307076b`\n  - Security group: `sg-0fd88e7b6da9c2274`\n- SQS event source mapping is enabled for `arn:aws:sqs:us-east-1:954976331678:scudo-poc-projection`.\n\nHealth check result:\n\n- `/prod/health` returned `\"ok\": true`.\n- The health payload includes non-empty values for:\n  - `SCUDO_NEPTUNE_SPARQL_ENDPOINT`\n  - `SCUDO_NEPTUNE_ENDPOINT`\n  - `SCUDO_OPENSEARCH_ENDPOINT`\n  - `SCUDO_OPENSEARCH_INDEX`\n  - `SCUDO_AURORA_CLUSTER_ARN`\n  - `SCUDO_AURORA_DATABASE_NAME`\n  - `SCUDO_EMBEDDINGS_MODEL_ID`\n  - `SCUDO_APPSYNC_API_URL`\n\n## 3. Build/Deploy Run\n\nLatest successful CodeBuild run:\n\n- Build ID: `scudo-poc-build:d72890ec-9c66-47d9-aa52-8c56bb7b6664`\n- Commit deployed: `e768284` (`fix(scudo): pass a single Neptune class`)\n- Result: `SUCCEEDED`\n- Phases: `INSTALL`, `BUILD`, `POST_BUILD`, `UPLOAD_ARTIFACTS`, `FINALIZING`, `COMPLETED` all succeeded.\n\nImportant fixes that landed during provisioning:\n\n- `f0d1f4e` - added `scudo-poc-data`, projection worker, and bootstrap loader.\n- `adc58fa` - creates the OpenSearch service-linked role before deploy.\n- `3c49425` - retries data stack after `ROLLBACK_COMPLETE`.\n- `c731f99` - fixes AppSync resolver teardown ordering.\n- `e768284` - passes a single clean Neptune instance class to CloudFormation.\n- `fa8ca5b` - adds the console Aurora MySQL cluster and the two console import exports.\n\n## 4. Bootstrap Confirmations\n\nThe successful build uploaded the mock CDAO catalog to S3 and initialized the\ntarget stores. CodeBuild log markers showed:\n\n- `[init_data_platform] Aurora schema ready`\n- `[init_data_platform] Neptune CDAO nodes upserted: 19`\n- `[init_data_platform] OpenSearch CDAO docs indexed: 19`\n\nThe prior statement that only a representative 6-node set was seeded is now\nout of date for this branch/deployment; the current fixture load reports 19\ncatalog nodes.\n\n## 5. What Is Now Provisioned From The Diagram\n\n- Aurora audit/catalog/persistent-memory backing store: provisioned.\n- Aurora MySQL backing store for the Flask ingestion console: provisioned.\n- Neptune canonical RDF/SPARQL store: provisioned.\n- OpenSearch lexical + k-NN-capable index endpoint: provisioned.\n- Titan embeddings path: configured and used by the bootstrap/indexing code when Bedrock invocation succeeds.\n- CDAO catalog bootstrap: loaded from S3 into Aurora/Neptune/OpenSearch.\n- Data steward AppSync/WebSocket publish path: AppSync API is provisioned; publish mutation/subscription schema exists.\n- Asynchronous projection path: EventBridge/SQS projection queue now has `scudo-poc-projection-worker` attached.\n\n## 6. Remaining Runtime Caveats\n\nThese are not provisioning blockers, but the next agent should understand them:\n\n1. `/run` still builds matcher candidates from the mock sidecar candidate set in `lambda_handler.py`. The real stores are provisioned and seeded, but matcher retrieval still needs to be changed to query OpenSearch/Neptune/FalkorDB instead of using only mock candidates.\n2. `MappingCompleted` is still emitted for every outcome from the API path. The new projection worker gates writes to `outcome == \"published\"`, but the event naming is still broad and should be tightened.\n3. Persistence helpers remain mostly fail-soft. A write failure can still be hidden from the HTTP response unless the caller explicitly checks downstream state.\n4. AppSync uses a bootstrap API key. Replace with Cognito/IAM/OIDC before treating the steward channel as anything beyond PoC.\n5. OpenSearch is a VPC domain. Any direct inspection or smoke query must run from VPC-attached compute, CloudShell with suitable networking, or another approved path.\n\n## 7. Verification Commands\n\nUse CloudShell in `us-east-1`:\n\n```bash\naws cloudformation describe-stacks --stack-name scudo-poc-data --region us-east-1 \\\n  --query \"Stacks[0].[StackStatus,Outputs[?OutputKey!='AppSyncApiKey']]\" --output table\n\naws cloudformation list-exports --region us-east-1 \\\n  --query \"Exports[?starts_with(Name,'scudo-poc-console-mysql')].[Name,Value]\" --output table\n\naws rds describe-db-clusters --db-cluster-identifier scudo-poc-console-mysql --region us-east-1 \\\n  --query \"DBClusters[0].[Status,Endpoint,Engine,EngineVersion,Port]\" --output table\n\naws lambda get-function-configuration --function-name scudo-poc-projection-worker --region us-east-1 \\\n  --query \"{State:State,LastUpdateStatus:LastUpdateStatus,VpcConfig:VpcConfig}\" --output json\n\naws lambda list-event-source-mappings --function-name scudo-poc-projection-worker --region us-east-1 \\\n  --query \"EventSourceMappings[].{State:State,Arn:EventSourceArn}\" --output table\n\nHEALTH=$(aws cloudformation describe-stacks --stack-name scudo-poc --region us-east-1 \\\n  --query \"Stacks[0].Outputs[?OutputKey=='HealthUrl'].OutputValue|[0]\" --output text)\ncurl -s \"$HEALTH\" | python -m json.tool\n```", "handovers/code-review-fixes": "# Codex code-review fixes \u2014 status\n\nTracks the Codex full-review findings the owner prioritized. **Fixed-here** =\nlanded + unit-tested on e-profile ARNs (`BedrockModelId`) |\n| B6 | Wildcard CORS | `SCUDO_CORS_ORIGINS` env wired in `scudo-poc-app.yaml` (`CorsOrigins` param) |\n| B7 | Silent mock fallback | `SCUDO_ALLOW_MOCK_FALLBACK` env wired (`AllowMockFallback` param), default \"0\" |\n\n> \u26a0\ufe0f These YAML edits change the TEMPLATE. They do nothing to the running stack\n> until the deployer redeploys `scudo-poc-app` / `scudo-poc-foundation`. Until\n> then the **live** auth gate is still dev-open.\n\n## Deployer-action only (needs live AWS / topology decisions)\n\n| # | Finding | What the deployer must do |\n|---|---------|---------------------------|\n| B2 (blocker) | Header-trust boundary | Strip+inject `X-Authenticated-User` at the edge \u2014 full spec in `infra/AUTH_GATE_SPEC_strip_inject.md`. The B1 template change is necessary but NOT sufficient without this. |\n| B3 | CloudFront\u2192ALB over HTTP | Add ALB TLS + set CloudFront origin protocol policy to HTTPS-only; close/redirect plain HTTP. Touches the live distribution/listener \u2014 left to the deployer rather than guessed. |\n| B5 | `/demo/` SPA fallback inconsistent | Add a CloudFront Function rewriting `/demo/*` misses \u2192 `/demo/index.html` (deep-link 404s otherwise). Needs the live distribution. |\n| Lambda `API_KEY` fail-open | `lambda_handler.py:81` | [UNVERIFIED deployed path] confirm the Lambda actually enforces `x-api-key` in the deployed config; fail closed if `API_KEY` unset. |\n\n## Verification done\n- `pytest` across all matching test files: green (run per-file to avoid the\n  known process-global store-cache cross-file pollution).\n- `pnpm build:matching`: unaffected (no dashboard code changed this round).\n\n## Not changed (verified FINE by Codex)\n0.85 band float fix; SSE worker Flask-context safety (copies `g.principal`\nbefore the thread); cleanup script dry-run default; canonical `mds.*` vendor\nIRIs; shell scripts `set -euo pipefail`.\n\n## Related\n\n- [Auth gate spec](/specs/auth-gate-strip-inject.md)", "handovers/dashboard-repo-push": "## Dashboard source bundle \u2014 apply & push\n\n# Dashboard source bundle \u2014 apply & push\n\n`scudo-dashboard.bundle` carries the 7 unpushed dashboard commits\n(branch `scudo-phase0-foundations`, tip `6741756`) for\n`github.com/Egonex-AI/Understand-Anything`. It exists because `2096955` lacks\npush access there (403). See `../DASHBOARD_REPO_PUSH_HANDOFF.md` for context.\n\n**Thin bundle:** it contains only `origin/main..scudo-phase0-foundations` and\n*requires* base commit `7f5a717` (already on the dashboard repo's `main`), so\napply it inside a normal clone of that repo.\n\n## Apply (from a clone you can push)\n\n```bash\ngit clone https://github.com/Egonex-AI/Understand-Anything.git\ncd Understand-Anything\ngit fetch /path/to/scudo-dashboard.bundle scudo-phase0-foundations:scudo-phase0-foundations\ngit checkout scudo-phase0-foundations\ngit log --oneline -1          # expect 6741756 (HITL reasoning + decision UI)\ngit push -u origin scudo-phase0-foundations\n# then open a PR: scudo-phase0-foundations \u2192 main\n```\n\nIf `git fetch` complains about a missing base, your clone's `main` is behind \u2014\n`git fetch origin && git checkout main && git pull` first so `7f5a717` is present.\n\n## Verify the bundle before applying\n```bash\ngit bundle verify scudo-dashboard.bundle   # should say \"is okay\"\n```\n\nThe matching UI is gated on `VITE_MATCHING_MODE` / the matching vite config, so\nmerging it does not change the default Understand-Anything dashboard build.\n\n---\n\n## Handoff \u2014 push the dashboard SOURCE repo\n\n# Handoff \u2014 push the dashboard SOURCE repo\n\n**For:** a collaborator/deploy agent **with write access to\n`github.com/Egonex-AI/Understand-Anything`**. The MatchMaker author (`2096955`)\nis **not** a collaborator there \u2014 `git push` returns 403 \u2014 so the dashboard\nsource commits are stranded locally and need pushing by someone with access.\n\n> **This is NOT required to deploy.** The built dashboard (`dashboard-dist/`,\n> including the HITL UI) is vendored + pushed in the MatchMaker repo, so the\n> live demo deploys from MatchMaker alone. This handoff is only to get the\n> dashboard **editable source** onto the remote so it isn't lost and others can\n> rebuild it.\n\n## What exists locally (unpushed)\n\n- Repo: `Egonex-AI/Understand-Anything`, package `packages/dashboard` (+ a one-line\n  `packages/core` type change).\n- Branch: **`scudo-phase0-foundations`** \u2014 **does not exist on the remote**, never\n  pushed (no upstream).\n- HEAD: **`6741756`**. It is **7 commits ahead of `origin/main`**:\n\n  ```\n  6741756 feat(dashboard): human-in-the-loop \u2014 reasoning transcript + decision UI\n  e6ba0a2 fix(dashboard): force same-origin API base in matching build\n  f1b1df7 feat(dashboard): SCUDO pipeline-glyph favicon for matching build\n  1bf3fdd fix(dashboard): rewrite static <title> in matching build (no title flash)\n  84fe88f fix(dashboard): brand browser tab title in matching mode\n  f7a91eb feat(dashboard): SCUDO matching mode \u2014 floating edges, real drill-down, upload & test\n  a6a6386 feat(core): add optional data{band,weight} to GraphEdge for SCUDO matching\n  ```\n\n  These are the entire dashboard side of the SCUDO matching work: matching mode +\n  floating edges + the real per-layer drill-down, the Upload & Test live-pipeline\n  UI, the HITL reasoning + decision panels, branding, and the same-origin API fix.\n\n## What needs to happen\n\nThe local commits live on the laptop at\n`/Users/anthonylui/Understand-Anything/understand-anything-plugin`. Get them onto\nthe remote one of these ways:\n\n1. **If you can push from that laptop** (you have creds for the Egonex-AI org):\n   ```bash\n   cd ~/Understand-Anything/understand-anything-plugin\n   git push -u origin scudo-phase0-foundations\n   # then open a PR: scudo-phase0-foundations \u2192 main\n   ```\n2. **If you work from your own clone:** the author can hand you a bundle/patch\n   (`git bundle create scudo-dashboard.bundle origin/main..scudo-phase0-foundations`\n   or `git format-patch origin/main`), which you `git fetch`/`git am` into your\n   clone and push.\n3. **Fork route** (only with owner approval \u2014 it publishes the code to a new\n   location): fork under a namespace you can write to, push the branch there,\n   PR upstream.\n\n## Build note (so the source actually builds for whoever pulls it)\n\n- The dashboard is a **pnpm workspace**; `packages/dashboard` depends on\n  `packages/core` (a `workspace:*` dep with vite aliases to `../core/dist/*.js`).\n- To build: `pnpm install` at the repo root, build `core` first (`pnpm --filter\n  @understand-anything/core build`), then `pnpm --filter\n  @understand-anything/dashboard build:matching`. (This ordering is why MatchMaker\n  vendors a prebuilt `dist/` rather than building in CodeBuild \u2014 see\n  `infra/build_dashboard_dist.sh`.)\n- `dist/` is gitignored in that repo (correct \u2014 it's build output).\n\n## After the push \u2014 verify\n```bash\ngit ls-remote origin scudo-phase0-foundations   # should now resolve to 6741756\n```\nThen a PR into `main` is the clean way to land it; the matching UI is gated on\n`VITE_MATCHING_MODE` / the matching vite config, so it does not affect the\ndefault Understand-Anything dashboard build.\n\n## Note\nA stray `packages/dashboard/public/matching-graph.json` shows as modified locally\n\u2014 that's only the `analyzedAt` timestamp regenerating; it's content-identical and\ncan be discarded (`git checkout -- \u2026`), not committed.", "handovers/hitl-bands-2026-06-26": "# SCUDO \u2014 HITL-visible + reviewer-tunable bands: work summary & deploy/push handover\n\n**Date:** 2026-06-26\n**Branch:** `scudo-phase0-foundations`\n**For:** the deploy operator with direct AWS access to `954976331678` / `us-east-1`\n(laptop has no AWS creds). This is the **incremental** handover for *this release* \u2014\nit builds on `infra/DEPLOY_RUNBOOK_scudo-poc.md` (full runbook) and\n`infra/REDEPLOY_NOTE_branding.md` (the `/cogJPMdemo/` base-rewrite). Read those for\nthe baseline; this doc covers only what changed and what to verify.\n\n---\n\n## 1. Summary of work\n\nTwo things the owner asked for, on top of the existing matching demo:\n\n1. **HITL is always visible.** Previously the reasoning + decision panels only\n   appeared after a run came back borderline, so the headline Human-in-the-Loop\n   feature was effectively invisible. Now, in matching mode:\n   - `ReasoningPanel` and `DecisionPanel` always render (idle empty states on load).\n   - The decision surface (Approve / Override / Reject) is driven by the backend\n     result status **and prerequisite-gated** \u2014 Approve needs a mapped node +\n     confidence, Override needs an alternative candidate, and out-of-scope /\n     `band=\"n/a\"` / no-candidate results disable the actions (no spurious POST).\n   - A **\"Run sample\"** button runs a known LSEG product through the live pipeline\n     so the panels populate without hunting for a file.\n2. **The reviewer can move the confidence bands.** A \"Review thresholds\" control\n   lets a reviewer change the borderline window (e.g. **0.75\u20130.85 \u2192 0.70\u20130.85**).\n   - The graph edges + node-info band **re-colour live** (advisory display).\n   - **\"Re-run with these thresholds\"** re-invokes the matcher with the chosen\n     window so the *actual* AUTO_MAPPED vs NEEDS_REVIEW escalation changes.\n\n**Not in scope (called out for honesty):** the reasoning panel is one-way; a true\ntwo-way chat remains spec-only. Auth stays dev-open for the closed demo.\n\n### What changed in code\n- **Frontend** (dashboard repo, source `@ 6fc9550`): new `src/utils/reviewBands.ts`\n  (+`reviewDecision.ts`); `store.ts` reviewBands state; `DecisionPanel`,\n  `ReasoningPanel`, `UploadTestPanel`, `GraphView`, `NodeInfo`, `App.tsx`,\n  `MobileLayout.tsx`. FE tests **69 pass** + `build:matching` green (verified in the\n  dashboard source repo, not this checkout).\n- **Backend** (MatchMaker `@ 1281ab1`): `scudo_mapping_mcp/matching.py` (kw-only\n  `floor`/`half` on `map_vendor_product`, default `settings`),\n  `scudo_mapping_mcp/agent.py` (both `run()` thread `confidence_floor`/\n  `borderline_half_width` to the authoritative matcher calls + the Strands tool\n  closure; override uses a **local** agent so there is no cross-run threshold\n  bleed; no contextvar), `routes/mapping.py` (`/map` + `/agent/run` accept +\n  validate the optional window). BE tests: **28 pass** per-file.\n- **FE\u2194BE contract:** the FE sends `confidence_floor` + `borderline_half_width`\n  (derived `floor=(passCut+failCut)/2`, `half=(passCut\u2212failCut)/2`, 4dp so odd-span\n  windows round-trip exactly through the backend's 2dp gate). The BE reads them by\n  key-presence and validates `0 \u2264 floor\u2212half < floor+half \u2264 1` (\u2192 400 otherwise).\n\nProcess: Codex independently reviewed the plan (outset) + each phase + the final\ncombined diff + the recovery (see \u00a76). FE & BE built by parallel agents.\n\n---\n\n## 2. Git push (do this first)\n\n- **MatchMaker** \u2014 the feature code is commit `1281ab1`; this handover is added as\n  a separate doc-only commit on the same branch. Push the branch (it carries both)\n  so CodeBuild builds them:\n  ```bash\n  git -C <MatchMaker> push origin scudo-phase0-foundations\n  ```\n- **Dashboard** (`github.com/Egonex-AI/Understand-Anything`) \u2014 the author (`2096955`)\n  **cannot push it (403, not a collaborator)**. The source `@ 6fc9550` is delivered\n  as a git bundle: `infra/handoff/scudo-dashboard.bundle` (thin, `origin/main..branch`).\n  A collaborator with push access applies it:\n  ```bash\n  git clone <Understand-Anything> ua && cd ua\n  git fetch /path/to/scudo-dashboard.bundle scudo-phase0-foundations:scudo-phase0-foundations\n  git checkout scudo-phase0-foundations && git push origin scudo-phase0-foundations\n  ```\n  > The AWS deploy does **not** need the dashboard repo \u2014 the built dashboard is\n  > vendored in MatchMaker at `dashboard-dist/`. The bundle is only so the source\n  > repo stays in sync.\n\n---\n\n## 3. AWS deployment\n\nBoth halves must ship. **Order doesn't matter, but the backend image MUST roll** \u2014\nthe reviewer band-override is new backend code; without the image roll the\nfrontend \"Re-run with these thresholds\" silently has no effect (the BE ignores the\nextra body keys on the old image).\n\n### 3a. Frontend (dashboard \u2192 S3 + CloudFront)\nThe new bundle is vendored at `dashboard-dist/` (main JS `index-CdVj71F2.js`,\n`base:/demo/`, title \"SCUDO Matching Comprehension\", `favicon-scudo.svg`).\n```bash\ncd <MatchMaker>\nbash infra/deploy_dashboard_cloudshell.sh      # syncs dashboard-dist/ \u2192 s3://<bucket>/demo/ + invalidates /demo/*\n```\nFor the branded **`/cogJPMdemo/`** path, also do the base-rewrite copy per\n`infra/REDEPLOY_NOTE_branding.md` (sed `/demo/`\u2192`/cogJPMdemo/` into a second prefix\n+ invalidate `/cogJPMdemo/*`). Current distribution: `dp4ji14se0pct.cloudfront.net`\n(bucket `scudo-dev-frontend-954976331678`, dist `E3E55IQ7L8SI8`).\n\n### 3b. Backend (image roll \u2014 REQUIRED for the band override)\nThe console/app image (`backend/Dockerfile`) is built \u2014 and the vendored\n`dashboard-dist/` frontend is published \u2014 by the CodeBuild project defined in\n`infra/scudo-poc-build.yaml`, named\n`${StackPrefix}-console-build` (default **`scudo-poc-console-build`**) and exported\nas `scudo-poc-console-build-project-name`. Resolve it rather than hard-coding:\n```bash\nPROJ=\"$(aws cloudformation list-exports \\\n  --query \"Exports[?Name=='scudo-poc-console-build-project-name'].Value\" --output text)\"\naws codebuild start-build --project-name \"$PROJ\" \\\n  --source-version scudo-phase0-foundations\n# watch buildStatus \u2192 SUCCEEDED, then roll the scudo-poc app to the new image\n```\n> NOTE: `scudo-poc-build` (in `backend/scudo/build-pipeline.yaml`) is a SEPAR
