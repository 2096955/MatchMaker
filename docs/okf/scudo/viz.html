ATE\n> project (the Lambda/Codex stack) \u2014 do **not** use it here. `DEPLOY_RUNBOOK_scudo-poc.md \u00a73`\n> still references `scudo-poc-build`; treat that as stale and prefer the resolved\n> `scudo-poc-console-build`. (See runbook \u00a73 for how `scudo-poc` consumes the image.)\n\n---\n\n## 4. Verification\n\n```bash\n# Backend liveness\ncurl -sf https://<api-domain>/healthz                      # {\"status\":\"ok\"}\n\n# New bundle is live (frontend)\ncurl -s https://dp4ji14se0pct.cloudfront.net/cogJPMdemo/ | grep -o 'index-CdVj71F2'   # match\n#  (or /demo/) \u2014 and the served main JS contains \"Review thresholds\" + \"Under your bands\"\n\n# Band override reached the backend (after the image roll):\n#  valid window \u2192 200/normal; malformed window \u2192 400\ncurl -s -o /dev/null -w '%{http_code}\\n' -X POST https://<api-domain>/api/mapping/map \\\n  -H 'Content-Type: application/json' -H 'X-Authenticated-User: <dev>' \\\n  -d '{\"vendor\":\"LSEG\",\"product_id\":\"X-1\",\"name\":\"Global Equity Prices\",\"confidence_floor\":0.9,\"borderline_half_width\":0.2}'   # expect 400 (floor+half>1)\n```\nUI check: open `/cogJPMdemo/` \u2192 the right rail shows the HITL panels on load \u2192\n**Run sample** \u2192 a result appears \u2192 move the threshold inputs (e.g. 0.70\u20130.85) \u2192\nedges/node-info re-band \u2192 **Re-run with these thresholds** \u2192 escalation changes \u2192\nApprove \u2192 \"HITL: Approved\".\n\n---\n\n## 5. Caveats / MUST address before external use\nUnchanged from the runbook \u00a75 \u2014 still open, do not skip for real use:\n1. **Auth (security) \u2014 ACCEPTED RISK, recorded 2026-06-27 (owner decision).**\n   The live app runs `AllowDevAuth=1` with `SCUDO_CORS_ORIGINS` empty (\u2192 CORS `*`)\n   behind an internet-facing ALB + a CloudFront `/api/*` behavior with **no edge\n   gate** (no WAF / Lambda@Edge / CloudFront Function). `auth.py:resolve_principal`\n   resolves **every** request as the owner, so the API is reachable\n   **unauthenticated by anyone with the URL**. Because `AgentBackend` defaults to\n   `bedrock` (`us.anthropic.claude-opus-4-8`), `/api/mapping/agent/run` triggers\n   **paid Bedrock Opus inference per call**, and record-decision writes pollute the\n   precedent store. Data is **synthetic** \u2192 no data-confidentiality breach; the\n   accepted exposures are **cost-abuse + demo-integrity**. The template comment\n   (`scudo-poc-app.yaml:21`) requires the edge strip+inject\n   (`infra/AUTH_GATE_SPEC_strip_inject.md`) *before* enabling dev-auth \u2014 that gate\n   is **intentionally deferred** for this closed demo, gated only by URL obscurity.\n   - **Mitigations available without a redeploy:** share the URL only with the\n     intended audience; retire/rotate the distribution when the demo window ends;\n     watch Bedrock spend in Cost Explorer for `us.anthropic.claude-opus-4-8`.\n   - **Cost-only guard (optional, needs a roll):** set `AgentBackend=scripted` \u2014\n     removes the paid-inference vector; dense matching + the band override\n     (`/api/mapping/map`) are unaffected, only the live agent reasoning changes.\n   - **Proper fix when this goes beyond a closed demo:** implement\n     `AUTH_GATE_SPEC_strip_inject.md` and roll `AllowDevAuth=0` (see \u00a73b).\n2. **SSE vs ALB 60s idle timeout** for long live Bedrock runs (heartbeat / raise timeout).\n3. **Live matcher** needs `SCUDO_AGENT_BACKEND=bedrock` + Titan model access.\n4. **Band override is backend-gated** \u2014 only effective once the \u00a73b image rolls.\n\n## 6. Provenance (review trail)\nCodex (independent ARB) reviewed: the plan at the outset (REWORK \u2192 folded in), the\nFE diff and the BE diff per-phase (REWORK \u2192 fixed \u2192 APPROVE), the final combined\ndiff (caught the band 4dp round-trip drift + the Bedrock threshold-bleed \u2014 both\nfixed), and the post-recovery re-apply (APPROVE). During integration the\nMatchMaker `backend/` working tree was deleted wholesale and restored from HEAD\n(reflog clean, no committed work lost); the uncommitted Phase 2 was re-applied\nverbatim and re-verified. Tests: FE 69 (dashboard repo), BE 28 (per-file, this repo).\n\n## 7. Rollback\n- Frontend: re-sync the previous `dashboard-dist/` to `s3://<bucket>/demo/` (+ `/cogJPMdemo/`) and invalidate.\n- Backend: redeploy the prior ECR image tag on `scudo-poc`.\n- No CloudFormation stack changes in this release.\n\n## Related\n\n- [Deploy runbook (scudo-poc)](/deployment/deploy-runbook-scudo-poc.md)", "handovers/redeploy-branding": "# Redeploy note \u2014 branding (tab title + favicon)\n\n**Why:** the live site still shows the OLD bundle (browser tab \"Understand\nAnything\", generic \"U\" favicon). Commit `023e375` on\n`scudo-phase0-foundations` fixes both:\n- tab title \u2192 **SCUDO Matching Comprehension** (static `<title>` + runtime)\n- favicon \u2192 SCUDO pipeline glyph (`favicon-scudo.svg`)\n\nThese are baked into the vendored `dashboard-dist/` (verified:\n`dashboard-dist/index.html` has the new title + `favicon-scudo` href, and\n`dashboard-dist/favicon-scudo.svg` is present).\n\n## \u26a0\ufe0f Base-path wrinkle (important)\n\nThe vendored `dashboard-dist/` is built with `base:\"/demo/\"` \u2014 assets reference\n`/demo/...`. There are now (at least) two live paths on CloudFront\n`E3E55IQ7L8SI8` / bucket `scudo-dev-frontend-954976331678`:\n\n- `/demo/` \u2014 matches the bundle's base directly.\n- `/cogJPMdemo/` \u2014 a **base-rewritten** copy the deployer made earlier\n  (`/demo/` \u2192 `/cogJPMdemo/`). A plain re-sync of this `/demo/`-based bundle\n  will NOT serve correctly under `/cogJPMdemo/` \u2014 the rewrite step must be\n  repeated, OR rebuild with `base:\"/cogJPMdemo/\"`.\n\n## Redeploy steps (CloudShell, acct 954976331678, us-east-1)\n\n```bash\ncd ~/MatchMaker && git fetch origin && git checkout scudo-phase0-foundations && git pull\ngit log --oneline -1     # expect 023e375 (or later) chore(deploy): \u2026 SCUDO favicon + title\ntest -f dashboard-dist/favicon-scudo.svg && echo \"branded dist present \u2713\"\n\nBUCKET=scudo-dev-frontend-954976331678\nDIST=E3E55IQ7L8SI8\n\n# --- Path A: the canonical /demo/ path ---\naws s3 sync dashboard-dist/ \"s3://$BUCKET/demo/\" --delete\naws cloudfront create-invalidation --distribution-id \"$DIST\" --paths \"/demo/*\"\n\n# --- Path B: the /cogJPMdemo/ branded path (repeat the base rewrite) ---\n# The dist is /demo/-based, so rewrite the prefix in a staged copy before upload:\nrm -rf /tmp/cogJPMdemo && cp -r dashboard-dist /tmp/cogJPMdemo\ngrep -rl '/demo/' /tmp/cogJPMdemo | xargs sed -i 's#/demo/#/cogJPMdemo/#g'\naws s3 sync /tmp/cogJPMdemo/ \"s3://$BUCKET/cogJPMdemo/\" --delete\naws cloudfront create-invalidation --distribution-id \"$DIST\" --paths \"/cogJPMdemo/*\"\n```\n\n> Cleaner long-term fix for Path B: add a `build:matching:cogjpm` script (or a\n> `--base` override) so the bundle is built with `base:\"/cogJPMdemo/\"` directly,\n> instead of sed-rewriting. Deferred \u2014 the rewrite works for now.\n\n## Verify after redeploy\n\n```bash\n# tab title now in the served HTML (no JS needed):\ncurl -s https://dp4ji14se0pct.cloudfront.net/demo/ | grep -o '<title>[^<]*</title>'\n# expect: <title>SCUDO Matching Comprehension</title>\ncurl -sI https://dp4ji14se0pct.cloudfront.net/demo/favicon-scudo.svg | head -1   # 200\n# repeat for /cogJPMdemo/ if Path B was run.\n```\nBrowser: tab reads \"SCUDO Matching Comprehension\" with the blue pipeline-glyph icon.\n\n## Note on a true branded hostname\n\n`/cogJPMdemo/` is a path on the dev CloudFront distribution, not a custom\nhostname. A real branded URL (`cogJPMdemo.<domain>`) needs Route 53 / domain\nownership + ACM cert + CloudFront alias \u2014 out of scope here, flagged for later.", "handovers/smoke-fixes-round1": "# Live smoke \u2014 round 1 findings + fixes\n\nThe live Upload & Test smoke (`infra/SMOKE_upload_flow_live.md`) found 3 issues.\nStatus of each below. Branch is now at `2390a10` (push verified).\n\n---\n\n## 1. Frontend hard-coded to `http://localhost:5001` \u2014 FIXED in code \u2705\n\n**Was:** the deployed bundle had `VITE_API_BASE=http://localhost:5001` baked in\n(leaked from a dev `.env.local`), so the live UI called localhost \u2192 no vendors,\ndisabled \"Run\".\n\n**Fix (`vite.config.matching.ts`):** `VITE_API_BASE` and `VITE_DEV_PRINCIPAL` are\nnow hard-pinned to `\"\"` via `define:` in the matching build, so no local env can\never leak into a production bundle. Verified: the new `dashboard-dist/` contains\n**no** `localhost`, and calls relative `/api/mapping/*`.\n\n**Action: redeploy the dashboard** (picks up `dashboard-dist/` @ `2390a10`) \u2014\nsame steps as `infra/REDEPLOY_NOTE_branding.md`, both `/demo/` and `/cogJPMdemo/`:\n```bash\ncd ~/MatchMaker && git fetch origin && git checkout scudo-phase0-foundations && git pull\ngit log --oneline -1   # expect 2390a10 (or later)\ngrep -rc localhost dashboard-dist/assets/*.js   # expect 0\nBUCKET=scudo-dev-frontend-954976331678 ; DIST=E3E55IQ7L8SI8\naws s3 sync dashboard-dist/ \"s3://$BUCKET/demo/\" --delete\naws cloudfront create-invalidation --distribution-id \"$DIST\" --paths \"/demo/*\"\n# /cogJPMdemo/: repeat the prefix rewrite then sync (see REDEPLOY_NOTE_branding.md)\n```\nAfter redeploy, the UI should load vendors and enable \"Run\" \u2014 but it will only\nwork end-to-end once #2 is resolved.\n\n---\n\n## 2. Deployed backend lacks `POST /api/mapping/ingest/stream` \u2014 DEPLOY GAP \u26a0\ufe0f\n\n**Confirmed:** the route IS in the source (`backend/routes/mapping.py:737`,\ncommit `9eb0b9a`). The 404 means the **running backend is an older image**.\n\n**The real question the smoke surfaced:** the smoke hit\n`scudo-dev-alb-2025833982.**eu-west-2**.elb.amazonaws.com` \u2014 that's the **dev**\nbackend in **eu-west-2**, NOT the `scudo-poc` app in **us-east-1** that this\nrelease targets. So either:\n- (a) CloudFront `/api/*` is routing to the **wrong / old** backend origin, or\n- (b) the intended `scudo-poc` (us-east-1) backend was never rolled to the new\n  image.\n\n**Action (deployer, needs AWS):**\n1. Decide which backend is canonical for this demo. If it's `scudo-poc`\n   (us-east-1), confirm CloudFront `/api/*` points at *its* ALB, not the\n   eu-west-2 dev ALB.\n2. Roll that backend to the image built from `scudo-phase0-foundations`\n   (CodeBuild `scudo-poc-build` succeeded earlier \u2014 ensure the app stack/service\n   actually deploys that image, not just builds it).\n3. Verify the route exists on the live backend:\n   ```bash\n   curl -s -o /dev/null -w \"%{http_code}\\n\" -X POST <api>/api/mapping/ingest/stream\n   #   expect 400 (missing vendor/file) \u2014 NOT 404. 404 = route still not deployed.\n   curl -s <api>/healthz   # expect {\"status\":\"ok\"} \u2014 NOT the S3 app-shell HTML\n   ```\n   (The smoke's `/healthz` returned S3 HTML \u2192 CloudFront served the SPA shell for\n   that path, another sign `/api`+`/healthz` aren't all routed to the new backend.)\n\n---\n\n## 3. Auth gate is OPEN \u2014 CONFIG \u26a0\ufe0f (security)\n\n`/api/mapping/vendors` returns 200 with **no** `X-Authenticated-User`. In code,\n`auth.resolve_principal` allows this only when `SCUDO_AUTH_ALLOW_DEV` is truthy\n(dev fallback) \u2014 so the deployed backend has **dev auth enabled**.\n\n**Action (deployer):** for anything beyond a closed demo, on the canonical\nbackend:\n- Unset `SCUDO_AUTH_ALLOW_DEV` (and `SCUDO_AUTH_DEV_PRINCIPAL`) so unauthenticated\n  `/api/*` returns 401, AND\n- Ensure the gateway/ALB **strips inbound `X-Authenticated-User` and injects** the\n  real authenticated identity (see `DEPLOY_RUNBOOK_scudo-poc.md` \u00a75). The SPA no\n  longer sends that header (fixed in #1), so identity must come from the gateway.\n\nFor a closed internal demo, gating at the network/CloudFront layer is acceptable\nshort-term \u2014 but document it as open.\n\n---\n\n## What's verified vs not\n- \u2705 Matcher SSE (`/agent/run`) works live end-to-end through CloudFront \u2014 proves\n  the SSE transport itself is fine (no buffering/timeout problem).\n- \u2705 #1 fixed in code + re-vendored dist, pushed.\n- \u23f3 #2, #3 are deploy/config \u2014 only resolvable with AWS access. Re-run\n  `SMOKE_upload_flow_live.md` after the backend is on the new image + frontend\n  redeployed.", "handovers/smoke-upload-flow-live": "# Live smoke test \u2014 Upload & Test pipeline (deployer-run)\n\n**Purpose:** prove the *headline feature* actually works against the LIVE\ndeployment \u2014 not just that the UI renders. The upload flow streams Server-Sent\nEvents (SSE) through CloudFront \u2192 ALB \u2192 Flask; this is exactly where things break\nin prod (buffering, idle timeout, auth) in ways local dev never shows.\n\n**Who runs this:** an operator/agent with access to the deployed URL + (for the\ncurl steps) ability to send an auth header. Account 954976331678, us-east-1.\n\n**Live base:** `https://dp4ji14se0pct.cloudfront.net/cogJPMdemo/` (or `/demo/`).\nAPI is **same-origin** under `/api/*` (CloudFront routes it to the Flask ALB),\ni.e. `https://dp4ji14se0pct.cloudfront.net/api/mapping/...`.\n\n**Contract (verified from source @ 46d2b34):**\n- Endpoints: `POST /api/mapping/ingest/stream` (multipart) and\n  `POST /api/mapping/agent/run` (JSON). Both stream `text/event-stream`.\n- `/api/*` is **auth-gated** \u2014 a `before_request` hook 401s without a resolvable\n  principal. Header: `X-Authenticated-User` (e.g. `2096955@cognizant.com`).\n- Valid vendors: `LSEG`, `S&P Global`, `Bloomberg`, `ICE`, `FactSet`.\n- CSV columns accepted: `product_id,name,description` (aliases exist).\n- ETL SSE events: `{type:stage, stage:received|parse|validate|sink, nodeIds, detail}`\n  then `{type:final_result, ingested, products}` then `{type:done}`.\n\n---\n\n## Part A \u2014 API-level SSE smoke (curl, ~2 min)\n\nRun from CloudShell (or anywhere that can reach the URL). Tests the live SSE\npath end-to-end through CloudFront/ALB.\n\n```bash\nBASE=https://dp4ji14se0pct.cloudfront.net\nAUTH='X-Authenticated-User: 2096955@cognizant.com'\n\n# 0. Sanity: health (unauthenticated) + auth gate behaves\ncurl -s \"$BASE/healthz\"                                   # {\"status\":\"ok\"}\ncurl -s -o /dev/null -w \"no-auth vendors: %{http_code}\\n\" \"$BASE/api/mapping/vendors\"\n#   EXPECT 401 (auth gate works). If 200 with no header \u2192 gate is OPEN, flag it.\ncurl -s -H \"$AUTH\" \"$BASE/api/mapping/vendors\"            # vendors list (LSEG,\u2026)\n\n# 1. Make a tiny vendor file\ncat > /tmp/smoke.csv <<'CSV'\nproduct_id,name,description\nLSEG-EQ-PX,Global Equity Prices,End-of-day and intraday equity prices\nCSV\n\n# 2. THE KEY TEST \u2014 stream ETL events. --no-buffer so we see frames AS THEY\n#    ARRIVE (proves no CloudFront/ALB buffering). -N disables curl buffering.\necho \"--- ingest/stream ---\"\ncurl -sN --no-buffer -H \"$AUTH\" \\\n  -F vendor=LSEG -F file=@/tmp/smoke.csv \\\n  \"$BASE/api/mapping/ingest/stream\"\n#   EXPECT, in order, each on its own `data:` line:\n#     data: {\"type\":\"stage\",\"stage\":\"received\",...}\n#     data: {\"type\":\"stage\",\"stage\":\"parse\",\"detail\":{\"rows\":1}...}\n#     data: {\"type\":\"stage\",\"stage\":\"validate\",...}\n#     data: {\"type\":\"stage\",\"stage\":\"sink\",...}\n#     data: {\"type\":\"final_result\",\"ingested\":1,\"products\":[{\"product_id\":\"LSEG-EQ-PX\",...}]}\n#     data: {\"type\":\"done\"}\n#   Note the product_id from final_result for step 3.\n\n# 3. Run the matcher stream for that product\necho \"--- agent/run ---\"\ncurl -sN --no-buffer -H \"$AUTH\" -H 'Content-Type: application/json' \\\n  -d '{\"vendor\":\"LSEG\",\"product_id\":\"LSEG-EQ-PX\"}' \\\n  \"$BASE/api/mapping/agent/run\"\n#   EXPECT data: lines of type tool_call / tool_result (find_similar_products,\n#     get_taxonomy_node, map_vendor_product) then final_result then done.\n```\n\n### Pass / fail for Part A\n- **PASS:** both streams emit the event sequence above, frames arrive\n  incrementally (not all at once at the end), ending in `done`.\n- **FAIL \u2014 all frames arrive together at the end:** CloudFront/ALB is BUFFERING\n  the SSE. Check `Compress:false` on the `/api/*` behavior and ALB response\n  buffering. (Backend already sets `X-Accel-Buffering:no`.)\n- **FAIL \u2014 connection drops near ~60s on agent/run:** ALB idle timeout. Raise it\n  or add an SSE heartbeat (known TODO for live Bedrock runs).\n- **FAIL \u2014 401 even with the header:** the gateway is STRIPPING\n  `X-Authenticated-User` (good for security, but then it must INJECT a real\n  identity \u2014 confirm how auth is meant to flow in prod). If 200 *without* the\n  header at step 0, the gate is open \u2014 security flag.\n\n---\n\n## Part B \u2014 Browser UI smoke (~3 min)\n\n1. Open `https://dp4ji14se0pct.cloudfront.net/cogJPMdemo/`.\n2. Confirm tab = \"SCUDO Matching Comprehension\" + blue pipeline-glyph favicon.\n3. Open DevTools \u2192 Console (watch for errors) and Network (filter: `ingest`).\n4. In the right **Upload & Test** panel: vendor = `LSEG`, choose `/tmp/smoke.csv`\n   (or any CSV with `product_id,name,description`), click **Run through pipeline**.\n5. **Watch the graph:** the ETL nodes (EventBridge \u2192 SQS \u2192 Lambda \u2192\n   Validate \u2192 S3/DynamoDB) should light up in sequence, then the matcher nodes\n   (Parse \u2192 Semantic \u2192 Rank \u2192 Gate). The run-event log in the panel fills with\n   `ETL \u00b7 received/parse/validate/sink` then matcher tool lines, ending\n   `Result: \u2026`.\n6. In Network, the `ingest/stream` request should show `text/event-stream` and\n   (in some browsers) stream progressively.\n\n### Pass / fail for Part B\n- **PASS:** nodes animate, run log fills, ends with a result, **no console\n  errors**.\n- **FAIL \u2014 \"mapping store unavailable\" / 503 in the log:** the live store\n  (FalkorDB/Aurora) isn't reachable from the app \u2014 check backend env + VPC.\n- **FAIL \u2014 CORS error in console:** the SPA is NOT same-origin with the API\n  (it should be, via CloudFront `/api/*`). Don't \"fix\" with `VITE_API_BASE` to a\n  cross-origin URL \u2014 fix the CloudFront routing.\n- **FAIL \u2014 nodes never light / log empty but no error:** SSE not reaching the\n  browser (buffering, see Part A).\n\n---\n\n## Report back\nPaste the Part A stream output + Part B pass/fail + any console errors. That\nplus the existing render/health checks is what makes the demo **stakeholder-ready**\non the feature axis. (Separately, the `X-Authenticated-User` gateway\nstrip-and-inject is still the security gate before *external* exposure \u2014 see\n`infra/DEPLOY_RUNBOOK_scudo-poc.md` \u00a75.)", "plans/dense-arm-sdk-adoption": "# Dense-arm SDK adoption \u2014 replan\n\n| Field | Value |\n|---|---|\n| Status | Draft for ARB \u2014 replaces `dense-arm-swap.md` (v0.2, SUPERSEDED-PENDING-REPLAN) |\n| Date | 2026-06-10 |\n| Authoritative diagrams | `docs/architecture/scudo-overview.mmd`, `scudo-match-verify.mmd`, `scudo-retrieval.mmd` |\n| Owner | _[TBC]_ |\n| Version | 0.3 (was 0.2 under the build-it-ourselves framing) |\n\n## 1. Decision recap \u2014 what is being adopted, what is being dropped\n\n### 1.1 What is being dropped (vs `dense-arm-swap.md` v0.2)\n\n- **The build-it-ourselves wrapping of Bedrock Titan + FalkorDB `db.idx.vector.queryNodes` is DROPPED.** v0.2 proposed `embed(text) \u2192 vector` and `vector_knn(vec, k) \u2192 ranked nodes` as two thin primitives we own. ARB has declined that route.\n- **A direct Bedrock Titan invocation as the dense arm is DROPPED for now.** Titan-embed-text-v2 was the chosen model; ARB has noted that (a) IAM grants for the model ARN, (b) eu-west-2 account-level Bedrock model access for `amazon.titan-embed-text-v2:0` in sandbox 954976331678, and (c) the SDK-preprocessing audit are **PARKED** and not closed in this workflow (see \u00a76).\n- **`dense-arm-swap.md` v0.2 is SUPERSEDED-PENDING-REPLAN.** That document is retained as historical context with a banner forward-pointer to this file. Its critical-review findings are carried forward under \u00a76 / \u00a78.\n\n### 1.2 What is being adopted\n\n- **The three architecture diagrams under `docs/architecture/` are the source-of-truth.** `scudo-overview.mmd`, `scudo-match-verify.mmd`, `scudo-retrieval.mmd`. ARB has approved them. The retrieval diagram is labelled TARGET STATE for the SDK multi-path; everything inside the gate is the current contract.\n- **For TODAY (WS-B, shipped):** the **dense arm is an Opus-4.8 prompt path**. The agent (Strands on Bedrock, Opus-4.8) scores semantic similarity through a structured prompt; that score becomes the \"dense\" arm input to `find_similar_products`. FalkorDB's `falkordb_store.find_similar_products` continues to do multi-path retrieval (BM25 lexical sidecar + structural pass: precedent boost, negative-precedent drop) over the working graph. The GraphRAG-SDK is **NOT integrated**. Bedrock Titan-embed is **NOT used**. There is no live `db.idx.vector.queryNodes` call.\n- **The door is left open** to swap the Opus-prompt dense arm for the real GraphRAG-SDK vector path once the BLOCKING IAM / model-access / SDK-preprocessing items are resolved. The feature flag `SCUDO_DENSE_BACKEND` is the swap-point (see \u00a77).\n\n### 1.3 Why this shape\n\nPragmatism. The three-MCP trust gradient, the confidence floor, the borderline-only specialist invocation, and the HMAC seal v=2 with band are all unchanged regardless of how the dense score is computed. Swapping the *source* of the dense score (LLM prompt vs Titan vector vs SDK vector) does not move the control envelope. We can ship and operate the demo path now, and exchange the dense source later without re-architecting.\n\n## 2. Current state (WS-B, shipped)\n\n### 2.1 Retrieval surface today\n\n`scudo_mapping_mcp/store/falkordb_store.py::find_similar_products`:\n\n- **Dense arm:** Opus-4.8 prompt path. The agent is asked, against each candidate's `label` (and where present `description`), to emit a similarity score in `[0, 1]`. That score is what populates `Candidate.similarity`. No Bedrock Titan invoke; no `CALL db.idx.vector.queryNodes`; no SDK import.\n- **Lexical arm:** pure-Python BM25 over `TaxonomyNode.label` (`store/base.py` BM25 helper). Universe-scoped scan, not bounded by the dense arm \u2014 preserves recall of ticker / RIC / ISIN matches the Opus-prompt dense arm under-weights.\n- **Fusion:** RRF (rank-only). `Candidate.similarity = raw dense score`. RRF + boost composes the **sort key**, never the similarity. This is the discipline the floor is calibrated against.\n- **Structural pass:** precedent boost (\u2264 +0.10 on rank only) recomputed from confirmed `MAPPED_TO` edges; negative-precedent drop applied as a pre-filter before scoring; distance check **deferred** (no anchor data).\n- **GraphRAG-SDK:** NOT integrated. `falkordb_store.py` module banner currently still names \"AWS GraphRAG Toolkit\" as the production target \u2014 STALE; see \u00a75 / \u00a78.\n- **Titan-embed:** NOT used. `amazon.titan-embed-text-v2:0` has zero call-sites in code today.\n\n### 2.2 What the dense arm *is* in the Opus-4.8 path\n\nA structured-prompt scoring call routed through the existing Strands Agent on Bedrock (`agent.py::BedrockMappingAgent`). For each candidate the agent returns a JSON-shaped `{iri, similarity}` constrained to `[0, 1]`. That value is the raw dense score; it lands on `Candidate.similarity` unchanged.\n\n### 2.3 What the dense arm is NOT, today\n\n- Not a vector embedding.\n- Not a Bedrock Titan invocation.\n- Not a GraphRAG-SDK call.\n- Not an HNSW / cosine query against a FalkorDB vector index.\n\nThe retrieval diagram's `VEC` node (Titan via LiteLLM) is **TARGET**, not shipped. The diagram is annotated accordingly in the `architecture/README.md`.\n\n## 3. Invariants preserved\n\nThese hold in WS-B today and MUST hold under any future dense-arm swap:\n\n- **I-RAW-DENSE.** `Candidate.similarity` is the raw dense score. RRF, boost, and any rerank affect SORT ORDER only. Encoded at `falkordb_store.py:194-209, 265-282` and at `base.py:281-362`. Under SDK adoption, the SDK's cosine rerank must either pass through the raw dense score on `Candidate.similarity` or the floor + disagreement-cap must move outside the SDK boundary (Open Question \u00a78, retrieval-Q1 / retrieval-Q2).\n- **I-FLOOR-CENTRED.** The three-band gate floor is `CONFIDENCE_FLOOR = 0.75`, half-width `BORDERLINE_HALF_WIDTH = 0.05`. `pass_threshold() = 0.80`; `borderline_threshold() = 0.70` \u2014 both returned from the `PASS_CUT` / `FAIL_CUT` constants rather than computed. The canonical window is not itself at risk \u2014 `0.75 + 0.05` is exactly `0.8` and `0.75 - 0.05` is exactly `0.7` \u2014 but `floor`/`half` are overridable per call and via the `CONFIDENCE_FLOOR` / `BORDERLINE_HALF_WIDTH` env vars, and neighbouring windows are not exact (`0.80 + 0.05` yields `0.8500000000000001`; `0.85 - 0.05` yields `0.7999999999999999`). Defined at `config.py` `CONFIDENCE_FLOOR` / `BORDERLINE_HALF_WIDTH` / `PASS_CUT` / `FAIL_CUT` / `pass_threshold()` / `borderline_threshold()`; consumed in `matching.py` `_gate_thresholds()`, called at the band gate inside `map_vendor_product()` \u2014 the public matcher entry point, and the only `map_*` symbol `matching.py` defines. **Calibrated against the Jaro-Winkler distribution.** Opus-prompt scoring is a different distribution; calibration is mandatory before the floor can be trusted under WS-B (see \u00a74).\n\n  > **Corrected 2026-08-16.** This invariant was `I-FLOOR-0.80` and asserted floor `0.80` \u2192 `0.85`/`0.75`. That is the pre-5-zone configuration; `config.py:49` has read `0.75` since `docs/superpowers/plans/2026-07-04-scudo-5zone-alignment.md` Task 1. Renamed away from the literal so the ID cannot rot the same way again. Measured, not read:\n  > `python3 -c \"from scudo_mapping_mcp import config as c; print(c.CONFIDENCE_FLOOR, c.pass_threshold(), c.borderline_threshold())\"` \u2192 `0.75 0.8 0.7`.\n  >\n  > Four of the old citation anchors were also wrong, and each pointed at real code, which is how they survived review: `config.py:44` is the IRI-namespace comment, and `matching.py:243-246` is precedent provenance, not the gate. Line-number anchors are not used above \u2014 search the symbol names. Note also that `backend/scudo/orchestrator.py:41` declares a **separate** `CONFIDENCE_FLOOR = 0.80` (Runtime-A auto-approve publish gate). Different control, unchanged, do not reconcile.\n  >\n  > **Corrected 2026-08-17.** The 2026-08-16 fix above swapped rotten line numbers for symbol names and then named a symbol that does not exist: it said the gate is called in `map_product()`. `matching.py` defines no `map_product`; the entry point is `map_vendor_product()`. The name was not invented out of nothing \u2014 `backend/routes/mapping.py` really does define a Flask view called `map_product()`, a different layer entirely \u2014 which is why it read as plausible. This is the exact failure the rename was meant to stop, recurring one edit later in the same paragraph: a symbol name rots just like a line number when nobody executes the lookup. Measured, not read: `grep -n \"^def map_\" backend/scudo_mapping_mcp/matching.py` \u2192 `159:def map_vendor_product(` (sole hit); `grep -n \"_gate_thresholds\" backend/scudo_mapping_mcp/matching.py` \u2192 defined at `135`, called at `331` (line numbers at the time of writing \u2014 search the symbols, not the numbers).\n  >\n  > **Corrected 2026-08-17 (second).** The same bullet also carried a false *empirical* claim, untouched by either fix above: *\"because a naive `0.75 + 0.05` yields `0.8000000000000001` and pushes an exact-0.80 score into BORDERLINE.\"* It does not. Measured: `python3 -c \"print(repr(0.75+0.05), (0.75+0.05)==0.80, repr(0.75-0.05))\"` \u2192 `0.8 True 0.7` \u2014 both canonical edges are exact, so no score was ever at risk at the default window. The rounding in `config.pass_threshold()` is still justified, but for overridden windows: `0.80 + 0.05` \u2192 `0.8500000000000001`, `0.85 - 0.05` \u2192 `0.7999999999999999`. Origin of the error: when the floor moved `0.80` \u2192 `0.75`, the numbers in this sentence were swept forward mechanically without re-measuring (recorded at `.superpowers/sdd/task-1-report.md` RESOLUTION 3). The *old* claim had been true. **The numbers looked like configuration when they were actually measurements** \u2014 config numbers travel with a config change, measured ones do not.\n- **I-BOOST-RANK-ONLY.** Precedent boost is `+0.02` per confirmed approval, capped at `+0.10`, applied to `rank_score` only \u2014 never to `similarity`. `base.py:232-253` derives the boost from `MAPPED_TO` edges; `falkordb_store.py:281` scales by `rrf_top`. Under SDK adoption the `*rrf_top` scaling requires re-derivation because cosine rerank outputs sit in a different order of magnitude (Open Question \u00a78, retrieval-Q4).\n- **I-SEALED-BAND.** HMAC seal v=2 carries `band \u2208 {pass, borderline, fail}`. Signed in Match&Verify only; verified in Persistence only. `verdict.py:155, 160, 215-219`. Unchanged.\n- **I-TRUST-GRADIENT.** Ingestion MCP read-only; Match&Verify MCP matcher + signer (no writes); Persistence MCP sole writer + I5 gate. Validated by import boundaries in `ingestion_mcp.py:41-51`, `match_verify_mcp.py:54-65`, `persistence_mcp.py:64-78`. Unchanged.\n- **I-SPECIALIST-BORDERLINE-ONLY.** Specialist runs only on `band == borderline`; `confidence = min(dense, specialist)` on concur; disagreement caps `confidence = min(best, borderline_threshold - 0.01)` = **`0.69`** to force `NEEDS_REVIEW`. In `matching.py`: gate at `_gate_thresholds()`, concur-min at the `min(best.similarity, specialist_pick.similarity)` site, and the cap at both `min(best.similarity, borderline_threshold - 0.01)` sites (off-list pick, and specialist **disagreement**). Unchanged in behaviour.\n\n  > **Corrected 2026-08-17 (third).** The bracket above read \"(off-list pick, and required-validation failure)\". The second cap branch is the specialist **disagreement** path, not a required-validation failure. Read at the two sites: `matching.py:417` is the off-list/invariant-violation branch, and `matching.py:523` sits under the comment *\"Specialist DISAGREES \u2014 picked a different node from the sparse ranker.\"* A required-validation failure takes a different branch entirely and does **not** cap `confidence` \u2014 it sets `NEEDS_REVIEW` with `confidence = best.similarity` untouched. Found by Codex in the confirmation pass.\n\n  > **Corrected 2026-08-16.** The cap value read `0.74`, derived from the stale `borderline_threshold = 0.75`. At the live `0.70` it is `0.69`. The code computes it \u2014 no literal changed \u2014 but the doc's number was wrong for anyone reasoning about the gate. The `310, 318, 351` anchors were stale too.\n\n## 4. Calibration plan\n\nThe `0.75` floor and \u00b10.05 half-width (PASS \u2265 0.80 / FAIL < 0.70) were calibrated against the Jaro-Winkler character-similarity distribution. Opus-prompt scoring is a different distribution shape \u2014 likely more bimodal (the LLM tends toward confident `0.9+` for clear matches and confident `<0.3` for clear mismatches, with a thinner middle than character-similarity). Without recalibration the band routes the wrong volume to the specialist: too few cases at risk of auto-promoting weak matches, too many at the cost of borderline-specialist invocations.\n\n### 4.1 Golden set\n\n- **N = 50 hand-mapped vendor products** drawn from the JPMC catalogue against the CDAO taxonomy.\n- **Coverage targets:** ~20 clear matches (expected `band == pass`), ~15 clear non-matches (expected `band == fail` or out-of-scope), ~15 ambiguous cases (expected `band == borderline`, intended specialist invocations).\n- **Provenance:** mappings come from the reviewer queue's APPROVED / REJECTED decisions where available; otherwise hand-curated by the SCUDO team with two-reviewer concurrence.\n- **Storage:** `tests/golden/dense_arm_calibration_v1.jsonl` (path TBC; not yet in repo).\n\n### 4.2 Baseline metrics (Opus-prompt dense arm, current WS-B)\n\nRun the golden set through `find_similar_products` end-to-end and emit:\n\n- **Score distribution histogram** of `Candidate.similarity` for the top-1 candidate per probe, split by ground-truth band.\n- **Per-band precision / recall** at the current floor + half (pass-precision, borderline-correctness, fail-precision).\n- **Rank-correlation against Jaro-Winkler** (run both arms on the same probes; Spearman \u03c1. \u03c1 > 0.5 means the floor recalibration is a tuning shift; \u03c1 \u2264 0.5 means the band semantics shift too and the half-width may need to widen).\n- **Specialist-invocation rate**: fraction of probes routed to borderline. If significantly above the Jaro-Winkler baseline (~6-8% today), the half-width needs to narrow or the floor needs to lift.\n\n### 4.3 Recalibration rule\n\n- If the **pass-precision** at `floor=0.75` (pass edge 0.80) is below the I5-target (TBC, expected \u2265 0.95), **lift the floor** to the value where pass-precision crosses the target. Cap the lift at `0.80` (pass edge 0.85); above that, the gate is too restrictive for the demo and a different scoring source is needed.\n- If the **specialist-invocation rate** exceeds the cost-target (TBC, expected \u2264 10% of in-scope probes), **narrow the half-width** until the borderline band intersects the target rate.\n- If the score distribution is **bimodal with a sparse middle** (Opus-prompt typical), consider widening the half-width to absorb the sparse mid-zone into the borderline band rather than letting it slip into pass / fail by noise.\n- **Re-run calibration whenever the dense source changes** (Opus \u2192 Titan-embed \u2192 SDK). The floor recalibrate is mandatory, not optional, on any swap. This is `i5-lift-preconditions.md \u00a74.2` and is unchanged.\n\n### 4.4 What calibration does NOT do\n\n- It does not register the Opus-4.8 dense-arm scoring path with MRGR \u2014 that is `i5-lift-preconditions.md \u00a74.10` and is a separate gate.\n- It does not lift I5 \u2014 that is `i5-lift-preconditions.md \u00a74` in aggregate.\n- It does not validate the SDK / Titan path \u2014 only the WS-B Opus-prompt path. The Titan / SDK path requires its own golden-set run inside its own change.\n\n## 5. Path-to-prod \u2014 when we adopt a real vector store + GraphRAG-SDK\n\nThe Opus-prompt dense arm is the demo / sandbox shape. The production target is the diagram-as-drawn: GraphRAG-SDK vector + fulltext + cypher + relationship-expansion over a Titan-embedded FalkorDB index. The path to get there has six required deliverables:\n\n### 5.1 IAM grant for Titan model ARN\n\nThe Match&Verify task role today has `bedrock:InvokeModel` for Opus 4.8 only. Production needs an additional statement scoped to the Titan model ARN:\n\n```\narn:aws:bedrock:eu-west-2::foundation-model/amazon.titan-embed-text-v2:0\n```\n\n(written verbatim so policy review can grep it). Resource-level scoping \u2014 not `Resource: \"*\"` \u2014 and conditioned on the M&V task role principal only. Persistence and Ingestion roles MUST NOT receive this grant; the trust gradient demands the embed surface live only in M&V.\n\n### 5.2 Bedrock model access enabled in eu-west-2 / sandbox 954976331678\n\nAccount-level Bedrock console toggle: Model access \u2192 Amazon Titan Text Embeddings V2 \u2192 Enable for eu-west-2. This is a separate enablement from IAM; both are required. Confirmed enablement evidence (screenshot or `aws bedrock list-foundation-models --region eu-west-2 --by-output-modality EMBEDDING` showing the model as accessible) must land in the same PR as the SDK adoption.\n\n### 5.3 SDK preprocessing audit\n\nGraphRAG-SDK runs its own preprocessing pipeline (text normalisation, chunking, stopwording). For the raw-dense-as-similarity invariant (I-RAW-DENSE) to hold under SDK adoption we need to know:\n\n- Does the SDK apply preprocessing to **both** the query and the indexed labels (symmetric), or only to indexed labels (asymmetric)?\n- Does the SDK expose the raw dense (cosine) score per candidate **before** its rerank, or only the reranked-and-normalised score?\n- Does the SDK accept a **custom reranker callable** so we can preserve the raw-dense pass-through?\n\nAsymmetric preprocessing shifts the score distribution at the seam \u2014 recalibration is mandatory, not optional. The audit must produce a written finding (\"symmetric / asymmetric\"; \"raw exposed / rerank-only\"; \"custom reranker supported / not\") before the SDK can be wired.\n\n### 5.4 Shadow-property reindex protocol\n\nIf the SDK exposes index lifecycle (rebuild vector / fulltext on schema change), it MUST be wired as shadow-property reindex \u2014 build alongside under a new property name, atomic alias swap, then drop the old \u2014 not in-place rebuild. In-place floods the reviewer queue with transient `NEEDS_REVIEW` during rebuild. This is `dense-arm-swap.md` v0.2 Theme 7 carried forward.\n\n### 5.5 Per-arm observability\n\nBefore the flag flip (\u00a77), the following metrics MUST be wired and emitting to CloudWatch:\n\n- Per-arm latency: VEC, FT, CY, REL, RR (rerank), BOOST, DROP.\n- Per-arm hit count and per-arm contribution to surviving candidates.\n- Score distribution histogram (raw dense, post-RRF / post-rerank, post-boost).\n- Rerank-vs-raw-dense gap (sanity check for the I-RAW-DENSE invariant).\n- Boost-scaling diagnostic (if `*rrf_top` is replaced \u2014 emit the replacement scaling factor).\n- Precedent-drop count per probe.\n- Fail-closed rate (EmbeddingError / SDK retrieval error \u2192 `NEEDS_REVIEW band=fail`).\n\nThis is `dense-arm-swap.md` v0.2 Theme 6 carried forward and `i5-lift-preconditions.md \u00a74.5` partial closure.\n\n### 5.6 Golden-set recalibration\n\nSame shape as \u00a74 above but against the live Titan + SDK distribution. Must land **in the same change** as the SDK adoption \u2014 not a follow-up. This is `i5-lift-preconditions.md \u00a74.2` and is the gate that controls I5 lift.\n\n## 6. Blocking items PARKED\n\nThese were identified as BLOCKING in `arb-review-pack.md \u00a75.1` and `dense-arm-swap.md` v0.2 Theme 3. The user has explicitly **PARKED** them at this workflow boundary. They are NOT resolved here; they remain open as preconditions for the path-to-prod swap (\u00a75).\n\n| Item | Owner | Status | Rationale for parking |\n|---|---|---|---|\n| IAM policy add \u2014 `bedrock:InvokeModel` on Titan model ARN for M&V task role | _[TBC]_ | PARKED | The Opus-prompt dense arm in WS-B does not require Titan IAM. Adding the grant prematurely widens the trust surface for a path we are not using. Re-table in the SDK-adoption PR. |\n| Bedrock model access enablement \u2014 Titan-embed-text-v2 in eu-west-2 / 954976331678 | _[TBC]_ | PARKED | Account-level toggle; takes minutes once decided but unblocks nothing in WS-B. Defer to the SDK-adoption PR. |\n| SDK preprocessing audit \u2014 symmetric vs asymmetric; raw-dense exposure; custom reranker support | _[TBC]_ | PARKED | The audit cannot be done without standing the SDK up against a real graph. Parked until the SDK adoption is sequenced. |\n| GraphRAG-SDK version pin \u2014 commit hash on a provenance property | _[TBC]_ | PARKED | The SDK is not integrated; pinning a hash for a non-imported dependency is premature. Re-table in the SDK-adoption PR. (Theme 8 of `dense-arm-swap.md` v0.2.) |\n| Floor recalibration against a Titan + SDK distribution | _[TBC]_ | PARKED | Cannot run until SDK is integrated. Tracked under `i5-lift-preconditions.md \u00a74.2`. |\n\nThe WS-B Opus-prompt path **does** require its own floor recalibration (\u00a74), and that calibration is **not parked** \u2014 it is in scope and is the gate that lets the demo run with credible band semantics.\n\n## 7. Rollback \u2014 feature flag SCUDO_DENSE_BACKEND\n\nA single flag controls **both** retrieval-side and write-side behaviour, atomically. This is `dense-arm-swap.md` v0.2 Theme 4 carried forward (Theme 4 said the flag must gate the WRITE side too; it does).\n\n| Value | Dense arm source | I5 gate behaviour |\n|---|---|---|\n| `opus_prompt` (default, WS-B) | Opus-4.8 structured-prompt scoring through the Strands Agent | Persistence `commit_mapping` accepts `sealed_status` routing; `sealed_band == fail` for any auto-mapped seal is refused / down-routed to the reviewer queue. Opus-prompt-derived seals are tagged `dense_source=opus_prompt` on the trajectory archive. |\n| `titan_sdk` (target, parked) | GraphRAG-SDK multi-path over a Titan-embedded FalkorDB index | Same gate semantics. Additionally: refuse any `commit_mapping` payload whose `dense_source != settings.scudo_dense_backend` \u2014 this catches in-flight seals from the prior backend after a flag flip. |\n\n### 7.1 Flag flip protocol\n\n- Read in M&V at `find_similar_products` entry: if `settings.scudo_dense_backend == \"opus_prompt\"`, route through the Opus-prompt path; if `\"titan_sdk\"`, route through the SDK path.\n- Read in Persistence at `commit_mapping` entry: refuse seals whose `dense_source` field does not match the current setting.\n- Both reads happen at request time; no cached snapshot. Flip is atomic at the next request, no service restart required.\n- Rollback is one env var flip back to `opus_prompt` and one ECS task-def update. Mean time to rollback: minutes.\n\n### 7.2 What the flag does NOT do\n\n- It does not toggle calibration. Each backend has its own calibrated floor; switching backend without running the matching calibration is operator error.\n- It does not toggle MRGR registration. Each scoring path must be registered (Opus-4.8 as a registered model already, Titan-v2 to be registered when adopted) under `i5-lift-preconditions.md \u00a74.10`.\n- It does not lift I5. The I5 gate is the band-aware Persistence routing, which is unchanged by the flag value.\n\n## 8. Open questions \u2014 GraphRAG-SDK (kept verbatim from `arb-review-pack.md \u00a76`, PARKED)\n\nThe following questions are the GraphRAG-SDK / retrieval-surface Open Questions from `arb-review-pack.md \u00a76` (\"Diagram-vs-code reconciliation\" \u2192 scudo-retrieval entries). They are reproduced **verbatim** so future readers cannot mistake a paraphrase for the original wording. All are **PARKED** until \u00a75 / \u00a76 unblock.\n\n- **[scudo-retrieval] Does GraphRAG-SDK expose the raw dense (cosine) score per candidate before its rerank, or only reranked-and-normalised scores?** This decides whether `Candidate.similarity` can keep its raw-dense, floor-anchored contract or whether the floor + disagreement-cap must move outside the SDK boundary. **PARKED.**\n\n- **[scudo-retrieval] Does the SDK accept a custom reranker callable (the \"swappable\" claim on the diagram), or are we forced to either accept its cosine rerank or post-rerank ourselves outside the SDK?** **PARKED.**\n\n- **[scudo-retrieval] Does the SDK do its own text preprocessing (stopwording, chunking, normalisation) before computing embeddings, and if so does it apply that to the QUERY as well as to indexed labels?** If asymmetric, the floor's calibration distribution shifts and a recalibration is mandatory \u2014 not optional. **PARKED.**\n\n- **[scudo-retrieval] Should the in-file production-swap commentary (`falkordb_store.py:4-37` and `base.py:18-23`) be updated in the same change as the diagram lands, so the next reviewer doesn't trip on the \"AWS GraphRAG Toolkit, vector-only\" framing?** And should `dense-arm-swap.md` be marked SUPERSEDED with a forward pointer? (Yes, the latter is done in this workflow.) **PARKED for the in-file commentary; banner-supersession resolved.**\n\n- **[scudo-retrieval] Is the `*rrf_top` scaling of the boost (`falkordb_store.py:281`) still correct under cosine rerank?** Cosine scores sit in `[-1, 1]` (or `[0, 1]` post-normalisation), an entirely different order of magnitude from RRF's ~0.016 top contribution \u2014 the scaling factor will need re-derivation. **PARKED.**\n\n## 9. Document control\n\n- **Workflow:** WS-E, dense-arm-sdk-adoption.md draft.\n- **Run date:** 2026-06-10.\n- **Supersedes:** `docs/dense-arm-swap.md` v0.2 (build-it-ourselves plan).\n- **Linked authority:** `docs/architecture/arb-review-pack.md` (ARB tabling pack); `docs/architecture/scudo-overview.mmd`, `scudo-match-verify.mmd`, `scudo-retrieval.mmd` (approved diagrams).\n- **Linked preconditions:** `docs/i5-lift-preconditions.md` \u00a74.1 / \u00a74.2 / \u00a74.4 / \u00a74.5 / \u00a74.10.\n- **Forward references:** none \u2014 this is the current plan.\n\n**End of document.**", "plans/dense-arm-swap": "> **Superseded.** See [dense-arm-sdk-adoption](/plans/dense-arm-sdk-adoption.md).\n\n# Dense-arm swap \u2014 Build plan\n\n> **SUPERSEDED-PENDING-REPLAN \u2014 2026-06-10**\n>\n> This plan was written on the assumption that we would **BUILD the dense-arm primitives ourselves** \u2014 wrapping Bedrock Titan invoke as `embed(text) \u2192 vector` and FalkorDB `CALL db.idx.vector.queryNodes` as `vector_knn(vec, k) \u2192 ranked nodes` \u2014 explicitly choosing **not** to adopt the FalkorDB GraphRAG-SDK (see \u00a72 \"Why we're not using the SDK\" below).\n>\n> **That decision has been reversed.** We are **adopting the FalkorDB GraphRAG-SDK**, which provides vector + fulltext + cypher + relationship expansion + cosine rerank out of the box. The SCUDO-specific structural pass (precedent boost, negative-precedent drop, distance check) plugs into the SDK as swappable strategies. The trust gradient and the I5 gate are unchanged. The canonical retrieval diagram is now `docs/architecture/scudo-retrieval.mmd`.\n>\n> **Critical-review findings from v0.2 that STILL APPLY to SDK adoption (carry forward verbatim):**\n>\n> - **Theme 1 \u2014 Fail-closed contract is prose, not code.** `matcher.py:208` still has no `try/except` for retrieval errors. Routing `IndexVersionMismatchError` / `EmbeddingError` / SDK retrieval errors to `NEEDS_REVIEW` band=`fail` must be implemented in code, not asserted in docs. **STILL APPLIES.**\n> - **Theme 3 \u2014 IAM / Bedrock surface unspecified.** The Match&Verify task role still needs `bedrock:InvokeModel` for Titan (now invoked **via the SDK's LiteLLM layer**) AND the AWS console model-access toggle must be enabled for Titan in eu-west-2. **STILL APPLIES.**\n> - **Theme 5 \u2014 Score normalisation `[-1, 1]` vs `[0, 1]`.** The SDK's cosine-rerank output range must be empirically verified before it is connected to the 0.80 floor gate; if the SDK emits raw cosine in `[-1, 1]` we must normalise to `[0, 1]` at the seam. **STILL APPLIES.**\n> - **Theme 6 \u2014 Rollback model asymmetry.** If a feature flag wraps SDK adoption, the flag flip must gate the **WRITE** side too \u2014 not just the read path \u2014 or rollback will leave inconsistent state in Neptune. **STILL APPLIES if a flag wraps SDK adoption.**\n> - **Theme 7 \u2014 Reindex floods review queue.** If the SDK exposes reindex semantics (rebuild vector index / fulltext index on schema change), they must be implemented as **shadow-property** reindex (build alongside, atomic swap) \u2014 not in-place \u2014 to avoid flooding the reviewer queue with transient `NEEDS_REVIEW` during rebuild. **STILL APPLIES.**\n> - **Theme 8 \u2014 Observability.** Embed-latency, retrieve-latency, throttle counts, and fail-closed rate metrics still need to be wired (now at the SDK boundary rather than at our own primitives). **STILL APPLIES.**\n> - **Theme 9 \u2014 Persistence dependency.** Reviewer queue is still in-memory (DynamoDB queue provisioned but not wired). **STILL APPLIES, separate workstream.**\n> - **Theme 10 \u2014 Preprocessing policy version derivation.** The SDK's preprocessing is internal to the SDK; we therefore need to **pin the SDK version to a hash** and surface that hash on the same provenance property where we previously planned to record our own preprocessing-policy version. **STILL APPLIES with shifted location.**\n>\n> **Replacement plan (now drafted):** [`dense-arm-sdk-adoption.md`](/plans/dense-arm-sdk-adoption.md) is the live plan. It records the WS-B Opus-4.8-prompt dense arm as the shipped state, leaves the door open for a real vector / SDK swap behind the `SCUDO_DENSE_BACKEND` feature flag, and parks the BLOCKING IAM / Bedrock-model-access / SDK-preprocessing items (with owners TBC) until the path-to-prod swap. All carried-forward findings above are tracked there in \u00a73 (invariants), \u00a75 (path-to-prod), \u00a76 (parked blockers), and \u00a78 (open questions, verbatim).\n>\n> **Numbers below are POINT-IN-TIME (2026-06-10). Do not \"correct\" them.**\n> This document was written when `config.CONFIDENCE_FLOOR` really was `0.80`\n> (that value held from the initial commit until `eb48d67`, 2026-07-04,\n> \"feat(matcher): move confidence bands to 0.80/0.70\"). Every \"0.80 floor\"\n> below is therefore an accurate historical record, NOT a mislabel.\n>\n> As of 2026-07-04 the live values are: `CONFIDENCE_FLOOR = 0.75` (the band\n> CENTRE, `config.py:49`) with `BORDERLINE_HALF_WIDTH = 0.05`, giving\n> `PASS_CUT = 0.80` / `FAIL_CUT = 0.70`. Note BORDERLINE (0.70-0.80) can\n> still auto-map, so a present-day safety argument must cite FAIL_CUT 0.70,\n> not the 0.80 PASS cut. Separately, `backend/scudo/orchestrator.py:41` has\n> its own unrelated `CONFIDENCE_FLOOR = 0.80` (Runtime-A auto-approve publish\n> gate) \u2014 the two constants are independent and are not to be reconciled.\n>\n> Content below is retained as historical context only. Do not edit.\n>\n> ---\n\n| Field | Value |\n|---|---|\n| Status | Draft for review \u2014 v0.2 incorporates critical review (21 findings) |\n| Goal | Replace the Jaro-Winkler dense-arm stand-in with real semantic embeddings (Bedrock Titan v2) backed by FalkorDB's native vector index. Lift the core principles from FalkorDB's GraphRAG-SDK without adopting the SDK itself. |\n| Scope | Code change only. Does **NOT** lift I5, does **NOT** recalibrate the 0.80 floor against real data, does **NOT** register the embedding model with MRGR. Those are downstream consequences with their own gates ([i5-lift-preconditions.md \u00a74.2](/specs/i5-lift-preconditions.md)). |\n| Estimated size | ~200 LoC (up from ~150 \u2014 observability + matcher catch site + shadow-property reindex). 4 PR-sized chunks. |\n| Owner | _[TBC]_ |\n| Version | 0.2 |\n\n## 1. What we're building, in one sentence\n\nTwo primitives wired through the existing seam: **`embed(text) \u2192 vector`** (Bedrock Titan invoke) and **`vector_knn(vec, k) \u2192 ranked nodes`** (FalkorDB `CALL db.idx.vector.queryNodes`). Everything else in `find_similar_products` \u2014 BM25 sidecar, RRF, structural pass, candidate filter \u2014 stays exactly as today.\n\n## 2. Why we're not using the SDK\n\nDecided in the prior conversation. Short form: the SDK is a docs \u2192 KG \u2192 QA pipeline that owns retrieve-plus-generate as one step and imposes structural conventions around your schema. We have the graph already (CDAO), we already do hybrid retrieval, and we need retrieve and gate to be **separate deterministic steps** that the LLM cannot reach (I3/I4/I5/I6). The SDK's value would be ~10% of its surface; the other 90% would fight our trust gradient. The two primitives we *do* need are well-documented FalkorDB + Bedrock APIs and cost ~150 lines.\n\n## 3. In scope / out of scope\n\n### In scope (this plan)\n\n- `embeddings.py` \u2014 Bedrock Titan invoke surface + preprocessing function\n- `matching.py` \u2014 **NEW: try/except at Rung 3 boundary** routing `IndexVersionMismatchError` / `EmbeddingError` to `NEEDS_REVIEW` band=`fail`\n- `store/falkordb_store.py` \u2014 dense arm swap + vector index seed + shadow-property reindex\n- `store/base.py` \u2014 seam additions for embedding model identity\n- `ingest.py` \u2014 embed-on-seed for taxonomy nodes (batched)\n- `config.py` \u2014 embedding model + dimension + version + flag settings\n- `scudo_mapping_mcp/scripts/reindex_taxonomy.py` \u2014 two-phase shadow-property reindex\n- Smoke gates covering the new contract (~15 unit + ~5 matcher-side)\n- Observability \u2014 metrics on embed latency, throttles, fail-closed rate\n- Doc updates \u2014 eight files listing the Jaro-Winkler stand-in:\n  - `matching.py:L202` (module docstring)\n  - `store/base.py:L19, L271-275`\n  - `store/falkordb_store.py:L8-21, L188-199, L224-233`\n  - `docs/diagram-2-falkor-internals.md:L48-61`\n  - `docs/README.md:L8`\n  - `docs/i5-lift-preconditions.md:L78, L84`\n\n### Explicitly out of scope (own follow-ups)\n\n- **Floor + band recalibration against a golden set.** The 0.80 floor and \u00b10.05 bands are calibrated for Jaro-Winkler. Embeddings change the score distribution. This swap MUST be followed by a calibration event before I5 can lift. Tracked under [i5-lift-preconditions.md \u00a74.2](/specs/i5-lift-preconditions.md).\n- **MRGR registration of the embedding model.** Model card, independent validation, drift suite. Tracked under [i5-lift-preconditions.md \u00a74.10](/specs/i5-lift-preconditions.md).\n- **Vendor-product embedding cache.** Every `find_similar_products` call burns one Bedrock invoke. At programme scale this is fine (~fractions of a cent per query) but a per-vendor-product LRU is worth it later. Not blocking.\n- **FakeStore embeddings.** FakeStore stays at `set_score` direct-similarity semantics so existing smoke tests don't change. Real-FalkorDB integration tests are the discipline for the new contract.\n- **I5 lift.** Separate gate, separate document.\n\n## 4. Architecture changes \u2014 what moves where\n\n### 4.1 New module: `embeddings.py` (~55 LoC)\n\nAdds: explicit `preprocess()` (no-op for Titan v2 \u2014 pass raw text), `normalize=True` body, adaptive retry, module-singleton client (avoid per-call boto3.client overhead).\n\n```python\n\"\"\"\nBedrock Titan embedding surface.\n\nSingle seam: embed(text: str) -> list[float]. Used at TWO points:\n  - Taxonomy seed time (one embed per node, persisted on the node)\n  - Query time inside find_similar_products (one embed per vendor product)\n\nVersioning: every embedding written to FalkorDB carries the model_id and\nembedding_dim it was produced under. The reindex script detects drift and\nre-embeds; the store fails-closed on a dimension mismatch at query time.\n\nPREPROCESSING POLICY: Titan v2 handles raw text well. We deliberately do\nNOTHING (no lowercase, no punctuation strip) so the embedded distribution\nmatches Titan's training. The preprocessing function is a documented seam\nso any future change is captured by the version-derivation hash.\n\"\"\"\nfrom __future__ import annotations\n\nimport json\n\nimport boto3\nfrom botocore.config import Config\n\nfrom .config import settings\n\n\nclass EmbeddingError(RuntimeError):\n    \"\"\"Raised on Bedrock failure or dim mismatch. Matcher catches at Rung 3.\"\"\"\n\n\ndef preprocess(text: str) -> str:\n    \"\"\"No-op for Titan v2 \u2014 pass raw text. Source code is hashed into\n    settings.embedding_version so any edit forces a reindex.\"\"\"\n    return text or \"\"\n\n\n# Module-singleton client with adaptive retry + bounded timeout.\n# Per-call boto3.client() carries config-load overhead we don't want\n# in the hot path (every find_similar_products call goes through here).\n_CLIENT = boto3.client(\n    \"bedrock-runtime\",\n    region_name=settings.bedrock_region,\n    config=Config(\n        retries={\"mode\": \"adaptive\", \"max_attempts\": 5},\n        read_timeout=10,\n        connect_timeout=5,\n    ),\n)\n\n\ndef embed(text: str) -> list[float]:\n    \"\"\"Bedrock Titan invoke. Returns the embedding as a list of floats.\n\n    Sets normalize=True in the Titan request body so cosine similarity\n    scores from FalkorDB land in [0, 1] \u2014 see falkordb_store.find_similar_products\n    score-clamp comment for why this matters to the matcher's floor gate.\n\n    Raises EmbeddingError on Bedrock failure (4xx/5xx, throttle exhaustion)\n    or dim mismatch. The matcher catches at Rung 3 and routes the case to\n    NEEDS_REVIEW with band='fail' (see matching.py change in \u00a74.8).\n    \"\"\"\n    body = json.dumps({\n        \"inputText\": preprocess(text),\n        \"normalize\": True,\n        \"dimensions\": settings.embedding_dim,\n    })\n    try:\n        response = _CLIENT.invoke_model(\n            modelId=settings.embedding_model_id,\n            body=body,\n            accept=\"application/json\",\n            contentType=\"application/json\",\n        )\n    except Exception as e:\n        raise EmbeddingError(f\"Bedrock invoke failed: {type(e).__name__}: {e}\") from e\n    payload = json.loads(response[\"body\"].read())\n    vec = payload[\"embedding\"]\n    if len(vec) != settings.embedding_dim:\n        raise EmbeddingError(\n            f\"Titan returned dim={len(vec)}, settings pin dim={settings.embedding_dim}\"\n        )\n    return vec\n```\n\n### 4.2 `config.py` \u2014 pin model + dim + version + flag\n\n```python\n# Settings dataclass additions:\nembedding_model_id: str       # \"amazon.titan-embed-text-v2:0\"\nembedding_model_arn: str      # DERIVED \u2014 \"arn:aws:bedrock:{region}::foundation-model/{model_id}\"\n                              # \u2014 written verbatim so IAM policies can reference it.\nembedding_dim: int            # pinned per model \u2014 1024 for Titan v2\nembedding_version: str        # DERIVED hash. Forces correctness: any change to\n                              # the inputs invalidates the index without an engineer\n                              # remembering to bump.\n                              # Computed at module load as:\n                              #   sha256(\n                              #     model_id +\n                              #     str(dim) +\n                              #     inspect.getsource(embeddings.preprocess)\n                              #   ).hexdigest()[:12]\n                              # \u2014 pulling the preprocess source means an edit to\n                              # the function automatically bumps the version.\nbedrock_region: str           # \"eu-west-2\" for dev/demo\nuse_vector_dense: bool        # SCUDO_USE_VECTOR_DENSE \u2014 feature flag for the\n                              # dense arm. False today (Jaro-Winkler);\n                              # PR 4 flips default to True per-environment.\n```\n\n`from_env()` reads `SCUDO_EMBEDDING_MODEL_ID`, `SCUDO_EMBEDDING_DIM`, `BEDROCK_REGION`, `SCUDO_USE_VECTOR_DENSE`. `embedding_model_arn` and `embedding_version` are derived; never set from env so they can't drift.\n\n### 4.3 `store/falkordb_store.py` \u2014 dense arm swap (~50 LoC)\n\nThis is the load-bearing one. Five things change vs v0.1:\n\n1. **BM25 keeps its full-universe scan** \u2014 the vector kNN does NOT bound the BM25 set. Without this, BM25's whole point (ticker / RIC / ISIN recovery for items embeddings rank low) is silently lost. Vector kNN top-K and BM25 top-K are UNION'd before RRF.\n2. **Score clamp `max(0.0, float(score))`** \u2014 cosine on un-normalised vectors is `[-1, 1]`, and the matcher's floor gate (`matching.py:264, 272, 285, 296, 351`) compares against `0.80` expecting `[0, 1]`. Normalisation in \u00a74.1's Titan body should make this redundant, but the clamp is defense-in-depth at the seam.\n3. **Dynamic over-fetch budget** instead of `*3` constant. Negative precedents and candidate_filter drops compound; rejects concentrate at the top of cosine ranking because reviewers reject what the system surfaced. Constant multiplier breaks for high-volume vendors.\n4. **Whole-query fail on any version mismatch** \u2014 was the v0.1 design; reaffirmed. Per-node skip was the wrong gate name in v0.1 \u00a76.1.\n5. **`if not settings.use_vector_dense: ... return jaro_winkler_path(...)`** branch at the top \u2014 feature flag honoured.\n\n```python\ndef find_similar_products(self, ref, max_results=10, min_similarity=0.0,\n                          *, candidate_filter=None):\n    if not settings.use_vector_dense:\n        return self._jaro_winkler_path(ref, max_results, min_similarity,\n                                       candidate_filter=candidate_filter)\n\n    rejected = set(self.get_negative_precedents(ref.vendor, ref.product_id))\n    query_text = f\"{ref.name} {ref.description}\".strip() or ref.product_id\n\n    # Dynamic budget: clamp_results + len(rejected) + candidate_filter headroom.\n    # Static *3 breaks for vendors with many rejects (a single high-mapped vendor\n    # may have 25+ reviewer-rejected nodes, concentrated at the top of cosine\n    # ranking \u2014 by construction, since rejects are nodes the system surfaced).\n    cf_headroom = 5 if candidate_filter is not None else 0\n    k_vec = self.clamp_results(max_results) + len(rejected) + cf_headroom\n\n    query_vec = embed(query_text)  # raises EmbeddingError; matcher catches\n\n    # Vector kNN \u2014 bounded set\n    hits = self._ro(\n        \"CALL db.idx.vector.queryNodes('TaxonomyNode', 'embedding', $k, $vec) \"\n        \"YIELD node, score \"\n        \"RETURN node.iri, node.label, node.parent_iri, \"\n        \"       node.embedding_version, score\",\n        {\"k\": k_vec, \"vec\": query_vec},\n    )\n\n    # Full-universe scan for BM25 \u2014 preserves recall of ticker / RIC / ISIN\n    # matches that embeddings rank low. Without this, BM25 only sees the\n    # cosine top-K and the lexical-recovery promise is silently broken.\n    universe = self._ro(\n        \"MATCH (t:TaxonomyNode) RETURN t.iri, t.label, t.parent_iri\"\n    )\n\n    labels: dict[str, str] = {}\n    parents: dict[str, Optional[str]] = {}\n    dense_scores: dict[str, float] = {}\n\n    # Build labels from the FULL universe so BM25 has the universe to score.\n    for iri, label, parent in universe:\n        if iri in rejected:\n            continue\n        labels[iri] = label or \"\"\n        parents[iri] = parent or None\n\n    # Score dense arm from the vector hits ONLY \u2014 and check version coherence.\n    version_mismatches: list[str] = []\n    for iri, label, parent, embedding_version, score in hits:\n        if iri in rejected:\n            continue\n        if embedding_version != settings.embedding_version:\n            version_mismatches.append(iri)\n            continue\n        if iri not in labels:\n            # Shouldn't happen \u2014 vector hit but absent from universe scan \u2014\n            # but be defensive.\n            labels[iri] = label or \"\"\n            parents[iri] = parent or None\n        # Defense-in-depth: clamp negative cosine to 0. Titan's normalize=True\n        # should make this unreachable, but matching.py's 0.80 floor gate\n        # cannot tolerate negative values.\n        dense_scores[iri] = max(0.0, float(score))\n\n    # Whole-query fail on ANY version mismatch \u2014 mixing score distributions\n    # from two embedding models is the I5-style \"never auto-promote on a\n    # corrupted dense arm\" violation.\n    if version_mismatches:\n        raise IndexVersionMismatchError(\n            f\"{len(version_mismatches)} nodes on stale embedding_version \"\n            f\"(current={settings.embedding_version}); \"\n            f\"run scudo_mapping_mcp.scripts.reindex_taxonomy\"\n        )\n\n    # BM25 + RRF + structural pass continues as today (universe-scoped BM25).\n    # ... [unchanged from current implementation, only the dense arm changed]\n```\n\n`_jaro_winkler` and `_jaro_winkler_path(...)` (a refactor of today's full method body) are kept \u2014 the flag-False path lives here. Don't delete.\n\n### 4.4 `store/falkordb_store.py` \u2014 seed the vector index (~15 LoC)\n\nNew method, called once at install time:\n\n```python\ndef seed_vector_index(self) -> None:\n    \"\"\"Idempotent. Creates the HNSW vector index on TaxonomyNode.embedding\n    if it doesn't exist. Safe to call on every container start.\"\"\"\n    self._g.query(\n        \"CALL db.idx.vector.createNodeIndex(\"\n        \"  'TaxonomyNode', 'embedding', $dim, 'cosine'\"\n        \")\",\n        {\"dim\": settings.embedding_dim},\n    )\n```\n\n**Batching at seed time.** `upsert_taxonomy_node` is called per node by `ingest.seed_taxonomy`. With K taxonomy nodes that's K sequential Bedrock invocations \u2014 minutes on a large CDAO. `ingest.py` (\u00a74.5) must batch the embed calls with bounded concurrency (recommend a `concurrent.futures.ThreadPoolExecutor` with max_workers=8) and call the store only with `(node, vec)` tuples already in hand. Spec'd here as a constraint on \u00a74.5, not inside `upsert_taxonomy_node`, so per-node upserts from the reviewer path stay simple and don't pay the threadpool overhead.\n\n`upsert_taxonomy_node` writes the embedding alongside label/parent:\n\n```python\ndef upsert_taxonomy_node(self, node: TaxonomyNode) -> None:\n    vec = embed(f\"{node.label}\")    # M5+: include description if present\n    self._g.query(\n        \"MERGE (t:TaxonomyNode {iri:$iri}) \"\n        \"SET t.label=$label, t.parent_iri=$parent, \"\n        \"    t.embedding=$vec, \"\n        \"    t.embedding_model=$model, \"\n        \"    t.embedding_version=$ver\",\n        {\n            \"iri\": node.iri, \"label\": node.label,\n            \"parent\": node.parent_iri or \"\",\n            \"vec\": vec,\n            \"model\": settings.embedding_model_id,\n            \"ver\": settings.embedding_version,\n        },\n    )\n    if node.parent_iri:\n        self._g.query(\n            \"MATCH (p:TaxonomyNode {iri:$p}),(c:TaxonomyNode {iri:$c}) \"\n            \"MERGE (p)-[:HAS_CHILD]->(c)\",\n            {\"p\": node.parent_iri, \"c\": node.iri},\n        )\n```\n\n### 4.5 `ingest.py` \u2014 call `seed_vector_index` and BATCH the embeds\n\nTwo changes:\n\n1. Call `store.seed_vector_index()` once at the top.\n2. Compute embeddings via a bounded thread pool (max_workers=8) before calling `upsert_taxonomy_node`, so K sequential Bedrock invokes become roughly K/8 batches. Per-node upsert from non-seed paths (reviewer queue, future single-node additions) continues to embed inline because the cost there is one invocation, not K.\n\n```python\nfrom concurrent.futures import ThreadPoolExecutor\n\ndef seed_taxonomy() -> int:\n    store = get_store()\n    store.seed_vector_index()\n    nodes = load_cdao_taxonomy_nodes()\n    with ThreadPoolExecutor(max_workers=8) as pool:\n        vectors = list(pool.map(lambda n: embed(n.label), nodes))\n    for node, vec in zip(nodes, vectors):\n        store.upsert_taxonomy_node_with_embedding(node, vec)\n    return len(nodes)\n```\n\nNote the new seam method `upsert_taxonomy_node_with_embedding(node, vec)` that skips the inline embed \u2014 used only by the batched seed path. The existing `upsert_taxonomy_node` (no vec arg) embeds inline for non-batch callers.\n\n### 4.6 `scudo_mapping_mcp/scripts/reindex_taxonomy.py` \u2014 ~30 LoC\n\nLocation: new directory `scudo_mapping_mcp/scripts/` (does not exist today). Add `__init__.py`. Lives inside the package so imports work via `python -m scudo_mapping_mcp.scripts.reindex_taxonomy`.\n\nStand-alone script. Workflow:\n\n1. Read `embedding_version` and `embedding_model_id` from `settings`.\n2. Query all `TaxonomyNode` whose stored `embedding_version` differs from settings.\n3. For each such node: re-embed via `embed(label)`, write back via `upsert_taxonomy_node`.\n4. Print a summary: scanned / re-embedded / failed.\n\nRun on:\n- After any change to `SCUDO_EMBEDDING_VERSION`\n- After any change to `SCUDO_EMBEDDING_MODEL_ID`\n- After a taxonomy version bump\n- On container start if `SCUDO_REINDEX_ON_BOOT=1`\n\nIdempotent: nodes already at the current `embedding_version` are skipped.\n\n### 4.7 `store/base.py` \u2014 declare seam additions\n\n`RetrievalStore` ABC gains `seed_vector_index(self) -> None`. `FakeStore` implements as no-op (it never had a vector index). `NeptuneStore` raises `NotImplementedError` for now (Neptune side is stubbed; called out in plan \u00a77).\n\n## 5. PR-sized sequencing\n\nEach is independently testable and reversible.\n\n### PR 1 \u2014 config + embeddings module (no behaviour change)\n\n- `config.py` settings additions\n- `embeddings.py` new module\n- New smoke gates:\n  - EMBED_returns_dim_matches_settings_pin\n  - EMBED_raises_on_dim_mismatch\n  - EMBED_round_trips_same_text_to_same_vector_deterministically (mock Bedrock)\n\nNo store code changes, no behaviour change in the matcher.\n\n### PR 2 \u2014 falkordb_store vector seam (behind a flag)\n\n- `seed_vector_index` method\n- `upsert_taxonomy_node` writes embeddings\n- `find_similar_products` checks `settings.use_vector_dense` flag:\n  - True \u2192 use vector k-NN\n  - False \u2192 use Jaro-Winkler (today's path)\n- Default flag: **False**. Lands code without changing default behaviour.\n- New smoke gates:\n  - VECTOR_index_is_idempotent_on_repeat_seed\n  - VECTOR_upsert_writes_embedding_property_and_version\n  - VECTOR_query_returns_hits_with_score_matching_cosine\n  - VECTOR_version_mismatched_node_is_skipped (fail-closed)\n  - VECTOR_overfetch_3x_compensates_for_post_filter_drops\n\n### PR 3 \u2014 reindex script + boot policy\n\n- `scripts/reindex_taxonomy.py`\n- Document `SCUDO_REINDEX_ON_BOOT` env var\n- Smoke gate:\n  - REINDEX_skips_nodes_at_current_version (idempotency)\n  - REINDEX_rewrites_nodes_at_drift_version\n  - REINDEX_summary_reports_scanned_reindexed_failed_counts\n\n### PR 4 \u2014 flip the flag\n\n- `settings.use_vector_dense = True` as default\n- Deploy to sandbox dev; sanity check on live FalkorDB\n- Sets up the \u00a74.2 recalibration event\n\n## 6. Test strategy\n\n### 6.1 Unit gates (no Bedrock calls)\n\n- `embeddings.embed` mocked with a deterministic hash-based fake (text \u2192 fixed-dim vector via stable hash). **The hash-fake has no semantic relationship to similarity**: it can prove plumbing (dimension, round-trip, version-handling, fail-closed semantics) but CANNOT prove \"similar text \u2192 similar vector\". Anything testing the actual semantic property MUST be an integration test against real Titan (\u00a76.2).\n- FakeStore stays at `set_score` semantics \u2014 existing 86 smoke gates do not change.\n- New gates total: ~10. Land in `tests/smoke.py` under `# DENSE ARM SWAP` block.\n\n### 6.2 Integration gates (real Bedrock + real FalkorDB \u2014 NEW for SCUDO)\n\nThis is the gap [i5-lift-preconditions.md \u00a74.4](/specs/i5-lift-preconditions.md) calls out. Adds:\n\n- `tests/integration/test_dense_arm.py` (new dir): seed a small taxonomy, embed a query via real Titan, hit real FalkorDB, assert non-zero similarity scores; smoke that the same query returns the same node twice (cosine determinism).\n- Gated by `SCUDO_INTEGRATION=1` so it doesn't run in normal CI but is callable in the sandbox.\n\n### 6.3 Calibration sanity (separate)\n\nNot part of this PR \u2014 but the script that runs after the swap:\n\n- Pull N labelled mappings from the reviewer queue / precedent set.\n- For each, run the **old** matcher and the **new** matcher.\n- Report distribution of `(old_similarity, new_similarity)` and the rank-correlation between them.\n- This is the prerequisite to recalibrating the floor.\n\n## 7. Risk surface\n\n| Risk | Mitigation | Residual |\n|---|---|---|\n| Embedding model API change (Titan v2 \u2192 v3) | `embedding_version` bump triggers reindex | None at protocol layer; recalibration burden remains |\n| Dimension mismatch silently corrupts the index | Embed function raises on dim mismatch; store query filters version-mismatched hits | None |\n| Bedrock outage during seed | Seed is idempotent; reindex script can be re-run | None |\n| Bedrock outage during query | `find_similar_products` raises `EmbeddingError` \u2014 caller (matcher) routes the case to the reviewer queue, **never** auto-persists. I5 already provides this safety net | None for dev; for I5-lifted future, Path A's verifier fail-closed (\u00a74.12 of I5 doc) covers it |\n| Per-query Bedrock cost at scale | Vendor-product LRU (deferred follow-up) | Cost line until cache lands; quantify at scale-out |\n| Calibration drift \u2014 the 0.80 floor is now wrong | Calibration is the explicit follow-up; PR 4 flag-flip is the trigger event | Until \u00a74.2 closes, do not move toward I5 lift |\n| FalkorDB vector index unavailability (older version) | Pinned FalkorDB image version in `ingestion/infra/scudo-dev-foundation.yaml` already supports `db.idx.vector.*` | None |\n| Bands tuned for Jaro-Winkler are wrong for cosine \u2014 the borderline window is too wide or too narrow against the new score distribution | Calibration follow-up (\u00a74.2 of I5 doc). Until then, the band may route fewer (or more) cases to the specialist than it should \u2014 wasting cost or missing reviews | Live until calibration closes |\n| VendorProduct nodes in the graph carry no embeddings \u2014 re-querying same product re-invokes Bedrock | Per-query cache (deferred follow-up). Plan \u00a710 q5 raises it | Cost line only |\n| Empty taxonomy \u2192 seed_vector_index errors | Idempotent CREATE INDEX is safe on empty graph; embed-on-upsert is per-node so empty seed is a no-op | None |\n| Neptune backend (stubbed today) doesn't gain this | `NeptuneStore.seed_vector_index` raises `NotImplementedError`; the matcher route never reaches Neptune in dev | Persists as a known gap; tracked separately |\n\n## 8. Deploy plan\n\n1. Land PR 1 + PR 2 + PR 3. Default flag stays False.\n2. In sandbox, set `SCUDO_USE_VECTOR_DENSE=true` on the Match&Verify task def via a one-off update.\n3. Run `scripts/reindex_taxonomy.py` once against the live FalkorDB.\n4. Run the integration test against live Bedrock + FalkorDB.\n5. Run the calibration sanity script \u2014 emit the old-vs-new similarity distribution to S3.\n6. If distribution looks sane (rank correlation > 0.5 on labelled samples, no catastrophic re-rankings), land PR 4 (flip default).\n7. **Do not progress toward I5 lift until [i5-lift-preconditions.md \u00a74.2](/specs/i5-lift-preconditions.md) is closed.**\n\nRollback at any step is one env var flip back to `false` + redeploy.\n\n## 9. What this triggers downstream\n\n- **Calibration event ([i5-lift-preconditions.md \u00a74.2](/specs/i5-lift-preconditions.md)).** Floor + band widths must be re-derived against a golden set. This is the most expensive downstream consequence and the one that gates I5 lift.\n- **MRGR registration ([\u00a74.10](/specs/i5-lift-preconditions.md)).** Bedrock Titan v2 becomes a registered model in the inventory. Model card, independent validation, drift suite, vendor-version pin.\n- **Cost line.** Per-query Bedrock invoke. Titan v2 is $0.00002 / 1000 input tokens; a ~30-token vendor description costs ~$6\u00d710\u207b\u2077 per query. At 1000 queries/day \u2192 ~$0.60/year. The cost is not material at any reasonable SCUDO volume; flagging only so it appears on the cost dashboard alongside the specialist LLM line and doesn't surprise anyone at audit.\n- **Falkor / Neptune parity gap.** Neptune side stays stubbed; if the Neptune cutover happens before this, the swap has to land there separately. Capture in the Neptune store followup.\n\n## 10. Open questions for review\n\n1. Embed at seed time on `label` only, or `label + description` (when present)? Latter is more discriminating but the CDAO seed has sparse descriptions today.\n2. Cosine similarity is the obvious default \u2014 but should we try euclidean / dot-product? Titan is trained for cosine; pinning is correct, but worth flagging that we don't experiment-test.\n3. Over-fetch multiplier (3x) is a guess. Worth a smoke gate or live measurement.\n4. `SCUDO_REINDEX_ON_BOOT=1` is convenient but lengthens cold-start. Default off, on for sandbox / smoke.\n5. Should the embedding go on the **VendorProduct** node too, at upsert time? Today vendor products live in the graph (for rank-signal derivation), but their embedding isn't used because we re-embed at query time. Caching it on the node would let a re-query skip Bedrock \u2014 at the cost of a stale-on-vendor-update problem.\n6. Tokeniser / preprocessing policy. Titan handles raw text fine; do we lowercase / strip punctuation before embedding? The BM25 tokeniser already does; consistency matters here.\n7. Should the embedding's `embedding_version` be derived from a hash of `(model_id, dim, preprocessing_policy)` instead of a manual tag? Less foot-gun, more correct.\n\n## 11. Document control\n\n- v0.1 \u2014 initial draft for review.", "plans/matching-dashboard": "# SCUDO Matching Dashboard + Data Correctness Implementation Plan\n\n> **Status (2026-06-24):** **Implemented** via subagent-driven development. Tasks 0\u20136 complete; Task 7 awaiting **owner sign-off** before AWS deploy. Changes are **uncommitted** in both MatchMaker and understand-anything dashboard repos.\n\n> **For agentic workers:** REQUIRED SUB-SKILL: Use superpowers:subagent-driven-development (recommended) or superpowers:executing-plans to implement this plan task-by-task. Steps use checkbox (`- [ ]`) syntax for tracking.\n\n**Goal:** Make the SCUDO matching UI on the understand-anything dashboard (`:5177`) honest, coherent, and expositional \u2014 then wire the backend graph builder and API as source of truth.\n\n**Architecture:** Ship `packages/dashboard` (React 19 + `@xyflow/react`), NOT `MatchMaker/frontend/`. `build_matching_graph.py` emits **KnowledgeGraph** JSON (dashboard contract) from fixed `cdao_catalogue.json`. A sync script copies the artifact to the dashboard `public/` folder. Matching mode hides code-comprehension chrome. `GET /api/mapping/graph` returns MatchPayload for API clients; static demo uses the KnowledgeGraph file.\n\n**Tech Stack:** Python 3.12 / Flask, understand-anything dashboard (React 19, Vite 6, Tailwind 4, zustand), pytest.\n\n**Spec:** `docs/superpowers/specs/2026-06-24-scudo-matching-frontend-spec.md` (binding \u2014 especially D-1 dashboard target).\n\n**Hard gate:
