<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OKF Bundle Viewer</title>

<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  font-size: 14px;
  color: #0f172a;
  background: #f8fafc;
  display: flex;
  flex-direction: column;
  height: 100vh;
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  background: #fff;
  border-bottom: 1px solid #e2e8f0;
  flex-shrink: 0;
}
.title strong { font-size: 16px; margin-right: 8px; }
.muted { color: #64748b; font-size: 12px; }
.controls { display: flex; gap: 8px; }
.controls input, .controls select, .controls button {
  font-size: 13px;
  padding: 5px 8px;
  border: 1px solid #cbd5e1;
  border-radius: 4px;
  background: #fff;
}
.controls input { width: 220px; }
.controls button { cursor: pointer; background: #f1f5f9; }
.controls button:hover { background: #e2e8f0; }

main {
  display: flex;
  flex: 1;
  min-height: 0;
}
#graph {
  flex: 1 1 60%;
  background: #fff;
  border-right: 1px solid #e2e8f0;
  min-width: 0;
  position: relative;
}
#detail {
  flex: 0 0 40%;
  overflow-y: auto;
  padding: 18px 22px;
  background: #fff;
}
#detail-empty {
  text-align: center;
  margin-top: 40px;
}

.detail-header { margin-bottom: 12px; }
.detail-header h1 {
  font-size: 18px;
  margin: 4px 0 2px;
  font-weight: 600;
}
.type-chip {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
  color: #fff;
  background: #94a3b8;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
dl.frontmatter {
  display: grid;
  grid-template-columns: 90px 1fr;
  row-gap: 4px;
  column-gap: 12px;
  margin: 8px 0 12px;
  font-size: 13px;
}
dl.frontmatter dt {
  color: #64748b;
  font-weight: 500;
}
dl.frontmatter dd { margin: 0; }
dl.frontmatter a { color: #2563eb; word-break: break-all; }

.tag {
  display: inline-block;
  padding: 1px 6px;
  margin: 0 4px 2px 0;
  border-radius: 4px;
  background: #f1f5f9;
  color: #475569;
  font-size: 11px;
}

hr { border: none; border-top: 1px solid #e2e8f0; margin: 14px 0; }

#detail-body { font-size: 13px; line-height: 1.55; }
#detail-body h1 {
  font-size: 16px; margin: 18px 0 6px;
  padding-bottom: 4px; border-bottom: 1px solid #e2e8f0;
}
#detail-body h2 { font-size: 14px; margin: 14px 0 4px; }
#detail-body h3 { font-size: 13px; margin: 12px 0 4px; }
#detail-body p { margin: 6px 0; }
#detail-body code {
  background: #f1f5f9;
  padding: 1px 4px;
  border-radius: 3px;
  font-size: 12px;
  font-family: ui-monospace, "SF Mono", Consolas, monospace;
}
#detail-body pre {
  background: #0f172a;
  color: #e2e8f0;
  padding: 10px 12px;
  border-radius: 6px;
  overflow-x: auto;
  font-size: 12px;
}
#detail-body pre code { background: transparent; color: inherit; padding: 0; }
#detail-body ul, #detail-body ol { padding-left: 22px; margin: 6px 0; }
#detail-body li { margin: 2px 0; }
#detail-body table { border-collapse: collapse; margin: 8px 0; }
#detail-body th, #detail-body td {
  border: 1px solid #e2e8f0; padding: 4px 8px; font-size: 12px;
}
#detail-body a.internal { color: #2563eb; cursor: pointer; }
#detail-body a.external { color: #2563eb; }

#detail-backlinks { margin-top: 18px; }
#detail-backlinks h2 { font-size: 13px; color: #64748b; margin-bottom: 6px; }
#detail-backlinks ul { padding-left: 18px; }
#detail-backlinks a { color: #2563eb; cursor: pointer; }

</style>
</head>
<body>
<header>
  <div class="title">
    <strong id="bundle-name"></strong>
    <span class="muted">OKF bundle</span>
  </div>
  <div class="controls">
    <input id="search" type="search" placeholder="Search title / id / tag">
    <select id="filter-type">
      <option value="">All types</option>
    </select>
    <select id="layout">
      <option value="cose">cose (force)</option>
      <option value="concentric">concentric</option>
      <option value="breadthfirst">breadth-first</option>
      <option value="circle">circle</option>
      <option value="grid">grid</option>
    </select>
    <button id="reset">Reset view</button>
  </div>
</header>

<main>
  <section id="graph"></section>
  <section id="detail">
    <div id="detail-empty" class="muted">Click a node to see its details.</div>
    <article id="detail-content" hidden>
      <header class="detail-header">
        <span class="type-chip" id="detail-type"></span>
        <h1 id="detail-title"></h1>
        <div class="muted" id="detail-id"></div>
      </header>
      <dl class="frontmatter">
        <dt>Description</dt><dd id="detail-description"></dd>
        <dt>Resource</dt><dd id="detail-resource"></dd>
        <dt>Tags</dt><dd id="detail-tags"></dd>
      </dl>
      <hr>
      <div id="detail-body"></div>
      <section id="detail-backlinks" hidden>
        <h2>Cited by</h2>
        <ul id="backlinks-list"></ul>
      </section>
    </article>
  </section>
</main>

ect__deployment/deploy-runbook-scudo-poc", "source": "specs/auth-gate-strip-inject", "target": "deployment/deploy-runbook-scudo-poc"}}, {"data": {"id": "specs/i5-lift-preconditions__reference/matching-data-provenance", "source": "specs/i5-lift-preconditions", "target": "reference/matching-data-provenance"}}, {"data": {"id": "specs/i5-lift-preconditions__handovers/hitl-bands-2026-06-26", "source": "specs/i5-lift-preconditions", "target": "handovers/hitl-bands-2026-06-26"}}, {"data": {"id": "specs/ingestion-framework__architecture/diagrams-and-sources", "source": "specs/ingestion-framework", "target": "architecture/diagrams-and-sources"}}, {"data": {"id": "specs/ingestion-framework__reference/matching-data-provenance", "source": "specs/ingestion-framework", "target": "reference/matching-data-provenance"}}, {"data": {"id": "specs/matching-frontend__reference/agents", "source": "specs/matching-frontend", "target": "reference/agents"}}, {"data": {"id": "specs/matching-frontend__reference/matching-data-provenance", "source": "specs/matching-frontend", "target": "reference/matching-data-provenance"}}], "bodies": {"architecture/arb-review-pack": "# SCUDO Architecture \u2014 ARB Review Pack\n\n## 1. Decision being tabled\n\nThe programme is adopting **FalkorDB GraphRAG-SDK** as the dense + lexical + cypher + relationship-expansion retrieval surface for the Match&Verify MCP, replacing the in-house Jaro-Winkler / pure-Python BM25 / RRF stand-in shipped today. The three-MCP trust gradient (Ingestion read-only, Match&Verify matcher + signer, Persistence sole-writer + I5 gate) and the I5 invariant (no autonomous canonical write without human) are **unchanged** by this decision. The architecture is captured in three Mermaid diagrams (`scudo-overview`, `scudo-match-verify`, `scudo-retrieval`) now sitting at `scudo_mapping_mcp/docs/architecture/` and tabled here as the source-of-truth, superseding the prior `diagram-1-main-flow.md` / `diagram-2-falkor-internals.md` and the `dense-arm-swap.md` v0.2 build-it-ourselves plan.\n\n## 2. What was landed in this workflow\n\nFiles written / edited in this session:\n\n- `scudo_mapping_mcp/docs/architecture/scudo-overview.mmd` (+ `.txt`) \u2014 system-level diagram: Gateway \u2192 Agent \u2192 MCP host \u2192 three MCPs \u2192 stores + observability, trust gradient classification preserved.\n- `scudo_mapping_mcp/docs/architecture/scudo-match-verify.mmd` (+ `.txt`) \u2014 internals of the matching engine: scope \u2192 precedent \u2192 match \u2192 validations \u2192 three-band gate \u2192 specialist \u2192 seal \u2192 Persistence.\n- `scudo_mapping_mcp/docs/architecture/scudo-retrieval.mmd` (+ `.txt`) \u2014 internals of the retrieval surface: GraphRAG-SDK multi-path (vector / fulltext / cypher / rel-expansion) \u2192 cosine rerank \u2192 precedent boost \u2192 negative-precedent drop \u2192 distance check (deferred) \u2192 survivors.\n- `scudo_mapping_mcp/docs/architecture/README.md` \u2014 index, intended audience, supersession notice.\n- `scudo_mapping_mcp/docs/diagram-1-main-flow.md` \u2014 banner: **SUPERSEDED**, forward pointer to `architecture/scudo-overview.mmd`.\n- `scudo_mapping_mcp/docs/diagram-2-falkor-internals.md` \u2014 banner: **SUPERSEDED**, forward pointer to `architecture/scudo-match-verify.mmd` and `architecture/scudo-retrieval.mmd`.\n- `scudo_mapping_mcp/docs/dense-arm-swap.md` \u2014 banner: **SUPERSEDED-PENDING-REPLAN**, forward pointer to forthcoming `dense-arm-sdk-adoption.md`; the v0.2 critical-review findings are carried forward in \u00a78 below.\n\n## 3. The three diagrams\n\n### 3.1 Overview (`scudo-overview.mmd`)\n\nLoad-bearing: the **MCPS** subgraph classification (write-isolated) encodes the trust gradient; the **AGENT \u2192 HOST \u2192 {ING, MV, PER}** fan-out shows the agent orchestrating through a single MCP host (pool, breaker, semaphore); the dotted **MV -.->|borderline specialist| AGENT** edge is the only LLM-into-matcher hop.\n\n```mermaid\nflowchart TD\n    GW[\"Gateway: NGINX + FastAPI<br/>auth, rate-limit, identity\"]\n    UI[\"Scudo Reviewer UI<br/>human: approve / reject\"]\n    IN[\"Catalogue + CDAO taxonomy<br/>per-vendor adapters, one MCP per vendor\"]\n\n    AGENT[\"Strands agent, Claude Opus 4.8 on Bedrock<br/>the LLM the user engages<br/>orchestrates under deterministic guards<br/>also the borderline specialist\"]\n    HOST[\"MCP host, transport<br/>pool, circuit breaker, semaphore\"]\n\n    subgraph MCPS[\"MCP servers (by responsibility, write-isolated)\"]\n        ING[\"Ingestion MCP<br/>read-only: scope, frame read\"]\n        MV[\"Match and Verify MCP<br/>the matching engine: matcher, seal\"]\n        PER[\"Persistence MCP<br/>sole writer: verify seal, I5 gate, queue\"]\n    end\n\n    subgraph STORES[\"Stores and runtime (AWS Atlas)\"]\n        S3[\"S3<br/>vendor frames\"]\n        FALKOR[\"FalkorDB working graph<br/>GraphRAG-SDK retrieval, sparse<br/>non-authoritative, rebuildable\"]\n        NEP[\"Neptune<br/>canonical RDF, sole-write\"]\n        QUEUE[\"Reviewer queue, DynamoDB\"]\n        SSM[\"SSM / Secrets Manager<br/>HMAC key, verify\"]\n        IFU[\"iFusion<br/>publish via SPI V2\"]\n    end\n\n    subgraph OBS[\"Observability and audit\"]\n        XR[\"AWS X-Ray<br/>agent traces, Strands OTEL\"]\n        CW[\"CloudWatch<br/>metrics, logs\"]\n        BL[\"Bedrock invocation logs\"]\n        TA[\"Trajectory archive, S3<br/>sealed verdict, steps\"]\n    end\n\n    GW -->|engages| AGENT\n    AGENT -->|triggers tools| HOST\n    HOST --> ING\n    HOST --> MV\n    HOST --> PER\n    ING -->|frames| MV\n    MV -->|sealed verdict| PER\n    MV -.->|borderline specialist| AGENT\n    ING --> S3\n    MV --> FALKOR\n    PER --> NEP\n    PER --> QUEUE\n    PER --> SSM\n    NEP -->|publish| IFU\n    NEP -.->|precedent| FALKOR\n    PER -.->|needs-review| UI\n    IN -.->|catalogue| S3\n    AGENT -.->|telemetry| XR\n\n    classDef agent fill:#e9defb,stroke:#6b46c1,color:#3b2566;\n    classDef det fill:#d8f0ee,stroke:#2c8c84,color:#16433f;\n    classDef store fill:#ece8e0,stroke:#7d7464,color:#3d362a;\n    classDef good fill:#e0f0d5,stroke:#5a8f3a,color:#274a14;\n    class AGENT agent\n    class ING,MV,PER det\n    class S3,FALKOR,NEP,QUEUE,SSM,HOST,XR,CW,BL,TA store\n    class IFU,GW,UI,IN good\n```\n\n### 3.2 Match & Verify (`scudo-match-verify.mmd`)\n\nLoad-bearing: the **three-band gate** (floor 0.75 \u00b1 0.05 \u2014 PASS at sim 0.80 and up, FAIL below 0.70) decides PASS / BORDERLINE / FAIL; the **specialist** runs **only** on BORDERLINE and produces `confidence = min(dense, specialist)`; the **HMAC seal v=2** carries `band` and is signed in M&V only \u2014 Persistence is the sole verifier.\n\n```mermaid\nflowchart TD\n    VP[\"Vendor product<br/>normalised frame, from Ingestion\"]\n    SCOPE{{\"Scope gate<br/>in scope?\"}}\n    OOS[\"Out of scope, exit\"]\n    PREC{{\"Precedent check<br/>confirmed MAPPED_TO?\"}}\n    REUSE[\"Reuse mapping, short-circuit\"]\n    MATCH[\"Falkor match and check<br/>GraphRAG-SDK multi-path, sparse structural<br/>similarity is the raw dense score\"]\n    VAL[\"Validations, M5 deterministic<br/>required: scope_compatible, identifier_resolves, data_class_match<br/>warn: name and description length\"]\n    GATE{{\"Three-band gate<br/>floor 0.75, half-width 0.05<br/>PASS at sim 0.80 and up, FAIL below 0.70<br/>or required-fail\"}}\n    AUTO[\"AUTO_MAPPED<br/>PASS, no specialist\"]\n    SPEC[\"LLM specialist, borderline only, the agent<br/>anchored to top candidate<br/>confidence is min of dense and specialist\"]\n    REVIEW[\"NEEDS_REVIEW<br/>FAIL or required-fail\"]\n    SEAL[\"HMAC seal, v=2<br/>carries band, signed here only, key from SSM\"]\n    PERS[\"to Persistence MCP<br/>I5 gate decides persist-or-queue\"]\n\n    VP --> SCOPE\n    SCOPE -->|in scope| PREC\n    SCOPE -->|out of scope| OOS\n    PREC -->|new| MATCH\n    PREC -->|confirmed| REUSE\n    MATCH --> VAL\n    VAL --> GATE\n    GATE -->|PASS| AUTO\n    GATE -->|BORDERLINE| SPEC\n    GATE -->|FAIL| REVIEW\n    SPEC -->|concur| AUTO\n    SPEC -->|disagree| REVIEW\n    AUTO --> SEAL\n    REVIEW --> SEAL\n    SEAL --> PERS\n\n    classDef gate fill:#fdf0d5,stroke:#b8860b,color:#5c4209;\n    classDef det fill:#d8f0ee,stroke:#2c8c84,color:#16433f;\n    classDef llm fill:#e9defb,stroke:#6b46c1,color:#3b2566;\n    classDef good fill:#e0f0d5,stroke:#5a8f3a,color:#274a14;\n    classDef warn fill:#fdf0d5,stroke:#b8860b,color:#5c4209;\n    classDef store fill:#ece8e0,stroke:#7d7464,color:#3d362a;\n    class SCOPE,PREC,GATE gate\n    class MATCH,VAL det\n    class SPEC llm\n    class AUTO,REUSE good\n    class REVIEW,OOS warn\n    class SEAL,PERS,VP store\n```\n\n### 3.3 Retrieval (`scudo-retrieval.mmd`)\n\nLoad-bearing: the **PATHS** subgraph is the SDK multi-path surface (vector / fulltext / cypher / rel-expansion); the **BOOST \u2192 DROP** pair is the SCUDO-specific structural pass (precedent boost \u2264 +0.10 on rank only, never on similarity; negative-precedent drop) implemented as swappable SDK strategies; distance check is **deferred**.\n\n```mermaid\nflowchart TD\n    Q[\"Vendor product<br/>name, id, description\"]\n    subgraph PATHS[\"GraphRAG-SDK multi-path (over the working graph)\"]\n        VEC[\"vector, dense<br/>Titan embeddings, Bedrock via LiteLLM\"]\n        FT[\"fulltext, lexical<br/>RediSearch\"]\n        CY[\"cypher<br/>structured graph query\"]\n        REL[\"relationship expansion<br/>traverse from seed nodes\"]\n    end\n    RR[\"cosine rerank<br/>ranked candidates, SDK default, swappable\"]\n    BOOST[\"plus precedent boost<br/>rank-signal tilt up to 0.10, recomputed from edges\"]\n    DROP[\"minus negative-precedent drop<br/>rejected mappings removed\"]\n    DIST[\"distance check, SciPy sparse<br/>deferred: needs anchor data\"]\n    SURV[\"Surviving candidates<br/>top candidate and similarity, to the gate\"]\n    NONE[\"No survivors, to review\"]\n\n    Q --> VEC\n    Q --> FT\n    Q --> CY\n    Q --> REL\n    VEC --> RR\n    FT --> RR\n    CY --> RR\n    REL --> RR\n    RR --> BOOST\n    BOOST --> DROP\n    DROP --> SURV\n    DROP --> NONE\n    DROP -.->|deferred| DIST\n\n    classDef det fill:#d8f0ee,stroke:#2c8c84,color:#16433f;\n    classDef dense fill:#dbe9fb,stroke:#3b6fb0,color:#1d3a5f;\n    classDef fuse fill:#fbe4e0,stroke:#c0563a,color:#5a1f12;\n    classDef store fill:#ece8e0,stroke:#7d7464,color:#3d362a;\n    classDef good fill:#e0f0d5,stroke:#5a8f3a,color:#274a14;\n    classDef warn fill:#fdf0d5,stroke:#b8860b,color:#5c4209;\n    classDef deferred fill:#ffffff,stroke:#7d7464,color:#7d7464,stroke-dasharray:4 3;\n    class VEC dense\n    class FT,CY,REL det\n    class RR fuse\n    class BOOST,DROP store\n    class DIST deferred\n    class SURV good\n    class NONE warn\n    class Q store\n```\n\n## 4. What changed from the prior architecture\n\nConcrete deltas against `diagram-1-main-flow.md` / `diagram-2-falkor-internals.md`:\n\n- **Agent moved to the top of the orchestration.** Previously the agent was only invoked by Match&Verify on the BORDERLINE path. Now the agent is the entry point the user engages via the Gateway, and orchestrates all three MCPs through deterministic guards. The agent retains its second role as the borderline specialist.\n- **MCP host added as a NEW component.** A transport / pool / circuit-breaker / semaphore layer sits between the agent and the three MCPs. This did not exist on the prior diagrams and does not exist in code today \u2014 it is target-state for the I5-lift / Strands-on-Bedrock production deployment.\n- **Retrieval consolidated under GraphRAG-SDK multi-path.** Prior diagrams showed an in-house \"dense + lexical \u2192 RRF\" composition. The new retrieval diagram shows four SDK-native arms (vector, fulltext, cypher, relationship-expansion) feeding a single rerank stage. The in-house RRF is replaced by SDK cosine rerank.\n- **Structural pass becomes swappable SDK strategies.** Precedent boost (\u2264 +0.10 on rank-signal only, never on similarity) and negative-precedent drop (rejected mappings removed pre-scoring) are repositioned as strategies that plug into the SDK rather than custom logic in `find_similar_products`. Distance check remains deferred (no anchor data).\n- **Trust gradient, three-band gate, seal v=2-with-band, I5 gate \u2014 all UNCHANGED.** This is the point: the retrieval surface is being swapped underneath an unchanged control envelope.\n\n## 5. Consistency findings \u2014 diagram vs shipped code\n\nFifteen findings from the validation pass, grouped by severity. **Blocking + high findings must be resolved before the diagrams are called authoritative.**\n\n### 5.1 Blocking\n\n**[scudo-retrieval / BLOCKING] VEC arm \"Titan via LiteLLM\" \u2014 IAM, Bedrock model access, and SDK preprocessing risk to the raw-dense floor anchor.**\n- *Inconsistency:* the diagram shows Titan embeddings live via Bedrock/LiteLLM; in reality (a) the M&V task role has `bedrock:InvokeModel` for Opus 4.8 only, not for `amazon.titan-embed-text-v2:0`; (b) the eu-west-2 Bedrock \"Model access\" toggle for Titan-Embed in sandbox 954976331678 is region- and account-scoped and is a separate enablement; (c) GraphRAG-SDK typically runs its own preprocessing / normalisation pipeline, which collides with the load-bearing discipline at `falkordb_store.py:4-16` that \"`Candidate.similarity` is the raw dense score and the 0.80 floor is calibrated against the dense distribution\".\n- *Which changes:* **both \u2014 code and diagram**. Code: IAM policy add for the Titan model ARN; account-level model-access enablement; an interceptor or SDK config that preserves the raw dense score on `Candidate.similarity`. Diagram: annotate that VEC is gated by \u00a74.1 / \u00a74.2 of `i5-lift-preconditions.md` and that \"raw dense as similarity\" is an invariant the SDK adoption must satisfy.\n- *Recommended resolution:* do not ship the diagram as authoritative until (i) the model-ARN IAM add is merged and applied, (ii) Bedrock model access is enabled for Titan-Embed in eu-west-2 / 954976331678, and (iii) a probe test demonstrates the SDK returning raw dense scores (or that an intercept preserves them) \u2014 and the golden-set recalibration is in the same change as the SDK adoption per \u00a74.2.\n\n### 5.2 High\n\n**[scudo-overview / high] HOST (MCP host with pool, circuit breaker, semaphore) does not exist in shipped code.**\n- *Inconsistency:* the diagram shows `AGENT -->|triggers tools| HOST` and `HOST --> {ING, MV, PER}`. In code (`scudo_mapping_mcp/agent.py:343-367, 421-477`) `BedrockMappingAgent._build_agent()` constructs a Strands Agent whose tools are local Python `@tool` functions calling straight into the package; there is no MCP client, no pool, no breaker, no semaphore. The only `urllib3.PoolManager` use (`neptune_store.py`) is unrelated; \"circuit breaker\" appears only as target-state in `i5-lift-preconditions.md`.\n- *Which changes:* **diagram** (and code follows later). HOST is target-state for the I5-lift / production Strands-on-Bedrock deployment.\n- *Recommended resolution:* style HOST node and its edges as aspirational (dashed border / dotted edges) consistent with the convention `diagram-1-main-flow.md` already used for autonomous-Neptune persistence. Pin a separate workstream owner for HOST as a NEW deliverable (see \u00a76).\n\n**[scudo-overview / high] `NEP -.->|precedent| FALKOR` write-back path is not implemented.**\n- *Inconsistency:* `feedback.apply_decision` (`feedback.py:138-142`) calls `store.upsert_precedent` on the **single** active store selected by `STORE_BACKEND` via `store/factory.py:7-24`; the stores are alternatives, not synchronised. There is no Neptune\u2192Falkor hydrator. In `STORE_BACKEND=neptune` deployments Falkor is bypassed; in `STORE_BACKEND=falkor` deployments Neptune is bypassed. The edge as drawn is misleading.\n- *Which changes:* **either diagram or code, by ARB choice**. If the architectural intent is \"Neptune is canonical, Falkor is the rebuildable working graph hydrated from Neptune\", a hydrator is missing in code. If the intent is \"two backend modes, only one active at a time\", the diagram must say so.\n- *Recommended resolution:* clarify the intent (Open Question \u00a76) and either (a) drop the edge and annotate the two store modes, or (b) keep the edge and open a workstream for the Neptune\u2192Falkor hydrator with an explicit owner.\n\n**[scudo-retrieval / high] Diagram describes a TARGET state; today there is no GraphRAG-SDK integration at all.**\n- *Inconsistency:* `find_similar_products` (`falkordb_store.py:180-285`) is a single-host scan (`MATCH (t:TaxonomyNode) RETURN ...`), then pure-Python Jaro-Winkler over the label (`_jaro_winkler`, lines 52-90), then pure-Python BM25 over the same label corpus (`base.py:281-362`), fused via RRF (not cosine). No `db.idx.vector.queryNodes`, no `db.idx.fulltext.*`, no cypher-as-retrieval, no rel-expansion, no SDK import. The module banner (`falkordb_store.py:4-37`) and the seam docstring (`base.py:18-23`) still name \"AWS GraphRAG Toolkit\" as the production target and call the toolkit graph-store \"vector-only, no traversal\" \u2014 stale under SDK adoption.\n- *Which changes:* **code must catch up to diagram** (the diagram is the adopted target). Concurrently, the in-file production-swap commentary must be updated to point at GraphRAG-SDK, not the AWS toolkit.\n- *Recommended resolution:* the diagram is approved as TARGET STATE; the dense-arm-sdk-adoption.md plan is the implementation route; in the same change as the SDK lands, rewrite the `falkordb_store.py:4-37` and `base.py:18-23` banners. Until that lands, annotate the retrieval diagram as TARGET.\n\n**[scudo-retrieval / high] RR \"cosine rerank, SDK default, swappable\" \u2014 today's fuser is RRF and \"swappable\" must be load-bearing.**\n- *Inconsistency:* the fuser today is RRF (`base.py:344-362`); the code is built around the discipline `Candidate.similarity = raw dense, RRF + boost drive sort key only` (`falkordb_store.py:194-209, 265-282`). If the SDK rerank replaces similarity with cosine-of-cosines, the 0.80 floor stops measuring the quantity it was calibrated against, and `matching.py:323-356`'s disagreement-cap loses its reference quantity.\n- *Which changes:* **diagram caption must elevate \"swappable\" from a default to an invariant; code must enforce it.**\n- *Recommended resolution:* either (a) run the SDK rerank but pass the raw dense score through on `Candidate.similarity` (rerank affects ORDER only, as RRF does today), or (b) configure the SDK with a custom reranker that preserves the raw-dense contract. If the SDK forces cosine and cannot be intercepted, move the floor + disagreement-cap **outside** the SDK boundary. Annotate \"swappable\" on the diagram as a hard invariant.\n\n**[scudo-match-verify / high] Persistence I5 gate routes on `sealed_status` only, NOT on `sealed_band`.**\n- *Inconsistency:* `commit_mapping` (`persistence_mcp.py:225, 246-265`) reads `sealed_status` from the payload and routes solely on status \u2014 `AUTO_MAPPED \u2192 _enqueue(reason='auto_mapped_agent_path')`, `NEEDS_REVIEW \u2192 _enqueue(reason='needs_review')`, `OUT_OF_SCOPE \u2192 refuse`. The seal carries `band` (`verdict.py:160`), and `verdict.py:36-37` explicitly anticipates band-gating (\"Persistence MCP can gate on `sealed_band` \u2026 refuse to write APPROVED if `band=fail` without explicit override\"), but `commit_mapping` never reads `payload['band']`. The reviewer queue is also still in-memory (`persistence_mcp.py:91` comment: \"placeholder in-memory implementation\").\n- *Which changes:* **code**. The diagram's \"I5 gate decides persist-or-queue\" is correct for status routing, but if the band is intended to be load-bearing at the gate, the code must honour it.\n- *Recommended resolution:* extend `commit_mapping` to read `sealed_band` and refuse / down-route `AUTO_MAPPED` seals where `band == 'fail'`. Track the DynamoDB reviewer-queue wiring as a separate workstream and annotate PERS in the diagram as \"in-memory queue today, DynamoDB target\" if ARB confirms that as the framing.\n\n### 5.3 Medium\n\n**[scudo-overview / medium] `NEP -->|publish| IFU` iFusion edge is target-state, no SPI V2 wiring exists.** No `ifusion|iFusion|SPI|spi_v2` matches in the codebase except the diagram files. Persistence writes to Neptune via `upsert_precedent` and stops. Drawing this as a solid edge alongside genuinely-shipped edges overstates readiness \u2014 style it aspirational (dashed) like the prior diagram-1 convention.\n\n**[scudo-overview / medium] `PER \u2192 SSM` edge mis-describes how the signing key is loaded.** `verdict._load_signing_key` (`verdict.py:85-96`) reads `SCUDO_VERDICT_SIGNING_KEY` from env, with a dev fallback gated by `SCUDO_VERDICT_ALLOW_DEV=1`. No `boto3` Secrets Manager / SSM call. The contract docstring (`verdict.py:41-44`) says prod MUST inject via Secrets Manager \u2014 i.e. an infra / task-definition responsibility. Either re-label the edge as \"env var injected by Secrets Manager at task start\" or extend `verdict.py` to fetch directly.\n\n**[scudo-match-verify / medium] Specialist \"anchored to top candidate\" is not enforced in code.** `SpecialistScorer` (`matching.py:121-124`) signature matches the diagram. Concur branch identifies agreement by `specialist_pick.node.iri == best.node.iri` (line 310). But there is **no check** that `specialist_pick.node.iri` is in `{c.node.iri for c in candidates}`. A misbehaving specialist returning an off-list IRI falls through to the disagree branch (line 335) and the off-list IRI surfaces as `alternative_iri` / `alternative_label` (lines 347-348). Either add `assert specialist_pick.node.iri in candidate_iris` (abstain otherwise) or soften the diagram caption.\n\n**[scudo-match-verify / medium] SEAL \"key from SSM\" is aspirational \u2014 env var in code.** v=2 + band are correctly implemented (`verdict.py:155, 160`); `verify()` accepts v \u2208 {1,2} (lines 215-2 te\" invariant intended to be enforced in code (assert `specialist_pick.node.iri \u2208 candidate IRI set`, abstain otherwise), or is the current \"surface as alternative on disagree\" behaviour the actual contract and the diagram caption needs softening?\n- [scudo-match-verify] Should `commit_mapping` read `sealed_band` from the seal payload and refuse / down-route `AUTO_MAPPED` seals where `band == 'fail'` (as `verdict.py:36-37` itself anticipates), so the I5 gate framing is band-aware end-to-end?\n- [scudo-match-verify] Reviewer queue is still the in-memory placeholder list in `persistence_mcp.py` \u2014 is the DynamoDB wiring tracked as a separate workstream, or should the diagram annotate PERS as \"in-memory queue today, DynamoDB target\"?\n- [scudo-retrieval] Does GraphRAG-SDK expose the raw dense (cosine) score per candidate before its rerank, or only reranked-and-normalised scores? This decides whether `Candidate.similarity` can keep its raw-dense, floor-anchored contract or whether the floor + disagreement-cap must move outside the SDK boundary.\n- [scudo-retrieval] Does the SDK accept a custom reranker callable (the \"swappable\" claim on the diagram), or are we forced to either accept its cosine rerank or post-rerank ourselves outside the SDK?\n- [scudo-retrieval] Does the SDK do its own text preprocessing (stopwording, chunking, normalisation) before computing embeddings, and if so does it apply that to the QUERY as well as to indexed labels? If asymmetric, the 0.80 floor's calibration distribution shifts and a recalibration is mandatory \u2014 not optional.\n- [scudo-retrieval] Should the in-file production-swap commentary (`falkordb_store.py:4-37` and `base.py:18-23`) be updated in the same change as the diagram lands, so the next reviewer doesn't trip on the \"AWS GraphRAG Toolkit, vector-only\" framing? And should `dense-arm-swap.md` be marked SUPERSEDED with a forward pointer? (Yes, the latter is done in this workflow.)\n- [scudo-retrieval] Is the `*rrf_top` scaling of the boost (`falkordb_store.py:281`) still correct under cosine rerank? Cosine scores sit in [-1, 1] (or [0, 1] post-normalisation), an entirely different order of magnitude from RRF's ~0.016 top contribution \u2014 the scaling factor will need re-derivation.\n\n**Explicit decisions ARB is asked to take:**\n- Pin a specific Titan model version (`amazon.titan-embed-text-v2:0`) and dimension (1024) to the Model Inventory under MRGR registration?\n- Confirm the MCP host component as a NEW deliverable to be owned by **[TBC]**?\n- Confirm that agent-at-top orchestration is the target state regardless of I5 status?\n- Re-table `dense-arm-sdk-adoption.md` (yet to be drafted, replacing v0.2) at the next ARB session?\n\n## 7. Preconditions still open (linked to `i5-lift-preconditions.md`)\n\nThe architecture being approved here **does not lift I5**; it nominates the retrieval surface and orchestration shape. The following \u00a74 preconditions of `i5-lift-preconditions.md` remain open after this architecture change:\n\n- **\u00a74.1 Dense arm is production-grade** \u2014 depends on the SDK adoption landing in code, IAM grant for Titan model ARN, and eu-west-2 Bedrock model-access toggle (the BLOCKING finding above).\n- **\u00a74.2 Floor and band widths calibrated against a golden set** \u2014 must happen in the same change as the SDK adoption; SDK preprocessing risk (Open Question above) makes recalibration mandatory, not optional.\n- **\u00a74.3 Verdict seal hardening cluster** \u2014 SSM/SM key custody, IRSA scoping, rotation policy, replay window tightening, image signing \u2014 none closed by this architecture change.\n- **\u00a74.4 Retrieval path integration-tested against real stores** \u2014 current tests are seam-level; FalkorDB + Neptune end-to-end integration tests not yet in CI.\n- **\u00a74.5 Per-decision audit-back loop with integrity** \u2014 not implemented; sampled-review acting authority **[TBC]**.\n- **\u00a74.6 Canonical taxonomy DQ pass** \u2014 not evidenced in repo.\n- **\u00a74.7 Precedent edge integrity** \u2014 precedents created before the dense swap must be re-scored under embeddings (not done; no dense arm yet).\n- **\u00a74.8 Controlled rollout** \u2014 phased lift plan exists in `i5-lift-preconditions.md` \u00a75 but is not active.\n- **\u00a74.9 Commercial / TPRM envelope** \u2014 SoW amendment, TPRM reclassification, OpRisk capital impact \u2014 not closed.\n- **\u00a74.10 LLM-in-the-loop classification** \u2014 borderline specialist (Opus 4.8) and any Path A verifier require Model Inventory registration + independent MRGR validation.\n- **\u00a74.11 Governance sign-off** \u2014 full \u00a710 sign-off matrix unsatisfied.\n- **\u00a74.12 Path A verifier seam** \u2014 only required if Path A is chosen; not built.\n\nThis ARB approves the **architecture**, not the lift.\n\n## 8. Carry-forward findings from the superseded `dense-arm-swap.md` v0.2 critical review\n\nEight themes from the adversarial review of the build-it-ourselves plan apply equally to the SDK adoption path:\n\n1. **Fail-closed contract must be CODE not prose in `matching.py`.** Any condition that should abstain (specialist off-list, SDK timeout, missing dense score) must raise / route to review, not be documented as a \"should\".\n2. **Match&Verify needs `bedrock:InvokeModel` IAM + eu-west-2 model-access toggle for Titan.** Same blocker as v0.2; restated as the BLOCKING finding in \u00a75.1.\n3. **Score normalisation [-1, 1] vs [0, 1] \u2014 verify against SDK output range.** The 0.80 floor was calibrated against Jaro-Winkler's character-similarity distribution; whatever range the SDK returns dictates a new floor \u2014 re-derived against the golden set, in the same change.\n4. **Rollback model must gate the write side too.** Whatever feature flag wraps SDK adoption must be observable in Persistence's I5 gate, so a rollback flips both retrieval and write-side behaviour atomically.\n5. **Reindex must use the shadow-property protocol; no whole-graph rebuild on live traffic.** The SDK's index lifecycle must support shadow-build \u2192 atomic alias swap; if not, we wrap it.\n6. **Observability not wired anywhere \u2014 must be specified before flag flip.** Per-arm latency, hit rate, score distribution, rerank-vs-raw-dense gap, boost-scaling diagnostics, precedent-drop counts \u2014 all required for the \u00a74.5 audit-back loop. None exist today.\n7. **Persistence dependency: reviewer queue still in-memory list, separate workstream.** Restated as a Medium finding in \u00a75.3; the DynamoDB wiring gap blocks any meaningful Phase 2 / 3 evidence per `i5-lift-preconditions.md` \u00a75.\n8. **SDK version must be pinned to a hash for the same preprocessing-policy property v0.2 derived.** Any SDK upgrade silently changes embedding model, tokeniser, or normalisation \u2014 invalidating calibration. Pin to a commit hash, gate upgrades behind the \u00a74.10 model-change control.\n\n## 9. What ARB is asked to do\n\nThree explicit decisions:\n\n1. **Approve** the three diagrams in `scudo_mapping_mcp/docs/architecture/` (`scudo-overview.mmd`, `scudo-match-verify.mmd`, `scudo-retrieval.mmd`) as the SCUDO architecture **source-of-truth**, superseding `docs/diagram-1-main-flow.md` and `docs/diagram-2-falkor-internals.md` (already marked SUPERSEDED in this workflow).\n2. **Acknowledge** the supersession of `docs/dense-arm-swap.md` (the build-it-ourselves plan) and **approve** `docs/dense-arm-sdk-adoption.md` being drafted as the replacement plan, to come back to ARB at a future session.\n3. **Confirm** that the \u00a75 consistency findings (one blocking, five high, five medium, four low) must be resolved \u2014 by diagram amendment (mark target-state) or code change \u2014 before the diagrams ship to wider distribution. In particular, the BLOCKING IAM / model-access / SDK-preprocessing items must be evidenced before the retrieval diagram is presented outside this forum as anything other than TARGET STATE.\n\n## 10. Document control\n\n- **Workflow run ID:** (filled by workflow runtime)\n- **Date tabled:** 2026-06-10\n- **Files touched in this workflow:**\n  - `scudo_mapping_mcp/docs/architecture/scudo-overview.mmd` (+ `.txt`)\n  - `scudo_mapping_mcp/docs/architecture/scudo-match-verify.mmd` (+ `.txt`)\n  - `scudo_mapping_mcp/docs/architecture/scudo-retrieval.mmd` (+ `.txt`)\n  - `scudo_mapping_mcp/docs/architecture/README.md`\n  - `scudo_mapping_mcp/docs/diagram-1-main-flow.md` (marked SUPERSEDED)\n  - `scudo_mapping_mcp/docs/diagram-2-falkor-internals.md` (marked SUPERSEDED)\n  - `scudo_mapping_mcp/docs/dense-arm-swap.md` (marked SUPERSEDED-PENDING-REPLAN)\n- **Validation findings preserved at:** \u00a75 of this pack.\n- **Forward references:**\n  - `scudo_mapping_mcp/docs/i5-lift-preconditions.md` v0.2 \u2014 unchanged by this architecture decision; preconditions tracked in \u00a77.\n  - `scudo_mapping_mcp/docs/dense-arm-sdk-adoption.md` \u2014 to be drafted, replaces `dense-arm-swap.md`.\n\n## 11. Decisions ratified\n\n- **2026-06-10:** Three diagrams (`scudo-overview.mmd`, `scudo-match-verify.mmd`, `scudo-retrieval.mmd`) **APPROVED** as the SCUDO architecture source of truth (user sign-off). `docs/diagram-1-main-flow.md` and `docs/diagram-2-falkor-internals.md` confirmed SUPERSEDED.\n- **2026-06-10:** Supersession of `docs/dense-arm-swap.md` **ACKNOWLEDGED**; `docs/dense-arm-sdk-adoption.md` **APPROVED in principle** as the replacement plan (see WS-E for the draft).\n- **2026-06-10:** BLOCKING items in \u00a75.1 (IAM grant for Titan model ARN / Bedrock model-access toggle in eu-west-2 / SDK preprocessing risk to the raw-dense floor anchor) **PARKED**. Park rationale and re-entry conditions live in `docs/dense-arm-sdk-adoption.md` \u00a76.\n- **2026-06-10:** MCP host **ADOPTED** as a SCUDO-owned visibility platform \u2014 NEW deliverable (see WS-C). Closes Open Question \u00a76 \"Confirm the MCP host component as a NEW deliverable to be owned by \u2026\".\n- **2026-06-10:** Specialist-anchored-to-top-candidate invariant **ENFORCED IN CODE** (see WS-D). Closes the \u00a75.3 medium finding \"Specialist 'anchored to top candidate' is not enforced in code\" and the matching Open Question in \u00a76.\n\n**End of document.**\n\n## Related\n\n- [Confidence bands & provenance (canonical)](/reference/matching-data-provenance.md)", "architecture/batch": "# Batch matching \u2014 the self-verifying loop, made durable\n\n`batch.py` adds a batch layer over the per-product `Orchestrator`. The orchestrator\nmaps **one** vendor product (maker \u2192 independent verifier \u2192 deterministic gate \u2192\n`Outcome`); `BatchMatcher` runs **N** products as a loop that does not stop while\nanything is still wrong, and survives interruption.\n\nThe design is a direct application of three operating-discipline skills (the\narchitecture *is* the leverage \u2014 these are not runtime AgentSkills dropped into\n`scudo/skills/`):\n\n- **`self-verifying-loop`** \u2014 plan \u2192 execute \u2192 **independent** verify \u2192\n  **requeue rejects with their reason** \u2192 loop until a pass rejects nothing or the\n  retry budget is hit \u2192 **quarantine** (never drop) whatever never passes. The\n  per-unit claim (\"vendor product X \u2192 CDAO node Y\") is mechanically checkable (the\n  verifier rubric + the orchestrator's pre-verify defects + IRI determinism), and\n  the verifier is structurally independent of the maker (separate Strands agent,\n  separate context, sees only the result + rubric). That is the regime where the\n  loop buys a real guarantee.\n- **`loops`** \u2014 durable runtime: **idempotent** publish (a replayed publish is a\n  no-op), **checkpointed** ledger + **resume** (a resumed run skips units already\n  terminal \u2014 no re-call of the LLM), and run-history observability (the ledger).\n- **`compound-system`** \u2014 maker \u2260 verifier; verify load-bearing work\n  independently; the reason rides back to the *maker* only, never the verifier.\n\n## Outcome \u2192 ledger mapping\n\n| Orchestrator `Outcome` | Ledger destination | Terminal? |\n|---|---|---|\n| `PUBLISHED` | `passed` | yes (verified clean) |\n| `RESEARCH_QUEUED` | `research` | yes (escalated to ontology owner) |\n| `HITL` (floor breach / self-flag) | `quarantined` | yes (needs a human; no retry path) |\n| `RETRY` | requeued with reason, up to `retry_budget` passes | on exhaustion \u2192 HITL queue + `quarantined` |\n\n`retry_budget` defaults to **2** (pass 1 = initial, pass 2 = the single retry the\norchestrator's own \"retry once then HITL\" intends). Budget-exhausted units are\nenqueued to the orchestrator's **existing** `hitl_queue` \u2014 the human channel is\nreused, never duplicated, and the unit is never dropped.\n\n## Wiring durability\n\n```python\nfrom scudo.batch import BatchMatcher\nfrom scudo.stubs import IdempotentPublishSink, InMemoryLedgerStore, InMemoryPublishSink\n\nsink = IdempotentPublishSink(InMemoryPublishSink())   # replay-safe publish\norch = Orchestrator(..., publish_sink=sink)           # build with the wrapped sink\nmatcher = BatchMatcher(orch, ledger_store=InMemoryLedgerStore(), retry_budget=2)\n\nledger = matcher.run_batch(payloads, run_id=\"2026-06-20-lseg\")\n# after a crash / interruption, resume from the checkpointed ledger:\nledger = matcher.run_batch(payloads, run_id=\"2026-06-20-lseg\", resume=True)\n```\n\n## Non-goals (v1)\n\nSequential, not concurrent (so no per-key race / double-publish). The bundle is\nre-assembled each pass \u2014 caching it across passes is a future optimisation.\n\n## Verify\n\n```\npython -m scudo.tests.batch_smoke   # \u2192 SCUDO BATCH SMOKE OK\npython -m scudo.tests.smoke         # \u2192 SCUDO SMOKE OK (per-product, unchanged)\n```", "architecture/diagram-falkor-internals": "> **Superseded.** See [diagrams-and-sources](/architecture/diagrams-and-sources.md).\n\n# Diagram 2 \u2014 Inside the Falkor match + check\n\n> **SUPERSEDED \u2014 2026-06-10**\n>\n> This diagram has been superseded by:\n>\n> - **`docs/architecture/scudo-retrieval.mmd`** \u2014 the canonical retrieval-internals diagram\n>\n> Specifically, the v0.2 \"Inside the Falkor match+check\" content shown below \u2014 the Jaro-Winkler dense-arm stand-in, the pure-Python BM25 sidecar, and the Reciprocal Rank Fusion (RRF) step \u2014 is superseded by the **FalkorDB GraphRAG-SDK multi-path adoption** (vector + fulltext + cypher + relationship expansion + cosine rerank). The SCUDO-specific structural pass (precedent boost, negative-precedent drop, distance check) plugs into the SDK as swappable strategies. The trust gradient and the I5 gate are unchanged.\n>\n> **Numbers below are POINT-IN-TIME (2026-06-10). Do not \"correct\" them.**\n> When this was written `config.CONFIDENCE_FLOOR` really was `0.80`; it moved\n> to `0.75` in `eb48d67` (2026-07-04). Live values: floor `0.75` is the band\n> CENTRE, half-width `0.05`, so PASS >= 0.80 / FAIL < 0.70. BORDERLINE\n> (0.70-0.80) can still auto-map. See\n> [dense-arm-sdk-adoption.md](/architecture/dense-arm-sdk-adoption.md) \u00a73 for the live\n> invariants.\n>\n> Content below is retained as historical context only. Do not edit.\n>\n> ---\n\nWhat rung 3 of the cost ladder does. Dense and lexical retrieval arms fuse via RRF; the structural pass drops rejected nodes, tilts toward precedents, and (when the anchor data exists) bounds candidates by taxonomy distance.\n\n```mermaid\nflowchart TD\n    Vendor[Vendor product<br/>name \u00b7 id \u00b7 description]\n\n    GraphRAG[GraphRAG Toolkit<br/>dense \u00b7 authoritative]\n    BM25[BM25 -LlamaIndex-<br/>lexical \u00b7 IDs, acronyms]\n\n    RRF[Reciprocal rank fusion<br/>-> Top-N candidates]\n\n    subgraph Structural [Structural check \u2014 SciPy sparse over taxonomy adjacency -deterministic-]\n        Distance[Distance check<br/>plausible neighbourhood]\n        NegPrec[- Negative precedents<br/>drop rejected nodes]\n        PosPrec[+ Precedent boost<br/><=0.10, from edges]\n    end\n\n    Survivors[Surviving candidates<br/>ranked -> on to validations]\n    NoSurvivors[No survivors<br/>-> review]\n\n    Vendor --> GraphRAG\n    Vendor --> BM25\n    GraphRAG --> RRF\n    BM25 --> RRF\n    RRF --> Structural\n    Structural --> Survivors\n    Structural --> NoSurvivors\n\n    classDef dense fill:#d6e4f2,stroke:#3b6fa8,color:#173155;\n    classDef lexical fill:#d9efe4,stroke:#2f8f6f,color:#0d4f3c;\n    classDef fusion fill:#f4d6cf,stroke:#b9523c,color:#4a160a;\n    classDef ok fill:#e0f0d5,stroke:#5a8f3a,color:#274a14;\n    classDef warn fill:#f6dcc1,stroke:#c47a2a,color:#5a3210;\n    classDef neutral fill:#ece8e0,stroke:#7d7464,color:#3d362a;\n\n    class GraphRAG dense;\n    class BM25 lexical;\n    class RRF fusion;\n    class Survivors ok;\n    class NoSurvivors warn;\n    class Vendor neutral;\n```\n\n> The structural ranking also cross-checks the LLM output downstream \u2014 disagreement caps confidence (see [diagram-1-main-flow.md](/architecture/diagram-main-flow.md) and `matching.map_vendor_product` borderline-disagreement branch).\n\n## What lives where \u2014 production targets vs today's stand-ins\n\n| Box | Production target | Today | Where it lives |\n|---|---|---|---|\n| Dense arm | AWS GraphRAG Toolkit vector index (Titan v2 / equivalent embeddings) via `CALL db.idx.vector.queryNodes` | Pure-Python Jaro-Winkler over taxonomy labels | `store.falkordb_store._jaro_winkler` |\n| Lexical arm | LlamaIndex `BM25Retriever` (or FalkorDB-native full-text index) | Pure-Python BM25 | `RetrievalStore.bm25_scores` (`store/base.py`) |\n| RRF | Same | RRF k=60 | `RetrievalStore.reciprocal_rank_fusion` (`store/base.py`) |\n| Distance check | SciPy sparse adjacency BFS / shortest-path against an anchor | **Not implemented** \u2014 deferred until anchor data exists (see warm-up phase) | \u2014 |\n| Negative precedents | Same | Implemented in seam | `FalkorDBStore.find_similar_products` + `FakeStore.find_similar_products` |\n| Precedent boost (\u2264+0.10) | Same | Implemented in seam \u2014 applied to SORT KEY only, never to `Candidate.similarity` | `RetrievalStore.compute_rank_boost` |\n\n## The dense / floor coupling\n\n`Candidate.similarity` is the **dense-arm** score (Jaro-Winkler today, embeddings later). The 0.80 floor and the band half-width are calibrated against this distribution. **The dense-arm swap (Titan) and the recalibration are one operation** \u2014 swapping character similarity for semantic embeddings changes the quantity the floor measures, so the 0.80 and the bands must be re-derived against a golden set at the same time. See [i5-lift-preconditions.md \u00a74.2](/specs/i5-lift-preconditions.md).\n\n## RRF is sort-only\n\nRRF fuses dense rank with BM25 rank to drive the SORT order, so lexical hits (RICs, tickers, ISINs) surface into the top-N. It does **not** replace dense as similarity. If a lexical-strong, semantic-weak candidate sorts to the top, the floor still sees the low dense score and routes the case to NEEDS_REVIEW (correctly). Recall lift without precision loss.\n\n## Distance check \u2014 why deferred\n\nThe distance check needs an anchor. The candidates are:\n\n- (a) The parent path of any precedent for the same `(vendor, signature)`.\n- (b) The nearest ancestor with any confirmed precedent across all vendors.\n- (c) A per-vendor class baseline derived from data_class tags.\n\nIn the warm-up phase, (a) and (b) abstain (no precedents yet) and (c) is inert (CDAO seed carries no class tags). The implementation will use the tightest-available fallback `a \u2192 b \u2192 c`, contribute distance as a soft signal into the confidence cap when an anchor resolves, and never hard-drop until the underlying data is real.\n\n## Related\n\n- [Confidence bands & provenance (canonical)](/reference/matching-data-provenance.md)\n- [Diagrams & sources (canonical)](/architecture/diagrams-and-sources.md)", "architecture/diagram-main-flow": "> **Superseded.** See [diagrams-and-sources](/architecture/diagrams-and-sources.md).\n\n# Diagram 1 \u2014 Main mapping flow\n\n> **SUPERSEDED \u2014 2026-06-10**\n>\n> This diagram has been superseded by the canonical architecture set under `docs/architecture/`:\n>\n> - **`docs/architecture/scudo-overview.mmd`** \u2014 replaces the end-to-end mapping flow shown below\n> - **`docs/architecture/scudo-architecture/scudo-match-verify.mmd`** \u2014 replaces the Match&Verify-specific portion (Falkor + LLM specialist + gate)\n>\n> The new diagrams reflect the decision to **adopt the FalkorDB GraphRAG-SDK** (vector + fulltext + cypher + relationship expansion + cosine rerank) rather than building the retrieval primitives ourselves. The trust gradient (Ingestion / Match&Verify / Persistence) and the I5 gate are unchanged.\n>\n> Content below is retained as historical context only. Do not edit.\n>\n> ---\n\nCanonical end-to-end shape of a single mapping decision. The cost ladder runs left-to-right; first rung that can settle the case wins, the LLM specialist runs only on the narrow ambiguous window, and the reviewer queue closes the loop back into precedents.\n\n```mermaid\nflowchart TD\n    Vendor[Vendor product<br/>normalised by Ingestion]\n\n    Scope{{Scope gate<br/>fail-closed}}\n    OutOfScope[Out of scope<br/>not mapped]\n\n    Precedent{{Precedent check<br/>confirmed mapping?}}\n    Reuse[Reuse mapping<br/>human-approved]\n\n    Falkor[Falkor match + check<br/>retrieve + structural check]\n    LLM[LLM specialist<br/>ambiguous cases only]\n    Validations[Validations<br/>5 checks]\n\n    Gate{{Gate: floor + verifier<br/>>=0.80 + passing verdict}}\n    AutoMapped[Auto-mapped<br/>persist -> Neptune]\n\n    Reviewer[Reviewer queue<br/>needs review]\n\n    Vendor --> Scope\n    Scope -- in scope --> Precedent\n    Scope --> OutOfScope\n\n    Precedent -- none --> Falkor\n    Precedent --> Reuse\n\n    Falkor -- candidate --> LLM\n    Falkor -- no survivors --> Reviewer\n\n    LLM --> Validations\n    Validations -- pass --> Gate\n    Validations -- \"required fail / else\" --> Reviewer\n\n    Gate -- \">=0.80 + verified\" --> AutoMapped\n    Gate --> Reviewer\n\n    Reviewer -. approved -> precedent .-> Precedent\n\n    classDef deterministic fill:#d9efe4,stroke:#2f8f6f,color:#0d4f3c;\n    classDef llm fill:#e1dcf5,stroke:#6a55b5,color:#2d2270;\n    classDef gate fill:#f6dcc1,stroke:#c47a2a,color:#5a3210;\n    classDef mapped fill:#e0f0d5,stroke:#5a8f3a,color:#274a14;\n    classDef neutral fill:#ece8e0,stroke:#7d7464,color:#3d362a;\n\n    class Scope,Precedent,Falkor,Validations deterministic;\n    class LLM llm;\n    class Gate gate;\n    class Reuse,AutoMapped mapped;\n    class Vendor,OutOfScope,Reviewer neutral;\n```\n\n## Reading the diagram against the code\n\n| Diagram element | Code location | Notes |\n|---|---|---|\n| Scope gate | `frames.check_scope` (rung 1 of `matching.map_vendor_product`) | Deterministic; LLM never gets a vote (I3) |\n| Precedent check / reuse | `store.get_precedent_mapping` (rung 2) | Confirmed-only; provisional edges filtered |\n| Falkor match + check | `store.find_similar_products` (rung 3) | See Diagram 2 for internals |\n| LLM specialist | `specialist` kwarg on `map_vendor_product` (rung 4) | Per-call DI; default `None`. Runs ONLY in the borderline window |\n| Validations | `validations.run_validations` + `required_failures` | Required-fail forces NEEDS_REVIEW even at high similarity (I6) |\n| Gate | `matching.map_vendor_product` rung 5 | Three bands: PASS / BORDERLINE / FAIL \u2014 see `MappingResult.band` |\n| Auto-mapped \u2192 Neptune | `persistence_mcp.commit_mapping` | **Currently intercepted by I5** \u2014 agent-driven AUTO_MAPPED goes to reviewer queue. Lift gated by [i5-lift-preconditions.md](/specs/i5-lift-preconditions.md) |\n| Reviewer queue | `persistence_mcp._REVIEWER_QUEUE` | Approved \u2192 `feedback.apply_decision` writes precedent edge |\n\n## \"Auto-mapped \u2192 Neptune\" is aspirational today\n\nThe arrow from Gate to `AutoMapped \u2192 persist \u2192 Neptune` is what the cost ladder *would* do without I5. Today, `persist.commit_mapping` refuses agent-driven `AUTO_MAPPED` verdicts and routes them to the reviewer queue. The reviewer is the universal verifier of last resort; the diagram's autonomous-persist arrow becomes live only once the preconditions in [i5-lift-preconditions.md](/specs/i5-lift-preconditions.md) are met, evidenced, and signed off.\n\n## Related\n\n- [Confidence bands & provenance (canonical)](/reference/matching-data-provenance.md)\n- [Diagrams & sources (canonical)](/architecture/diagrams-and-sources.md)", "architecture/diagrams-and-sources": "> **Note:** The canonical Mermaid (`.mmd`) diagrams referred to below live in the repo at `backend/scudo_mapping_mcp/docs/architecture/`; they are not part of this `.md` bundle. Where the text below says \"this directory\", it means that repo path.\n\n# SCUDO Architecture Diagrams\n\nThis directory is the **source-of-truth** for SCUDO mapping architecture diagrams.\nAll diagrams are authored in [Mermaid](https://mermaid.js.org/) (`.mmd`) and\ndistributed alongside a sibling plain-text export (`.txt`) for teammates who\ncannot render Mermaid directly.\n\nScope: the JPMC SCUDO programme (Cognizant delivery) that maps vendor products\n(LSEG, S&P Global, Bloomberg, ICE, FactSet) onto the CDAO taxonomy in Neptune,\nusing the FalkorDB GraphRAG-SDK as the retrieval substrate, an Opus 4.8 borderline\nspecialist, and a strict three-MCP trust gradient with an I5 reviewer gate.\n\nIf a diagram in this folder disagrees with prose elsewhere in the repo, **this\nfolder wins**. Update prose to match, not the other way around.\n\n## Diagrams\n\n| Filename | What it covers | When to read |\n|----------|----------------|--------------|\n| `scudo-overview.mmd` | End-to-end flow across the three MCPs (Ingestion -> Match&Verify -> Persistence), HMAC seal handoff, I5 reviewer-queue interception, and the Bedrock + Neptune + DynamoDB + Falkor data plane. | You are new to SCUDO, or you need to explain the system to a reviewer / architect / governance forum in one picture. Start here. |\n| `scudo-match-verify.mmd` | Internals of the Match&Verify MCP: matcher pipeline, gate logic, borderline-specialist call, HMAC seal signing, and the swappable SCUDO structural strategies (precedent boost, negative-precedent drop, distance check) plugged into the SDK. | You are changing matcher behaviour, adjusting thresholds, touching the seal-signing path, or onboarding a new vendor adapter into the matcher. |\n| `scudo-retrieval.mmd` | Internals of the FalkorDB GraphRAG-SDK retrieval call: vector + fulltext + cypher + relationship-expansion + cosine rerank, and where the SCUDO-specific structural strategies inject. | You are tuning retrieval recall/precision, swapping a SDK strategy, debugging a missed candidate, or evaluating dense-arm production-readiness against the I5 lift preconditions. |\n\n## Conventions\n\nAll diagrams in this folder follow the same drawing conventions so they read\nconsistently and survive Mermaid version drift:\n\n- **ASCII tokens only** in node IDs and labels. No smart quotes, no en/em dashes,\n  no Unicode arrows. Mermaid's parser is fussy and CI renderers vary.\n- **No arrows inside node labels.** Arrows belong on edges. If a node needs to\n  describe a transition, split it into two nodes joined by an edge.\n- **Hexagons (`{{ ... }}`) for gates and trust boundaries.** The I5 reviewer\n  gate, the HMAC seal verifier, and any IAM-Deny boundary are always hexagons so\n  they are visually unmissable.\n- **`classDef` colours by responsibility**, not by component name. The palette is:\n  - Ingestion MCP / read-only vendor frames\n  - Match&Verify MCP / matcher + signer\n  - Persistence MCP / sole writer\n  - Bedrock (Opus 4.8 + embeddings)\n  - Falkor / SDK retrieval\n  - Neptune + DynamoDB persistence\n  - Gates and trust boundaries (hexagons)\n- **`.mmd` is the source.** The sibling `.txt` is a hand-checked plain-text\n  rendering for teammates without a Mermaid renderer (Outlook, Confluence Cloud\n  without the plugin, screen readers). When you change a `.mmd`, refresh the\n  `.txt` in the same commit.\n\n## I5 lift decision context\n\nThese diagrams show the I5 reviewer gate as **physically enforced** by the\nPersistence MCP intercepting every `AUTO_MAPPED` decision into the DynamoDB\nreviewer queue. Whether and when SCUDO can *lift* that gate (i.e. allow\nagent-driven `AUTO_MAPPED` to bypass the reviewer queue for selected\nhigh-confidence bands) is governed by:\n\n- [`../i5-lift-preconditions.md`](/specs/i5-lift-preconditions.md)\n\nRead that document before proposing any change to the gate's behaviour in\n`scudo-overview.mmd` or `scudo-match-verify.mmd`. The preconditions cover\ndense-arm production-grade evidence, golden-set calibration, MRGR registration,\nsigning-key hardening, integration test coverage, the audit-back loop, and the\ngovernance sign-off matrix.\n\n## Supersedes\n\nThese three diagrams **supersede** the previous architecture diagrams kept at\nthe top of `docs/`:\n\n- `../diagram-1-main-flow.md` -> superseded by `scudo-overview.mmd`\n- `../diagram-2-falkor-internals.md` -> superseded by `scudo-retrieval.mmd`\n  (with Match&Verify-specific internals moved to `scudo-match-verify.mmd`)\n\nA reconciliation agent is marking those two files **deprecated** in-place with a\nbanner pointing here. Do not edit them; edit the `.mmd` files in this folder\ninstead. The earlier `dense-arm-swap.md` plan v0.2 (which described building the\nretrieval primitives ourselves) is also superseded by the decision to adopt the\nFalkorDB GraphRAG-SDK, but its critical-review findings carry forward into the\nSCUDO-specific structural strategies shown in `scudo-retrieval.mmd` and\n`scudo-match-verify.mmd`.\n\n---\n\n# SCUDO Mapping MCP \u2014 Architecture docs\n\nRound-tripped artefacts. Each lives here so the diagrams and gates aren't trapped in chat.\n\n| Doc | What it pins | When to read |\n|---|---|---|\n| [diagram-1-main-flow.md](/architecture/diagram-main-flow.md) | The cost ladder end-to-end: scope \u2192 precedent \u2192 Falkor \u2192 LLM specialist \u2192 gate \u2192 auto-mapped / reviewer | When reasoning about what runs when, or comparing the diagram against `matching.map_vendor_product` |\n| [diagram-2-falkor-internals.md](/architecture/diagram-falkor-internals.md) | Rung 3 expanded: dense (Jaro-Winkler stand-in \u2192 GraphRAG Toolkit) + lexical (BM25 \u2192 LlamaIndex) + RRF + structural pass (neg-precedents, precedent boost, distance check deferred) | When touching `store.find_similar_products` or thinking about recall vs precision in retrieval |\n| [i5-lift-preconditions.md](/specs/i5-lift-preconditions.md) | What must be true before sealed PASS verdicts can autonomously persist to Neptune without a human | Before any conversation about lifting I5, removing the reviewer queue, or scoping autonomous writes |\n\n## Quick orientation for a new reader\n\n- The system maps vendor products (LSEG, S&P Global, Bloomberg, ICE, FactSet) to JPMC's CDAO taxonomy.\n- The architecture is three MCPs in a trust gradient: Ingestion (read-only vendor frames) \u2192 Match&Verify (matcher + HMAC seal signer) \u2192 Persistence (the **only** writer; gates on `sealed_status` / `sealed_band`).\n- Persistence today refuses agent-driven `AUTO_MAPPED` per **I5** \u2014 every such verdict goes to the reviewer queue. Lifting that interception is the subject of `i5-lift-preconditions.md`.\n- The matcher is a deterministic cost ladder. The LLM specialist runs only in the borderline window and can REINFORCE confidence but cannot INFLATE past the deterministic anchor.\n\n## Conventions\n\n- Diagrams are Mermaid, embedded in `.md` so they render on GitHub and in any viewer.\n- Code-pointer tables (Diagram \u2192 file:method) live alongside each diagram so they don't rot independently of the code.\n- `[TBC]` markers in `i5-lift-preconditions.md` are deliberately unresolved \u2014 they require JPMC input (named owners, thresholds, control IDs).", "architecture/hooks": "# Hooks \u2014 Deterministic Enforcement Layer\n\nHooks are shell commands the Agent SDK fires on lifecycle events. They receive the\nevent JSON on stdin and can **allow or deny** an action (PreToolUse: exit 2 or a\n`permissionDecision: \"deny\"` payload). They run regardless of which model is in the\nloop, so they are where every non-negotiable lives. The model does *judgement*; the\nhooks enforce the *invariants*. This is the single biggest lever for running the\nsystem on a weaker/older model safely (see \"Model portability\" at the foot).\n\nThe agent must never be *asked in prose* to \"remember to validate\" or \"be replay-safe\".\nIf it can be violated, it is a hook, not a sentence in a SKILL.md.\n\n## Hook inventory\n\n| Event | Matcher | Enforces | Clarif. |\n|---|---|---|---|\n| `SessionStart` | \u2014 | Pin `ontology_snapshot`, `rubric_version`, `schema_version` into the run context. Same inputs \u2192 same pins \u2192 same end-state. | G39, L69 |\n| `UserPromptSubmit` | \u2014 | Pydantic-validate the request + `BriefBundle` before any agent reasons. Deny on schema drift (catches the `Literal`-vs-`str` / union-unwrap class of bug). | \u2014 |\n| `PreToolUse` | `neptune_publish_triples` | **Publish gate.** Deny unless: verifier \u2265 16 *or* item is routed to HITL; every triple carries a named graph; every IRI is deterministic (`mds.<vendor>:<uuid5>` / `jpmorgan:data:cdao:\u2026`); and `route != RESEARCH`. | G39, A2, F31 |\n| `PreToolUse` | `neptune_*`, `rdf_*` | **No hand-written queries.** Deny if any input field carries a raw SPARQL/Turtle string. Forces the parameterised query/serialiser tools. Kills the hallucinated-Turtle/SPARQL failure mode. | \u2014 |\n| `PostToolUse` | `submit_mapping` | **Verifier always runs.** Invoke the 10-dimension verifier, attach `VerifierReport`. Verification cannot be skipped by a forgetful model. | \u2014 |\n| `PostToolUse` | `submit_mapping` | **Confidence floor.** If `confidence < 0.80` *or* `requires_human_review` *or* verifier total `< 16` \u2192 enqueue to the **catalogue HITL queue** and block the auto-publish path (12\u201315 \u2192 one retry first). | F31, E27 |\n| `SubagentStop` | \u2014 | Assert the Mapping Object holds `{route, bundle_ref, mapping_result, verifier_score, publish_outcome\\|hitl_outcome}`. Mark incomplete otherwise. | \u2014 |\n| `PostToolUse` | `*` (agent calls) | Emit per-agent input/output tokens, USD, and Neptune-query count (rediscovery detector). | \u2014 |\n\nRouting itself is **not** a hook because it is not LLM judgement \u2014 it is a deterministic\nrule in the orchestrator. The `UserPromptSubmit` hook simply validates that the route the\norchestrator stamped is one of the four and matches the payload shape.\n\n## settings.json (excerpt)\n\n```json\n{\n  \"hooks\": {\n    \"SessionStart\":    [{ \"hooks\": [{ \"type\": \"command\", \"command\": \".claude/hooks/pin_versions.sh\" }] }],\n    \"UserPromptSubmit\":[{ \"hooks\": [{ \"type\": \"command\", \"command\": \"python .claude/hooks/validate_bundle.py\" }] }],\n    \"PreToolUse\": [\n      { \"matcher\": \"neptune_publish_triples\", \"hooks\": [{ \"type\": \"command\", \"command\": \"python .claude/hooks/publish_gate.py\" }] },\n      { \"matcher\": \"neptune_.*|rdf_.*\",        \"hooks\": [{ \"type\": \"command\", \"command\": \"python .claude/hooks/reject_raw_query.py\" }] }\n    ],\n    \"PostToolUse\": [\n      { \"matcher\": \"submit_mapping\", \"hooks\": [\n          { \"type\": \"command\", \"command\": \"python .claude/hooks/run_verifier.py\" },\n          { \"type\": \"command\", \"command\": \"python .claude/hooks/confidence_floor.py\" }\n      ]},\n      { \"matcher\": \".*\", \"hooks\": [{ \"type\": \"command\", \"command\": \"python .claude/hooks/telemetry.py\" }] }\n    ],\n    \"SubagentStop\": [{ \"hooks\": [{ \"type\": \"command\", \"command\": \"python .claude/hooks/mapping_object_complete.py\" }] }]\n  }\n}\n```\n\n## publish_gate.py \u2014 the load-bearing one\n\n```python\n#!/usr/bin/env python3\n# PreToolUse on neptune_publish_triples. Deny exit code is 2 (stderr \u2192 the model).\nimport json, re, sys\n\nev = json.load(sys.stdin)\nti = ev.get(\"tool_input\", {})\nobj = ti.get(\"mapping_object\", {})          # the run's Mapping Object\ntriples = ti.get(\"triples\", [])\n\ndef deny(why: str):\n    print(f\"PUBLISH BLOCKED: {why}\", file=sys.stderr)\n    sys.exit(2)\n\n# 1. RESEARCH never publishes to iFusion (blueprint \u00a74.2)\nif obj.get(\"route\") == \"RESEARCH\":\n    deny(\"RESEARCH route produces an ontology-owner write-up, not a publish.\")\n\n# 2. Verifier gate, or explicit HITL routing (clarif. F31)\nv = obj.get(\"verifier_score\", {}).get(\"total\")\nif obj.get(\"hitl_outcome\") is None and (v is None or v < 16):\n    deny(f\"verifier total {v} < 16 and not routed to HITL.\")\n\n# 3. Replay-safety: deterministic IRIs + named-graph provenance (clarif. G39)\nIRI = re.compile(r\"^(mds\\.[a-z]+:[0-9a-f-]{36}|jpmorgan:data:cdao:)\")\nfor t in triples:\n    if not t.get(\"graph\"):\n        deny(\"a triple is missing its named graph (no provenance).\")\n    if not IRI.match(t.get(\"subject\", \"\")):\n        deny(f\"non-deterministic subject IRI: {t.get('subject')!r}\")\n\nsys.exit(0)  # allow\n```\n\nThe other scripts follow the same shape: read the event JSON, check a small invariant,\nexit 0 to allow or 2 (PreToolUse) to deny. Keep each to one concern.\n\n## Model portability \u2014 does this hold on older models?\n\nYes for the invariants, no for the quality \u2014 and that split is the whole point.\n\nEverything in the table above is **enforced outside the model**. A Haiku-class model, an\nolder Sonnet, or an LLMSuite/Azure-OpenAI model [clarif. 19] *cannot* publish below the\n0.80 floor, *cannot* skip the verifier, *cannot* publish on RESEARCH, *cannot* hand-write\nTurtle, and *cannot* mint a non-deterministic IRI \u2014 because the hook denies the tool call,\nnot because the model behaved. So safety and replay-correctness are model-independent.\n\nWhat degrades on a weaker model is **judgement**: lower first-pass mapping accuracy, more\nAmber/Red bands, more RESEARCH/RECONCILE, weaker confidence calibration, more missed\nself-flags. The visible effect is **more items falling to HITL and a lower auto-publish\nrate** \u2014 i.e. graceful degradation [clarif. 18], which JPMC approved \u2014 not bad data\nreaching Neptune.\n\nTwo caveats. (a) Skill auto-triggering and subagent dispatch themselves need some model\ncapability; that is why routing is a deterministic rule and the verifier is hook-invoked,\nnot left to the model to \"remember\". The more transitions you move from \"model does X\" to\n\"hook does X\", the lower your usable model floor. (b) The hardest judgement is the\nno-exact-match mapping \u2014 which is the core value [clarif. 83] \u2014 so keep your strongest\nmodel there and validate any cheaper swap against the golden set [clarif. 33] with the eval\nharness before trusting it. The nightly drift detector (CloudWatch alarm on >5pp accuracy\ndrop) catches a model regression in production.\n\n## JPMC translation\n\nBedrock has no direct hooks primitive. On Atlas the same invariants move to: Lambda\naction-group pre/post-processing (publish gate, schema validation), Bedrock Guardrails\n(the raw-query / output filter), and explicit verifier + floor steps the orchestrator runs\nbefore the publish action group. The enforcement stays deterministic; only the mechanism\nchanges.\n\n## Related\n\n- [Confidence bands & provenance (canonical)](/reference/matching-data-provenance.md)", "architecture/overview": "# SCUDO MatchMaker\n\nSCUDO MatchMaker turns inconsistent vendor product catalogues into governed,\nreusable mappings against a client-owned CDAO catalogue.\n\nIt combines deterministic matching, agent assistance, and human review. The\nagents can explain and improve the process, but they do not become the system\nof record. The core operating rule is:\n\n> **The matcher proposes a controlled result, agents add context, and people\n> decide what is uncertain.**\n\n## Live multi-vendor console\n\nA deployed mirror of this project with a broader vendor catalogue:\n\n[http://data-matching-console-1261515569.us-east-1.elb.amazonaws.com/app/catalogue?vendor=lseg](http://data-matching-console-1261515569.us-east-1.elb.amazonaws.com/app/catalogue?vendor=lseg)\n\n## Why it matters\n\nVendor catalogues are difficult to use consistently because product names,\nidentifiers, descriptions, classifications, and delivery terms vary by source.\nSCUDO MatchMaker provides a repeatable way to:\n\n- standardise vendor product metadata;\n- map products to a shared business taxonomy;\n- identify ambiguous or out-of-scope products;\n- give reviewers the evidence behind each recommendation;\n- preserve decisions and provenance for audit;\n- use approved decisions to improve future retrieval without silently changing\n  live behaviour.\n\nThe current product is a governed **vendor-to-taxonomy matching system**. It is\nnot yet a complete market-data procurement, spend, licence, usage, or\nentitlement optimisation platform.\n\n## Business flow\n\n```mermaid\nflowchart LR\n    vendor[Vendor catalogue] --> ingest[Ingest and normalise]\n    ingest --> candidates[Find relevant catalogue candidates]\n    candidates --> matcher[Deterministic matcher]\n    matcher --> agent[Agent explanation and specialist review]\n    agent --> gate{Confidence and policy gate}\n    gate -->|Clear result| persist[Persist governed mapping]\n    gate -->|Uncertain result| human[Human review]\n    human --> persist\n    persist --> feedback[Approved feedback improves future retrieval]\n```\n\nThe same product can be run through the browser, REST API, MCP tools, or the\norchestrated Lambda path. Those surfaces share the same catalogue contracts and\ngovernance rules, although their runtime wiring is not identical. The current\nimplementation documents those differences in [Technical architecture](#technical-architecture).\n\n## Decision controls\n\n| Control | Business meaning |\n|---|---|\n| Deterministic scope gate | An out-of-scope product is rejected before similarity or model judgement can change the result. |\n| Candidate anchoring | Agents work from candidates retrieved by the matching engine rather than inventing catalogue nodes. |\n| Confidence bands | Clear matches can proceed; borderline and weak matches are made visible for review. |\n| Human-in-the-loop | Reviewers can approve, override, or reject a decision. |\n| Provenance | Inputs, versions, rationale, confidence, and decisions can be traced together. |\n| Durable record | Aurora PostgreSQL is the target system of record for decisions, audit, lineage, and agent memory. |\n| Controlled learning | Recorded outcomes remain offline evidence until they pass holdout evaluation and receive named approval. |\n\n## What a reviewer sees\n\nThe dashboard is designed around the business decision rather than the\nunderlying infrastructure:\n\n1. A vendor file or product record enters the workflow.\n2. The interface shows normalisation, candidate retrieval, scoring, and the\n   confidence gate.\n3. The agent explains the candidate and the evidence it used.\n4. The reviewer sees the proposed mapping, alternatives, confidence, rationale,\n   and any policy or validation issue.\n5. The reviewer approves, overrides, or rejects the result.\n6. The decision becomes a reusable precedent for similar future products.\n\nThe review controls are intentionally visible even when a run has not yet\nproduced a decision. A reviewer cannot approve a missing candidate or override\nwithout an available alternative.\n\n## Controlled self-improvement\n\nSCUDO now has a governed foundation for improving both agent behaviour and\nmatching-engine quality.\n\n### How it works\n\n1. **Capture evidence.** Agent and deterministic-engine outcomes are stored as\n   structured trajectories with input, decision, provenance, and version data.\n2. **Curate a golden set.** Human-labelled examples are divided into training,\n   holdout, and adversarial cases. A holdout *evaluation* requires at least one\n   positive mapping example; abstention-only scenarios still load and remain\n   valuable adversarial evidence. Duplicate vendor/product identities across\n   splits are rejected.\n3. **Evaluate offline.** Candidate changes are measured for exact matching,\n   abstention recall, false auto-pass, calibration, Brier score, vendor\n   coverage, and taxonomy coverage. A product identity cannot appear in both the mined\n   training trajectories and the held-out evaluation partition.\n4. **Require approval.** A candidate must pass the holdout policy and receive\n   named approval before it can influence live prompts or skills.\n5. **Promote immutably.** The approved artifact is stored under a versioned\n   key, and a live pointer is updated only after the artifact is written.\n6. **Rollback by version.** Earlier approved artifacts remain identifiable and\n   can be restored by changing the live pointer.\n7. **Monitor promoted behavior offline.** A separate monitoring authority joins\n   predictions to authoritative outcomes and signs an immutable\n   `SignedMonitoringEnvelope` with its Ed25519 private key. The runtime monitor\n   receives only that envelope and configured audience, deployment, key ID, and\n   public key. It verifies the active UTC validity period and resolves every\n   signed observation against an immutable trajectory/audit source record before\n   evaluating fixed `monitor-v1` thresholds (20 total and 20 auto-pass\n   observations). Only complete windows atomically claim source events and\n   persist retain/rollback decisions. Insufficient samples, including zero\n   traffic, return `persisted=false` and claim nothing; the external scheduler\n   must retry until its deadline. `monitor-v1` never rolls back merely because\n   traffic is absent. Run the offline backend entrypoint with\n   `python -m scudo.scripts.monitor_promotion_window ENVELOPE.json --audience\n   AUD --deployment-id DEPLOYMENT --key-id KEY --public-key-file PUBLIC.pem`.\n   The scheduler and immutable source audit store are deployment prerequisites;\n   this repository deploys neither.\n\nRecording a trajectory does not change live matching. The deterministic matcher\nremains authoritative at request time, and legacy scalar-only skill records are\nquarantined rather than served to agents.\n\nAutomatic predictions are valid only at confidence `>= 0.80`. Human teaching\nmay create an exact-product precedent immediately, but generalized lessons stay\nquarantined as `rule_candidate` evidence until incorporated into a protected,\nevaluated, promoted artifact.\n\n### Offline evaluation command\n\nFrom `backend/`, evaluate saved agent or matcher results against a JSONL golden\nset:\n\n```bash\nPYTHONPATH=. python -m scudo.scripts.evaluate_matching_golden \\\n  --golden-set cases.jsonl \\\n  --golden-version golden-2026-07-16 \\\n  --predictions results.jsonl \\\n  --candidate-version matcher-v2\n```\n\nThe evaluator is report-only. It does not write Aurora, change thresholds, or\npromote an artifact.\n\nThe offline promotion entry points require a structured holdout report and\nnamed approval; scalar scores fail closed. The scheduler's dry-run invokes the\nsame promotion preflight as an apply run, but never writes an artifact or live\npointer. A holdout *evaluation* with no positive mapping examples is rejected:\ncorrectly abstaining is important, but it does not demonstrate matching\ncapability. A curated business golden set and a scheduled evaluation job are\nstill deployment inputs.\n\n## Current experience\n\n### Upload and Test\n\nThe primary dashboard flow supports:\n\n- CSV and JSON vendor uploads;\n- live ETL stage events;\n- candidate retrieval and matching;\n- agent activity and rationale;\n- confidence-band review;\n- approve, override, and reject actions;\n- repeat runs with reviewer-selected thresholds.\n\n### Matching Test\n\nThe narrower `/matching-test` experience supports:\n\n- selecting an available agent provider;\n- uploading a vendor file;\n- ingesting a website URL through the guarded ingestion path;\n- watching the agent run;\n- inspecting the final authoritative matcher result.\n\n### Demonstration endpoints\n\nKnown demonstration endpoints are documented here for stakeholder review. Use\nsynthetic data only, and treat these as closed demonstrations until the\nauthentication and deployment controls in [Open work and limits](#open-work-and-limits)\nare completed.\n\n- [Stakeholder dashboard](https://dp4ji14se0pct.cloudfront.net/cogJPMdemo/)\n- [Dashboard deployment](https://d2im563be0sl1r.cloudfront.net/demo/)\n- [Matching Test](https://d2im563be0sl1r.cloudfront.net/matching-test)\n- [Multi-vendor catalogue console (LSEG entry)](http://data-matching-console-1261515569.us-east-1.elb.amazonaws.com/app/catalogue?vendor=lseg) \u2014 mirror of this project with a broader vendor set\n\n## How matching works\n\nThe matcher uses a first-match-wins cost ladder:\n\n1. **Scope:** check whether the product is eligible for the requested\n   catalogue context.\n2. **Precedent:** reuse a confirmed human decision when one exists.\n3. **Retrieval:** find and rank a bounded set of catalogue candidates.\n4. **Validation:** run deterministic checks against the leading candidate.\n5. **Confidence gate:** classify the result as PASS, BORDERLINE, or FAIL.\n6. **Specialist, when appropriate:** use an agent only in the borderline\n   window and keep it anchored to the retrieved candidates.\n7. **Review or persistence:** clear results proceed through the applicable\n   publish controls; uncertain results go to human review.\n\nThe default business bands are:\n\n| Band | Default score | Meaning |\n|---|---:|---|\n| PASS | `>= 0.80` | Strong candidate, subject to validation and publish controls. |\n| BORDERLINE | `0.70 - <0.80` | Evidence is useful but not decisive; specialist or human review may be required. |\n| FAIL | `<0.70` | Insufficient confidence for unattended mapping. |\n\nThe public REST path requires specialist confirmation for borderline cases. Some\nlibrary and agent paths use the configured floor as a fallback when no\nspecialist is available. This is an implementation distinction, not a change to\nthe business policy that uncertain work must remain reviewable.\n\n## Human review and feedback\n\nHuman review is a control point, not an exception path.\n\n- **Approve** confirms the proposed mapping.\n- **Override** records a different catalogue node.\n- **Reject** records that the candidate is not suitable.\n\nDecisions are bound to the authenticated reviewer, retain the source and\ndecision provenance, and can influence future candidate ranking through a\nprecedent overlay. The graph store is a retrieval index; it is not the\nauthoritative record of what the business decided.\n\n## Data and catalogue scope\n\nThe catalogue model supports both:\n\n- business catalogue concepts such as products, datasets, distributions,\n  services, delivery channels, fields, and taxonomies;\n- rights and contract concepts such as parties, contracts, policies, duties,\n  permissions, obligations, and documents.\n\nRights and scope checks are deterministic and fail closed. Similarity alone\ndoes not grant entitlement. The rights graph is available as context, but the\ncurrent matching product should not be described as a complete automated\nlicence or entitlement decision system.\n\nVendor ingestion currently supports the normalised frame contract used by the\nmatching engine, with adapters for CSV, JSON, XML, XLSX, and guarded URL\ningestion paths. Source hashes and audit identifiers are preserved when the\nupstream source provides them.\n\n## Current status\n\n### Implemented and verified\n\n-
