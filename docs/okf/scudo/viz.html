_provenance.py`\n\nThe current script emits MatchPayload only \u2014 this broke `:5177`. Restore KnowledgeGraph output as the primary artifact.\n\n- [x] **Step 1: Write failing test for graph schema**\n\nAdd to `backend/scudo/tests/test_provenance.py`:\n\n```python\ndef test_matching_graph_is_knowledge_graph_schema():\n    path = Path(__file__).resolve().parents[1] / \"fixtures\" / \"matching-graph.json\"\n    raw = json.loads(path.read_text())\n    assert raw.get(\"kind\") == \"codebase\"\n    assert \"layers\" in raw and len(raw[\"layers\"]) >= 4\n    assert \"tour\" in raw and len(raw[\"tour\"]) >= 3\n    assert \"project\" in raw\n    node = raw[\"nodes\"][0]\n    assert \"summary\" in node and \"name\" in node\n```\n\n- [x] **Step 2: Run test to verify it fails**\n\nRun: `cd backend && PYTHONPATH=. pytest scudo/tests/test_provenance.py::test_matching_graph_is_knowledge_graph_schema -v`  \nExpected: FAIL (`kind` missing or file has MatchPayload `meta` top-level)\n\n- [x] **Step 3: Rewrite build_matching_graph.py**\n\nEmit structure matching the dashboard template:\n- Top-level: `version`, `kind: \"codebase\"`, `project`, `nodes`, `edges`, `layers`, `tour`\n- Pipeline nodes: `etl-*`, `match-*`, `orch-*`, `store-*` (reuse ids from template)\n- CDAO nodes: read from `cdao_catalogue.json` with `jpmorgan:data:cdao:*` ids; `summary` = caption\n- Vendor products: `mds.<vendor>:<uuid>` or `vendor:<vendor>:<product_id>` ids matching existing dashboard edges\n- Edge `data.band` + `weight` on candidate edges; band thresholds from `config.py` (0.85 / 0.75)\n- **Remove** all Marketing nodes, layers, tour steps, vendor `LSEG-MKT-ASSETS`\n- Gate/orchestration summaries use **matcher bands** (0.85 / 0.75), not diagram \"80% / 70%\"\n\nAlso write `fixtures/meta.json` sidecar:\n\n```json\n{ \"dataProvenance\": \"synthetic\", \"bands\": { \"pass\": 0.85, \"borderline\": 0.75 } }\n```\n\n> **Stale as of 2026-08-17 \u2014 historical record.** Step 3 above (and this JSON block) states\n> the bands as of 2026-06-24. The floor moved to `0.75` (PASS `0.80` / FAIL `0.70`) under\n> `docs/superpowers/plans/2026-07-04-scudo-5zone-alignment.md` Task 1. Retained unedited as\n> the record of what was true then. Live values:\n> `docs/superpowers/matching-data-provenance.md`.\n>\n> **The instruction was superseded by a better outcome \u2014 do not re-apply it.** The builder no\n> longer hardcodes band values at all: `backend/scudo/build_matching_graph.py:33-34` derives\n> them from config \u2014\n> `PASS_THRESHOLD = pass_threshold()` / `BORDERLINE_THRESHOLD = borderline_threshold()`\n> (imported from `scudo_mapping_mcp.config` at lines 29-30) \u2014 and every emission site uses\n> those constants (`:90` caption, `:129`/`:131` banding, `:515-516`, `:1371-1372` the\n> `meta.json` sidecar). So the shipped artifact tracks config automatically. Measured\n> 2026-08-17 \u2014 `cat backend/scudo/fixtures/meta.json` really contains:\n>\n> ```json\n> {\n>   \"dataProvenance\": \"synthetic\",\n>   \"bands\": {\n>     \"pass\": 0.8,\n>     \"borderline\": 0.7\n>   }\n> }\n> ```\n\n- [x] **Step 4: Regenerate and run tests**\n\nRun: `cd backend && python -m scudo.build_matching_graph && PYTHONPATH=. pytest scudo/tests/test_provenance.py -v`  \nExpected: PASS\n\n- [ ] **Step 5: Commit** *(deferred \u2014 not requested)*\n\n```bash\ngit add backend/scudo/build_matching_graph.py backend/scudo/fixtures/matching-graph.json backend/scudo/tests/test_provenance.py\ngit commit -m \"fix: emit KnowledgeGraph matching-graph for dashboard compatibility\"\n```\n\n---\n\n### Task 1: Sync script + dashboard static files\n\n**Files:**\n- Create: `backend/scudo/scripts/sync_matching_graph_to_dashboard.sh`\n- Modify: `packages/dashboard/public/matching-graph.json` (via sync)\n- Create: `packages/dashboard/public/meta.json`\n\n- [x] **Step 1: Create sync script**\n\n```bash\n#!/usr/bin/env bash\nset -euo pipefail\nROOT=\"$(cd \"$(dirname \"$0\")/../../..\" && pwd)\"\nDASH=\"${DASHBOARD_DIR ng-graph.json` in `public/`  \nOpen `http://127.0.0.1:5177/?token=...` \u2014 banner visible at top.\n\n- [ ] **Step 4: Commit** *(deferred \u2014 not requested)* (dashboard repo)\n\n---\n\n### Task 3: Matching-mode chrome (hide code-comprehension controls)\n\n**Files:**\n- Modify: `packages/dashboard/src/App.tsx`\n\n- [x] **Step 1: Detect matching mode**\n\n```typescript\nconst isMatchingMode =\n  import.meta.env.VITE_MATCHING_MODE === \"true\" ||\n  graph?.project?.name?.includes(\"SCUDO Matching\");\n```\n\n- [x] **Step 2: Conditionally hide controls** \u2014 also updated `MobileLayout.tsx`, `MobileBottomNav.tsx`, `MobileDrawer.tsx`\n\nWhen `isMatchingMode`:\n- Do not render: `FileExplorer`, `CodeViewer`, `PathFinderModal` trigger, domain/structural toggles if they error\n- Keep: `GraphView`, `NodeInfo`, `LayerLegend`, `ProjectOverview`, tour/onboarding, `SearchBar`\n\n- [x] **Step 3: Manual verify on :5177**\n\nClick through toolbar \u2014 no file explorer, no broken view-mode buttons.\n\n- [ ] **Step 4: Commit** *(deferred \u2014 not requested)* (dashboard repo)\n\n---\n\n### Task 4: Revert rejected frontend/ bolt-on\n\n**Files:**\n- Delete: `frontend/src/pages/mapping/PipelineView.jsx`, `MatchDrillDown.jsx`, `MappingPipelinePage.jsx`, `MappingDrillDownPage.jsx`, `MappingLayout.jsx`, `MappingGraphContext.jsx`, `MappingAgentLab.jsx`, `StageNode.jsx`, `mappingConstants.js`, `pipeline-layout.js`\n- Modify: `frontend/src/App.jsx` \u2014 remove `/mapping` routes\n- Modify: `frontend/src/components/Layout.jsx` \u2014 remove SCUDO nav link\n- Modify: `frontend/package.json` \u2014 remove `reactflow` if only used by mapping\n\n- [x] **Step 1: Remove routes and files**\n\n- [x] **Step 2: Verify ingestion console still builds**\n\nRun: `cd frontend && npm run build`  \nExpected: PASS, no mapping routes\n\n- [ ] **Step 3: Commit** *(deferred \u2014 not requested)*\n\n```bash\ngit commit -m \"revert: remove rejected /mapping bolt-on from ingestion console\"\n```\n\n---\n\n### Task 5: Fix GET /api/mapping/graph\n\n**Files:**\n- Modify: `backend/routes/mapping.py`\n- Test: `backend/tests/test_mapping_graph_route.py`\n\n- [x] **Step 1: Write failing test**\n\n```python\ndef test_mapping_graph_returns_200(client):\n    r = client.get(\"/api/mapping/graph\")\n    assert r.status_code == 200\n    body = r.get_json()\n    assert body[\"meta\"][\"dataProvenance\"] == \"synthetic\"\n    assert \"nodes\" in body\n```\n\n- [x] **Step 2: Run test \u2014 expect FAIL if 500**\n\nRun: `cd backend && PYTHONPATH=. pytest tests/test_mapping_graph_route.py -v`\n\n- [x] **Step 3: Fix route** \u2014 uses `build_match_payload()` with `MemoryStore` (no FalkorDB required offline)\n\n- [x] **Step 4: Run test \u2014 expect PASS** \u2014 2 tests including vendor drill-down\n\n- [ ] **Step 5: Commit** *(deferred \u2014 not requested)*\n\n---\n\n### Task 6: FalkorDB stale node cleanup\n\n**Files:**\n- Modify: `backend/scudo/seed_falkordb.py` or add `backend/scudo/scripts/cleanup_stale_cdao.py`\n\n- [x] **Step 1: Script deletes nodes matching** `Marketing`, `urn:cdao`, `cdao:` \u2014 `cleanup_stale_cdao.py` with `--dry-run`\n\n- [ ] **Step 2: Re-seed from catalogue** *(script ready; not run \u2014 FalkorDB may not be up)*\n\nRun: `python backend/scudo/seed_falkordb.py` (with FalkorDB up)\n\n- [ ] **Step 3: Commit** *(deferred \u2014 not requested)*\n\n---\n\n### Task 7: Owner verification checkpoint (HARD GATE)\n\n- [x] **Step 1: Start stack** \u2014 verified on `:5179` (5177 in use); graph loads with 42 nodes + tour\n\n```bash\n# terminal 1: backend on 5001\ncd backend && FLASK_APP=app.py python -m flask run --port 5001\n# terminal 2: dashboard on 5177\ncd packages/dashboard && pnpm dev --port 5177\n```\n\n- [x] **Step 2: Capture screenshots** \u2014 tour welcome + pipeline visible (agent session)\n\n- Full pipeline overview (layers visible, left-to-right flow)\n- Gate node selected (band legend visible)\n- ILLUSTRATIVE banner visible\n- Tour step 1\n\n- [ ] **Step 3: Owner sign-off** before any AWS deploy work.\n\n---\n\n## Plan self-review (vs spec)\n\n| Spec requirement | Task | Done? |\n|------------------|------|-------|\n| D-1 dashboard ships | Tasks 0\u20133 | \u2705 |\n| D-2 matcher bands | Task 0 summaries + edge data | \u2705 |\n| D-3/D-4 IRIs, no Marketing | Task 0 + grep in test | \u2705 |\n| Phase 0 provenance banner | Task 2 | \u2705 |\n| Phase 1 hide dead controls | Task 3 | \u2705 |\n| Revert frontend bolt-on | Task 4 | \u2705 |\n| Phase 2 API | Task 5 | \u2705 |\n| FalkorDB cleanup | Task 6 | \u23f3 script only |\n| Owner gate | Task 7 | \u23f3 pending sign-off |\n\n**Open decision for deploy plan:** monorepo strategy (git submodule vs vendor copy of dashboard into MatchMaker).\n\n---\n\n## Execution handoff\n\n**Plan implemented 2026-06-24** via subagent-driven development. Remaining before AWS deploy:\n\n1. Owner sign-off on `:5177` screenshots (Task 7)\n2. Git commits (MatchMaker + dashboard repos)\n3. Live FalkorDB cleanup when graph is up\n4. Write/execute `docs/superpowers/plans/2026-06-24-scudo-matching-deploy.md` (Phase 3\u20134)\n\n## Related\n\n- [Matching frontend spec](/specs/matching-frontend.md)", "plans/matching-frontend-and-deploy": "# SCUDO Matching Front-End Correctness + Console Deployment Implementation Plan\n\n> **\u26a0\ufe0f SUPERSEDED for front-end target (2026-06-24):** Owner chose the **understand-anything dashboard** (`:5177`), not a port into `frontend/`. Binding spec: `docs/superpowers/specs/2026-06-24-scudo-matching-frontend-spec.md`. Executable plans split into:\n> - **Data + dashboard:** `docs/superpowers/plans/2026-06-24-scudo-matching-dashboard.md` \u2014 **IMPLEMENTED** (Tasks 0\u20136; Task 7 owner sign-off pending)\n> - **AWS deploy:** start only after owner approves `:5177` screenshots (Phase 3\u20134 below, revised for dashboard build)\n>\n> The body below retains Codex review findings (C-1\u2013C-8) for reference; **C-1 decision is now D-1 in the spec (ship dashboard).**\n\n> **For agentic workers:** REQUIRED SUB-SKILL: Use superpowers:subagent-driven-development (recommended) or superpowers:executing-plans to implement this plan task-by-task. Steps use checkbox (`- [ ]`) syntax for tracking.\n\n**Goal:** Make the SCUDO vendor\u2192CDAO matching front-end *demonstrably honest and faithful to the architecture diagram*, then deploy the console to AWS so it can be shown to stakeholders without misrepresenting fabricated data as real.\n\n**Architecture:** Two front-end views over the SCUDO matcher \u2014 a **macro \"pipeline\" view** that faithfully reproduces the AIA architecture diagram's deliberate flow (ETL \u2192 A/B/C \u2192 confidence gate \u2192 bands \u2192 JAPI persist), and a **micro \"match drill-down\"** showing one vendor product's candidates, scores, and band. Backend exposes a real `GET /api/mapping/graph`. The console (Flask + React SPA) deploys on AWS via CloudFront \u2192 ALB \u2192 ECS Fargate, consuming Codex-owned Aurora MySQL.\n\n**Tech Stack:** Python 3.12 / Flask (backend + matcher), React 19 + Vite + `@xyflow/react` (front-end), AWS CloudFormation (CodeBuild + CloudShell deploy pattern), us-east-1.\n\n---\n\n## \u26d4 READ FIRST \u2014 Why this plan exists\n\nThe current matching front-end was rejected by the product owner. **Mock data is acceptable** \u2014 the owner said so directly: *\"I don't mind it mocked, but if you're mocking the base, you need to be able to tell a story and convey flow throughout the setup\u2026 every part should be capable of 'expositional' context.\"* The defects are about **coherence, honesty, and exposition**, not about the data being synthetic:\n\n1. **Incoherent mock + presented as real (BLOCKER).** The mock CDAO taxonomy includes a **\"Marketing\" domain** (`backend/scudo/fixtures/cdao_catalogue.json`) that makes no sense for the financial-data vendors in the demo (LSEG, S&P Global, ICE) \u2014 it reads as a hallucination and *breaks the story*. It is also under a made-up IRI scheme `urn:cdao:*` while the canonical scheme is `jpmorgan:data:cdao:*` (`backend/scudo/orchestrator.py:44`), and nothing in the UI signals the data is illustrative. **Product owner: \"we can't wire this in without getting our asses chewed.\"** The risk is not \"mock data\" \u2014 it is *incoherent* mock data shown *as if it were the real bank taxonomy*.\n2. **The graph has no deliberate flow and no exposition.** The architecture diagram (reference: `docs/superpowers/scudo-agentic-architecture.drawio`, and the image the owner shared) has a deliberate left-to-right pipeline where each stage clearly leads to the next. The current dashboard uses generic auto-layout (ELK over collapsible clusters) which scatters the nodes, conveys no flow, and \u2014 critically \u2014 **no part explains itself**. The owner needs every stage/node to carry *expositional context*: what it is, what it consumes, what it produces, and how it advances the vendor\u2192CDAO matching story.\n3. **Buttons don't work.** The front-end is the `understand-anything` *code-comprehension* dashboard repurposed for matching. Its controls (`domain`/`structural` view modes, `file`/`class` detail levels, file explorer, code viewer, pathfinder \u2014 see `packages/dashboard/src/App.tsx:458-597`) are meaningless or broken in a matching context.\n\n**The root cause of #2 and #3 is the same:** a generic code-graph explorer is being forced to do a job it was not built for. This plan treats that head-on (Phase 1 decision).\n\n**Two disciplines apply to every task:**\n- **Honesty:** synthetic data is fine, but it must be *unmistakably labelled* \"ILLUSTRATIVE / SYNTHETIC\" in the UI and the data file. Never let mock data read as the real CDAO taxonomy.\n- **Exposition:** the mock must *tell the end-to-end matching story*. The taxonomy must be coherent with the vendor products (financial market/reference data, not Marketing), and **every part \u2014 each pipeline stage, each node, each match \u2014 must be able to explain itself in context** (a short expositional caption + a guided walkthrough). A viewer should be walked through \"vendor product arrives \u2192 parsed \u2192 semantically matched \u2192 scored \u2192 gated by confidence \u2192 routed \u2192 persisted\" as a narrative.\n\n---\n\n## \ud83d\udd2c CODEX REVIEW \u2014 verified findings & incorporated revisions (2026-06-24, thread 019ef87c)\n\nAn independent Codex pass verified the repo and found errors in the first draft. All findings below were **hand-verified against the repo** and are now binding corrections \u2014 they OVERRIDE any contradicting detail later in this doc until that detail is rewritten.\n\n**C-1 (CRITICAL \u2014 front-end target was wrong).** The matching visualisation I built earlier lives in a **separate repo**: `Understand-Anything/understand-anything-plugin/packages/dashboard` (React 19 + `@xyflow/react`). The **deployed console front-end is THIS repo's `frontend/`** \u2014 React **18.3** + Vite 6, **no `@xyflow/react`** (`frontend/package.json:13`), entry `frontend/src/App.jsx`, matching demo at `frontend/src/pages/mapping/MappingDemo.jsx`. The CodeBuild deploy does `cd frontend && npm run build`. **DECISION REQUIRED (Task 1.0):** either (a) port the macro/micro matching views INTO `frontend/` (React 18 \u2014 use a React-18-compatible graph lib: `reactflow` v11 or `cytoscape`, per the original deployment plan which already specced `cytoscape`), or (b) deploy the understand-anything dashboard as a separate artifact and point CodeBuild at it. Do NOT assume `packages/dashboard` is what ships. Every `packages/dashboard/...:line` reference below is from the OTHER repo and is illustrative only.\n\n**C-2 (CRITICAL \u2014 confidence bands were wrong).** Matcher reality (`backend/scudo_mapping_mcp/config.py:44` `CONFIDENCE_FLOOR=0.80`; `matching.py:44-55`): **PASS \u2265 floor+0.05 = 0.85; BORDERLINE within \u00b10.05 of floor = 0.75\u20130.85; FAIL < floor\u22120.05 = 0.75.** The architecture diagram says \"80% floor / 70-79% / \u226580%\" \u2014 that DISAGREES with the code. **Reconcile (Task 0.0):** decide with the owner whether the diagram narrative or the config is canonical, then make UI band labels + edge colouring use the SAME numbers as the matcher. Do not hardcode 0.80/0.70 anywhere.\n\n**C-3 (infra already exists \u2014 revise, don't recreate).** `infra/scudo-poc-foundation.yaml`, `infra/scudo-poc-app.yaml`, `infra/scudo-poc-frontend.yaml`, `infra/scudo-poc-build.yaml` already exist (Jun 23). Phase 3 must **read and revise these in place**, not create `-console-` duplicates (duplicate ECR/export/resource names will fail against deployed stacks). First task of Phase 3 is to diff the existing files against the requirements below.\n\n**C-4 (data cleanup scope incomplete).** `backend/scudo_mapping_mcp/ingest.py` ALSO emits `cdao:*` IRIs and Flask startup seeds from it (`backend/routes/mapping.py:39`). Phase 0 must include `ingest.py`, the regenerated `matching-graph.json`, and a **live FalkorDB cleanup** (stale Marketing/`urn:cdao`/`cdao:` nodes persist in the running graph). Add repo + API grep gates asserting none of `Marketing`, `urn:cdao`, bare `cdao:` survive.\n\n**C-5 (caption/provenance can't round-trip the store).** `TaxonomyNode` (`backend/scudo_mapping_mcp/models.py:63`) has only `iri/label/parent_iri/children_iris` \u2014 no description/caption, and `seed_falkordb.py` does not persist one. The `GET /api/mapping/graph` route must **join caption/provenance from the fixture at response time** (or extend the store schema). Don't assume captions survive the store.\n\n**C-6 (schema guard too weak).** Guarding only on `metadata.users` empty can still DROP populated `tp_*`. Use a **migration sentinel** (e.g. a `schema_migrations` row) AND check `tp_provider`/`tp_dataset`/`tp_dataset_col` row counts before running `init_db.sql`.\n\n**C-7 (CloudFront `/healthz`).** Plan routes only `/api/*` to the ALB but smoke-tests `https://<cf>/healthz` \u2014 that 404s. Either add a `/healthz` ALB behaviour OR smoke via `/api/mapping/vendors`. (Existing `infra/scudo-poc-frontend.yaml:102` only forwards `/api/*` + `/mcp/*`.)\n\n**C-8 (auth is public-demo unsafe).** `SCUDO_AUTH_ALLOW_DEV=1` authenticates EVERY caller as the dev principal; the CloudFront origin prefix-list limits direct ALB access but does NOT authenticate viewers. Add a CloudFront\u2192ALB **secret origin header** check (or IP allowlist / real auth) before this is shown outside a controlled demo.\n\n**Codex also recommends splitting this into two executable plans** \u2014 *Plan 1: front-end + data correctness* (Phases 0\u20132, gated by owner screenshots) and *Plan 2: AWS deploy* (Phases 3\u20134, only after Plan 1 passes). This doc keeps them together but the Phase 2\u21923 boundary is a HARD GATE: do not start Phase 3 until Phases 0\u20132 are owner-approved.\n\n---\n\n## Global Constraints\n\n- **AWS account:** `954976331678` (`cb4115669a-genaipocs-aw`), region **us-east-1** only.\n- **Do NOT edit Codex-owned files:** `backend/scudo/data-platform.yaml`, `backend/scudo/build-pipeline.yaml`, `backend/scudo/template.yaml`. These provision/deploy the **Lambda** runtime and the data platform. The console is a *separate* set of stacks.\n- **Console deploys are a distinct stack set** named `scudo-poc-console-*` so they never collide with Codex's `scudo-poc-*` Lambda stacks. The console-build CloudFormation stack/CodeBuild project is `scudo-poc-console-build` (NOT `scudo-poc-build`, which is Codex's).\n- **Repo is public:** `github.com/2096955/MatchMaker`, working branch `scudo-phase0-foundations`. Deploys clone this branch in CodeBuild.\n- **Local shell has no AWS creds.** All AWS provisioning runs in the user's authenticated **CloudShell** (us-east-1). Local commands (commit/push, tests, builds) run via the session's permission prompts.\n- **Canonical IRI schemes (verbatim, `orchestrator.py:44`):** vendor products `mds.<vendor>:<uuid5>`; CDAO nodes `jpmorgan:data:cdao:<...>`. The mock `urn:cdao:*` scheme is WRONG and must not appear in any shipped artifact.\n- **Confidence bands (CODE REALITY \u2014 see C-2):** floor `CONFIDENCE_FLOOR=0.80`, half-width `0.05` \u2192 **PASS \u2265 0.85; BORDERLINE 0.75\u20130.85; FAIL < 0.75**. The architecture diagram's \"80% / 70-79%\" disagrees with the code; reconcile in Task 0.0 and use ONE set of numbers everywhere (matcher = source of truth unless the owner changes the config).\n- **Auth (PoC):** dev-auth only \u2014 `SCUDO_AUTH_ALLOW_DEV=1`, `SCUDO_AUTH_DEV_PRINCIPAL=2096955@cognizant.com`. This is a flagged sandbox simplification, NOT real auth. Lock the ALB to the CloudFront origin prefix list; same-origin (drop wildcard CORS at `backend/app.py:53`).\n- **Brand palette (Cognizant, from NeuroSAN UI \u2014 verified):** canvas `#f5f3ef`, surface `#ffffff`, text `#1a1a1a`/`#8b8680`, accent **`#1a5ecf`**, green `#66bb6a`, connector grey `#d0cbc5`. Light theme.\n- **Never say \"production ready\" or \"fully operational\"** in any status, comment, or copy. Say \"complete and ready for review.\"\n- **Secrets:** never commit or paste the AWS `/run` API key or the AppSync API key. Console DB creds come from Secrets Manager only.\n\n---\n\n## File Structure\n\n**Front-end \u2014 THIS repo's `frontend/` (React 18.3 + Vite 6, the artifact CodeBuild ships). See C-1 + Task 1.0 for the port-vs-separate decision.** Paths below assume porting into `frontend/` (recommended); adjust if the owner picks \"deploy dashboard separately\". Use a React-18 graph lib (`reactflow` v11 or `cytoscape`), NOT `@xyflow/react` (that's React 19, the other repo).\n- `frontend/src/pages/mapping/PipelineView.jsx` \u2014 NEW. Bespoke macro architecture-flow view (faithful to the diagram).\n- `frontend/src/pages/mapping/pipeline-layout.js` \u2014 NEW. Curated/pinned node positions + edges for the deliberate flow.\n- `frontend/src/pages/mapping/MatchDrillDown.jsx` \u2014 NEW. Micro view: one vendor product's candidates, sco Provenance;            // REQUIRED \u2014 drives the \"SYNTHETIC\" badge\n  caption: string;                   // REQUIRED \u2014 expositional one-liner (\u2264140 chars)\n}\nexport interface MatchEdge {\n  source: string; target: string;\n  band?: Band;                       // routing/candidate edges\n  weight?: number;                   // similarity in [0,1] for candidate edges only\n  kind: \"candidate\" | \"chosen\" | \"route\" | \"hierarchy\" | \"flow\";\n}\nexport interface MatchPayload {\n  meta: { generatedAt: string; dataProvenance: \"real\" | \"synthetic\"; bands: {pass:number; borderline:number} };\n  nodes: MatchNode[];\n  edges: MatchEdge[];\n}\n```\n\n- **Produced by:** Task 2.1 (`build_matching_graph.py`) and Task 2.2 (`GET /api/mapping/graph`).\n- **Consumed by:** Phase 1 front-end views.\n\n---\n\n## PHASE 0 \u2014 Coherent, Labelled, Expositional Mock Data (BLOCKER \u2014 nothing ships until this passes)\n\nMock data is acceptable. The bar is: (1) **coherent** with the vendor-matching story, (2) **labelled** as illustrative, (3) **expositional** \u2014 every node carries a one-line caption explaining its role.\n\n### Task 0.0: Reconcile the confidence bands (DECISION REQUIRED \u2014 see C-2)\n\nThe matcher code says PASS \u2265 0.85 / BORDERLINE 0.75\u20130.85 / FAIL < 0.75 (`config.py:44`, `matching.py:44-55`); the architecture diagram says 80% / 70-79% / \u226580%. They disagree.\n\n- [ ] **Step 1:** Use AskUserQuestion: is the matcher config canonical (update the diagram narrative + any UI copy to 0.85/0.75), or should the config change to match the diagram (edit `CONFIDENCE_FLOOR`/`BORDERLINE_HALF_WIDTH`)?\n- [ ] **Step 2:** Record one canonical band definition in `docs/superpowers/matching-data-provenance.md`; every later task (UI labels, edge colours, captions) uses exactly those numbers.\n\n**Acceptance:** A single band definition exists and matches the matcher's runtime behaviour.\n\n### Task 0.1: Audit and classify every data value the U nance\": \"synthetic\"` to every node and a top-level dataset label `\"ILLUSTRATIVE \u2014 synthetic CDAO taxonomy for demonstration\"`.\n- [ ] **Step 5:** Commit `data(scudo): coherent + captioned synthetic CDAO taxonomy (drop incoherent Marketing branch)`.\n\n**Acceptance:** No incoherent nodes remain; every node has a caption + provenance; canonical IRI scheme used.\n\n### Task 0.3: `build_matching_graph.py` propagates provenance + captions; test enforces it\n\n**Files:** Modify `backend/scudo/build_matching_graph.py`.\n\n- [ ] **Step 1: Write the failing test** `backend/scudo/tests/test_provenance.py`:\n```python\nimport json, subprocess, sys, os\ndef test_every_node_is_labelled_and_expositional():\n    subprocess.run([sys.executable, \"-m\", \"scudo.build_matching_graph\"], cwd=\"backend\", check=True,\n                   env={**os.environ, \"STORE_BACKEND\": \"memory\", \"FRAME_SOURCE\": \"mock\"})\n    g = json.load(open(\"backend/scudo/fixtures/matching-graph.json\"))\n    for n in g[\"nodes\"]:\n        assert \"provenance\" in n, f\"{n['id']} missing provenance\"\n        assert n.get(\"caption\"), f\"{n['id']} missing expositional caption\"\n        assert not n[\"id\"].startswith(\"urn:cdao:\"), f\"{n['id']} uses the fabricated scheme\"\n    assert g[\"meta\"][\"dataProvenance\"] == \"synthetic\"\n    assert \"marketing\" not in json.dumps(g).lower(), \"incoherent Marketing branch still present\"\n```\n- [ ] **Step 2:** Run; expect FAIL.\n- [ ] **Step 3:** Implement: emit `provenance` + `caption` per node, `meta.dataProvenance`, drop `urn:cdao:`.\n- [ ] **Step 4:** Run; expect PASS.\n- [ ] **Step 5:** Commit.\n\n**Acceptance:** The test passes \u2014 the dataset is coherent, labelled synthetic, captioned, and free of the fabricated scheme/Marketing branch.\n\n---\n\n## PHASE 1 \u2014 Matching Comprehension Front-End\n\n### Task 1.0: DECISION \u2014 bespoke matching views vs. adapting the code-comprehension dashboard (DECISION REQUIRED)\n\n**Context for t hen D \u2192 **guarded one-time schema init in-VPC** (`CREATE DATABASE IF NOT EXISTS metadata; CREATE DATABASE IF NOT EXISTS ingestion;` then run `init_db.sql` **only if a `schema_migrations` sentinel row is absent AND `tp_provider`+`tp_dataset`+`tp_dataset_col` are all empty** \u2014 `init_db.sql` DROPs `tp_*` unconditionally, so the guard is load-bearing; write the sentinel after a successful init \u2014 see C-6) \u2192 `cd frontend && npm ci && npm run build` \u2192 `aws s3 sync dist/` \u2192 `cloudfront create-invalidation` \u2192 `aws ecs update-service --force-new-deployment`.\n- [ ] Write; validate; deploy the build *project*; commit.\n\n### Task 3.5: Flask task-def env (record verbatim in Stack C)\n```\nAWS_REGION=us-east-1\nmy_sql_host=<ImportValue scudo-poc-console-mysql-endpoint>\nmy_sql_port=3306\nmy_sql_user / my_sql_password   # via Secrets: from scudo-poc-console-mysql-secret-arn\nSTORE_BACKEND=falkordb\nFALKORDB_URL=falkordb://falkordb.scudo.local:6379\nGRAPH_NAME=scudo_mapping\nFRAME_SOURCE=mock\nCONFIDENCE_FLOOR=0.80\nBORDERLINE_HALF_WIDTH=0.05\nSCUDO_AGENT_BACKEND=scripted\nSCUDO_AUTH_ALLOW_DEV=1\nSCUDO_AUTH_DEV_PRINCIPAL=2096955@cognizant.com\n```\n(`db.py` already reads `my_sql_host`/`my_sql_port` from env \u2014 verified; `/healthz` exists.)\n\n---\n\n## PHASE 4 \u2014 Deploy + UI/UX verification\n\n### Task 4.1: Deploy sequence (CloudShell)\n- [ ] Push branch. In CloudShell: deploy Stack B (foundation), then Stack E (build project). Run `aws codebuild start-build --project-name scudo-poc-console-build`. One run builds the image, deploys C (ALB+ECS) + D (CloudFront), runs the guarded schema init, ships the SPA, forces ECS redeploy.\n- [ ] Confirm ECS service 1/1 healthy. Smoke via `https://<cloudfront-domain>/api/mapping/vendors` \u2192 200 (CloudFront only forwards `/api/*` to the ALB; `/healthz` at the CF root would 404 unless a `/healthz` behaviour is added \u2014 see C-7). The ALB target-group health check still uses `/healthz` directly.\n\n### Task 4.2: Playwright UI/UX pass (against the CloudFront URL)\n- [ ] **Honesty check FIRST:** the synthetic banner is visible (if path B); no fabricated \"Marketing\"/`urn:cdao:` value appears unlabelled.\n- [ ] Macro pipeline view reads left-to-right matching the diagram; three band colours present.\n- [ ] Micro drill-down: candidates + scores + band render for a product.\n- [ ] Every visible button produces a visible effect; zero console errors; `/api/*` returns 200.\n- [ ] Deep-link hard refresh of a non-`/api` route returns 200 (SPA fallback); an `/api/*` 404 returns JSON, not `index.html`.\n- [ ] Report results + remaining gaps to the owner. Do NOT call it \"production ready.\"\n\n---\n\n## Risks / Notes\n- **Reputational (highest):** fabricated CDAO taxonomy. Phase 0 is the gate; do not deploy past it without owner sign-off on the data path.\n- **FalkorDB is ephemeral** (no EFS) \u2014 confirmed HITL precedents are lost on task restart.\n- **Offline matcher returns low/`out_of_scope` confidence** without Bedrock embeddings; real bands appear only against AWS FalkorDB+Titan. Label scores accordingly in the UI.\n- **Cost ~$95\u2013120/mo** if left on 24/7 (ALB + Fargate + existing NAT). Tear down C/D between demos.\n- **Schema-init re-run wipes `tp_*`** \u2014 the guard is load-bearing.\n- **db.py env name must be exactly `my_sql_host`** or MySQL pages 500 while matcher/catalogue still work (confusing half-up state).\n\n## Codex review gate\n\u2705 **DONE (2026-06-24, thread 019ef87c).** Codex reviewed this plan against the repo; all findings were hand-verified and incorporated as the binding **\ud83d\udd2c CODEX REVIEW** section near the top (C-1\u2026C-8). Those corrections OVERRIDE any stale inline detail. A second Codex pass is recommended after the executing agent resolves the Task 1.0 (front-end target) and Task 0.0 (band) decisions, since those reshape Phase 1. Bash authorization for AWS provisioning remains the user's (CloudShell); local commands run via session permission prompts.", "plans/phase0-foundations": "# SCUDO Phase 0 \u2014 Foundations & Safety: Implementation Plan\n\n> **For agentic workers:** REQUIRED SUB-SKILL: Use superpowers:subagent-driven-development (recommended) or superpowers:executing-plans to implement this plan task-by-task. Steps use checkbox (`- [ ]`) syntax for tracking.\n\n**Goal:** Land the three safe, fully-grounded foundations from the SCUDO production roadmap \u2014 retire the dead Strands skeleton, close the export\u2192S3\u2192hydrate cycle, and make the orchestrator's Gate-2 thresholds config-driven \u2014 without changing any decision behavior.\n\n**Architecture:** SCUDO maps vendor products \u2192 CDAO taxonomy nodes through a deterministic cost-ladder matcher (`scudo_mapping_mcp/matching.py`) plus a Bedrock-wired orchestrator/verifier (`scudo/orchestrator.py`). Phase 0 hardens the seams these already expose; it adds no new infra and flips no defaults. Bigger moves (single-conductor consolidation, OpenSearch/SciPy arms, Aurora-canonical, DQ, JAPI ingestion) are deferred to their own plans (see *Downstream Roadmap*).\n\n**Tech Stack:** Python 3.12, Pydantic, boto3 (lazy), FalkorDB/Neptune/in-memory store seam, standalone smoke runners + pytest.\n\n---\n\n## Context \u2014 why this change\n\nThe gap analysis (`docs/superpowers/2026-06-16-scudo-architecture-gap-analysis.md`) found SCUDO's data plane real/demo-ready but production-incomplete. Two target diagrams (\"Matching Engine design proposal\", \"Matching engine drill-down\") sharpened the end state. A read-only recon of the actual code (5 Explore agents) then corrected several assumptions in the roadmap's draft \"Phase 0\":\n\n- **The WS-D specialist-anchored invariant is ALREADY SHIPPED.** `matching.py:309-350` fails closed to `NEEDS_REVIEW` with `invariant_violation=\"specialist_off_list\"` and caps confidence below floor when the specialist returns an off-list pick. It is covered by `TRUST_specialist_anchored_to_top_candidate` in `scudo_mapping_mcp/tests/smoke.py`. **No work \u2014 verify-only.**\n- **`map_vendor_product` already accepts `specialist=`** (an `Optional[SpecialistScorer]`, `matching.py:130-135`), consulted only in the borderline band.\n- **Confidence floor + borderline half-width are already env-overridable** via `Settings.from_env()` (`config.py:138-203`). The *orchestrator's* Gate-2 thresholds are NOT \u2014 they're module constants (`scudo/orchestrator.py:38-40`). That asymmetry is the real gap.\n- **The S3 *write* path genuinely does not exist.** `bundle.export_bundle()` returns an in-memory object; `hydrate()` reads from S3; nothing writes. The cycle is open.\n- **`scudo_strands_app.py` has zero references repo-wide** (verified by grep) \u2014 a 7\u00d7`NotImplementedError` blueprint safe to delete.\n- **The \"70-79 review\" Gate-1 band from the new diagram does NOT exist** and does not map onto the current PASS/BORDERLINE/FAIL model; adding it needs a new band variant + a ~160-line refactor. **Deferred to P1 (recalibration)** \u2014 not P0.\n\nIntended outcome: a clean, reversible foundation that the later phases build on, with every existing smoke gate still green.\n\n---\n\n## Files touched in Phase 0\n\n- **Delete:** `scudo_strands_app.py` (repo root) \u2014 dead skeleton.\n- **Modify:** `backend/scudo_mapping_mcp/hydrate.py` \u2014 add `export_to_s3()` (the writer; reuses `_s3_client()` + `_bundle_s3_location()`).\n- **Modify:** `backend/scudo_mapping_mcp/persistence_mcp.py` \u2014 add a new opt-in read-write MCP tool `persist.publish_bundle` (leaves the existing read-only `persist.export_bundle` untouched).\n- **Modify:** `backend/scudo/orchestrator.py` \u2014 `__init__` gains keyword Gate-2 threshold params (defaulting to today's constants); `_gate_and_decide` reads instance attrs.\n- **Test:** `backend/scudo_mapping_mcp/tests/smoke.py` (S3 round-trip case), `backend/scudo/tests/smoke.py` (config-override case).\n\nVerified anchors: `matching.py:130-135,246-249,275-436`; `config.py:44,49,138-203`; `orchestrator.py:38-40,55-78,151-152,215-260,319`; `hydrate.py:46-60,89,92-125,161-247`; `bundle.py:113-185`; `persistence_mcp.py:315-330`.\n\n---\n\n## Task 1: Retire the dead `scudo_strands_app.py` skeleton\n\n**Files:**\n- Delete: `scudo_strands_app.py` (repo root)\n\nThis is a deletion of verified dead code, so the regression gate is the existing smoke suites, not a new test.\n\n- [ ] **Step 1: Re-confirm zero references (do not trust the plan)**\n\nRun:\n```bash\ncd /Users/anthonylui/MatchMaker/MatchMaker && grep -rn \"scudo_strands_app\" --include=\"*.py\" . ; echo \"exit=$?\"\n```\nExpected: no matches (grep exit=1). If ANY match appears, STOP \u2014 the file is not dead; do not delete it, report the reference instead.\n\n- [ ] **Step 2: Capture the current green baseline**\n\nRun (from `backend/`):\n```bash\ncd /Users/anthonylui/MatchMaker/MatchMaker/backend && python -m scudo_mapping_mcp.tests.smoke && python -m scudo.tests.smoke && pytest scudo_mapping_mcp/tests/test_invariants.py -q\n```\nExpected: all three suites pass. Record the pass counts.\n\n- [ ] **Step 3: Delete the skeleton**\n\nRun:\n```bash\ncd /Users/anthonylui/MatchMaker/MatchMaker && git rm scudo_strands_app.py\n```\n\n- [ ] **Step 4: Re-run the suites \u2014 identical pass counts**\n\nRun the same command as Step 2. Expected: identical pass counts (nothing imported it, so nothing changes).\n\n- [ ] **Step 5: Commit**\n\n```bash\ncd /Users/anthonylui/MatchMaker/MatchMaker && git add -A && git commit -m \"chore(scudo): retire dead scudo_strands_app.py skeleton (zero refs)\n\nCo-Authored-By: Claude Opus 4.8 <noreply@anthropic.com>\"\n```\n\n---\n\n## Task 2: Close the export\u2192S3\u2192hydrate cycle (S3 write path)\n\n**Files:**\n- Modify: `backend/scudo_mapping_mcp/hydrate.py` (add `export_to_s3`)\n- Modify: `backend/scudo_mapping_mcp/persistence_mcp.py` (add `persist.publish_bundle` tool)\n- Test: `backend/scudo_mapping_mcp/tests/smoke.py`\n\nThe writer lives in `hydrate.py` (not `bundle.py`) because `bundle.py` is imported by `hydrate.py` \u2014 putting the writer in `bundle.py` would create a circular import. `hydrate.py` already owns `_s3_client()` (lines 56-60) and `_bundle_s3_location()` (lines 92-125), so the writer reuses them and writes to the exact location the reader reads.\n\n- [ ] **Step 1: Write the failing test (S3 round-trip)**\n\nAdd to `backend/scudo_mapping_mcp/tests/smoke.py`, modeled on the existing `M6_round_trip_reproduces_confirmed_mappings_in_fresh_env` case (~line 596) and the `HYDRATE_happy_path_applies_bundle_patterns` case (~line 2041). Reuse `_fresh_store()`, `_swap_settings`/`_restore_settings`, and `hydrate._set_s3_client_for_test`:\n\n```python\n@case(\"M6_export_to_s3_round_trips_through_hydrate\")\ndef _():\n    import io\n    import scudo_mapping_mcp.hydrate as hydrate_mod\n    from scudo_mapping_mcp.bundle import export_bundle\n\n    class _FakeS3:\n        def __init__(self):\n            self.store = {}\n        def put_object(self, *, Bucket, Key, Body, **kw):\n            self.store[(Bucket, Key)] = Body\n            return {}\n        def get_object(self, *, Bucket, Key):\n            if (Bucket, Key) not in self.store:\n                raise KeyError(\"NoSuchKey\")\n            return {\"Body\": io.BytesIO(self.store[(Bucket, Key)])}\n\n    # Populate a store with one confirmed precedent, then export it.\n    fake = _fresh_store()\n    ref = VendorProductRef(vendor=IN_SCOPE_VENDOR, product_id=\"EQ-1\",\n                           name=\"Equity Prices\")\n    node = TaxonomyNode(iri=EQ_PRICES_IRI, label=\"Equity Prices\")\n    fake.upsert_precedent(ref=ref, node=node, decision=\"approve\",\n                          decided_by=\"tester\", confidence=0.95,\n                          provisional=False, decided_at_ms=0)\n\n    s3 = _FakeS3()\n    hydrate_mod._set_s3_client_for_test(s3)\n    saved = _swap_settings(s3_bucket=\"test-bucket\")\n    try:\n        bundle = export_bundle(source_env=\"mock-local\",\n                               created_at=\"2026-01-01T00:00:00Z\")\n        bucket, key = hydrate_mod.export_to_s3(bundle)\n        assert (bucket, key) in s3.store, \"export_to_s3 wrote nothing to S3\"\n\n        # Fresh store + hydrate from the same fake S3 replays the precedent.\n        _fresh_store()\n        hydrate_mod._set_s3_client_for_test(s3)\n        result = hydrate_mod.hydrate(strict=True)\n        assert result.applied == 1, f\"expected 1 applied, got {result.applied}\"\n    finally:\n        _restore_settings(saved)\n        hydrate_mod._set_s3_client_for_test(None)\n```\n\n(If `upsert_precedent`'s kwargs differ in the FakeStore, copy the exact seeding call used by `M6_export_bundle_carries_confirmed_precedent_with_rank` at ~line 538.)\n\n- [ ] **Step 2: Run it \u2014 verify it fails**\n\nRun: `cd /Users/anthonylui/MatchMaker/MatchMaker/backend && python -m scudo_mapping_mcp.tests.smoke`\nExpected: FAIL \u2014 `AttributeError: module 'scudo_mapping_mcp.hydrate' has no attribute 'export_to_s3'`.\n\n- [ ] **Step 3: Implement `export_to_s3` in `hydrate.py`**\n\nAdd after `_bundle_s3_location()` (after line 125). It mirrors the reader's resolution exactly:\n\n```python\ndef export_to_s3(bundle: MappingBundle, *, uri: Optional[str] = None) -> tuple[str, str]:\n    \"\"\"Persist the canonical bundle JSON to the S3 location ``hydrate()`` reads.\n\n    Closes the export->hydrate cycle: ``bundle.export_bundle()`` builds the\n    snapshot, this writes it to ``s3://<bucket>/<key>``, and the next boot's\n    ``hydrate()`` replays it. Resolution matches ``_bundle_s3_location`` so a\n    writer and reader pointed at the same env round-trip.\n\n    Args:\n        bundle: the MappingBundle to persist.\n        uri: optional ``s3://bucket/key`` override; defaults to the canonical\n            location resolved exactly like the reader.\n\n    Returns:\n        (bucket, key) actually written.\n    \"\"\"\n    if uri:\n        if not uri.startswith(\"s3://\"):\n            raise HydrationError(f\"export_to_s3: uri must be s3://\u2026 got {uri!r}\")\n        bucket, _, key = uri[len(\"s3://\"):].partition(\"/\")\n        if not bucket or not key:\n            raise HydrationError(f\"export_to_s3: malformed uri {uri!r}\")\n    else:\n        bucket, key = _bundle_s3_location()\n\n    body = bundle.model_dump_json().encode(\"utf-8\")\n    _s3_client().put_object(\n        Bucket=bucket, Key=key, Body=body, ContentType=\"application/json\",\n    )\n    _log.info(\"export_to_s3: wrote canonical bundle to s3://%s/%s (%d bytes)\",\n              bucket, key, len(body))\n    return bucket, key\n```\n\n- [ ] **Step 4: Run it \u2014 verify it passes**\n\nRun: `cd /Users/anthonylui/MatchMaker/MatchMaker/backend && python -m scudo_mapping_mcp.tests.smoke`\nExpected: PASS, including the new case.\n\n- [ ] **Step 5: Wire the opt-in MCP tool in `persistence_mcp.py`**\n\nLeave the existing read-only `persist.export_bundle` (lines 315-330) untouched. Add a new read-write tool below it. `_RW` should mirror the annotation style of `_RO` already in the file (a read-write equivalent \u2014 if no `_RW` exists, declare `_RW = {\"readOnlyHint\": False}` near `_RO`):\n\n```python\n@mcp.tool(\n    name=\"persist.publish_bundle\",\n    annotations={\"title\": \"Export and publish the M6 bundle to canonical S3\", **_RW},\n)\nasync def publish_bundle_tool(params: BundleExportInput) -> str:\n    \"\"\"Build the confirmed-precedent bundle AND write it to the canonical S3\n    key that hydrate() reads at boot. Read-write: the only write side of the\n    export->hydrate cycle. Bucket/key resolve exactly like hydration.\"\"\"\n    bundle = export_bundle(\n        source_env=params.source_env,\n        created_at=params.created_at,\n    )\n    from .hydrate import export_to_s3\n    bucket, key = export_to_s3(bundle)\n    return json.dumps({\"bucket\": bucket, \"key\": key,\n                       \"patterns\": len(bundle.patterns)})\n```\n\n- [ ] **Step 6: Smoke the package suite again + commit**\n\nRun: `cd /Users/anthonylui/MatchMaker/MatchMaker/backend && python -m scudo_mapping_mcp.tests.smoke`\nExpected: PASS.\n\n```bash\ncd /Users/anthonylui/MatchMaker/MatchMaker && git add -A && git commit -m \"feat(scudo): S3 export path closes the export->hydrate cycle\n\nAdds hydrate.export_to_s3 (writer mirrors the reader's location) and an\nopt-in persist.publish_bundle MCP tool. Read-only persist.export_bundle\nis unchanged.\n\nCo-Authored-By: Claude Opus 4.8 <noreply@anthropic.com>\"\n```\n\n---\n\n## Task 3: Make the orchestrator's Gate-2 thresholds config-driven (behavior-preserving)\n\n**Files:**\n- Modify: `backend/scudo/orchestrator.py:55-78` (`__init__`) and `:215-260` (`_gate_and_decide`)\n- Test: `backend/scudo/tests/smoke.py`\n\nThe module constants `VERIFIER_AUTOPUBLISH=16`, `VERIFIER_RETRY_LO,HI=12,15`, `CONFIDENCE_FLOOR=0.80` (lines 38-40) stay as the **defaults** (so `__all__` at line 319 and `cloudshell_demo.py`'s local copies are unaffected). They become injectable per-instance. No values change \u2192 no behavior change at defaults.\n\n- [ ] **Step 1: Write the failing test (threshold override changes the outcome)**\n\nAdd to `backend/scudo/tests/smoke.py`. Reuse `FakeAgent`, `make_bundle_assembler`, `_verifier_with_total`, the `InMemory*Queue` stubs, and the mapping responder + intake payload from the existing PUBLISHED-path scenario (copy that scenario's `mapping` responder and `orch.run({...})` payload verbatim \u2014 only the two changes below differ):\n\n```python\ndef scenario_gate2_thresholds_are_instance_config(mcp_client):\n    \"\"\"Raising verifier_retry_hi to 17 turns a total-16 result \u2014 normally\n    PUBLISHED \u2014 into a RETRY, proving Gate-2 thresholds are per-instance.\"\"\"\n    rubric = \"v1\"\n    # mapping responder: copy from the existing PUBLISHED scenario (confidence\n    # >= floor so the floor never trips); verifier total fixed at 16.\n    mapping = FakeAgent(structured_responder=_publish_path_mapping_responder)\n    verifier = FakeAgent(\n        structured_responder=lambda cls, p: _verifier_with_total(16, rubric))\n    orch = Orchestrator(\n        mapping_specialist=mapping,\n        rights_specialist=None,\n        verifier=verifier,\n        hitl_queue=InMemoryHitlQueue(),\n        research_queue=InMemoryResearchQueue(),\n        publish_sink=InMemoryPublishSink(),\n        ontology_snapshot=\"ont-1\",\n        rubric_version=rubric,\n        bundle_assembler=make_bundle_assembler(mcp_client),\n        verifier_retry_hi=17,   # NEW knob: 16 now lands inside the retry band\n    )\n    obj = orch.run(_publish_path_intake_payload())\n    assert obj.outcome is Outcome.RETRY, f\"expected RETRY, got {obj.outcome}\"\n```\n\nRegister the scenario in this file's runner list the same way the existing scenarios are registered. (`_publish_path_mapping_responder` / `_publish_path_intake_payload` are stand-ins for the inline responder + payload of the current PUBLISHED scenario \u2014 lift them directly.)\n\n- [ ] **Step 2: Run it \u2014 verify it fails**\n\nRun: `cd /Users/anthonylui/MatchMaker/MatchMaker/backend && python -m scudo.tests.smoke`\nExpected: FAIL \u2014 `TypeError: __init__() got an unexpected keyword argument 'verifier_retry_hi'`.\n\n- [ ] **Step 3: Add the threshold params to `__init__`**\n\nIn `Orchestrator.__init__` (after `bundle_assembler=None,` on line 66), add keyword params defaulting to the module constants, and store them (after line 78):\n\n```python\n        verifier_autopublish: int = VERIFIER_AUTOPUBLISH,\n        verifier_retry_lo: int = VERIFIER_RETRY_LO,\n        verifier_retry_hi: int = VERIFIER_RETRY_HI,\n        confidence_floor: float = CONFIDENCE_FLOOR,\n    ) -> None:\n        ...\n        self.verifier_autopublish = verifier_autopublish\n        self.verifier_retry_lo = verifier_retry_lo\n        self.verifier_retry_hi = verifier_retry_hi\n        self.confidence_floor = confidence_floor\n```\n\n- [ ] **Step 4: Point `_gate_and_decide` at the instance attrs**\n\nIn `_gate_and_decide` (lines 227, 235), replace the module constants with instance attributes:\n\n```python\n        if total < self.verifier_retry_lo or conf < self.confidence_floor or result.requires_human_review:\n            ...\n        if self.verifier_retry_lo <= total <= self.verifier_retry_hi:\n            ...\n```\n\nLeave the module-level constants (lines 38-40) and `__all__` (line 319) in place as the defaults.\n\n- [ ] **Step 5: Run the new test + the full orchestrator suite**\n\nRun: `cd /Users/anthonylui/MatchMaker/MatchMaker/backend && python -m scudo.tests.smoke`\nExpected: PASS \u2014 the new scenario passes AND every existing scenario (which uses defaults) is unchanged.\n\n- [ ] **Step 6: Commit**\n\n```bash\ncd /Users/anthonylui/MatchMaker/MatchMaker && git add -A && git commit -m \"refactor(scudo): orchestrator Gate-2 thresholds are per-instance config\n\nVERIFIER_AUTOPUBLISH/RETRY_LO/RETRY_HI/CONFIDENCE_FLOOR become __init__\nkwargs defaulting to the existing module constants. No behavior change at\ndefaults; enables P1 golden-set recalibration.\n\nCo-Authored-By: Claude Opus 4.8 <noreply@anthropic.com>\"\n```\n\n---\n\n## Phase 0 verification (run all, expect green)\n\nFrom `backend/`:\n```bash\npython -m scudo_mapping_mcp.tests.smoke        # cost ladder, bands, M6/hydrate, new S3 round-trip\npython -m scudo.tests.smoke                     # orchestrator routing/gate, new threshold-config case\npytest scudo_mapping_mcp/tests/test_invariants.py -q   # Section-13 invariants\n```\nNote: `scudo.tests.smoke` reaches the catalogue MCP over stdio \u2014 it must be runnable in the env. The Flask API suite (`backend/tests/run_all_tests.py`) needs MySQL and is **not** touched by Phase 0.\n\nExit criteria: all three suites green; `scudo_strands_app.py` gone; an export round-trips through S3 into a fresh store via `hydrate`; orchestrator thresholds overridable with defaults unchanged.\n\n---\n\n## Phase 0.5 \u2014 Single-conductor consolidation (its own spec + plan)\n\nThe roadmap's \"make `scudo/orchestrator.py` the single conductor\" (have `_call_mapping` delegate to `matching.map_vendor_product` instead of an LLM-structured call) is a **production-path change** to the Bedrock-wired orchestrator and needs its own brainstorm\u2192spec\u2192plan. Open questions to resolve first:\n- `BriefBundle` \u2192 `VendorProductRef` extraction (the orchestrator path and the matcher path use **different** `MappingResult` types \u2014 `scudo/schemas.py` vs `scudo_mapping_mcp/models.py`; an adapter is required).\n- Wrap the Bedrock specialist as a `SpecialistScorer` (`matching.py:124-127`) so the cost ladder consults it only in the borderline band.\n- Default stays on the current path; flip to deterministic delegation only **after** P1 golden-set recalibration (behind a flag, e.g. `SCUDO_ORCH_DETERMINISTIC_MAPPING`).\n- Today `routes/mapping.py:323` already calls `map_vendor_product` directly and `agent.py:351` wraps it \u2014 those are the reference for the target shape.\n\n---\n\n## Downstream Roadmap (each phase gets its own spec + plan + ExitPlanMode)\n\n**What STAYS (mostly all of it):** the cost-ladder matcher logic, the deterministic orchestrator + routing/gate/verifier, the HMAC-sealed 10-dim verifier, the Bedrock specialist (M9), the self-improving loop (precedent + `rank_signals_for` + bundle/`hydrate`), the reviewer UI / NGINX / FastAPI gateway, the iFusion publish seam, ingestion readers + ETL, the three-seam `config.py` contract.\n\n**P1 \u2014 Matching engine to target.** OpenSearch (lexical + k-NN) + SciPy/NetworkX arms; Titan query-vector generation (S3 vector store, WS-E IAM); build-time taxonomy index; **add the Gate-1 \"70-79 review\" band** (new band variant; extract the ~160-line band logic in `matching.py:275-436` to a helper first) and **recalibrate** floor/bands against a golden set. \u26a0\ufe0f Decision: OpenSearch+SciPy replace/augment the current JW+BM25+RRF on FalkorDB \u2014 confirm FalkorDB's role (cache tier vs retired).\n\n**P2 \u2014 Canonical = Aurora + transactional outbox (revises M7).** Aurora source of truth (canonical mappings + CDAO + lineage); atomic publish on Gate-1\u2265auto / verifier-pass; outbox (EventBridge/SQS) projecting async to Neptune (RDF/ODRL) + OpenSearch; precedent-hydrator reframed as the outbox projector. \u26a0\ufe0f Decision: Aurora-canonical vs the M7 docs' Neptune-canonical \u2014 adopt and update M7.\n\n**P3 \u2014 DQ Framework (from Aurora).** Ingestion-time + mapping-time DQ metrics; optional `DATA_QUALITY` verifier dimension; `DQNotificationSink` \u2192 SNS/SES.\n\n**P4 \u2014 Ingestion cutover.** Per-vendor JAPI clients (read-only, paginated) replacing the catalogue mock; single trust boundary (gateway + presigned-URL direct-to-S3 after auth/scan); `FRAME_SOURCE=s3` prod path.\n\n**P5 \u2014 Fusion SPI V2 + iFusion.** Real SPI V2 client + `SpiV2PublishSink`; Fusion JSON envelope; inbound callback consumer + durable store. *(Gated on JPMC SPI V2 spec.)*\n\n**P6 \u2014 Hardening, memory plane, observability.** WS-C JAPI client (pool + circuit breaker); AgentCore Memory plane formalizing the self-improving loop; Bedrock Evaluations (traces/tokens/context-rot); DynamoDB reviewer queue; seal hardening (I5 \u00a74.3); EventBridge scheduler + nightly self-improving routine; stateless-Lambda A/B/C packaging; I5-lift shadow-mode (MRGR-gated).\n\n**External blockers (flag, don't wait silently):** vendor JAPI/Glue contracts (P4); JPMC SPI V2 spec (P5); Bedrock Titan IAM + model access (P1); MRGR sign-off (P6).\n\n---\n\n## Self-review\n\n- **Spec coverage:** Phase 0 implements the three roadmap P0 items that are real, code-only, and unblocked; the WS-D item is dropped (already shipped \u2014 verified); the Gate-1 band item is correctly relocated to P1 (it's not behavior-preserving); the single-conductor item is carved into its own plan (it changes the production path).\n- **Placeholder scan:** test code is concrete; the two reused helpers (`_publish_path_mapping_responder`, `_publish_path_intake_payload`) are explicitly identified as lift-from-existing-scenario, not invent-new.\n- **Type consistency:** `export_to_s3(bundle, *, uri=None) -> tuple[str,str]` used consistently; orchestrator attrs (`self.verifier_retry_lo/hi`, `self.confidence_floor`) match their `__init__` params and the constants they default from.", "plans/precedent-hydrator-workstream": "# Precedent Hydrator \u2014 Workstream\n| Field | Value |\n|---|---|\n| Status | OPEN \u2014 workstream not yet started |\n| Goal | Hydrate Neptune\u2192Falkor precedents so the rank-signal tilt and precedent-reuse paths work in Neptune-canonical deployments |\n| Owner | _[TBC]_ |\n| Linked diagrams | docs/architecture/scudo-overview.mmd (NEP -.->\\|precedent\\| FALKOR edge) |\n\n## 1. Problem statement\n- Today: STORE_BACKEND selects ONE active store. feedback.apply_decision writes to that one. The two stores never synchronise.\n- In falkor mode: precedent edges live in Falkor, rank-signal tilt + precedent-reuse work, but there is no canonical source-of-record.\n- In neptune mode: Neptune is canonical, but Falkor working graph (used by find_similar_products for retrieval) has no precedent edges \u2192 rank-signal tilt is zero, precedent-reuse miss-rates rise, the cost ladder degrades.\n- The architecture diagram shows the working graph rehydrating from Neptune; the code does not.\n\n## 2. Three options\n(a) Read-through: at query time, fetch precedents from Neptune on-demand and cache in Falkor. Lazy. Solves cold-start but precedent-reuse path needs a synchronous Neptune query.\n(b) Background replicator: a sidecar process tails Neptune writes and replicates precedent edges to Falkor. Eager. Higher operational complexity but query-time has no Neptune dependency.\n(c) Eager dual-write: persistence_mcp writes to both Neptune AND Falkor in the same transaction. Simplest but violates \"Neptune is canonical, Falkor is rebuildable\" \u2014 Falkor becomes a co-source-of-truth.\n\n## 3. Recommended starting point\nOption (b) \u2014 background replicator \u2014 because:\n- Preserves Neptune as canonical\n- Preserves Falkor as rebuildable from Neptune (the diagram's promise)\n- Query-time latency unaffected\n- Can be killed for an unsynchronised Falkor and rebuilt \u2014 no data loss\n\n## 4. Open questions\n- What's the trigger? Neptune change-stream? Persistence MCP emit + SQS? Periodic poll?\n- What's the SLA? Read-your-write within N seconds, or eventual?\n- How does the replicator handle bundle imports (M6)?\n- Does the rebuild path use the same code as the replicator?\n\n## 5. Out of scope for this workstream\n- M6 bundle import / export (separate flow, lives in bundle.py)\n- Reviewer queue (separate workstream \u2014 DynamoDB wiring)\n- I5 lift preconditions (separate gate \u2014 see i5-lift-preconditions.md)\n\n## 6. Document control\n- v0.1 \u2014 workstream opened 2026-06-10", "reference/agents": "## Learned User Preferences\n\n- Ship the expositional SCUDO matching story (vendor \u2192 ETL \u2192 matcher \u2192 confidence gate \u2192 persist) from the understand-anything `packages/dashboard`, vendored at `/demo/` (including `jpmc-port`), not as a bolt-on to the ingestion console; synthetic demo data is acceptable only when clearly ILLUSTRATIVE and coherent, never as implausible bank taxonomy.\n- MatchMaker only \u2014 no Defra, no project switches, no commits unless explicitly asked.\n- Multi-phase ontology/rights work (DCAT P0\u2192P4; catalogue-rights UML gap Phases A\u2192C) stops after each phase for review with changed files, verification commands, and pass/fail counts before continuing; on a dirty worktree preserve unrelated uncommitted changes and edit shared files narrowly (e.g. retain existing SSE heartbeat edits in `backend/routes/mapping.py`).\n- Self-improvement loops must keep the standard outside the optimizer's reach: the proposer may only change prompts/skills/rule artifacts, never evaluation cases, held-out split, metric definitions, thresholds, publish gates, confidence bands, or the evaluator; promotion is an atomic versioned pointer move over immutable content-addressed artifacts with automatic rollback, never an in-place rewrite; defer a GNN until a leakage-safe, production-scale labelled corpus exists.\n- Keep matcher diffs narrow and bounded; preserve flag-gated compatible defaults and dense-score-only / BM25-nominator-only invariants; verify the design spec's residual evidence gaps in code (matching bands, enrichment shapes, Neptune precedent) before editing affected files.\n- Require production-grade dogfooding of the claimed path before declaring work complete (including Playwright visual checks for dashboard `/demo/` claims); failed required checks block completion claims; do not juxtapose deterministic stub pass counts with Opus/agentic-loop claims in ARB evidence; never report a server as \"up\" on a status check you know only held for the life of the tool call \u2014 say plainly that the human must host it.\n- Citrix/JPMC handoffs: process + full absolute clickable file links, or one anchored file a human can retype (every change is typed in by hand, so minimise edit surface and cite exact `file:line`); comment out (don't delete) MySQL/FalkorDB/Neptune call sites; document local-run with file-backed memory when Aurora is unreachable. Re-verify links, line numbers, and claims against live files before shipping.\n- JPMC-facing Mapping + Verifier agents must carry the system weight: Claude Opus 4.8, full agentic loops/reasoning/tool use, high token budget; every HITL teach must trigger fail-loud learning (no swallowed write errors); deterministic stubs are local/CI only, not the Atlas production path; if Bedrock Opus is unavailable for dogfooding, Cursor model is an acceptable agentic-loop test stand-in.\n- Do not claim agents can solve catalogue/rights UML (Dataset/Contract/Policy/CDM) without typed schemas, skills, and tools wired to that model.\n- Keep the root README simple and clear for business readers; preserve useful repository-map wording and avoid replacing it with dense engineering tables or unnecessary churn.\n- \"Everything wired with a real agent\" means every LLM lever actually on, not just the chat backend; prefer silent fallback so a demo keeps moving when a short-lived key dies, but surface which backends are live in the sidebar and judge a run by its reasoning trace, not by a number appearing.\n- Capone is the Cognizant-owned environment: fully local, portable, no Citrix port; JPMC-side politics/personnel are out of scope for Cognizant packaging. The demo must be one-click (`run_demo`), boot the whole stack, offer three upload points (vendor / contract / dataset) exercising the many-to-one story, and expose agent chat that demonstrates reasoning and guides the user. Cross-platform handoffs should be credential-free source bundles with Windows/macOS launchers (Python 3.11+ may be assumed); send short-lived keys separately. This repo stands on its own \u2014 borrow good UX ideas from other front ends, never their code or stale thresholds.\n\n## Learned Workspace Facts\n\n- SCUDO matching UI lives in `Understand-Anything/understand-anything-plugin/packages/dashboard`; `MatchMaker/frontend/` is the Data Ingestion Framework console only. Two graph schemas: **KnowledgeGraph** (dashboard via `backend/scudo/build_matching_graph.py`) and **MatchPayload** (`GET /api/mapping/graph` via `build_match_payload()`); JPMC day-one port scopes fixture regen and MatchPayload out. Canonical CDAO IRIs are `jpmorgan:data:cdao:*`; shipped artifacts must not contain `urn:cdao:*`, bare `cdao:*`, or Marketing-domain nodes.\n- Matcher confidence bands (canonical): PASS \u22650.80, BORDERLINE 0.70\u20130.80, FAIL <0.70 per `backend/scudo_mapping_mcp/config.py`. Taxonomy JSON source of truth: `backend/scudo/fixtures/cdao_catalogue.json`; sync to dashboard via `backend/scudo/scripts/sync_matching_graph_to_dashboard.sh`.\n- Do not edit Codex-owned files: `backend/scudo/data-platform.yaml`, `build-pipeline.yaml`, `template.yaml`; console AWS deploy uses `infra/scudo-poc-*.yaml` via Citrix CloudShell (`scudo-poc-console-build`) and publishes `dashboard-dist/` to S3 `/demo/` with CloudFront invalidation. Binding specs: matching `docs/superpowers/specs/2026-06-24-scudo-matching-frontend-spec.md`; DCAT `docs/superpowers/specs/2026-07-03-dcat-ontology-matching-design.md`; catalogue/rights UML `docs/superpowers/specs/2026-07-13-catalogue-rights-uml-gap-analysis.md` (`ContentDeliveryModel` 11 values; PROVISIONAL is `HAS_DUTY`-only).\n- Backend verification cwd is `MatchMaker/backend/` with `PYTHONPATH=.` (`jpmc-port/` likewise); invoke `python3.11 -m pytest` directly because bare pytest can misleadingly collect nothing. Streamlit-prefix tests must snapshot/restore the whole environment: `exec()` of the launcher prefix sets dense-backend and write-gate variables, and restoring only selected keys caused order-dependent leakage.\n- Slim JPMC rewrite lives in `jpmc-port/` (Capone `backend/scudo/` left intact); default agents are Bedrock Opus 4.8 (`us.anthropic.claude-opus-4-8`, `max_tokens=128000`) with agentic tool loops; `SCUDO_LOCAL=1` is deterministic e2e only (not Opus evidence); matching dashboard vendored at `jpmc-port/dashboard-dist/` served at `/demo/` via `run_local.py` (:5001); Capone A/B via `run_ab_compare.py` with Capone arm `python -P backend/scudo/scripts/ab_capone_arm.py` (`jpmc-port/ab_capone_arm.py` is retired). Its agents are not wired to Capone catalogue/rights UML fields (Bedrock alone does not cover Dataset/Contract/Policy/CDM), `orchestrator.py` returns `Outcome.RETRY` with no caller re-attempting, and its candidate-membership / vendor-IRI checks are advisory rather than the hard publish gates Capone has.\n- Live skill promotion is `aurora_memory.preflight_skill_promotion` \u2192 `matching_self_improvement.validate_promotion`; HITL decisions call `aurora_memory.learn_from_teaching` with fail-loud writes; `skill_gate.py` is not imported on the live path. Automatic promotion requires boundary-supplied trusted evidence and recomputes policy thresholds; legacy/unprotected artifacts cannot auto-promote. Canonical owner is `backend/scudo/matching_self_improvement.py`; its byte-identical JPMC copy is parity-guarded\u2014never let them drift.\n- Capone local-run is measured, not inferred: `start_local.py` (or one-click `run_demo.py` = Flask + Streamlit; `run_cognizant.py` = Flask only) runs with no Docker/Postgres/FalkorDB/Neptune/AWS. MySQL is gone; optional services and boto3 are lazy. Vendored `frontend/dist/` and `dashboard-dist/` need no Node. DB pages use SQLite. The \u201conly one page opens\u201d symptom is launcher env/auth (and sometimes port contention), not DB. Reviewer decisions survive restart. Local authoritative frames now use a process-cached registry partitioned by an unguessable Streamlit session key so real reruns cannot split writer/reader module state; S3 still uses the canonical frame reader. Taxonomy bootstrap seeds only an empty store, preserving uploaded nodes across reruns/restarts.\n- THREE independent dev-write gates exist and are NOT interchangeable \u2014 `SCUDO_VERDICT_ALLOW_DEV` (HMAC signing key), `SCUDO_PERSIST_ALLOW_DEV_WRITES` (persistence MCP), and `SCUDO_AUTH_ALLOW_DEV_WRITES`; without the last, `POST /api/mapping/decision` 403s while reads and matches still work, so Approve/Reject looks silently broken for no visible reason. Matching also refuses to match before ingest (`frame_not_found` 404) \u2014 that is the frame gate working, not a defect.\n- Matching is **many-to-one** and this is verified, not assumed: every contract is scored against the full catalogue with no exclusive assignment, so two vendors' contracts can both map to the same dataset, and approving one leaves the other untouched. Precedents are keyed per `(vendor, product_id)`; `vendor_signature` keys on the contract **name** (fallback product_id), so identical names share a small rank boost (0.02/approval, capped 0.10) \u2014 a ranking nudge, never an auto-approval.\n- The front end is Streamlit + SQLite (`streamlit_app.py`, calling the package directly rather than Flask); agent chat is step 04 in `backend/scudo_mapping_mcp/chat.py`. Scripted chat is keyword-routed and a no-AWS stand-in, not agentic evidence; it does not truly share the Bedrock agent\u2019s six-tool loop. Multi-vendor fixtures are in `sample_data/demo/`, and uploads accumulate contracts/catalogue nodes. Verify widgets with `streamlit.testing.v1.AppTest` (`session_state.get` is unsupported) and real-browser checks where claimed; shell-started servers are reaped after tool calls.\n- \"Aurora\" is three unrelated systems, do not conflate them: console CRUD (psycopg direct, `CONSOLE_DB_*`); the matching store; and agent memory (RDS **Data API**, `SCUDO_AURORA_*`, not reachable from Flask/Streamlit). The matching store now has a FalkorDB-free durable backend \u2014 `STORE_BACKEND=scipy_sqlite` (+ `SCUDO_PERSIST_TARGET`, `SCUDO_SCIPY_SQLITE_PATH`), the full 16-method `RetrievalStore` over SQLite with immutable revision-stamped SciPy sparse indexes \u2014 and it is the `start_local.py` default; bands stay 0.80/0.70. Every launcher (`streamlit_app.py` `_best_local_store`, `start_local.py`, `run_cognizant.py`, `run_demo.py`) must agree on `STORE_BACKEND` + `SCUDO_SCIPY_SQLITE_PATH` or Streamlit and Flask split-brain \u2014 a UI approval lands in SQLite while the API reads the JSONL journal, looking exactly like memory not working. It enforces referential integrity on taxonomy writes (`parent_iri` must exist), and precedent counts must come from tables `positive_precedents` / `negative_precedents`, never from counting JSONL lines. It is **single-host only** (not shared across ECS tasks/Lambdas) and the AWS templates deliberately remain on FalkorDB; a shared Aurora `RetrievalStore` + shadow cutover is still required for full AWS removal. Separately, `taxonomy_graph.py` is in-memory SciPy sparse (PageRank/shortest-path, read-only, score-blind) with **zero** SQLite \u2014 SQLite there is only the console-DB fallback.\n- JPMC Bedrock auth is `sts.assume_role` plus an application-inference-profile ARN; the Cognizant sandbox may instead use a short-lived bearer token. `SCUDO_BEDROCK_MODEL_ID` accepts the ARN verbatim, while `SCUDO_REGION` must align model prefix and client region. The Streamlit preflight must independently drain both `InvokeModelWithResponseStream` and direct `InvokeModel`, report ready/degraded/error per operation, and invalidate status after model/region changes. Full agentic operation requires `SCUDO_AGENT_BACKEND=bedrock`, `SCUDO_SPECIALIST_BACKEND=local`, `SCUDO_DENSE_BACKEND=opus`, and an explicit fallback policy. Opus similarity is model-generated input to deterministic bands/publish gates, not \u201cnarration only.\u201d Dense scoring is whole-batch all-or-nothing across standard and multi-path routes; fallback-off fails loudly, while fallback-on discards the entire model batch for Jaro. Breaker probe ownership is generation-tokened so stale decisions cannot reset successor probes. The repo uses CloudFormation, not Terraform; account permissions\u2014not code\u2014control AWS access.\n\n## Related\n\n- [Confidence bands & provenance (canonical)](/reference/matching-data-provenance.md)\n- [Matching frontend spec (binding)](/specs/matching-frontend.md)", "reference/matching-data-provenance": "# SCUDO Matching \u2014 Data Provenance & Confidence Bands\n\n## Confidence bands (canonical \u2014 matcher config)\n\nSource: `backend/scudo_mapping_mcp/config.py` (`CONFIDENCE_FLOOR=0.75`, `BORDERLINE_HALF_WIDTH=0.05`\n\u2192 `PASS_CUT=0.80`, `FAIL_CUT=0.70`). The floor is the band **centre**, not the pass\nedge \u2014 do not read `0.75` as a threshold.\n\n| Band       | Similarity range   | Route                          |\n|------------|--------------------|--------------------------------|\n| **PASS**   | \u2265 0.80             | Aurora audit + JAPI persist    |\n| **BORDERLINE** | 0.70 \u2013 0.80    | Strands orchestration layer    |\n| **FAIL**   | < 0.70             | Human review (Scudo UI)        |\n\nUI labels, edge colours, and graph captions use these numbers, and FE `DEFAULT_BANDS`\nmust agree (`CLAUDE.md` 5-zone contract, 2026-07-04).\n\n> **Corrected 2026-08-16.** This table read PASS \u2265 0.85 / BORDERLINE 0.75\u20130.85 /\n> FAIL < 0.75, sourced from a `CONFIDENCE_FLOOR=0.80` that no longer exists in\n> `config.py`. The floor moved to `0.75` under the 5-zone alignment\n> (`docs/superpowers/plans/2026-07-04-scudo-5zone-alignment.md` Task 1); this doc\n> did not follow. Verified by execution, not by reading:\n> `python3 -c \"from scudo_mapping_mcp import config as c; print(c.pass_threshold(), c.borderline_threshold())\"`\n> \u2192 `0.8 0.7`.\n>\n> Two different `CONFIDENCE_FLOOR` constants exist. This one is the MCP matcher\n> ladder (`scudo_mapping_mcp/config.py:49` = `0.75`). `backend/scudo/orchestrator.py:41`\n> declares a **separate** `CONFIDENCE_FLOOR = 0.80` \u2014 the Runtime-A auto-approve\n> publish gate. It is a different control and did **not** change. Do not\n> reconcile them.\n\n## IRI schemes\n\n| Kind           | Pattern                              |\n|----------------|--------------------------------------|\n| Vendor product | `mds.<vendor>:<uuid5>`               |\n| CDAO node      | `jpmorgan:data:cdao:<type>:<slug>`   |\n\nForbidden in shipped artifacts: `urn:cdao:*`, bare `cdao:*` (legacy demo seed).\n\n## Data classification\n\n| Value / branch              | Source                         | Synthetic? | Coherent? | Caption role |\n|-----------------------------|--------------------------------|------------|-----------|--------------|\n| Market Data domain          | `cdao_catalogue.json`          | yes        | yes       | Pricing + indices target |\n| Reference Data domain       | `cdao_catalogue.json`          | yes        | yes       | Instruments + entities |\n| Marketing domain (removed)  | was `cdao_catalogue.json`      | yes        | **no**    | Incoherent for LSEG/ICE \u2014 deleted |\n| Pipeline stage nodes        | `build_matching_graph.py`      | yes        | yes       | Architecture exposition |\n| Vendor samples              | `build_matching_graph.py`      | yes        | yes       | Demo products for ICE/LSEG/SPG |\n\nAll synthetic nodes carry `provenance: { source: \"synthetic\" }` and a `caption` (\u2264140 chars) in API/graph payloads. The UI shows a persistent **ILLUSTRATIVE DATA** banner when `meta.dataProvenance === \"synthetic\"`.", "skills/graphrag-retrieval": "# GraphRAG retrieval (candidate discovery)\n\n`graphrag_retrieve(query, top_k)` queries a **lexical sidecar** \u2014 a graph + vector\nindex built offline from the CDAO ontology definitions and the vendor catalogue.\nIt returns candidate CDAO nodes with their definitions and *why they are related*.\n\n## Why a graph, not just vectors\nVector search returns what is *semantically similar*; the sidecar returns what is\n*related* \u2014 through taxonomic, broader/narrower, and part-whole structure. A\nvendor product's wording is often not close to the right node's label but is\nrelated to it through the taxonomy. Retrieval over the graph surfaces those nodes,\nwhich is exactly the no-exact-match case that is the point of this work [clarif. 83].\n\n## It is not the source of truth\nThe sidecar is **non-authoritative and rebuildable**. It exists to narrow the\nsearch, nothing more. Two rules:\n- **Confirm before relying.** For any candidate you favour, read its authoritative\n  definition and position via the **neptune-io** skill (`neptune_node_by_iri`).\n- **Never publish from it.** Nothing sourced from the sidecar is written to the\n  RDF graph. Writes and truth live in neptune-io.\n\n## How to query\n- Build the query from the vendor product's title, description, theme, and\n  `asset_class` \u2014 the meaning, not the raw string.\n- Start focused; widen only if the first pass returns nothing usable. Retrieval\n  calls are budgeted (a hook caps them) \u2014 once you have viable candidates, stop\n  searching and judge.\n- Pass the candidates back to the **taxonomy-mapping** procedure as evidence,\n  citing which candidate and which confirmed authoritative node supported the call.\n\n## Reference\nThe sidecar is built by the offline `build_lexical_index()` job (corpus = rendered\nCDAO TTL [clarif. 11] + vendor catalogue). It is refreshed when CDAO or the\ncatalogue changes \u2014 it lags the authoritative graph between rebuilds, which is\nanother reason to confirm candidates in neptune-io.\n\n## Do not\nTreat retrieved candidates as ground truth \u00b7 publish anything from here \u00b7 widen the\nquery unboundedly \u00b7 skip the authoritative confirmation step.\n\n## Related\n\n- [Neptune I/O (confirmation)](/skills/neptune-io.md)", "skills/neptune-io": "# Neptune I/O (authoritative RDF graph \u2014 read + idempotent publish)\n\nThis skill is the **system of record**: RDF + ODRL + DCAT, reached only through\nparameterised tools that return precisely the slice the step needs. No raw SPARQL\ncrosses this boundary (a PreToolUse hook denies it). Maximum context is not the\ngoal; appropriate context is.\n\n## Two graphs \u2014 do not confuse them\n- **This (authoritative) RDF graph** \u2014 truth. Reads here are facts; writes here\n  are the published result. Everything below operates on it.\n- **The lexical sidecar** (graphrag-retrieval skill) \u2014 a *non-authoritative*,\n  rebuildable retrieval index used only to *discover candidates*. Never treat its\n  output as truth and **never publish anything sourced from it**. Candidates from\n  the sidecar must be confirmed here (`neptune_node_by_iri`) before you rely on them.\n\n## Reads (bounded, read-only, idempotent)\n- `neptune_node_by_iri(iri)` \u2014 one node + its authoritative definition and immediate edges. Use to confirm a retrieved candidate.\n- `neptune_existing_mapping(vendor, vendor_product_ref)` \u2014 prior mapping, if any (drives NEW vs EXTEND).\n- `neptune_conflicts(vendor_product_ref)` \u2014 equivalent products from other vendors with differing targets (drives RECONCILE_CONFLICT).\n\nEach is capped. Candidate *search* is not here \u2014 that is graphrag-retrieval.\n\n## Write \u2014 one idempotent path\n- `neptune_publish_triples(named_graph, triples)` \u2014 the **only** write, to the\n  authoritative graph. Idempotent and replay-safe: deterministic IRIs in,\n  named-graph provenance attached, identical input \u2192 identical end-state [clarif. G39].\n\nPreconditions (the publish gate enforces these \u2014 do not rely on prose alone):\n- Triples have passed SHACL via the **rdf-serialisation** skill.\n- The MappingResult passed the verifier (\u2265 16) **or** is routed to HITL.\n- `route != RESEARCH`. **RESEARCH never publishes to iFusion** \u2014 its output goes\n  to the ontology-owner queue, not this graph.\n\n## Reference\n- Query/publish module: `/modules/neptune/` (`queries.py`, `publish.py`). Parameterised,\n  reviewed SPARQL templates live here \u2014 the one place SPARQL is allowed to exist.\n\n## Do not\nHand-write SPARQL \u00b7 request unbounded results \u00b7 publish on RESEARCH \u00b7 publish\nunverified/sub-floor mappings \u00b7 publish anything sourced from the sidecar \u00b7 write\nthrough any path other than `neptune_publish_triples`.\n\n## Related\n\n- [RDF serialisation (publish)](/skills/rdf-serialisation.md)", "skills/rdf-serialisation": "# RDF serialisation (structured result \u2192 DCAT + adapted-ODRL Turtle)\n\nThis is not a reasoning task. A language model hand-writing Turtle invents prefixes,\nmalforms IRIs, and drifts from the house shapes. **Never write Turtle by hand.** Call\nthe serialiser, then validate.\n\n## Steps\n1. Call the serialiser with the typed result object:\n   - `rdf_serialise_mapping(mapping_result)` \u2192 catalogue triples (DCAT-conformant).\n   - `rdf_serialise_rights(rights_result)` \u2192 adapted-ODRL triples (RDFS semantics, simplified constraints \u2014 see the **rights-odrl** skill and clarif. 13).\n   The serialiser owns prefixes, the DCAT shape, deterministic IRI minting\n   (`mds.<vendor>:<uuid5>`, `jpmorgan:data:cdao:\u2026`), and the named-graph wrapper for\n   provenance. You pass data; you do not template strings.\n2. Call `rdf_validate_shapes(triples)` (SHACL). This is the **gate**:\n   - **conforms** \u2192 return the triples for the orchestrator to publish (via **neptune-io**).\n   - **violations** \u2192 return a defect (the violation report), **not** the triples. Do not \"fix\" Turtle by editing it; fix the upstream result and re-serialise.\n\n## Invariants the serialiser guarantees (so you must not re-implement them)\n- DCAT conformance and the adapted-ODRL shape.\n- Deterministic IRIs \u2192 replay-safety [clarif. G39]. Same input, same IRIs.\n- Every triple carries its named graph.\n\n## Reference\n- Serialiser + SHACL shapes: `/modules/rdf/` (`serialiser.py`, `shapes/`).\n- The shapes file is the source of truth for what \"valid\" means; if a shape and this\n  skill disagree, the shape wins.\n\n## Do not\nHand-write or hand-edit Turtle \u00b7 invent prefixes or IRIs \u00b7 publish triples that failed\nSHACL \u00b7 bypass the serialiser \"just this once\".", "skills/rights-odrl": "# Rights reasoning (contract terms \u2192 adapted-ODRL)\n\nYou are the **Rights Specialist**. You interpret already-extracted rights/licence\nterms for a vendor product and express them as JPMC's adapted-ODRL. You have your\nown verifier weights, separate from the mapping specialist's. You reason about\nrights only \u2014 you do not map taxonomy and you do not publish.\n\n## JPMC's ODRL is adapted \u2014 do not emit textbook ODRL [clarif. 13]\nJPMC is fully DCAT-conformant but has adapted ODRL in two specific ways:\n- **RDFS semantics** are used instead of ODRL's own (home-brewed) semantics.\n- The **constraint syntax is simplified**.\n\nTarget *that* shape. If you find yourself reaching for stock `odrl:` constructs\nthat the house model has simplified away, stop \u2014 produce the simplified form.\n\n## Inputs\n- The vendor product reference + its extracted rights terms (from the rights pipeline,\n  which itself reads validated rights triples from Neptune via SPARQL/REST [clarif. B7]).\n- The relevant slice of the rights vocabulary (handed in the bundle).\n\n## Procedure\n1. Classify each term into **permission / prohibition / duty**.\n2. Attach constraints in the simplified syntax (e.g. purpose, territory, count, time window) \u2014 only those the house model supports.\n3. Cite the source span for each rule as **evidence** (mandatory; evidence-free rules are rejected).\n4. Resolve obvious conflicts (a prohibition overrides a permission on the same action) and surface non-obvious ones for review rather than guessing.\n5. Emit the rules as triples via the **rdf-serialisation** skill \u2014 never hand-write Turtle. Each carries its named graph.\n6. Set confidence and self-flag `requires_human_review` on any ambiguous or unusual licence language.\n\n## Do not\nMap taxonomy \u00b7 publish \u00b7 emit stock ODRL semantics the house model has replaced \u00b7\nhand-write Turtle \u00b7 assert a rule with no cited source span \u00b7 silently resolve a\nmaterial conflict you are unsure about.", "skills/taxonomy-mapping": "# Taxonomy mapping (vendor product \u2192 CDAO node)\n\nYou are the **Mapping Specialist**. You receive a typed `BriefBundle` and nothing\nelse, and you return a `MappingResult`. You do **not** decide the route, assemble\nyour own context, or publish. If a field you need is absent, the orchestrator\nfailed \u2014 flag it; do not improvise.\n\n## Inputs (from the BriefBundle)\n- `vendor_product` \u2014 the normalised product (pulle
